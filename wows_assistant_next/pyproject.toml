[build-system]
requires = ["setuptools>=78,<82", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wows-assistant-next"
version = "0.1.0"
description = "A testable, vision-based World of Warships assistant research project"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy>=1.26,<2.1",
  "opencv-python>=4.9,<5",
  "Pillow>=10,<12",
  "PyQt5>=5.15.10,<5.16",
  "onnxruntime-gpu>=1.29,<1.30",
  "rapidocr-onnxruntime>=1.3.22,<2",
  "pywin32>=306",
  "mss>=9,<11",
  "psutil>=5.9,<7",
  "PyYAML>=6,<7",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[project.scripts]
wows-assistant = "wows_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"src/wows_assistant/diagnostics/doctor.py" = ["BLE001"]
"src/wows_assistant/monitor.py" = ["BLE001"]

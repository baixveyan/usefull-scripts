name: Publish Paper Atlas
on:
  push:
    branches: [main]
    paths: ['papers/**', 'site/**', 'maintenance/build_paper_index.py', '.github/workflows/paper-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: paper-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r site/requirements.txt
      - run: python maintenance/build_paper_index.py --check
      - run: python site/build.py
      - run: python site/check.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

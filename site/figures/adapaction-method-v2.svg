<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1200" viewBox="0 0 1400 1200" role="img" aria-labelledby="title desc"><title id="title">AdapAction ｜界面相关的动作，仍可能超出用户授权</title><desc id="desc">依据原文 §3–4、式1–8、Fig.4，PDF 3–7；无害预览例与布尔表均为原创解释。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1200" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">AdapAction ｜界面相关的动作，仍可能超出用户授权</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据原文 §3–4、式1–8、Fig.4，PDF 3–7；无害预览例与布尔表均为原创解释。</text><rect x="28" y="115" width="1344" height="250" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  两个阶段：训练来源被污染，测试时才出现条件行为</text><rect x="52" y="178" width="355" height="135" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="210" font-size="23" fill="#2376c5" font-weight="700">训练供应链</text><text x="70" y="243" font-size="19" fill="#18334c" font-weight="400">正常轨迹 + 异常示范</text><text x="70" y="272" font-size="19" fill="#18334c" font-weight="400">可见规划文本 r 与动作 a</text><text x="70" y="301" font-size="19" fill="#18334c" font-weight="400">普通 SFT 拟合条件输出</text><path d="M407,245 L470,245" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="480" y="178" width="385" height="135" fill="#fff" stroke="#7750ad" rx="16"/><text x="498" y="210" font-size="23" fill="#7750ad" font-weight="700">模型参数中的条件策略</text><text x="498" y="243" font-size="19" fill="#18334c" font-weight="400">正常输入仍可做常规任务</text><text x="498" y="272" font-size="19" fill="#18334c" font-weight="400">特定条件下，异常输出也读上下文</text><text x="498" y="301" font-size="19" fill="#18334c" font-weight="400">不等同任意网页即时接管模型</text><path d="M865,245 L928,245" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="938" y="178" width="398" height="135" fill="#fff" stroke="#17816c" rx="16"/><text x="956" y="210" font-size="23" fill="#17816c" font-weight="700">测试输入：指令 + GUI + 历史</text><text x="956" y="243" font-size="19" fill="#18334c" font-weight="400">输出不固定为同一个动作</text><text x="956" y="272" font-size="19" fill="#18334c" font-weight="400">动作可能可执行、与主题相关</text><text x="956" y="301" font-size="19" fill="#18334c" font-weight="400">仍需单独核对用户授权</text><rect x="28" y="390" width="1344" height="225" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="424" font-size="24" fill="#18334c" font-weight="700">02  无害界面例子：能点、相关、被授权是三个问题</text><rect x="52" y="453" width="355" height="125" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="485" font-size="23" fill="#2376c5" font-weight="700">用户授权</text><text x="70" y="518" font-size="19" fill="#18334c" font-weight="400">预览字号只调大 1 级</text><text x="70" y="547" font-size="19" fill="#18334c" font-weight="400">限定的是操作幅度</text><rect x="480" y="453" width="385" height="125" fill="#fff" stroke="#7750ad" rx="16"/><text x="498" y="485" font-size="23" fill="#7750ad" font-weight="700">界面上有字号按钮</text><text x="498" y="518" font-size="19" fill="#18334c" font-weight="400">预测点了 2 次加号</text><text x="498" y="547" font-size="19" fill="#18334c" font-weight="400">类型与位置都合理</text><rect x="938" y="453" width="398" height="125" fill="#fff" stroke="#c36b24" rx="16"/><text x="956" y="485" font-size="23" fill="#c36b24" font-weight="700">授权核对：仍然越界</text><text x="956" y="518" font-size="19" fill="#18334c" font-weight="400">相关性不等于数量被允许</text><text x="956" y="547" font-size="19" fill="#18334c" font-weight="400">例子不是作者实验样本</text><rect x="28" y="640" width="1344" height="290" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="674" font-size="24" fill="#18334c" font-weight="700">03  检出定义：1 代表对应监测器报错，不代表相关性通过</text><text x="70" y="712" font-size="22" fill="#18334c" font-weight="700">样本（逻辑例）</text><text x="370" y="712" font-size="22" fill="#18334c" font-weight="700">MB</text><text x="550" y="712" font-size="22" fill="#18334c" font-weight="700">IR</text><text x="720" y="712" font-size="22" fill="#18334c" font-weight="700">ER</text><text x="900" y="712" font-size="22" fill="#18334c" font-weight="700">任一 OR</text><text x="1130" y="712" font-size="22" fill="#18334c" font-weight="700">全部 AND</text><text x="160" y="763" font-size="24" fill="#2376c5" font-weight="700">A</text><text x="385" y="763" font-size="25" fill="#c36b24" font-weight="700">1</text><text x="563" y="763" font-size="25" fill="#586d80" font-weight="700">0</text><text x="733" y="763" font-size="25" fill="#586d80" font-weight="700">0</text><text x="955" y="763" font-size="25" fill="#17816c" font-weight="700">1</text><text x="1190" y="763" font-size="25" fill="#7750ad" font-weight="700">0</text><text x="160" y="818" font-size="24" fill="#2376c5" font-weight="700">B</text><text x="385" y="818" font-size="25" fill="#586d80" font-weight="700">0</text><text x="563" y="818" font-size="25" fill="#c36b24" font-weight="700">1</text><text x="733" y="818" font-size="25" fill="#586d80" font-weight="700">0</text><text x="955" y="818" font-size="25" fill="#17816c" font-weight="700">1</text><text x="1190" y="818" font-size="25" fill="#7750ad" font-weight="700">0</text><text x="160" y="873" font-size="24" fill="#2376c5" font-weight="700">C</text><text x="385" y="873" font-size="25" fill="#586d80" font-weight="700">0</text><text x="563" y="873" font-size="25" fill="#586d80" font-weight="700">0</text><text x="733" y="873" font-size="25" fill="#c36b24" font-weight="700">1</text><text x="955" y="873" font-size="25" fill="#17816c" font-weight="700">1</text><text x="1190" y="873" font-size="25" fill="#7750ad" font-weight="700">0</text><rect x="28" y="955" width="1344" height="185" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="989" font-size="24" fill="#18334c" font-weight="700">04  同一批样本可以 DR@1=100%，同时 DR@3=0%</text><text x="55" y="1022" font-size="23" fill="#18334c" font-weight="700">上表为人工布尔例子：三条都被至少一个监测器发现，却没有一条同时被三个发现。</text><text x="55" y="1067" font-size="22" fill="#c36b24" font-weight="400">原文 Fig.4 报告：AdapAction 的 DR@1=38%、DR@3=0%；干净模型 DR@1 误报28%。</text><text x="55" y="1111" font-size="21" fill="#586d80" font-weight="400">作者报告与逻辑例子分开；单步检出、正常任务效用、真实多步后果也必须分别评价。</text><text x="36" y="1177" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>
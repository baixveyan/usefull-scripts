<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1240" viewBox="0 0 1400 1240" role="img" aria-labelledby="title desc"><title id="title">3M-TI ｜让两模态跨位置通信，而非逐像素强行对齐</title><desc id="desc">依据原文 §3、Fig.2、式1，PDF 3–5；区块为计算结构，数字为解释例子，非测得注意力。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1240" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">3M-TI ｜让两模态跨位置通信，而非逐像素强行对齐</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据原文 §3、Fig.2、式1，PDF 3–5；区块为计算结构，数字为解释例子，非测得注意力。</text><rect x="28" y="115" width="1344" height="235" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  卷积独立处理两模态，注意力让全部位置互相读取</text><rect x="52" y="178" width="320" height="130" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="210" font-size="23" fill="#2376c5" font-weight="700">共享且冻结的 VAE 编码器</text><text x="70" y="243" font-size="19" fill="#18334c" font-weight="400">低分辨热图 + RGB 参考</text><text x="70" y="272" font-size="19" fill="#18334c" font-weight="400">两模态进入共同 latent 网格</text><path d="M372,240 L433,240" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="443" y="178" width="420" height="130" fill="#fff" stroke="#2376c5" rx="16"/><text x="461" y="210" font-size="23" fill="#2376c5" font-weight="700">非 Transformer 模块</text><text x="461" y="243" font-size="19" fill="#18334c" font-weight="400">B × M × C × H × W</text><text x="461" y="272" font-size="19" fill="#18334c" font-weight="400">→ (BM) × C × H × W</text><text x="461" y="301" font-size="19" fill="#18334c" font-weight="400">共享权重，模态间此时不混合</text><path d="M863,240 L925,240" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="935" y="178" width="401" height="130" fill="#fff" stroke="#7750ad" rx="16"/><text x="953" y="210" font-size="23" fill="#7750ad" font-weight="700">联合注意力 CSM</text><text x="953" y="243" font-size="19" fill="#18334c" font-weight="400">B × (MHW) × C</text><text x="953" y="272" font-size="19" fill="#18334c" font-weight="400">注意力后再还原模态维</text><text x="953" y="301" font-size="19" fill="#18334c" font-weight="400">此处 H、W 为当前层空间尺寸</text><rect x="28" y="375" width="1344" height="335" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="409" font-size="24" fill="#18334c" font-weight="700">02  一张注意力矩阵包含四种来源，不是只有热图读取 RGB</text><text x="127" y="445" font-size="21" fill="#2376c5" font-weight="700">键 K / 值 V：热位置</text><text x="425" y="445" font-size="21" fill="#c36b24" font-weight="700">RGB 位置</text><rect x="140" y="470" width="260" height="80" fill="#e2eef8" stroke="#2376c5" rx="0"/><text x="202" y="519" font-size="25" fill="#2376c5" font-weight="700">热 ← 热</text><rect x="400" y="470" width="260" height="80" fill="#f7e6d6" stroke="#c36b24" rx="0"/><text x="462" y="519" font-size="25" fill="#c36b24" font-weight="700">热 ← RGB</text><rect x="140" y="550" width="260" height="80" fill="#e5dcf2" stroke="#7750ad" rx="0"/><text x="202" y="599" font-size="25" fill="#7750ad" font-weight="700">RGB ← 热</text><rect x="400" y="550" width="260" height="80" fill="#ddf0e8" stroke="#17816c" rx="0"/><text x="462" y="599" font-size="25" fill="#17816c" font-weight="700">RGB ← RGB</text><text x="57" y="501" font-size="20" fill="#2376c5" font-weight="700">Q 热</text><text x="57" y="598" font-size="18" fill="#c36b24" font-weight="700">Q RGB</text><text x="141" y="671" font-size="22" fill="#18334c" font-weight="700">每行在两模态全部键上一起归一化</text><rect x="738" y="463" width="598" height="175" fill="#fff" stroke="#7750ad" rx="16"/><text x="756" y="495" font-size="23" fill="#7750ad" font-weight="700">解释性形状例子：B=1，M=2</text><text x="756" y="528" font-size="19" fill="#18334c" font-weight="400">C=8，H=W=4 → 卷积 2×8×4×4</text><text x="756" y="557" font-size="19" fill="#18334c" font-weight="400">重排为 1×32×8 → 每头注意力 32×32</text><text x="756" y="586" font-size="19" fill="#18334c" font-weight="400">四个区块各为 16×16；不是宽度翻倍</text><text x="756" y="615" font-size="19" fill="#18334c" font-weight="400">区块只表示连接许可，不表示实测权重</text><rect x="28" y="735" width="1344" height="255" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="769" font-size="24" fill="#18334c" font-weight="700">03  适配、结构保真与语义提示走不同接口</text><rect x="52" y="800" width="320" height="140" fill="#fff" stroke="#c36b24" rx="16"/><text x="70" y="832" font-size="23" fill="#c36b24" font-weight="700">RGB → RAM</text><text x="70" y="865" font-size="19" fill="#18334c" font-weight="400">语义提示送入扩散主干</text><text x="70" y="894" font-size="19" fill="#18334c" font-weight="400">物体标签不是温度监督</text><path d="M372,857 L433,857" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="443" y="800" width="420" height="140" fill="#fff" stroke="#7750ad" rx="16"/><text x="461" y="832" font-size="23" fill="#7750ad" font-weight="700">一步 UNet + CSM</text><text x="461" y="865" font-size="19" fill="#18334c" font-weight="400">LoRA rank 16 适配主干</text><text x="461" y="894" font-size="19" fill="#18334c" font-weight="400">热分支 latent → 解码</text><text x="461" y="923" font-size="19" fill="#18334c" font-weight="400">一步不等于零编码 / 提示开销</text><path d="M863,857 L925,857" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="935" y="800" width="401" height="140" fill="#fff" stroke="#17816c" rx="16"/><text x="953" y="832" font-size="23" fill="#17816c" font-weight="700">VAE 解码器 → 增强热图</text><text x="953" y="865" font-size="19" fill="#18334c" font-weight="400">LoRA rank 4；输出热模态</text><text x="953" y="894" font-size="19" fill="#18334c" font-weight="400">四层编码特征 → zero-conv skip</text><text x="953" y="923" font-size="19" fill="#18334c" font-weight="400">监督：像素 L2 + LPIPS</text><rect x="28" y="1015" width="1344" height="170" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="1049" font-size="24" fill="#18334c" font-weight="700">04  只扰动 RGB 学习错位鲁棒性；真实多深度运动仍有边界</text><text x="55" y="1081" font-size="24" fill="#18334c" font-weight="700">平移 / 缩放 / 旋转 / 透视：训练时改变参考位置，热目标坐标保持不变</text><text x="55" y="1122" font-size="21" fill="#c36b24" font-weight="400">全局几何变换不能完整模拟遮挡、不同深度视差和运动时差；推理仍要求内容重叠</text><text x="55" y="1160" font-size="22" fill="#17816c" font-weight="700">64 → 512 是边长 8 倍；生成的热图细节不等于新增物理温度测量</text><text x="36" y="1217" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>
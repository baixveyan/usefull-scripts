<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1150" viewBox="0 0 1400 1150" role="img" aria-labelledby="title desc"><title id="title">PCE-LiNGAM ｜从观测表到图，再到方差归因</title><desc id="desc">依据原文 §2、Algorithm 1、式7/14–17，PDF 2–5；明确保留原算法的实现缺口。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1150" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">PCE-LiNGAM ｜从观测表到图，再到方差归因</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据原文 §2、Algorithm 1、式7/14–17，PDF 2–5；明确保留原算法的实现缺口。</text><rect x="28" y="115" width="1344" height="315" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  初始投影：矩阵能相乘，不代表潜变量配对已解决</text><rect x="52" y="178" width="310" height="112" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="210" font-size="23" fill="#2376c5" font-weight="700">观测列中心化</text><text x="70" y="243" font-size="19" fill="#18334c" font-weight="400">X̃_j：N × 1</text><text x="70" y="272" font-size="19" fill="#18334c" font-weight="400">仍含父节点影响，不是结构噪声</text><rect x="425" y="178" width="365" height="112" fill="#fff" stroke="#c36b24" rx="16"/><text x="443" y="210" font-size="23" fill="#c36b24" font-weight="700">参考量 → 正交基矩阵</text><text x="443" y="243" font-size="19" fill="#18334c" font-weight="400">ζ_j 与观测样本怎样配对？</text><text x="443" y="272" font-size="19" fill="#18334c" font-weight="400">Φ_j[n,k] = Ψ_jk(ζ_j[n])</text><rect x="852" y="178" width="484" height="112" fill="#fff" stroke="#7750ad" rx="16"/><text x="870" y="210" font-size="23" fill="#7750ad" font-weight="700">系数与显著索引</text><text x="870" y="243" font-size="19" fill="#18334c" font-weight="400">c̃_j = Φ_jᵀ X̃_j / N：P+1 维</text><text x="870" y="272" font-size="19" fill="#18334c" font-weight="400">|c̃_jk| &gt; τ_s ‖c̃_j‖₂ → S_j</text><path d="M790,235 L845,235" fill="none" stroke="#7750ad" stroke-width="3" marker-end="url(#7750ad)" /><path d="M205 290 L205 320 L1090 320 L1090 296" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><text x="60" y="368" font-size="24" fill="#c36b24" font-weight="700">若 X̃ 与 ζ 独立配对：E[X̃ Ψ_k(ζ)] = E[X̃] E[Ψ_k(ζ)] = 0</text><text x="60" y="404" font-size="20" fill="#586d80" font-weight="400">因此不能把随机逐行配对画成已经恢复噪声指纹；需要原实现说明有效耦合。</text><rect x="28" y="455" width="1344" height="310" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="489" font-size="24" fill="#18334c" font-weight="700">02  候选父筛选与汇点删除：祖先来源不等于直接边</text><rect x="85" y="530" width="115" height="68" fill="#fff" stroke="#2376c5" rx="34"/><text x="124" y="575" font-size="27" fill="#2376c5" font-weight="700">X₁</text><rect x="310" y="530" width="115" height="68" fill="#fff" stroke="#2376c5" rx="34"/><text x="349" y="575" font-size="27" fill="#2376c5" font-weight="700">X₂</text><rect x="535" y="530" width="115" height="68" fill="#fff" stroke="#2376c5" rx="34"/><text x="574" y="575" font-size="27" fill="#2376c5" font-weight="700">X₃</text><path d="M200,564 L303,564" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><path d="M425,564 L528,564" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><path d="M143 598 L143 647 L592 647 L592 605" fill="none" stroke="#c36b24" stroke-width="3" marker-end="url(#c36b24)" stroke-dasharray="9 6"/><text x="223" y="682" font-size="22" fill="#c36b24" font-weight="700">经 X₂ 传播 ≠ 直接 X₁ → X₃</text><text x="85" y="728" font-size="19" fill="#586d80" font-weight="400">图为解释性链，不是作者恢复结果</text><rect x="738" y="521" width="598" height="190" fill="#fff" stroke="#7750ad" rx="16"/><text x="756" y="553" font-size="23" fill="#7750ad" font-weight="700">对当前目标 j* 的一步</text><text x="756" y="586" font-size="19" fill="#18334c" font-weight="400">候选 i → 多项式回归 → 残差 R_(j*|i)</text><text x="756" y="615" font-size="19" fill="#18334c" font-weight="400">残差重新展开 → 式7签名分数 → 候选父集</text><text x="756" y="644" font-size="19" fill="#18334c" font-weight="400">联合拟合 / 删除冗余 → 边 i → j* → 移除 j*</text><text x="756" y="673" font-size="19" fill="#18334c" font-weight="400">构造保证无环，不自动保证汇点和方向选对</text><rect x="28" y="790" width="1344" height="300" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="824" font-size="24" fill="#18334c" font-weight="700">03  全局展开后才分方差；方差份额不等于干预效应</text><text x="55" y="857" font-size="24" fill="#18334c" font-weight="700">解释例子：ζ₁、ζ₂ 独立且方差为 1；X₁ = ζ₁，X₂ = 2 X₁ + ζ₂</text><text x="55" y="905" font-size="23" fill="#2376c5" font-weight="700">Var(X₂) = 2² + 1² = 5</text><rect x="55" y="932" width="576" height="38" fill="#2376c5" stroke="#2376c5" rx="0"/><rect x="631" y="932" width="144" height="38" fill="#17816c" stroke="#17816c" rx="0"/><text x="175" y="959" font-size="21" fill="#ffffff" font-weight="700">来源 ζ₁：4 / 5 = 80%</text><text x="649" y="959" font-size="20" fill="#ffffff" font-weight="700">ζ₂：20%</text><rect x="852" y="893" width="484" height="137" fill="#fff" stroke="#17816c" rx="16"/><text x="870" y="925" font-size="23" fill="#17816c" font-weight="700">固定 X₁ = x 的干预</text><text x="870" y="958" font-size="19" fill="#18334c" font-weight="400">X₂ = 2x + ζ₂，只有 ζ₂ 仍随机</text><text x="870" y="987" font-size="19" fill="#18334c" font-weight="400">E[X₂ | do(X₁=x)] 对 x 的斜率为 2</text><text x="870" y="1016" font-size="19" fill="#18334c" font-weight="400">0.8 是方差占比，不是这条边的概率</text><text x="55" y="1020" font-size="21" fill="#586d80" font-weight="400">有交互时：一阶只计单源项，总阶还计含该源的交互项。</text><text x="55" y="1060" font-size="20" fill="#c36b24" font-weight="400">所有数字为独立代数例子；未执行因果发现或作者实验。</text><text x="36" y="1127" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>
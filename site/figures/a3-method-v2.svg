<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1250" viewBox="0 0 1400 1250" role="img" aria-labelledby="title desc"><title id="title">A³ ｜把广告评价拆成任务，再明确每项奖励约束什么</title><desc id="desc">原创中文教学图：人工目标、模型解释、规则奖励与推理输入分别标清。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1250" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">A³ ｜把广告评价拆成任务，再明确每项奖励约束什么</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">原创中文教学图：人工目标、模型解释、规则奖励与推理输入分别标清。</text><rect x="28" y="115" width="1344" height="245" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  数据先有人工目标，再由模型生成解释并抽样审核</text><rect x="52" y="179" width="585" height="165" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="211" font-size="23" fill="#2376c5" font-weight="700">人工标签 / 框 / 主观分数</text><text x="70" y="244" font-size="19" fill="#18334c" font-weight="400">30K广告图 → 120K指令响应对</text><text x="70" y="273" font-size="19" fill="#18334c" font-weight="400">批次质量阈值不是模型性能</text><text x="70" y="302" font-size="19" fill="#18334c" font-weight="400">按规则分二元、定位、评分任务</text><text x="70" y="331" font-size="19" fill="#18334c" font-weight="400">广告属性分数不是购买转化率</text><rect x="697" y="179" width="639" height="165" fill="#fff" stroke="#7750ad" rx="16"/><text x="715" y="211" font-size="23" fill="#7750ad" font-weight="700">模型解释与专家抽样</text><text x="715" y="244" font-size="19" fill="#18334c" font-weight="400">模型依据规则和答案生成解释</text><text x="715" y="273" font-size="19" fill="#18334c" font-weight="400">单条抽样接受需5位专家至少3票</text><text x="715" y="302" font-size="19" fill="#18334c" font-weight="400">评估子集接受率需稳定超过85%</text><text x="715" y="331" font-size="19" fill="#18334c" font-weight="400">不等于所有解释都由专家逐条书写</text><rect x="28" y="385" width="1344" height="245" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="419" font-size="24" fill="#18334c" font-weight="700">02  SFT学格式与任务，GRPO按当前规则选择有效奖励</text><rect x="52" y="451" width="585" height="165" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="483" font-size="23" fill="#2376c5" font-weight="700">所有样本：格式 + 去重复</text><text x="70" y="516" font-size="19" fill="#18334c" font-weight="400">格式有效 → R_format</text><text x="70" y="545" font-size="19" fill="#18334c" font-weight="400">句子与n-gram去重比例平均 → R_nonrep</text><text x="70" y="574" font-size="19" fill="#18334c" font-weight="400">能解析、少重复，不保证事实或逻辑正确</text><text x="70" y="603" font-size="19" fill="#18334c" font-weight="400">短文本与零分母需要实现规则</text><rect x="697" y="451" width="639" height="165" fill="#fff" stroke="#17816c" rx="16"/><text x="715" y="483" font-size="23" fill="#17816c" font-weight="700">仅适用任务：准确 / 工具 / 框 / 分数</text><text x="715" y="516" font-size="19" fill="#18334c" font-weight="400">二元：标签匹配；三类规则：工具调用且引用</text><text x="715" y="545" font-size="19" fill="#18334c" font-weight="400">图标：一对一匹配，IoU严格大于.5</text><text x="715" y="574" font-size="19" fill="#18334c" font-weight="400">主观：exp(−误差²/(2σ²))，σ=1.237</text><text x="715" y="603" font-size="19" fill="#18334c" font-weight="400">不适用奖励不应当作0参与平均</text><rect x="28" y="655" width="1344" height="245" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="689" font-size="24" fill="#18334c" font-weight="700">03  奖励算例：数值匹配、平均尺度和组内相对性分开看</text><rect x="52" y="721" width="380" height="165" fill="#fff" stroke="#7750ad" rx="16"/><text x="70" y="753" font-size="23" fill="#7750ad" font-weight="700">高斯评分奖励</text><text x="70" y="786" font-size="19" fill="#18334c" font-weight="400">误差0 → 1</text><text x="70" y="815" font-size="19" fill="#18334c" font-weight="400">误差1 → 约.721</text><text x="70" y="844" font-size="19" fill="#18334c" font-weight="400">误差2 → 约.271</text><text x="70" y="873" font-size="19" fill="#18334c" font-weight="400">不是直接优化跨样本SRCC</text><rect x="494" y="721" width="395" height="165" fill="#fff" stroke="#2376c5" rx="16"/><text x="512" y="753" font-size="23" fill="#2376c5" font-weight="700">有效奖励加权平均</text><text x="512" y="786" font-size="19" fill="#18334c" font-weight="400">教学等权：1、.8、1</text><text x="512" y="815" font-size="19" fill="#18334c" font-weight="400">总分2.8/3≈.933</text><text x="512" y="844" font-size="19" fill="#18334c" font-weight="400">只用当前任务的有效项</text><text x="512" y="873" font-size="19" fill="#18334c" font-weight="400">格式项未明示为乘法硬门控</text><rect x="951" y="721" width="385" height="165" fill="#fff" stroke="#17816c" rx="16"/><text x="969" y="753" font-size="23" fill="#17816c" font-weight="700">GRPO教学优势</text><text x="969" y="786" font-size="19" fill="#18334c" font-weight="400">候选奖励 .2、.5、.8</text><text x="969" y="815" font-size="19" fill="#18334c" font-weight="400">组均值 .5，总体标准差≈.245</text><text x="969" y="844" font-size="19" fill="#18334c" font-weight="400">标准化约−1.225、0、1.225</text><text x="969" y="873" font-size="19" fill="#18334c" font-weight="400">组大小与完整优化细节需核对</text><rect x="28" y="925" width="1344" height="265" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="959" font-size="24" fill="#18334c" font-weight="700">04  工具与推理边界</text><text x="55" y="993" font-size="23" fill="#18334c" font-weight="700">色相统计 / colorfulness / OCR提供辅助证据；促销图标定位不外包给检测器。</text><text x="55" y="1040" font-size="22" fill="#c36b24" font-weight="400">调用并引用工具 ≠ 解释忠实依赖结果；高colorfulness ≠ 广告协调性的充分证据。</text><text x="55" y="1087" font-size="22" fill="#7750ad" font-weight="400">推理只读取图像和规则，必要时用工具；不能把人工真值与训练奖励带入测试回答。</text><text x="55" y="1134" font-size="21" fill="#586d80" font-weight="400">依据§3.2–3.3、式1–2，PDF4–6；以上均为教学计算，未训练模型或评估真实广告。</text><text x="36" y="1227" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>
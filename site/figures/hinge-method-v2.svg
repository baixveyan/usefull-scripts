<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1240" viewBox="0 0 1400 1240" role="img" aria-labelledby="title desc"><title id="title">HINGE ｜逐基因恢复表达，用轻量条件路径接入冻结模型</title><desc id="desc">依据原文 Fig.1、式1–5、§3，PDF 3–5；向量与四步概率均为教学构造，未运行模型。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1240" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">HINGE ｜逐基因恢复表达，用轻量条件路径接入冻结模型</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据原文 Fig.1、式1–5、§3，PDF 3–5；向量与四步概率均为教学构造，未运行模型。</text><rect x="28" y="115" width="1344" height="240" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  条件化CellFM：冻结权重，但梯度仍须经过冻结算子</text><rect x="52" y="179" width="380" height="135" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="211" font-size="23" fill="#2376c5" font-weight="700">病理图 c → 冻结视觉编码器</text><text x="70" y="244" font-size="19" fill="#18334c" font-weight="400">图像特征 v + 时间嵌入 e_t</text><text x="70" y="273" font-size="19" fill="#18334c" font-weight="400">可训练 φ_cond → 共享条件 c_t</text><text x="70" y="302" font-size="19" fill="#18334c" font-weight="400">不是图像到真实测序的无损读取</text><path d="M240 314 L240 338 L1140 338 L1140 321" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="494" y="179" width="395" height="135" fill="#fff" stroke="#7750ad" rx="16"/><text x="512" y="211" font-size="23" fill="#7750ad" font-weight="700">mask-aware 基因token</text><text x="512" y="244" font-size="19" fill="#18334c" font-weight="400">可见：value embedding</text><text x="512" y="273" font-size="19" fill="#18334c" font-weight="400">遮挡：专门mask ID</text><text x="512" y="302" font-size="19" fill="#18334c" font-weight="400">再加gene ID，形成 G×D序列</text><path d="M889,245 L941,245" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="951" y="179" width="385" height="135" fill="#fff" stroke="#17816c" rx="16"/><text x="969" y="211" font-size="23" fill="#17816c" font-weight="700">冻结 CellFM + 冻结decoder</text><text x="969" y="244" font-size="19" fill="#18334c" font-weight="400">各子层插入可训练调制器</text><text x="969" y="273" font-size="19" fill="#18334c" font-weight="400">输出完整表达预测 x̂₀</text><text x="969" y="302" font-size="19" fill="#18334c" font-weight="400">训练损失只计算遮挡维度</text><rect x="28" y="380" width="1344" height="265" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="414" font-size="24" fill="#18334c" font-weight="700">02  反向生成：已可见值保留，新恢复位置填当前预测</text><rect x="52" y="446" width="380" height="140" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="478" font-size="23" fill="#2376c5" font-weight="700">当前状态：教学向量</text><text x="70" y="511" font-size="19" fill="#18334c" font-weight="400">m_t = (1, 0, 0)</text><text x="70" y="540" font-size="19" fill="#18334c" font-weight="400">x_t = (2, 0, 0)</text><text x="70" y="569" font-size="19" fill="#18334c" font-weight="400">网络预测 x̂₀ = (9, 3, 4)</text><path d="M432,515 L484,515" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="494" y="446" width="395" height="140" fill="#fff" stroke="#7750ad" rx="16"/><text x="512" y="478" font-size="23" fill="#7750ad" font-weight="700">可见性校准</text><text x="512" y="511" font-size="19" fill="#18334c" font-weight="400">x̃₀ = m_t x_t + (1−m_t) x̂₀</text><text x="512" y="540" font-size="19" fill="#18334c" font-weight="400">所以 x̃₀ = (2, 3, 4)</text><text x="512" y="569" font-size="19" fill="#18334c" font-weight="400">旧值2保留，不能被新预测9覆盖</text><path d="M889,515 L941,515" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="951" y="446" width="385" height="140" fill="#fff" stroke="#17816c" rx="16"/><text x="969" y="478" font-size="23" fill="#17816c" font-weight="700">采样新mask后更新</text><text x="969" y="511" font-size="19" fill="#18334c" font-weight="400">例如 m_(t−1) = (1, 0, 1)</text><text x="969" y="540" font-size="19" fill="#18334c" font-weight="400">x_(t−1) = (2, 0, 4)</text><text x="969" y="569" font-size="19" fill="#18334c" font-weight="400">“恢复可见”不是取得新的测序真值</text><text x="55" y="625" font-size="22" fill="#18334c" font-weight="700">从全mask出发；恢复概率 π_t=(ᾱ_(t−1)−ᾱ_t)/(1−ᾱ_t)。随机性来自mask轨迹。</text><rect x="28" y="670" width="1344" height="255" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="704" font-size="24" fill="#18334c" font-weight="700">03  SoftAdaLN：先调制输入，再对冻结子层输出门控</text><rect x="52" y="738" width="380" height="170" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="770" font-size="23" fill="#2376c5" font-weight="700">SoftNorm + 条件仿射</text><text x="70" y="803" font-size="19" fill="#18334c" font-weight="400">原表示与标准化表示按η混合</text><text x="70" y="832" font-size="19" fill="#18334c" font-weight="400">h′ = SoftNorm(h) ⊙ (1+s) + κ</text><text x="70" y="861" font-size="19" fill="#18334c" font-weight="400">初始化 η=0、s=0、κ=0</text><text x="70" y="890" font-size="19" fill="#18334c" font-weight="400">归一化沿token的隐藏维度</text><path d="M432,810 L484,810" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="494" y="738" width="395" height="170" fill="#fff" stroke="#7750ad" rx="16"/><text x="512" y="770" font-size="23" fill="#7750ad" font-weight="700">冻结 MHA 或 SGLU</text><text x="512" y="803" font-size="19" fill="#18334c" font-weight="400">u = F_frozen(h′)</text><text x="512" y="832" font-size="19" fill="#18334c" font-weight="400">冻结参数不等于切断全部梯度</text><text x="512" y="861" font-size="19" fill="#18334c" font-weight="400">梯度仍传回前面的调制器</text><text x="512" y="890" font-size="19" fill="#18334c" font-weight="400">视觉与CellFM预训练权重不更新</text><path d="M889,810 L941,810" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="951" y="738" width="385" height="170" fill="#fff" stroke="#17816c" rx="16"/><text x="969" y="770" font-size="23" fill="#17816c" font-weight="700">门控 + 残差 + 原 LayerNorm</text><text x="969" y="803" font-size="19" fill="#18334c" font-weight="400">h_out = LN(τ ⊙ u + λh)</text><text x="969" y="832" font-size="19" fill="#18334c" font-weight="400">τ初始化接近1，保留原子层</text><text x="969" y="861" font-size="19" fill="#18334c" font-weight="400">不是把子层输出零门控掉</text><text x="969" y="890" font-size="19" fill="#18334c" font-weight="400">decoder前另有无门控调制</text><rect x="28" y="950" width="1344" height="225" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="984" font-size="24" fill="#18334c" font-weight="700">04  四步日程只作代数核查；课程改变采样范围，不改变日程</text><text x="55" y="1018" font-size="23" fill="#18334c" font-weight="700">教学 T=4、ζ=1：反向恢复概率 1/4 → 1/3 → 1/2 → 1；期望可见率逐步到1。</text><text x="55" y="1064" font-size="22" fill="#7750ad" font-weight="400">初期仅抽低mask时间步；后期抽全范围。推理仍从全mask开始，不从20%mask开始。</text><text x="55" y="1110" font-size="21" fill="#586d80" font-weight="400">mask独立 ≠ 基因表达独立；冻结权重 ≠ 基因关系严格不变；样本多样 ≠ 不确定性已校准。</text><text x="36" y="1217" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>
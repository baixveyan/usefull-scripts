<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">A4VL：先找证据，再回答，再按分歧重新看</title><desc id="desc">action 指推理动作；外部视频内容与字幕不能授予代理新权限。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#6e8a83"/></marker><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#dde6dd"/></pattern></defs><rect width="1200" height="660" rx="20" fill="#fafcf8"/><rect y="110" width="1200" height="490" fill="url(#dots)"/><g font-family="Inter,Segoe UI,Microsoft YaHei,sans-serif"><text x="40" y="38" fill="#688279" font-size="11" font-weight="650">PAPER ATLAS / METHOD EXPLAINED</text><text x="40" y="75" fill="#1f3d34" font-size="28" font-weight="650">A4VL：先找证据，再回答，再按分歧重新看</text><text x="40" y="103" fill="#71867e" font-size="13" font-weight="400">action 指推理动作；外部视频内容与字幕不能授予代理新权限。</text><rect x="40" y="155" width="245" height="150" rx="14" fill="#e7effb" stroke="#3b6fba" stroke-opacity=".25"/><text x="60" y="187" fill="#3b6fba" font-size="18" font-weight="650">可选：无标签选队</text><text x="60" y="216" fill="#253d3c" font-size="14" font-weight="400">模型池 → 任务一致性评分</text><text x="60" y="241" fill="#253d3c" font-size="14" font-weight="400">选择 3 个异构 VLM</text><text x="60" y="266" fill="#253d3c" font-size="14" font-weight="400">不是根据真值选最好代理</text><rect x="390" y="155" width="310" height="150" rx="14" fill="#e5f3ec" stroke="#237958" stroke-opacity=".25"/><text x="410" y="187" fill="#237958" font-size="18" font-weight="650">感知：线索 → 视频块</text><text x="410" y="216" fill="#253d3c" font-size="14" font-weight="400">每代理先随机看 4 帧</text><text x="410" y="241" fill="#253d3c" font-size="14" font-weight="400">事件分块 + CLIP 线索检索</text><text x="410" y="266" fill="#253d3c" font-size="14" font-weight="400">从相关块采 16 帧</text><path d="M285 230 L390 230" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="820" y="155" width="335" height="150" rx="14" fill="#f0eafa" stroke="#7753a8" stroke-opacity=".25"/><text x="840" y="187" fill="#7753a8" font-size="18" font-weight="650">行动：回答与理由</text><text x="840" y="216" fill="#253d3c" font-size="14" font-weight="400">每代理基于自己的帧作答</text><text x="840" y="241" fill="#253d3c" font-size="14" font-weight="400">全体一致 → 总结回答</text><text x="840" y="266" fill="#253d3c" font-size="14" font-weight="400">一致性不保证正确</text><path d="M700 230 L820 230" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="820" y="420" width="335" height="135" rx="14" fill="#fff1df" stroke="#aa6b29" stroke-opacity=".25"/><text x="840" y="452" fill="#aa6b29" font-size="18" font-weight="650">不一致：互评与淘汰</text><text x="840" y="481" fill="#253d3c" font-size="14" font-weight="400">自己与同伴分别打分</text><text x="840" y="506" fill="#253d3c" font-size="14" font-weight="400">淘汰最低总分者</text><text x="840" y="531" fill="#253d3c" font-size="14" font-weight="400">剩余代理重写感知线索</text><path d="M990 305 L990 420" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><text x="995.0" y="353.5" fill="#627b73" font-size="11" font-weight="400">有分歧</text><path d="M820 485 H545 V305" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="7 6"/><text x="45" y="575" fill="#253d3c" font-size="15" font-weight="400">最多 3 轮（初始 3 代理）；最后剩 1 代理并不等于多人共同证实。</text><path d="M40 606H1160" stroke="#dae5dc"/><text x="40" y="631" fill="#71867e" font-size="12" font-weight="400">依据原论文 Fig.2 / §2 重绘；未展开事件边界检测和模型内部结构。</text><text x="1000" y="631" fill="#71867e" font-size="11" font-weight="400">原创概念重绘 · 非原图</text></g></svg>
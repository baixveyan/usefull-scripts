<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">4DP-QA：固定相机，才能看清“真正的运动”</title><desc id="desc">同一条世界轨迹可以有两种二维投影；区别只在参考相机是否随时间变化。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#6e8a83"/></marker><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#dde6dd"/></pattern></defs><rect width="1200" height="660" rx="20" fill="#fafcf8"/><rect y="110" width="1200" height="490" fill="url(#dots)"/><g font-family="Inter,Segoe UI,Microsoft YaHei,sans-serif"><text x="40" y="38" fill="#688279" font-size="11" font-weight="650">PAPER ATLAS / METHOD EXPLAINED</text><text x="40" y="75" fill="#1f3d34" font-size="28" font-weight="650">4DP-QA：固定相机，才能看清“真正的运动”</text><text x="40" y="103" fill="#71867e" font-size="13" font-weight="400">同一条世界轨迹可以有两种二维投影；区别只在参考相机是否随时间变化。</text><rect x="40" y="155" width="290" height="135" rx="14" fill="#e5f3ec" stroke="#237958" stroke-opacity=".25"/><text x="60" y="187" fill="#237958" font-size="18" font-weight="650">同一物体三维轨迹</text><text x="60" y="216" fill="#253d3c" font-size="14" font-weight="400">世界空间 X(t)</text><text x="60" y="241" fill="#253d3c" font-size="14" font-weight="400">相机外参随时间 T(t) 变化</text><rect x="455" y="145" width="345" height="145" rx="14" fill="#e7effb" stroke="#3b6fba" stroke-opacity=".25"/><text x="475" y="177" fill="#3b6fba" font-size="18" font-weight="650">常规图像轨迹 P₂D</text><text x="475" y="206" fill="#253d3c" font-size="14" font-weight="400">p(t) = Π(K, T(t), X(t))</text><text x="475" y="231" fill="#253d3c" font-size="14" font-weight="400">投影相机也在移动</text><text x="475" y="256" fill="#253d3c" font-size="14" font-weight="400">物体运动与相机运动纠缠</text><rect x="455" y="380" width="345" height="145" rx="14" fill="#f0eafa" stroke="#7753a8" stroke-opacity=".25"/><text x="475" y="412" fill="#7753a8" font-size="18" font-weight="650">True-motion 轨迹 M₂D</text><text x="475" y="441" fill="#253d3c" font-size="14" font-weight="400">m(t) = Π(K, T(tq), X(t))</text><text x="475" y="466" fill="#253d3c" font-size="14" font-weight="400">固定参考时刻 tq 的相机</text><text x="475" y="491" fill="#253d3c" font-size="14" font-weight="400">背景静止，物体轨迹更直观</text><path d="M330 205 L455 205" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M330 245 L455 435" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="895" y="165" width="255" height="120" rx="8" fill="#fff" stroke="#d5dfd7"/><path d="M915 250 L1130 250" stroke="#cad5cf"/><circle cx="925" cy="235" r="4" fill="#3b6fba" opacity="0.35"/><circle cx="968" cy="240" r="5" fill="#3b6fba" opacity="0.48"/><circle cx="1011" cy="245" r="6" fill="#3b6fba" opacity="0.61"/><circle cx="1054" cy="250" r="7" fill="#3b6fba" opacity="0.74"/><circle cx="1097" cy="255" r="8" fill="#3b6fba" opacity="0.87"/><path d="M800 220 L895 220" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="895" y="400" width="255" height="120" rx="8" fill="#fff" stroke="#d5dfd7"/><path d="M915 485 L1130 485" stroke="#cad5cf"/><circle cx="925" cy="470" r="4" fill="#7753a8" opacity="0.35"/><circle cx="968" cy="461" r="5" fill="#7753a8" opacity="0.48"/><circle cx="1011" cy="452" r="6" fill="#7753a8" opacity="0.61"/><circle cx="1054" cy="443" r="7" fill="#7753a8" opacity="0.74"/><circle cx="1097" cy="434" r="8" fill="#7753a8" opacity="0.87"/><path d="M800 455 L895 455" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><text x="45" y="560" fill="#253d3c" font-size="16" font-weight="400">4DP-QA 以可解释的 QA 模板生成监督；输出坐标并非完整、唯一的世界三维重建。</text><path d="M40 606H1160" stroke="#dae5dc"/><text x="40" y="631" fill="#71867e" font-size="12" font-weight="400">依据原论文 Fig.2 / 式1–2 重绘；两种轨迹互补，不可用光流直接替代固定参考轨迹。</text><text x="1000" y="631" fill="#71867e" font-size="11" font-weight="400">原创概念重绘 · 非原图</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1320" viewBox="0 0 1400 1320" role="img" aria-labelledby="title desc"><title id="title">ActivePolicy ｜从深度分歧到下一视角，再修正高斯地图</title><desc id="desc">依据正文 §3、Fig.2–3，PDF3–6；数值为教学例子，未运行 Habitat 或重建实验。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1320" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">ActivePolicy ｜从深度分歧到下一视角，再修正高斯地图</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据正文 §3、Fig.2–3，PDF3–6；数值为教学例子，未运行 Habitat 或重建实验。</text><rect x="28" y="115" width="1344" height="270" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  一个像素：未归一化累积、平均深度、几何融合是三个不同量</text><rect x="52" y="177" width="300" height="155" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="209" font-size="23" fill="#2376c5" font-weight="700">两高斯的示意读数</text><text x="70" y="242" font-size="19" fill="#18334c" font-weight="400">深度 d = [2, 4] 米</text><text x="70" y="271" font-size="19" fill="#18334c" font-weight="400">像素贡献 w = [.6, .2]</text><text x="70" y="300" font-size="19" fill="#18334c" font-weight="400">总贡献 .8；累积深度 2 m</text><rect x="403" y="177" width="380" height="155" fill="#fff" stroke="#c36b24" rx="16"/><text x="421" y="209" font-size="23" fill="#c36b24" font-weight="700">平均 + 主要贡献深度</text><text x="421" y="242" font-size="19" fill="#18334c" font-weight="400">dα = 2 / .8 = 2.5 m</text><text x="421" y="271" font-size="19" fill="#18334c" font-weight="400">dc = 2 m：按最大贡献解释</text><text x="421" y="300" font-size="19" fill="#18334c" font-weight="400">dc 选择算子需源码确认</text><path d="M352,245 L396,245" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="836" y="177" width="500" height="155" fill="#fff" stroke="#17816c" rx="16"/><text x="854" y="209" font-size="23" fill="#17816c" font-weight="700">对数域融合与最后修正</text><text x="854" y="242" font-size="19" fill="#18334c" font-weight="400">给定 wα = .5 → dr = √5 = 2.236 m</text><text x="854" y="271" font-size="19" fill="#18334c" font-weight="400">给定 κ=.5、ρc=.8 → q=.9</text><text x="854" y="300" font-size="19" fill="#18334c" font-weight="400">最终 d̂ = .9 dr + .1 dα = 2.262 m</text><path d="M783,245 L829,245" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><text x="65" y="365" font-size="21" fill="#18334c" font-weight="700">权重仅为教学假设；dα、dc、dr 的分歧产生 H×W 不确定度图 U，阈值计数才得到几何增益。</text><rect x="28" y="410" width="1344" height="335" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="444" font-size="24" fill="#18334c" font-weight="700">02  n 个候选 + 1 个地图节点：绝对收益和两两关系占据不同位置</text><circle cx="170" cy="582" r="47" fill="#edf3ff" stroke="#2376c5"/><text x="135" y="589" font-size="20" fill="#2376c5" font-weight="700">地图 0</text><path d="M220 582 L357 500" fill="none" stroke="#c36b24" stroke-width="3"/><circle cx="405" cy="500" r="44" fill="#eaf7f2" stroke="#17816c"/><text x="374" y="506" font-size="18" fill="#17816c" font-weight="700">候选 1</text><path d="M220 582 L542 585" fill="none" stroke="#c36b24" stroke-width="3"/><circle cx="590" cy="585" r="44" fill="#eaf7f2" stroke="#17816c"/><text x="559" y="591" font-size="18" fill="#17816c" font-weight="700">候选 2</text><path d="M220 582 L357 680" fill="none" stroke="#c36b24" stroke-width="3"/><circle cx="405" cy="680" r="44" fill="#eaf7f2" stroke="#17816c"/><text x="374" y="686" font-size="18" fill="#17816c" font-weight="700">候选 3</text><path d="M444 514 L550 568 M550 604 L442 663" fill="none" stroke="#7750ad" stroke-width="3"/><text x="62" y="728" font-size="19" fill="#18334c" font-weight="400">橙：几何 + 频谱；紫：重叠 × NCC × 距离衰减</text><rect x="713" y="474" width="620" height="213" fill="#fff" stroke="#2376c5" rx="16"/><text x="731" y="506" font-size="23" fill="#2376c5" font-weight="700">每个候选的渲染走两条通道</text><text x="731" y="539" font-size="19" fill="#18334c" font-weight="400">深度三估计 → U → 高不确定像素计数</text><text x="731" y="568" font-size="19" fill="#18334c" font-weight="400">灰度分块 → 窗函数 FFT → 高频 / 方向 / 边界</text><text x="731" y="597" font-size="19" fill="#18334c" font-weight="400">n=3 → A 为 4×4；度数为每行边权总和</text><text x="731" y="626" font-size="19" fill="#18334c" font-weight="400">L = I − D^(−1/2) A D^(−1/2)</text><text x="731" y="655" font-size="19" fill="#18334c" font-weight="400">取第二小特征向量，比较候选分量的绝对值</text><rect x="28" y="771" width="1344" height="260" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="805" font-size="24" fill="#18334c" font-weight="700">03  选视角与优化地图：两种循环不能混为一次前向</text><rect x="52" y="833" width="302" height="146" fill="#fff" stroke="#7750ad" rx="16"/><text x="70" y="865" font-size="23" fill="#7750ad" font-weight="700">图分数 → 下一视角</text><text x="70" y="898" font-size="19" fill="#18334c" font-weight="400">候选分量 |v₁[i]| 较小者</text><text x="70" y="927" font-size="19" fill="#18334c" font-weight="400">原式 6 漏印选择算子</text><text x="70" y="956" font-size="19" fill="#18334c" font-weight="400">NCC 负权 / 重根需处理</text><rect x="409" y="833" width="330" height="146" fill="#fff" stroke="#2376c5" rx="16"/><text x="427" y="865" font-size="23" fill="#2376c5" font-weight="700">RRT → 采集已定位 RGB-D</text><text x="427" y="898" font-size="19" fill="#18334c" font-weight="400">安全可行路径需独立检查</text><text x="427" y="927" font-size="19" fill="#18334c" font-weight="400">新观测初始化 / 更新高斯</text><text x="427" y="956" font-size="19" fill="#18334c" font-weight="400">探索与回访共用 2000 帧预算</text><path d="M354,904 L402,904" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="796" y="833" width="540" height="146" fill="#fff" stroke="#17816c" rx="16"/><text x="814" y="865" font-size="23" fill="#17816c" font-weight="700">回访关键帧 → 渲染 → RGB / 深度 L1</text><text x="814" y="898" font-size="19" fill="#18334c" font-weight="400">像素分歧 → 可疑高斯 → 随机 dropout</text><text x="814" y="927" font-size="19" fill="#18334c" font-weight="400">留下者透明度补偿；稳定表面承担更多责任</text><text x="814" y="956" font-size="19" fill="#18334c" font-weight="400">低 PSNR 对应较大误差，回访不是挑最高 PSNR</text><path d="M739,904 L789,904" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="28" y="1057" width="1344" height="217" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="1091" font-size="24" fill="#18334c" font-weight="700">04  丢弃示例：概率与透明度补偿，非直接永久删点</text><rect x="53" y="1115" width="600" height="120" fill="#fff" stroke="#c36b24" rx="16"/><text x="71" y="1147" font-size="23" fill="#c36b24" font-weight="700">给定归一化稳定度 .8、检测置信度 .75</text><text x="71" y="1180" font-size="19" fill="#18334c" font-weight="400">p = .1 + .5 × .8 × .75 = .4</text><text x="71" y="1209" font-size="19" fill="#18334c" font-weight="400">随机暂时屏蔽；未屏蔽时再进行补偿</text><rect x="707" y="1115" width="627" height="120" fill="#fff" stroke="#17816c" rx="16"/><text x="725" y="1147" font-size="23" fill="#17816c" font-weight="700">原透明度 .5、γkeep = .2</text><text x="725" y="1180" font-size="19" fill="#18334c" font-weight="400">αcomp = .5 × (1 + .2 × .4) = .54</text><text x="725" y="1209" font-size="19" fill="#18334c" font-weight="400">p 裁切、α 上界、退火曲线与 stop-gradient 未充分交代</text><text x="36" y="1297" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>
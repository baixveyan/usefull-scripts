<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1250" viewBox="0 0 1400 1250" role="img" aria-labelledby="title desc"><title id="title">A4Mer ｜变长动作单元如何组成层级表示</title><desc id="desc">原创中文详图：分段、显式模式挖掘、层级遮挡与动态损失分别解释。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1250" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">A4Mer ｜变长动作单元如何组成层级表示</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">原创中文详图：分段、显式模式挖掘、层级遮挡与动态损失分别解释。</text><rect x="28" y="115" width="1344" height="245" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  帧 → Atom → Motif：压缩的是变长片段</text><rect x="52" y="179" width="385" height="165" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="211" font-size="23" fill="#2376c5" font-weight="700">运动学边界先确定</text><text x="70" y="244" font-size="19" fill="#18334c" font-weight="400">轨迹偏离线性外推 → Atom边界</text><text x="70" y="273" font-size="19" fill="#18334c" font-weight="400">段内max-pool初始化query</text><text x="70" y="302" font-size="19" fill="#18334c" font-weight="400">该段帧token作K/V，聚成一个token</text><text x="70" y="331" font-size="19" fill="#18334c" font-weight="400">自注意力限同段；阈值需补充材料</text><path d="M437,255 L483,255" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="498" y="179" width="395" height="165" fill="#fff" stroke="#17816c" rx="16"/><text x="516" y="211" font-size="23" fill="#17816c" font-weight="700">段间关系与模式发现</text><text x="516" y="244" font-size="19" fill="#18334c" font-weight="400">LatentFormer读Atom序列</text><text x="516" y="273" font-size="19" fill="#18334c" font-weight="400">训练集k-means：512类离散码</text><text x="516" y="302" font-size="19" fill="#18334c" font-weight="400">GSP发现频繁组合</text><text x="516" y="331" font-size="19" fill="#18334c" font-weight="400">测试最近邻赋码，不重拟合聚类</text><path d="M893,255 L939,255" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="954" y="179" width="380" height="165" fill="#fff" stroke="#7750ad" rx="16"/><text x="972" y="211" font-size="23" fill="#7750ad" font-weight="700">动态规划非重叠覆盖</text><text x="972" y="244" font-size="19" fill="#18334c" font-weight="400">教学ABABC → AB | ABC</text><text x="972" y="273" font-size="19" fill="#18334c" font-weight="400">比A | B | ABC少一段</text><text x="972" y="302" font-size="19" fill="#18334c" font-weight="400">连续覆盖递推仅为教学版本</text><text x="972" y="331" font-size="19" fill="#18334c" font-weight="400">GSP间隔 / 回退规则需核验</text><rect x="28" y="385" width="1344" height="245" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="419" font-size="24" fill="#18334c" font-weight="700">02  遮挡必须贯穿层级：目标分支完整，在线分支看不见目标内容</text><rect x="52" y="451" width="595" height="165" fill="#fff" stroke="#c36b24" rx="16"/><text x="70" y="483" font-size="23" fill="#c36b24" font-weight="700">Motif M2由Atoms a3、a4组成</text><text x="70" y="516" font-size="19" fill="#18334c" font-weight="400">遮M2时，同时遮掉a3与a4</text><text x="70" y="545" font-size="19" fill="#18334c" font-weight="400">否则下层可能直接泄露其组成</text><text x="70" y="574" font-size="19" fill="#18334c" font-weight="400">在线分支 + mask token → 预测latent</text><text x="70" y="603" font-size="19" fill="#18334c" font-weight="400">目标分支读完整输入，目标stop-grad</text><rect x="697" y="451" width="640" height="165" fill="#fff" stroke="#2376c5" rx="16"/><text x="715" y="483" font-size="23" fill="#2376c5" font-weight="700">EMA更新目标，不是梯度直接更新目标</text><text x="715" y="516" font-size="19" fill="#18334c" font-weight="400">在线参数通过预测损失更新</text><text x="715" y="545" font-size="19" fill="#18334c" font-weight="400">目标参数跟随在线参数的移动平均</text><text x="715" y="574" font-size="19" fill="#18334c" font-weight="400">预训练缺失补全不自动等于因果预测</text><text x="715" y="603" font-size="19" fill="#18334c" font-weight="400">未来任务不能读真实未来段长</text><rect x="28" y="655" width="1344" height="265" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="689" font-size="24" fill="#18334c" font-weight="700">03  均值只覆盖被遮挡集合：局部与全局控制不同误差</text><rect x="52" y="721" width="385" height="170" fill="#fff" stroke="#17816c" rx="16"/><text x="70" y="753" font-size="23" fill="#17816c" font-weight="700">目标(1,3)，预测(2,4)</text><text x="70" y="786" font-size="19" fill="#18334c" font-weight="400">目标均值2，预测均值3</text><text x="70" y="815" font-size="19" fill="#18334c" font-weight="400">局部都为(−1,1)</text><text x="70" y="844" font-size="19" fill="#18334c" font-weight="400">局部误差0，全局仍有偏差</text><text x="70" y="873" font-size="19" fill="#18334c" font-weight="400">不是所有误差都被局部项约束</text><rect x="498" y="721" width="395" height="170" fill="#fff" stroke="#c36b24" rx="16"/><text x="516" y="753" font-size="23" fill="#c36b24" font-weight="700">目标(1,3)，预测(0,4)</text><text x="516" y="786" font-size="19" fill="#18334c" font-weight="400">两边均值都是2</text><text x="516" y="815" font-size="19" fill="#18334c" font-weight="400">局部为(−1,1)与(−2,2)</text><text x="516" y="844" font-size="19" fill="#18334c" font-weight="400">全局误差0，局部仍不同</text><text x="516" y="873" font-size="19" fill="#18334c" font-weight="400">比值分母为0需稳定规则</text><rect x="954" y="721" width="380" height="170" fill="#fff" stroke="#7750ad" rx="16"/><text x="972" y="753" font-size="23" fill="#7750ad" font-weight="700">停止梯度不能约分</text><text x="972" y="786" font-size="19" fill="#18334c" font-weight="400">L_l=.2，L_g=.1 → λ=2</text><text x="972" y="815" font-size="19" fill="#18334c" font-weight="400">α=.05 → αλL_g=.01</text><text x="972" y="844" font-size="19" fill="#18334c" font-weight="400">对L_g的系数仍是.1</text><text x="972" y="873" font-size="19" fill="#18334c" font-weight="400">不能替换成局部损失反传</text><rect x="28" y="945" width="1344" height="250" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="979" font-size="24" fill="#18334c" font-weight="700">04  下游接口：token之外还需要长度和监督口径</text><text x="55" y="1012" font-size="23" fill="#18334c" font-weight="700">教学3/5/4帧：段内位置对50，整段144；LatentFormer另读3个token。</text><text x="55" y="1060" font-size="22" fill="#2376c5" font-weight="400">预测头同时估计下一token与帧数，再顺序解码姿态；测试不可用真实未来长度。</text><text x="55" y="1108" font-size="22" fill="#c36b24" font-weight="400">k-NN识别仍需带动作标签的参考token；频繁模式不等于人工命名动作。</text><text x="55" y="1156" font-size="20" fill="#586d80" font-weight="400">依据§3.1–3.4、式1–6，PDF3–5；字母码/标量为教学例，未运行训练。</text><text x="36" y="1227" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>
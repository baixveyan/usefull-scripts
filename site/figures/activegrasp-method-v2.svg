<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1330" viewBox="0 0 1400 1330" role="img" aria-labelledby="title desc"><title id="title">ActiveGrasp ｜把观察方向对准抓取的不确定性</title><desc id="desc">原创中文详图：区分位姿密度、成功概率、场景方差和任务敏感方向。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1330" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">ActiveGrasp ｜把观察方向对准抓取的不确定性</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">原创中文详图：区分位姿密度、成功概率、场景方差和任务敏感方向。</text><rect x="28" y="115" width="1344" height="245" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  已训练能量模型 + 在线场景优化：更新对象不同</text><rect x="52" y="179" width="385" height="165" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="211" font-size="23" fill="#2376c5" font-weight="700">标定RGBD / 分割 → 3DGS</text><text x="70" y="244" font-size="19" fill="#18334c" font-weight="400">反投影与正运动学提供几何</text><text x="70" y="273" font-size="19" fill="#18334c" font-weight="400">每新增视角优化场景1000步</text><text x="70" y="302" font-size="19" fill="#18334c" font-weight="400">前景512点 + 背景512点</text><text x="70" y="331" font-size="19" fill="#18334c" font-weight="400">网络读高斯中心，不读所有属性</text><path d="M437,255 L483,255" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="498" y="179" width="395" height="165" fill="#fff" stroke="#17816c" rx="16"/><text x="516" y="211" font-size="23" fill="#17816c" font-weight="700">场景点 + 抓手锚点 + 噪声</text><text x="516" y="244" font-size="19" fill="#18334c" font-weight="400">P：1024×2×3；抓手g∈SE(3)</text><text x="516" y="273" font-size="19" fill="#18334c" font-weight="400">VNN / MLP → PointNet → 两logit</text><text x="516" y="302" font-size="19" fill="#18334c" font-weight="400">离线学习成功 / 失败能量</text><text x="516" y="331" font-size="19" fill="#18334c" font-weight="400">在线未描述继续微调EBM</text><path d="M893,255 L939,255" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="954" y="179" width="380" height="165" fill="#fff" stroke="#7750ad" rx="16"/><text x="972" y="211" font-size="23" fill="#7750ad" font-weight="700">128视角评分 → 新观测</text><text x="972" y="244" font-size="19" fill="#18334c" font-weight="400">候选球面距目标.3–.5 m</text><text x="972" y="273" font-size="19" fill="#18334c" font-weight="400">选择前仍需考虑机器人可达</text><text x="972" y="302" font-size="19" fill="#18334c" font-weight="400">观测 → 更新场景 → 下一轮</text><text x="972" y="331" font-size="19" fill="#18334c" font-weight="400">预算结束再规划并执行抓取</text><rect x="28" y="385" width="1344" height="245" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="419" font-size="24" fill="#18334c" font-weight="700">02  概率教学：aS=log6，aF=log2；式19分母=6+2+2=10</text><rect x="52" y="451" width="595" height="165" fill="#fff" stroke="#c36b24" rx="16"/><text x="70" y="483" font-size="23" fill="#c36b24" font-weight="700">pS=.6，pF=.2，总和=.8</text><text x="70" y="516" font-size="19" fill="#18334c" font-weight="400">不是互补的普通二类softmax</text><text x="70" y="545" font-size="19" fill="#18334c" font-weight="400">成功Bernoulli熵用(.6,.4)</text><text x="70" y="574" font-size="19" fill="#18334c" font-weight="400">不能直接将(.6,.2)代入该熵</text><text x="70" y="603" font-size="19" fill="#18334c" font-weight="400">额外质量和温度接口仍需核验</text><rect x="697" y="451" width="640" height="165" fill="#fff" stroke="#2376c5" rx="16"/><text x="715" y="483" font-size="23" fill="#2376c5" font-weight="700">位姿分布p(g|w)与成功率s(g,w)不同</text><text x="715" y="516" font-size="19" fill="#18334c" font-weight="400">E_S=−log(.6)≈.5108</text><text x="715" y="545" font-size="19" fill="#18334c" font-weight="400">能量密度还需要全位姿空间归一化</text><text x="715" y="574" font-size="19" fill="#18334c" font-weight="400">h(.5)=.6931；h(.9)=h(.1)=.3251</text><text x="715" y="603" font-size="19" fill="#18334c" font-weight="400">确信失败也能低熵，不是执行成功保证</text><rect x="28" y="655" width="1344" height="300" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="689" font-size="24" fill="#18334c" font-weight="700">03  二维教学：H=diag(4,1)，A加精度(4,0)，B加(0,1)</text><text x="55" y="722" font-size="23" fill="#18334c" font-weight="700">方差缩减：A=(.125,0)，B=(0,.5)；任务敏感权重c=(9,.04)。</text><text x="55" y="770" font-size="22" fill="#2376c5" font-weight="700">纯几何：总方差缩减</text><text x="730" y="770" font-size="22" fill="#17816c" font-weight="700">任务加权：I=½Σ c_i Δvar_i</text><text x="55" y="825" font-size="23" fill="#2376c5" font-weight="700">A</text><rect x="95" y="802" width="120.0" height="30" fill="#cfe4fa" stroke="#2376c5" rx="3"/><text x="590" y="826" font-size="22" fill="#2376c5" font-weight="400">0.125</text><text x="55" y="881" font-size="23" fill="#2376c5" font-weight="700">B</text><rect x="95" y="858" width="480.0" height="30" fill="#cfe4fa" stroke="#2376c5" rx="3"/><text x="590" y="882" font-size="22" fill="#2376c5" font-weight="400">0.5</text><text x="730" y="825" font-size="23" fill="#17816c" font-weight="700">A</text><rect x="770" y="802" width="440.0" height="30" fill="#ccebe1" stroke="#17816c" rx="3"/><text x="1230" y="826" font-size="22" fill="#17816c" font-weight="400">0.5625</text><text x="730" y="881" font-size="23" fill="#17816c" font-weight="700">B</text><rect x="770" y="858" width="7.822222222222223" height="30" fill="#ccebe1" stroke="#17816c" rx="3"/><text x="1230" y="882" font-size="22" fill="#17816c" font-weight="400">0.01</text><text x="55" y="927" font-size="22" fill="#c36b24" font-weight="400">左侧选B，右侧选A：信息多不等于对抓取判断更有帮助。数值为原创教学例。</text><rect x="28" y="980" width="1344" height="300" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="1014" font-size="24" fill="#18334c" font-weight="700">04  真实计算是多重近似：后验精度、任务曲率、归一化导数分别核查</text><text x="55" y="1047" font-size="22" fill="#18334c" font-weight="700">场景局部高斯 → 协方差≈H⁻¹；候选精度增量来自当前渲染雅可比。</text><text x="55" y="1095" font-size="22" fill="#2376c5" font-weight="400">任务曲率以uuᵀ+λI代理，再取对角：不等于真实Hessian。</text><text x="55" y="1143" font-size="21" fill="#c36b24" font-weight="400">式17原文最后为负；按归一化e^(−E)/Z求导应有正补偿项，代码尚未核验。</text><text x="55" y="1191" font-size="22" fill="#7750ad" font-weight="400">L=(L成功+L失败)/2 + L_AP + .1 L_SDF；网络 / 温度离线训练。</text><text x="55" y="1240" font-size="20" fill="#586d80" font-weight="400">依据式1–23、Fig.2、§3–4，PDF3–7；未运行仿真、训练或机器人。</text><text x="36" y="1307" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>
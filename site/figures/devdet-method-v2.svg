<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1230" viewBox="0 0 1400 1230" role="img" aria-labelledby="title desc"><title id="title">DevDet ｜从多域分数错位到两阶段自适应显影</title><desc id="desc">依据原文 §3–4、Fig.3、式1–7，PDF 3–5；顶部为教学分数，不是实验结果。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1230" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">DevDet ｜从多域分数错位到两阶段自适应显影</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据原文 §3–4、Fig.3、式1–7，PDF 3–5；顶部为教学分数，不是实验结果。</text><rect x="28" y="115" width="1344" height="265" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  教学分数：每域 AUC=1，统一0.5阈值仍只有50%正确</text><path d="M160,312 L1200,312" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><path d="M260,305 L260,319" stroke="#586d80" stroke-width="2"/><text x="240" y="345" font-size="18" fill="#586d80" font-weight="400">0.1</text><path d="M360,305 L360,319" stroke="#586d80" stroke-width="2"/><text x="340" y="345" font-size="18" fill="#586d80" font-weight="400">0.2</text><path d="M660,305 L660,319" stroke="#586d80" stroke-width="2"/><text x="640" y="345" font-size="18" fill="#586d80" font-weight="400">0.5阈值</text><path d="M960,305 L960,319" stroke="#586d80" stroke-width="2"/><text x="940" y="345" font-size="18" fill="#586d80" font-weight="400">0.8</text><path d="M1060,305 L1060,319" stroke="#586d80" stroke-width="2"/><text x="1040" y="345" font-size="18" fill="#586d80" font-weight="400">0.9</text><path d="M660,178 L660,300" stroke="#7750ad" stroke-width="2" stroke-dasharray="7 5"/><text x="60" y="223" font-size="22" fill="#18334c" font-weight="700">域 A</text><circle cx="260" cy="216" r="10" fill="#2376c5"/><circle cx="360" cy="216" r="10" fill="#c36b24"/><text x="278" y="223" font-size="20" fill="#2376c5" font-weight="400">真</text><text x="378" y="223" font-size="20" fill="#c36b24" font-weight="400">假</text><text x="60" y="283" font-size="22" fill="#18334c" font-weight="700">域 B</text><circle cx="960" cy="276" r="10" fill="#2376c5"/><circle cx="1060" cy="276" r="10" fill="#c36b24"/><text x="978" y="283" font-size="20" fill="#2376c5" font-weight="400">真</text><text x="1078" y="283" font-size="20" fill="#c36b24" font-weight="400">假</text><text x="1210" y="315" font-size="18" fill="#586d80" font-weight="400">假分↑</text><text x="55" y="365" font-size="21" fill="#c36b24" font-weight="400">四对真假比较只对3对：混合 AUC=0.75。分数全为解释例子，不是作者预测。</text><rect x="28" y="405" width="1344" height="280" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="439" font-size="24" fill="#18334c" font-weight="700">02  冻结对象互换；冻结权重不等于切断输入梯度</text><rect x="52" y="471" width="585" height="165" fill="#fff" stroke="#c36b24" rx="16"/><text x="70" y="503" font-size="23" fill="#c36b24" font-weight="700">Stage 1：更新 G，固定检测器 f</text><text x="70" y="536" font-size="19" fill="#18334c" font-weight="400">难假 + 易真 → G(x) → x̃ = x + ε G(x)</text><text x="70" y="565" font-size="19" fill="#18334c" font-weight="400">f 的参数不更新，但分类梯度经输入传给 G</text><text x="70" y="594" font-size="19" fill="#18334c" font-weight="400">目标：难假更易判假，易真仍判真</text><text x="70" y="623" font-size="19" fill="#18334c" font-weight="400">原式 TV 作用在 x̃，不自动改成 TV(G(x))</text><rect x="697" y="471" width="639" height="165" fill="#fff" stroke="#7750ad" rx="16"/><text x="715" y="503" font-size="23" fill="#7750ad" font-weight="700">Stage 2：固定 G，微调检测器 f</text><text x="715" y="536" font-size="19" fill="#18334c" font-weight="400">多域训练图 → DoseDict调剂量 → x̃ → f</text><text x="715" y="565" font-size="19" fill="#18334c" font-weight="400">检测器适应经过输入变换的特征分布</text><text x="715" y="594" font-size="19" fill="#18334c" font-weight="400">字典用的特征坐标、Norm及冻结边界需核对</text><text x="715" y="623" font-size="19" fill="#18334c" font-weight="400">不是单纯给最终分数做温度缩放</text><rect x="28" y="710" width="1344" height="300" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="744" font-size="24" fill="#18334c" font-weight="700">03  推理有两条输入分支：一个生成残差，一个控制剂量</text><rect x="52" y="778" width="280" height="140" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="810" font-size="23" fill="#2376c5" font-weight="700">输入人脸 x</text><text x="70" y="843" font-size="19" fill="#18334c" font-weight="400">无推理真值或域标签</text><text x="70" y="872" font-size="19" fill="#18334c" font-weight="400">按研究预处理得到RGB</text><rect x="398" y="766" width="400" height="100" fill="#fff" stroke="#17816c" rx="16"/><text x="416" y="798" font-size="23" fill="#17816c" font-weight="700">DevGen G：残差</text><text x="416" y="831" font-size="19" fill="#18334c" font-weight="400">δ_dev 与 x 同尺寸</text><path d="M332,812 L391,812" fill="none" stroke="#17816c" stroke-width="3" marker-end="url(#17816c)" /><rect x="398" y="886" width="400" height="100" fill="#fff" stroke="#c36b24" rx="16"/><text x="416" y="918" font-size="23" fill="#c36b24" font-weight="700">DoseDict：重建误差</text><text x="416" y="951" font-size="19" fill="#18334c" font-weight="400">e = ‖z − D α*(z)‖₂ → Norm(1−e)</text><path d="M190 918 L190 938 L391 938" fill="none" stroke="#c36b24" stroke-width="3" marker-end="url(#c36b24)" /><rect x="915" y="803" width="421" height="175" fill="#fff" stroke="#7750ad" rx="16"/><text x="933" y="835" font-size="23" fill="#7750ad" font-weight="700">融合后再检测</text><text x="933" y="868" font-size="19" fill="#18334c" font-weight="400">x̃ = x + ε_a δ_dev → f(x̃)</text><text x="933" y="897" font-size="19" fill="#18334c" font-weight="400">误差低表示接近已知难假字典</text><text x="933" y="926" font-size="19" fill="#18334c" font-weight="400">不等于这个输入的真实假概率</text><text x="933" y="955" font-size="19" fill="#18334c" font-weight="400">Norm范围与特征归一化需查实现</text><path d="M798 816 L850 816 L850 845 L908 845" fill="none" stroke="#17816c" stroke-width="3" marker-end="url(#17816c)" /><path d="M798 938 L850 938 L850 909 L908 909" fill="none" stroke="#c36b24" stroke-width="3" marker-end="url(#c36b24)" /><rect x="28" y="1035" width="1344" height="140" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="1069" font-size="24" fill="#18334c" font-weight="700">04  把机制意图、实验和取证结论分开</text><text x="55" y="1100" font-size="23" fill="#18334c" font-weight="700">“显影”是检测器相关的学习变换；高响应不自动证明该位置存在物理伪造痕迹。</text><text x="55" y="1143" font-size="21" fill="#586d80" font-weight="400">MID与未知域分别测；P2平均主要是假样本检出，不能当作已覆盖真实误报的总体准确率。</text><text x="36" y="1207" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>
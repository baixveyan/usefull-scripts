<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">T2LDM：把几何细节教给去噪器，辅助网络不随推理走</title><desc id="desc">DPE 缓解球面视野展开的方位混淆；检测框匹配率仍受评价检测器影响。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#6e8a83"/></marker><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#dde6dd"/></pattern></defs><rect width="1200" height="660" rx="20" fill="#fafcf8"/><rect y="110" width="1200" height="490" fill="url(#dots)"/><g font-family="Inter,Segoe UI,Microsoft YaHei,sans-serif"><text x="40" y="38" fill="#688279" font-size="11" font-weight="650">PAPER ATLAS / METHOD EXPLAINED</text><text x="40" y="75" fill="#1f3d34" font-size="28" font-weight="650">T2LDM：把几何细节教给去噪器，辅助网络不随推理走</text><text x="40" y="103" fill="#71867e" font-size="13" font-weight="400">DPE 缓解球面视野展开的方位混淆；检测框匹配率仍受评价检测器影响。</text><rect x="40" y="155" width="250" height="155" rx="14" fill="#e7effb" stroke="#3b6fba" stroke-opacity=".25"/><text x="60" y="187" fill="#3b6fba" font-size="18" font-weight="650">文本 + 噪声 RM</text><text x="60" y="216" fill="#253d3c" font-size="14" font-weight="400">CLIP 文本特征</text><text x="60" y="241" fill="#253d3c" font-size="14" font-weight="400">RM：距离 / 强度双通道</text><text x="60" y="266" fill="#253d3c" font-size="14" font-weight="400">水平 / 垂直方向角 DPE</text><rect x="400" y="155" width="310" height="155" rx="14" fill="#e5f3ec" stroke="#237958" stroke-opacity=".25"/><text x="420" y="187" fill="#237958" font-size="18" font-weight="650">DN 去噪网络</text><text x="420" y="216" fill="#253d3c" font-size="14" font-weight="400">条件 U-Net + 时间步</text><text x="420" y="241" fill="#253d3c" font-size="14" font-weight="400">v 预测与 CFG</text><text x="420" y="266" fill="#253d3c" font-size="14" font-weight="400">学习几何细节分布</text><path d="M290 230 L400 230" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="825" y="155" width="330" height="155" rx="14" fill="#e5f3ec" stroke="#237958" stroke-opacity=".25"/><text x="845" y="187" fill="#237958" font-size="18" font-weight="650">推理：仅迭代 DN</text><text x="845" y="216" fill="#253d3c" font-size="14" font-weight="400">噪声逐步恢复 Range Map</text><text x="845" y="241" fill="#253d3c" font-size="14" font-weight="400">逆球面投影 → LiDAR</text><text x="845" y="266" fill="#253d3c" font-size="14" font-weight="400">辅助 GN 不在推理路径</text><path d="M710 230 L825 230" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="400" y="425" width="420" height="140" rx="14" fill="#f0eafa" stroke="#7753a8" stroke-opacity=".25"/><text x="420" y="457" fill="#7753a8" font-size="18" font-weight="650">GN：训练期重建辅助</text><text x="420" y="486" fill="#253d3c" font-size="14" font-weight="400">输入干净 RM + DN 噪声特征</text><text x="420" y="511" fill="#253d3c" font-size="14" font-weight="400">重建细节 → 多尺度余弦对齐</text><text x="420" y="536" fill="#253d3c" font-size="14" font-weight="400">前 100k 步更新，之后冻结</text><path d="M555 310 L555 425" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="7 6"/><text x="560.0" y="358.5" fill="#627b73" font-size="11" font-weight="400">DN 多层特征</text><path d="M820 470 L710 290" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="7 6"/><text x="770.0" y="371.0" fill="#627b73" font-size="11" font-weight="400">SCRG 训练监督</text><text x="45" y="575" fill="#253d3c" font-size="15" font-weight="400">训练期可见干净目标；推理不得输入干净 RM，否则造成信息泄漏。</text><path d="M40 606H1160" stroke="#dae5dc"/><text x="40" y="631" fill="#71867e" font-size="12" font-weight="400">依据原论文 Fig.3 / §4 重绘；省略 DDPM 采样内部层与损失日程。</text><text x="1000" y="631" fill="#71867e" font-size="11" font-weight="400">原创概念重绘 · 非原图</text></g></svg>
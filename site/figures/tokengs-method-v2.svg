<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1040" viewBox="0 0 1400 1040" role="img" aria-labelledby="title desc"><title id="title">TokenGS ｜从图像证据到固定预算的三维高斯</title><desc id="desc">依据原文 §3、Fig.2/4，PDF 3–5；几何数值为解释例子，未沿用作者实验数据。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1040" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">TokenGS ｜从图像证据到固定预算的三维高斯</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据原文 §3、Fig.2/4，PDF 3–5；几何数值为解释例子，未沿用作者实验数据。</text><rect x="28" y="115" width="1344" height="310" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  两条序列：输入增加证据，不自动增加输出高斯</text><rect x="52" y="178" width="245" height="130" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="210" font-size="23" fill="#2376c5" font-weight="700">图像 + 相机</text><text x="70" y="243" font-size="19" fill="#18334c" font-weight="400">N_c 张 H × W 图片</text><text x="70" y="272" font-size="19" fill="#18334c" font-weight="400">RGB patch + 射线编码</text><text x="70" y="301" font-size="19" fill="#18334c" font-weight="400">N_I = N_c HW / p²</text><rect x="352" y="178" width="260" height="130" fill="#fff" stroke="#2376c5" rx="16"/><text x="370" y="210" font-size="23" fill="#2376c5" font-weight="700">跨视图编码器</text><text x="370" y="243" font-size="19" fill="#18334c" font-weight="400">图像证据 B：N_I × C</text><text x="370" y="272" font-size="19" fill="#18334c" font-weight="400">输入更多视图 → N_I 增加</text><path d="M297,240 L345,240" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="52" y="333" width="245" height="66" fill="#fff" stroke="#7750ad" rx="16"/><text x="70" y="359" font-size="22" fill="#7750ad" font-weight="700">可学习查询 T</text><text x="70" y="387" font-size="20" fill="#7750ad" font-weight="400">N_t × C</text><path d="M297 365 L650 365 L650 300 L683 300" fill="none" stroke="#7750ad" stroke-width="3" marker-end="url(#7750ad)" /><rect x="690" y="178" width="295" height="160" fill="#fff" stroke="#7750ad" rx="16"/><text x="708" y="210" font-size="23" fill="#7750ad" font-weight="700">解码：查询读图像证据</text><text x="708" y="243" font-size="19" fill="#18334c" font-weight="400">Q 来自 T；K/V 来自 B</text><text x="708" y="272" font-size="19" fill="#18334c" font-weight="400">交叉注意力：N_t × N_I</text><text x="708" y="301" font-size="19" fill="#18334c" font-weight="400">查询间自注意力：N_t × N_t</text><text x="708" y="330" font-size="19" fill="#18334c" font-weight="400">不同层共享图像 K/V</text><path d="M612,240 L683,240" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="1040" y="178" width="300" height="160" fill="#fff" stroke="#2376c5" rx="16"/><text x="1058" y="210" font-size="23" fill="#2376c5" font-weight="700">回归并展开</text><text x="1058" y="243" font-size="19" fill="#18334c" font-weight="400">每 token → 64 × 14 属性</text><text x="1058" y="272" font-size="19" fill="#18334c" font-weight="400">G：(64 N_t) × 14</text><text x="1058" y="301" font-size="19" fill="#18334c" font-weight="400">1024 token → 65,536 GS</text><text x="1058" y="330" font-size="19" fill="#18334c" font-weight="400">四元数归一、尺度为正</text><path d="M985,245 L1033,245" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><text x="708" y="386" font-size="21" fill="#17816c" font-weight="700">两张图 → 四张图：B 的行数翻倍；N_t 固定则 G 数量不变</text><rect x="28" y="448" width="1344" height="260" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="482" font-size="24" fill="#18334c" font-weight="700">02  可见性损失只管投影入框，不证明表面正确或无遮挡</text><rect x="85" y="526" width="200" height="125" fill="#fff" stroke="#89a6be" rx="4"/><text x="90" y="517" font-size="20" fill="#18334c" font-weight="400">相机 A</text><text x="95" y="679" font-size="18" fill="#586d80" font-weight="400">归一化画面 [-1, 1]²</text><circle cx="315" cy="576" r="7" fill="#c36b24"/><rect x="480" y="526" width="200" height="125" fill="#fff" stroke="#89a6be" rx="4"/><text x="485" y="517" font-size="20" fill="#18334c" font-weight="400">相机 B</text><text x="490" y="679" font-size="18" fill="#586d80" font-weight="400">归一化画面 [-1, 1]²</text><circle cx="650" cy="565" r="7" fill="#c36b24"/><path d="M308,576 L289,576" fill="none" stroke="#c36b24" stroke-width="3" marker-end="url(#c36b24)" /><text x="294" y="552" font-size="18" fill="#c36b24" font-weight="400">(1.3, 0.2)</text><text x="70" y="630" font-size="20" fill="#c36b24" font-weight="400">A 越界量 = 0.3</text><text x="481" y="630" font-size="20" fill="#17816c" font-weight="400">B 投影在框内 → 0</text><rect x="825" y="500" width="510" height="160" fill="#fff" stroke="#17816c" rx="16"/><text x="843" y="532" font-size="23" fill="#17816c" font-weight="700">对相机取 min，再对高斯求和</text><text x="843" y="565" font-size="19" fill="#18334c" font-weight="400">ℓ = ReLU(|ũ| − 1) + ReLU(|ṽ| − 1)</text><text x="843" y="594" font-size="19" fill="#18334c" font-weight="400">min(0.3, 0) = 0：一个画面接纳即可</text><text x="843" y="623" font-size="19" fill="#18334c" font-weight="400">输入图像监督还需把高斯放到合理表面</text><rect x="28" y="733" width="1344" height="245" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="767" font-size="24" fill="#18334c" font-weight="700">03  测试时只优化查询；动态分支有单向依赖</text><rect x="55" y="797" width="295" height="125" fill="#fff" stroke="#c36b24" rx="16"/><text x="73" y="829" font-size="23" fill="#c36b24" font-weight="700">token tuning：场景级</text><text x="73" y="862" font-size="19" fill="#18334c" font-weight="400">冻结编码器 / 解码器 / B</text><text x="73" y="891" font-size="19" fill="#18334c" font-weight="400">仅更新当前场景的 T</text><text x="73" y="920" font-size="19" fill="#18334c" font-weight="400">解码 → 渲染 → 输入图像误差</text><path d="M350 880 L390 880 L390 774 L220 774 L220 790" fill="none" stroke="#c36b24" stroke-width="3" marker-end="url(#c36b24)" /><text x="465" y="799" font-size="22" fill="#18334c" font-weight="700">动态 self-attention 的读取关系</text><text x="470" y="839" font-size="20" fill="#18334c" font-weight="400">Query</text><text x="670" y="839" font-size="20" fill="#18334c" font-weight="400">读静态 K/V</text><text x="880" y="839" font-size="20" fill="#18334c" font-weight="400">读动态 K/V</text><text x="475" y="879" font-size="20" fill="#18334c" font-weight="400">静态</text><text x="712" y="879" font-size="22" fill="#17816c" font-weight="700">允许</text><text x="927" y="879" font-size="22" fill="#c36b24" font-weight="700">禁止</text><text x="475" y="921" font-size="20" fill="#18334c" font-weight="400">动态</text><text x="712" y="921" font-size="22" fill="#17816c" font-weight="700">允许</text><text x="927" y="921" font-size="22" fill="#17816c" font-weight="700">允许</text><text x="1112" y="840" font-size="19" fill="#18334c" font-weight="400">只有动态 token</text><text x="1112" y="873" font-size="19" fill="#18334c" font-weight="400">加目标时间编码</text><text x="1112" y="913" font-size="19" fill="#18334c" font-weight="400">静态 token 不随</text><text x="1112" y="942" font-size="19" fill="#18334c" font-weight="400">目标时间改变</text><text x="36" y="1017" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1360" viewBox="0 0 1400 1360" role="img" aria-labelledby="title desc"><title id="title">A²GC ｜坐标打分、软分配与边缘校准怎么算</title><desc id="desc">原创中文详图：统一簇×patch轴；展示dustbin及有限校准后的真实行列和。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1360" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">A²GC ｜坐标打分、软分配与边缘校准怎么算</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">原创中文详图：统一簇×patch轴；展示dustbin及有限校准后的真实行列和。</text><rect x="28" y="115" width="1344" height="245" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  从patch到检索向量：不要将分配矩阵直接展平</text><rect x="52" y="179" width="385" height="165" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="211" font-size="23" fill="#2376c5" font-weight="700">224²图 → ViT-B/14</text><text x="70" y="244" font-size="19" fill="#18334c" font-weight="400">16×16=256个768维patch</text><text x="70" y="273" font-size="19" fill="#18334c" font-weight="400">全局token768 → 256维</text><text x="70" y="302" font-size="19" fill="#18334c" font-weight="400">局部内容投影与打分分支不同</text><text x="70" y="331" font-size="19" fill="#18334c" font-weight="400">最后4块微调，前面块冻结</text><path d="M437,255 L483,255" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="498" y="179" width="395" height="165" fill="#fff" stroke="#17816c" rx="16"/><text x="516" y="211" font-size="23" fill="#17816c" font-weight="700">64实簇 + 1 dustbin</text><text x="516" y="244" font-size="19" fill="#18334c" font-weight="400">矩阵统一：65行 × 256列</text><text x="516" y="273" font-size="19" fill="#18334c" font-weight="400">行是簇，列是patch</text><text x="516" y="302" font-size="19" fill="#18334c" font-weight="400">几何亲和加在内容亲和上</text><text x="516" y="331" font-size="19" fill="#18334c" font-weight="400">T=3轮并行行列归一化平均</text><path d="M893,255 L939,255" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="954" y="179" width="380" height="165" fill="#fff" stroke="#7750ad" rx="16"/><text x="972" y="211" font-size="23" fill="#7750ad" font-weight="700">权重 × 内容 → 求和</text><text x="972" y="244" font-size="19" fill="#18334c" font-weight="400">丢弃dustbin行的汇聚输出</text><text x="972" y="273" font-size="19" fill="#18334c" font-weight="400">64×128 + 256 = 8448维</text><text x="972" y="302" font-size="19" fill="#18334c" font-weight="400">128由默认维数反推</text><text x="972" y="331" font-size="19" fill="#18334c" font-weight="400">最终L2归一化，再FAISS检索</text><rect x="28" y="385" width="1344" height="380" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="419" font-size="24" fill="#18334c" font-weight="700">02  有dustbin的教学矩阵：仅1轮平均，非默认T=3实验</text><text x="55" y="451" font-size="22" fill="#18334c" font-weight="700">输入exp(M)=[[4,1],[1,2],[1,1]]；a=(.5,.5,1)，b=(1,1)，总质量同为2。</text><text x="65" y="498" font-size="24" fill="#2376c5" font-weight="700">先校准行</text><text x="205" y="529" font-size="18" fill="#586d80" font-weight="400">patch1</text><text x="335" y="529" font-size="18" fill="#586d80" font-weight="400">patch2</text><text x="475" y="529" font-size="18" fill="#586d80" font-weight="400">行和</text><text x="65" y="578" font-size="21" fill="#18334c" font-weight="400">簇1</text><rect x="185" y="545" width="120" height="47" fill="#edf6ff" stroke="#d9e3ec" rx="5"/><text x="197" y="576" font-size="21" fill="#18334c" font-weight="400">0.38279</text><rect x="315" y="545" width="120" height="47" fill="#edf6ff" stroke="#d9e3ec" rx="5"/><text x="327" y="576" font-size="21" fill="#18334c" font-weight="400">0.11721</text><text x="475" y="577" font-size="21" fill="#17816c" font-weight="400">0.50000</text><text x="65" y="634" font-size="21" fill="#18334c" font-weight="400">簇2</text><rect x="185" y="601" width="120" height="47" fill="#edf6ff" stroke="#d9e3ec" rx="5"/><text x="197" y="632" font-size="21" fill="#18334c" font-weight="400">0.14495</text><rect x="315" y="601" width="120" height="47" fill="#edf6ff" stroke="#d9e3ec" rx="5"/><text x="327" y="632" font-size="21" fill="#18334c" font-weight="400">0.35505</text><text x="475" y="633" font-size="21" fill="#17816c" font-weight="400">0.50000</text><text x="65" y="690" font-size="21" fill="#7750ad" font-weight="400">dustbin</text><rect x="185" y="657" width="120" height="47" fill="#f0ebfa" stroke="#d9e3ec" rx="5"/><text x="197" y="688" font-size="21" fill="#18334c" font-weight="400">0.44949</text><rect x="315" y="657" width="120" height="47" fill="#f0ebfa" stroke="#d9e3ec" rx="5"/><text x="327" y="688" font-size="21" fill="#18334c" font-weight="400">0.55051</text><text x="475" y="689" font-size="21" fill="#17816c" font-weight="400">1.00000</text><text x="185" y="744" font-size="21" fill="#c36b24" font-weight="400">列和：.97723，1.02277</text><text x="755" y="498" font-size="24" fill="#17816c" font-weight="700">再校准列</text><text x="895" y="529" font-size="18" fill="#586d80" font-weight="400">patch1</text><text x="1025" y="529" font-size="18" fill="#586d80" font-weight="400">patch2</text><text x="1165" y="529" font-size="18" fill="#586d80" font-weight="400">行和</text><text x="755" y="578" font-size="21" fill="#18334c" font-weight="400">簇1</text><rect x="875" y="545" width="120" height="47" fill="#edf6ff" stroke="#d9e3ec" rx="5"/><text x="887" y="576" font-size="21" fill="#18334c" font-weight="400">0.39171</text><rect x="1005" y="545" width="120" height="47" fill="#edf6ff" stroke="#d9e3ec" rx="5"/><text x="1017" y="576" font-size="21" fill="#18334c" font-weight="400">0.11460</text><text x="1165" y="577" font-size="21" fill="#c36b24" font-weight="400">0.50631</text><text x="755" y="634" font-size="21" fill="#18334c" font-weight="400">簇2</text><rect x="875" y="601" width="120" height="47" fill="#edf6ff" stroke="#d9e3ec" rx="5"/><text x="887" y="632" font-size="21" fill="#18334c" font-weight="400">0.14833</text><rect x="1005" y="601" width="120" height="47" fill="#edf6ff" stroke="#d9e3ec" rx="5"/><text x="1017" y="632" font-size="21" fill="#18334c" font-weight="400">0.34715</text><text x="1165" y="633" font-size="21" fill="#c36b24" font-weight="400">0.49547</text><text x="755" y="690" font-size="21" fill="#7750ad" font-weight="400">dustbin</text><rect x="875" y="657" width="120" height="47" fill="#f0ebfa" stroke="#d9e3ec" rx="5"/><text x="887" y="688" font-size="21" fill="#18334c" font-weight="400">0.45996</text><rect x="1005" y="657" width="120" height="47" fill="#f0ebfa" stroke="#d9e3ec" rx="5"/><text x="1017" y="688" font-size="21" fill="#18334c" font-weight="400">0.53826</text><text x="1165" y="689" font-size="21" fill="#c36b24" font-weight="400">0.99822</text><text x="875" y="744" font-size="21" fill="#17816c" font-weight="400">列和：1，1</text><path d="M625,608 L708,608" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="28" y="790" width="1344" height="245" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="824" font-size="24" fill="#18334c" font-weight="700">03  为什么同时两边缘未必精确：最后列缩放会再次改变行和</text><rect x="52" y="856" width="595" height="165" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="888" font-size="23" fill="#2376c5" font-weight="700">同一个旧Z，分别减行 / 列LSE</text><text x="70" y="921" font-size="19" fill="#18334c" font-weight="400">Z_new=(Z_row+Z_col)/2</text><text x="70" y="950" font-size="19" fill="#18334c" font-weight="400">普通域等于K_ji / √(r_j c_i)</text><text x="70" y="979" font-size="19" fill="#18334c" font-weight="400">是几何平均，不是普通域算术平均</text><text x="70" y="1008" font-size="19" fill="#18334c" font-weight="400">本阶段尚未按目标a/b校准</text><rect x="697" y="856" width="640" height="165" fill="#fff" stroke="#c36b24" rx="16"/><text x="715" y="888" font-size="23" fill="#c36b24" font-weight="700">行校准用Z；列校准必须用Z′</text><text x="715" y="921" font-size="19" fill="#18334c" font-weight="400">先加u，使每行和成为a_j</text><text x="715" y="950" font-size="19" fill="#18334c" font-weight="400">再加v，使每列和成为b_i</text><text x="715" y="979" font-size="19" fill="#18334c" font-weight="400">教学右表行和已偏离(.5,.5,1)</text><text x="715" y="1008" font-size="19" fill="#18334c" font-weight="400">不能凭检索提升宣称精确求解原OT</text><rect x="28" y="1060" width="1344" height="250" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="1094" font-size="24" fill="#18334c" font-weight="700">04  二维坐标偏好与训练边界：不等于三维几何约束</text><text x="55" y="1127" font-size="22" fill="#18334c" font-weight="700">16×16网格角点 → (−1,−1)/(1,1)；1×1卷积 → 16维位置嵌入。</text><text x="55" y="1175" font-size="21" fill="#17816c" font-weight="400">教学左右簇偏好(−1,0)/(1,0)：左角几何分差2，乘初始λ=.15后差.30。</text><text x="55" y="1223" font-size="22" fill="#7750ad" font-weight="400">地点正负对监督聚合；测试固定权重，每图重算分配，不重拟合城市聚类。</text><text x="55" y="1271" font-size="20" fill="#586d80" font-weight="400">依据式1–12、Fig.2、§3–4，PDF3–5；矩阵为原创教学例，未训练或建真实索引。</text><text x="36" y="1337" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>
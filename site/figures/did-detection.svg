<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">DID：残差再作差，不只是重建一次</title><desc id="desc">多一次重建与双分类器带来计算成本；噪声抵消依赖相关性假设。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#6e8a83"/></marker><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#dde6dd"/></pattern></defs><rect width="1200" height="660" rx="20" fill="#fafcf8"/><rect y="110" width="1200" height="490" fill="url(#dots)"/><g font-family="Inter,Segoe UI,Microsoft YaHei,sans-serif"><text x="40" y="38" fill="#688279" font-size="11" font-weight="650">PAPER ATLAS / METHOD EXPLAINED</text><text x="40" y="75" fill="#1f3d34" font-size="28" font-weight="650">DID：残差再作差，不只是重建一次</text><text x="40" y="103" fill="#71867e" font-size="13" font-weight="400">多一次重建与双分类器带来计算成本；噪声抵消依赖相关性假设。</text><rect x="40" y="155" width="190" height="120" rx="14" fill="#e7effb" stroke="#3b6fba" stroke-opacity=".25"/><text x="60" y="187" fill="#3b6fba" font-size="18" font-weight="650">原图 x</text><text x="60" y="216" fill="#253d3c" font-size="14" font-weight="400">待判断真实 / 生成</text><rect x="405" y="155" width="190" height="120" rx="14" fill="#f0eafa" stroke="#7753a8" stroke-opacity=".25"/><text x="425" y="187" fill="#7753a8" font-size="18" font-weight="650">重建 x′</text><text x="425" y="216" fill="#253d3c" font-size="14" font-weight="400">x′ = R(x)</text><rect x="810" y="155" width="230" height="120" rx="14" fill="#f0eafa" stroke="#7753a8" stroke-opacity=".25"/><text x="830" y="187" fill="#7753a8" font-size="18" font-weight="650">再次重建 x″</text><text x="830" y="216" fill="#253d3c" font-size="14" font-weight="400">x″ = R(x′)</text><path d="M230 215 L405 215" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><text x="322.5" y="206.0" fill="#627b73" font-size="11" font-weight="400">同一重建器 R</text><path d="M595 215 L810 215" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><text x="707.5" y="206.0" fill="#627b73" font-size="11" font-weight="400">再次调用 R</text><rect x="40" y="375" width="310" height="150" rx="14" fill="#e5f3ec" stroke="#237958" stroke-opacity=".25"/><text x="60" y="407" fill="#237958" font-size="18" font-weight="650">一阶残差 Δ</text><text x="60" y="436" fill="#253d3c" font-size="14" font-weight="400">|x − x′|</text><text x="60" y="461" fill="#253d3c" font-size="14" font-weight="400">保留基础重建信号</text><text x="60" y="486" fill="#253d3c" font-size="14" font-weight="400">ResNet50 分类器 A</text><rect x="465" y="375" width="360" height="150" rx="14" fill="#e5f3ec" stroke="#237958" stroke-opacity=".25"/><text x="485" y="407" fill="#237958" font-size="18" font-weight="650">二阶差 Δ²</text><text x="485" y="436" fill="#253d3c" font-size="14" font-weight="400">|x − x′| − |x′ − x″|</text><text x="485" y="461" fill="#253d3c" font-size="14" font-weight="400">尝试抵消相关重建扰动</text><text x="485" y="486" fill="#253d3c" font-size="14" font-weight="400">ResNet50 分类器 B</text><path d="M140 275 L140 375" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M925 275 L650 375" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="875" y="375" width="285" height="150" rx="14" fill="#fff1df" stroke="#aa6b29" stroke-opacity=".25"/><text x="895" y="407" fill="#aa6b29" font-size="18" font-weight="650">决策融合</text><text x="895" y="436" fill="#253d3c" font-size="14" font-weight="400">两支均判真实</text><text x="895" y="461" fill="#253d3c" font-size="14" font-weight="400">才输出真实</text><path d="M195 525 V545 H1080 V525" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M825 450 L875 450" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><text x="45" y="575" fill="#253d3c" font-size="16" font-weight="400">Δ² 是差值记号，不是平方；两个分类器需要真假标签训练。</text><path d="M40 606H1160" stroke="#dae5dc"/><text x="40" y="631" fill="#71867e" font-size="12" font-weight="400">依据原论文 Fig.2 / 式4 / §3.4 重绘；省略重建内部扩散步骤。</text><text x="1000" y="631" fill="#71867e" font-size="11" font-weight="400">原创概念重绘 · 非原图</text></g></svg>
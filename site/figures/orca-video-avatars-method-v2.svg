<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1290" viewBox="0 0 1400 1290" role="img" aria-labelledby="title desc"><title id="title">ORCA ｜先验证候选，再让世界状态向前一步</title><desc id="desc">原创中文教学图：将已接受轨迹、候选生成与失败诊断分开，避免计划替代事实。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1290" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">ORCA ｜先验证候选，再让世界状态向前一步</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">原创中文教学图：将已接受轨迹、候选生成与失败诊断分开，避免计划替代事实。</text><rect x="28" y="115" width="1344" height="245" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  已接受的状态是下一轮起点：目标、物体、清单与历史一起保留</text><rect x="52" y="179" width="380" height="165" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="211" font-size="23" fill="#2376c5" font-weight="700">Observe：更新证据</text><text x="70" y="244" font-size="19" fill="#18334c" font-weight="400">输入已接受片段的抽帧</text><text x="70" y="273" font-size="19" fill="#18334c" font-weight="400">场景对象 + 子目标清单 + 历史</text><text x="70" y="302" font-size="19" fill="#18334c" font-weight="400">教学：大盆有土，幼苗仍在小盆</text><text x="70" y="331" font-size="19" fill="#18334c" font-weight="400">belief为结构化记忆，非概率表</text><path d="M432,258 L484,258" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="494" y="179" width="395" height="165" fill="#fff" stroke="#7750ad" rx="16"/><text x="512" y="211" font-size="23" fill="#7750ad" font-weight="700">Think / System 2：双目标</text><text x="512" y="244" font-size="19" fill="#18334c" font-weight="400">g：把根团从小盆取出</text><text x="512" y="273" font-size="19" fill="#18334c" font-weight="400">预期：手托根团，根团已离盆</text><text x="512" y="302" font-size="19" fill="#18334c" font-weight="400">动作命令与预计状态分别输出</text><text x="512" y="331" font-size="19" fill="#18334c" font-weight="400">本轮目标依据最新进度选择</text><path d="M889,258 L941,258" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="951" y="179" width="385" height="165" fill="#fff" stroke="#17816c" rx="16"/><text x="969" y="211" font-size="23" fill="#17816c" font-weight="700">Act / System 1：提示落地</text><text x="969" y="244" font-size="19" fill="#18334c" font-weight="400">读当前图像、状态与双目标</text><text x="969" y="273" font-size="19" fill="#18334c" font-weight="400">补对象、手、位置、动作次序</text><text x="969" y="302" font-size="19" fill="#18334c" font-weight="400">输出面向I2V模型的详细caption</text><text x="969" y="331" font-size="19" fill="#18334c" font-weight="400">两System是同VLM的不同分工</text><rect x="28" y="385" width="1344" height="245" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="419" font-size="24" fill="#18334c" font-weight="700">02  候选区：每次生成都可能失败，不能直接改写已接受状态</text><rect x="52" y="451" width="585" height="165" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="483" font-size="23" fill="#2376c5" font-weight="700">生成候选视频 → 抽帧 → Reflect</text><text x="70" y="516" font-size="19" fill="#18334c" font-weight="400">G(原已接受观测, 当前caption)</text><text x="70" y="545" font-size="19" fill="#18334c" font-weight="400">比较：候选画面 / 子目标 / 预计结果</text><text x="70" y="574" font-size="19" fill="#18334c" font-weight="400">教学候选A：手动了，根团仍未离盆</text><text x="70" y="603" font-size="19" fill="#18334c" font-weight="400">核验可漏检、误拒绝；抽帧也可能漏掉异常</text><rect x="697" y="451" width="639" height="165" fill="#fff" stroke="#c36b24" rx="16"/><text x="715" y="483" font-size="23" fill="#c36b24" font-weight="700">拒绝分支：诊断可以使用，场景进展不提交</text><text x="715" y="516" font-size="19" fill="#18334c" font-weight="400">失败分析 → 修订caption → 从同一起点重新生成</text><text x="715" y="545" font-size="19" fill="#18334c" font-weight="400">不是接着失败候选的末帧继续下一子目标</text><text x="715" y="574" font-size="19" fill="#18334c" font-weight="400">预算耗尽：重规划，不自动宣称目标已完成</text><text x="715" y="603" font-size="19" fill="#18334c" font-weight="400">本轮尝试增加，最终视频段数暂不增加</text><rect x="28" y="655" width="1344" height="215" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="689" font-size="24" fill="#18334c" font-weight="700">03  接受分支：候选成为正式片段，下一轮才更新进度</text><text x="55" y="723" font-size="23" fill="#17816c" font-weight="700">教学候选B：根团确已离盆 → accept → 追加视频 → Observe确认 → 计划放入大盆。</text><text x="55" y="771" font-size="22" fill="#18334c" font-weight="400">视频制作能丢弃失败候选；不能据此认为现实机器人动作可以通过删视频撤销。</text><text x="55" y="819" font-size="21" fill="#c36b24" font-weight="400">原文算法最后一次重试可能未核验就退出；教学循环保证每个候选先检查，再决定退出。</text><rect x="28" y="895" width="1344" height="280" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="929" font-size="24" fill="#18334c" font-weight="700">04  预算与指标分开算：以下数字全是教学构造，不是ORCA实验</text><rect x="52" y="961" width="585" height="185" fill="#fff" stroke="#7750ad" rx="16"/><text x="70" y="993" font-size="23" fill="#7750ad" font-weight="700">生成调用 ≠ 最终视频长度</text><text x="70" y="1026" font-size="19" fill="#18334c" font-weight="400">4个子目标，每步最多2次额外重试</text><text x="70" y="1055" font-size="19" fill="#18334c" font-weight="400">无额外重规划时：至多4×3=12次生成</text><text x="70" y="1084" font-size="19" fill="#18334c" font-weight="400">独立成功率p=.5、最多3次：成功概率.875</text><text x="70" y="1113" font-size="19" fill="#18334c" font-weight="400">期望尝试1+.5+.25=1.75；真实尝试未必独立</text><rect x="697" y="961" width="639" height="185" fill="#fff" stroke="#2376c5" rx="16"/><text x="715" y="993" font-size="23" fill="#2376c5" font-weight="700">TSR ≠ 整任务成功率</text><text x="715" y="1026" font-size="19" fill="#18334c" font-weight="400">两个任务完成2/4和3/3</text><text x="715" y="1055" font-size="19" fill="#18334c" font-weight="400">逐任务比例均值：(1/2+1)/2=75%</text><text x="715" y="1084" font-size="19" fill="#18334c" font-weight="400">整任务全部完成：1/2=50%</text><text x="715" y="1113" font-size="19" fill="#18334c" font-weight="400">合并子目标：5/7≈71.4%，又是另一个指标</text><text x="55" y="1215" font-size="21" fill="#586d80" font-weight="400">依据Fig.2、式1–7、Algorithm 1，PDF3–6；未调用VLM、未生成视频、未复现实验。</text><text x="36" y="1267" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1240" viewBox="0 0 1400 1240" role="img" aria-labelledby="title desc"><title id="title">成员审计 ｜用输入几何检查统计判断，也保留证据边界</title><desc id="desc">依据原文 Definition 3–5、式7–11，PDF 4–7；分数与曲率例子为独立教学构造。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1240" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">成员审计 ｜用输入几何检查统计判断，也保留证据边界</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据原文 Definition 3–5、式7–11，PDF 4–7；分数与曲率例子为独立教学构造。</text><rect x="28" y="115" width="1344" height="220" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  真实训练历史不变；查询变化影响的是统计判断</text><rect x="52" y="179" width="380" height="130" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="211" font-size="23" fill="#2376c5" font-weight="700">真实标签 b</text><text x="70" y="244" font-size="19" fill="#18334c" font-weight="400">1：训练成员；0：非成员</text><text x="70" y="273" font-size="19" fill="#18334c" font-weight="400">修改输入不会追溯改写训练集</text><text x="70" y="302" font-size="19" fill="#18334c" font-weight="400">本次只做论文阅读与防御分析</text><path d="M432,245 L484,245" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="494" y="179" width="395" height="130" fill="#fff" stroke="#7750ad" rx="16"/><text x="512" y="211" font-size="23" fill="#7750ad" font-weight="700">模型查询与审计分数 S</text><text x="512" y="244" font-size="19" fill="#18334c" font-weight="400">真实类置信度高不等于成员</text><text x="512" y="273" font-size="19" fill="#18334c" font-weight="400">原始MIA：S &gt; τ 时判成员</text><text x="512" y="302" font-size="19" fill="#18334c" font-weight="400">负损失 / 比值 / 对数比不可随意互换</text><path d="M889,245 L941,245" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="951" y="179" width="385" height="130" fill="#fff" stroke="#17816c" rx="16"/><text x="969" y="211" font-size="23" fill="#17816c" font-weight="700">输入梯度 g = ‖∇_x ℓ‖</text><text x="969" y="244" font-size="19" fill="#18334c" font-weight="400">衡量局部损失敏感度</text><text x="969" y="273" font-size="19" fill="#18334c" font-weight="400">不是训练参数梯度 ∇_θ ℓ</text><text x="969" y="302" font-size="19" fill="#18334c" font-weight="400">低梯度也可能出现在真实成员</text><rect x="28" y="360" width="1344" height="220" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="394" font-size="24" fill="#18334c" font-weight="700">02  MFD与AR-MIA是两种流程，标签方向要各自说清</text><rect x="52" y="426" width="585" height="130" fill="#fff" stroke="#c36b24" rx="16"/><text x="70" y="458" font-size="23" fill="#c36b24" font-weight="700">MFD：先筛选，再检测伪造</text><text x="70" y="491" font-size="19" fill="#18334c" font-weight="400">原MIA判成员 → 在该子集检查 g 是否很小</text><text x="70" y="520" font-size="19" fill="#18334c" font-weight="400">式9的1更像伪造标记；Definition 4的1却是成员</text><text x="70" y="549" font-size="19" fill="#18334c" font-weight="400">需分开命名；条件集合AUC不是全流量效果</text><rect x="697" y="426" width="639" height="130" fill="#fff" stroke="#7750ad" rx="16"/><text x="715" y="458" font-size="23" fill="#7750ad" font-weight="700">AR-MIA：同时组合语义与几何</text><text x="715" y="491" font-size="19" fill="#18334c" font-weight="400">w = tanh(λg)，S_AR = wS，再用阈值判成员</text><text x="715" y="520" font-size="19" fill="#18334c" font-weight="400">原分数区分自然非成员；权重抑制低梯度查询</text><text x="715" y="549" font-size="19" fill="#18334c" font-weight="400">主方法需要白盒梯度，不是仅凭普通概率API</text><rect x="28" y="605" width="1344" height="260" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="639" font-size="24" fill="#18334c" font-weight="700">03  人为算例 λ=5：演示乘法，不是实验分布</text><text x="60" y="680" font-size="22" fill="#18334c" font-weight="700">假设查询</text><text x="440" y="680" font-size="22" fill="#18334c" font-weight="700">原分数 S</text><text x="665" y="680" font-size="22" fill="#18334c" font-weight="700">梯度 g</text><text x="875" y="680" font-size="22" fill="#18334c" font-weight="700">权重 w</text><text x="1100" y="680" font-size="22" fill="#18334c" font-weight="700">加权 S_AR</text><text x="60" y="733" font-size="22" fill="#2376c5" font-weight="700">真成员样式</text><text x="440" y="733" font-size="23" fill="#2376c5" font-weight="400">0.85</text><text x="665" y="733" font-size="23" fill="#2376c5" font-weight="400">0.30</text><text x="875" y="733" font-size="23" fill="#2376c5" font-weight="400">≈0.905</text><text x="1100" y="733" font-size="23" fill="#2376c5" font-weight="400">≈0.769</text><text x="60" y="788" font-size="22" fill="#c36b24" font-weight="700">高置信低梯度样式</text><text x="440" y="788" font-size="23" fill="#c36b24" font-weight="400">0.90</text><text x="665" y="788" font-size="23" fill="#c36b24" font-weight="400">0.01</text><text x="875" y="788" font-size="23" fill="#c36b24" font-weight="400">≈0.050</text><text x="1100" y="788" font-size="23" fill="#c36b24" font-weight="400">≈0.045</text><text x="60" y="843" font-size="22" fill="#17816c" font-weight="700">自然非成员样式</text><text x="440" y="843" font-size="23" fill="#17816c" font-weight="400">0.10</text><text x="665" y="843" font-size="23" fill="#17816c" font-weight="400">1.00</text><text x="875" y="843" font-size="23" fill="#17816c" font-weight="400">≈1.000</text><text x="1100" y="843" font-size="23" fill="#17816c" font-weight="400">≈0.100</text><rect x="28" y="890" width="1344" height="290" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="924" font-size="24" fill="#18334c" font-weight="700">04  局部曲率与分数坐标，决定能否泛化这个机制</text><text x="55" y="957" font-size="23" fill="#18334c" font-weight="700">v′ ≈ v − αH sign(v)：二阶近似本身，不保证所有方向的梯度范数严格下降。</text><text x="55" y="1003" font-size="21" fill="#c36b24" font-weight="400">一般光滑反例 ℓ(x)=−x²：x=1 → 1+α，损失下降但梯度范数增大；不是图像实验。</text><text x="55" y="1049" font-size="22" fill="#7750ad" font-weight="400">若 S 为负，乘小权重会使分数数值增大；先固定原统计量定义，再校准AR阈值。</text><text x="55" y="1095" font-size="22" fill="#586d80" font-weight="400">损失缩放、像素归一化都会改 g 的单位；λ与阈值不能在不同模型间盲搬。</text><text x="55" y="1141" font-size="21" fill="#586d80" font-weight="400">统计审计证据 ≠ 训练历史确定证明；未执行外部查询、模型训练或真实样本操纵。</text><text x="36" y="1217" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>
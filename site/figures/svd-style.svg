<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">SVD 风格个性化：换风格分量，借内容路径稳结构</title><desc id="desc">两个互补操作：PFB 改特征，SAC 改注意力；两者都发生在冻结模型推理。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#6e8a83"/></marker><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#dde6dd"/></pattern></defs><rect width="1200" height="660" rx="20" fill="#fafcf8"/><rect y="110" width="1200" height="490" fill="url(#dots)"/><g font-family="Inter,Segoe UI,Microsoft YaHei,sans-serif"><text x="40" y="38" fill="#688279" font-size="11" font-weight="650">PAPER ATLAS / METHOD EXPLAINED</text><text x="40" y="75" fill="#1f3d34" font-size="28" font-weight="650">SVD 风格个性化：换风格分量，借内容路径稳结构</text><text x="40" y="103" fill="#71867e" font-size="13" font-weight="400">两个互补操作：PFB 改特征，SAC 改注意力；两者都发生在冻结模型推理。</text><rect x="40" y="150" width="270" height="150" rx="14" fill="#f0eafa" stroke="#7753a8" stroke-opacity=".25"/><text x="60" y="182" fill="#7753a8" font-size="18" font-weight="650">参考图 → 图像编码器</text><text x="60" y="211" fill="#253d3c" font-size="14" font-weight="400">取得第三尺度 Fsty</text><text x="60" y="236" fill="#253d3c" font-size="14" font-weight="400">SVD 谱指数加权 Φ(F)</text><text x="60" y="261" fill="#253d3c" font-size="14" font-weight="400">不是只留下第一奇异值</text><rect x="410" y="150" width="330" height="150" rx="14" fill="#f0eafa" stroke="#7753a8" stroke-opacity=".25"/><text x="430" y="182" fill="#7753a8" font-size="18" font-weight="650">PFB：第三尺度混合</text><text x="430" y="211" fill="#253d3c" font-size="14" font-weight="400">Fgen ← Φ(Fsty)</text><text x="430" y="236" fill="#253d3c" font-size="14" font-weight="400">         + Fgen − Φ(Fgen)</text><text x="430" y="261" fill="#253d3c" font-size="14" font-weight="400">替换主分量，保留其余残差</text><path d="M310 225 L410 225" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="40" y="420" width="270" height="140" rx="14" fill="#e7effb" stroke="#3b6fba" stroke-opacity=".25"/><text x="60" y="452" fill="#3b6fba" font-size="18" font-weight="650">内容路径：同一文本</text><text x="60" y="481" fill="#253d3c" font-size="14" font-weight="400">冻结 Infinity2B</text><text x="60" y="506" fill="#253d3c" font-size="14" font-weight="400">不注入参考风格</text><text x="60" y="531" fill="#253d3c" font-size="14" font-weight="400">提供每尺度 Qcon / Kcon</text><rect x="410" y="420" width="330" height="140" rx="14" fill="#e5f3ec" stroke="#237958" stroke-opacity=".25"/><text x="430" y="452" fill="#237958" font-size="18" font-weight="650">SAC：尺度 3 → 12</text><text x="430" y="481" fill="#253d3c" font-size="14" font-weight="400">Qgen ← Qcon；Kgen ← Kcon</text><text x="430" y="506" fill="#253d3c" font-size="14" font-weight="400">生成路径仍保留自己的 V</text><text x="430" y="531" fill="#253d3c" font-size="14" font-weight="400">约束注意力空间关系</text><path d="M310 490 L410 490" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M575 300 L575 420" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="850" y="270" width="305" height="160" rx="14" fill="#fff1df" stroke="#aa6b29" stroke-opacity=".25"/><text x="870" y="302" fill="#aa6b29" font-size="18" font-weight="650">生成路径 → 解码输出</text><text x="870" y="331" fill="#253d3c" font-size="14" font-weight="400">文本保真与风格保真折中</text><text x="870" y="356" fill="#253d3c" font-size="14" font-weight="400">不逐风格训练，但要双流推理</text><text x="870" y="381" fill="#253d3c" font-size="14" font-weight="400">速度需区分微调摊销成本</text><path d="M740 490 L850 385" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M40 606H1160" stroke="#dae5dc"/><text x="40" y="631" fill="#71867e" font-size="12" font-weight="400">依据原论文 Fig.4 / 式5–7 重绘；省略逐尺度残差累积，hook 索引需实现核验。</text><text x="1000" y="631" fill="#71867e" font-size="11" font-weight="400">原创概念重绘 · 非原图</text></g></svg>
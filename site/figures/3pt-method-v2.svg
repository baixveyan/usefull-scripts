<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1250" viewBox="0 0 1400 1250" role="img" aria-labelledby="title desc"><title id="title">3PT ｜CAD条件检测如何走到多视图几何精修</title><desc id="desc">原创中文详图：模板、姿态候选、真实像素和CAD三维点是不同对象。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1250" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">3PT ｜CAD条件检测如何走到多视图几何精修</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">原创中文详图：模板、姿态候选、真实像素和CAD三维点是不同对象。</text><rect x="28" y="115" width="1344" height="245" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  CAD编码两种用途：先验条件不等于姿态候选</text><rect x="52" y="179" width="385" height="165" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="211" font-size="23" fill="#2376c5" font-weight="700">12个固定视角：Prior</text><text x="70" y="244" font-size="19" fill="#18334c" font-weight="400">渲染 → 编码 / 池化 / 拼接</text><text x="70" y="273" font-size="19" fill="#18334c" font-weight="400">与真实图像token早融合</text><text x="70" y="302" font-size="19" fill="#18334c" font-weight="400">按目标CAD生成物体相关假设</text><text x="70" y="331" font-size="19" fill="#18334c" font-weight="400">每个CAD分别前向再NMS</text><rect x="495" y="179" width="395" height="165" fill="#fff" stroke="#7750ad" rx="16"/><text x="513" y="211" font-size="23" fill="#7750ad" font-weight="700">5140个旋转：Templates</text><text x="513" y="244" font-size="19" fill="#18334c" font-weight="400">缓存5140×D模板特征</text><text x="513" y="273" font-size="19" fill="#18334c" font-weight="400">Q×D假设乘模板转置</text><text x="513" y="302" font-size="19" fill="#18334c" font-weight="400">得到Q×5140朝向相似度</text><text x="513" y="331" font-size="19" fill="#18334c" font-weight="400">保留多个模式，不只取一个角度</text><rect x="947" y="179" width="390" height="165" fill="#fff" stroke="#17816c" rx="16"/><text x="965" y="211" font-size="23" fill="#17816c" font-weight="700">框与朝向 → 实例候选</text><text x="965" y="244" font-size="19" fill="#18334c" font-weight="400">单视图：尺寸比粗估深度</text><text x="965" y="273" font-size="19" fill="#18334c" font-weight="400">多视图：至少3视图射线匹配</text><text x="965" y="302" font-size="19" fill="#18334c" font-weight="400">每视图Top500旋转进行KDE</text><text x="965" y="331" font-size="19" fill="#18334c" font-weight="400">在同一坐标系融合SO(3)旋转</text><rect x="28" y="385" width="1344" height="275" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="419" font-size="24" fill="#18334c" font-weight="700">02  一轮精修：渲染点有已知CAD坐标，实图无需测量深度</text><rect x="52" y="450" width="385" height="165" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="482" font-size="23" fill="#2376c5" font-weight="700">当前姿态 → 多视图渲染</text><text x="70" y="515" font-size="19" fill="#18334c" font-weight="400">真实crop和渲染共用编码器</text><text x="70" y="544" font-size="19" fill="#18334c" font-weight="400">真实Q读取渲染K/V</text><text x="70" y="573" font-size="19" fill="#18334c" font-weight="400">DPT输出描述子及分割</text><text x="70" y="602" font-size="19" fill="#18334c" font-weight="400">register token预测候选分数</text><path d="M437,530 L483,530" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="498" y="450" width="395" height="165" fill="#fff" stroke="#c36b24" rx="16"/><text x="516" y="482" font-size="23" fill="#c36b24" font-weight="700">边缘互最近邻</text><text x="516" y="515" font-size="19" fill="#18334c" font-weight="400">渲染边缘a → 最相似真实像素b</text><text x="516" y="544" font-size="19" fill="#18334c" font-weight="400">b反查必须回到a才保留</text><text x="516" y="573" font-size="19" fill="#18334c" font-weight="400">a提供CAD三维点X</text><text x="516" y="602" font-size="19" fill="#18334c" font-weight="400">b提供真实二维观测u</text><path d="M893,530 L939,530" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="954" y="450" width="380" height="165" fill="#fff" stroke="#17816c" rx="16"/><text x="972" y="482" font-size="23" fill="#17816c" font-weight="700">多视图PnP → 新姿态</text><text x="972" y="515" font-size="19" fill="#18334c" font-weight="400">投影X与观测u之间残差最小</text><text x="972" y="544" font-size="19" fill="#18334c" font-weight="400">更新R,t，不更新网络权重</text><text x="972" y="573" font-size="19" fill="#18334c" font-weight="400">重新渲染、重新匹配</text><text x="972" y="602" font-size="19" fill="#18334c" font-weight="400">按分数删底部50%候选</text><text x="60" y="640" font-size="22" fill="#7750ad" font-weight="400">教学K=8：8→4→2→1；通常3轮，但不据此猜所有配置都用8个候选。</text><rect x="28" y="685" width="1344" height="270" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="719" font-size="24" fill="#18334c" font-weight="700">03  坐标与初始化：先统一单位，再计算投影</text><rect x="52" y="750" width="595" height="185" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="782" font-size="23" fill="#2376c5" font-weight="700">单图教学：z≈fD/d</text><text x="70" y="815" font-size="19" fill="#18334c" font-weight="400">f=1000像素，D=.1米，d=100像素</text><text x="70" y="844" font-size="19" fill="#18334c" font-weight="400">得到z≈1米；x=(u−cx)z/fx</text><text x="70" y="873" font-size="19" fill="#18334c" font-weight="400">只作初始化：遮挡与旋转会改变框尺寸</text><text x="70" y="902" font-size="19" fill="#18334c" font-weight="400">CAD毫米和相机米不能直接组合</text><text x="70" y="931" font-size="19" fill="#18334c" font-weight="400">裁剪缩放需同步调整内参或坐标</text><rect x="697" y="750" width="637" height="185" fill="#fff" stroke="#c36b24" rx="16"/><text x="715" y="782" font-size="23" fill="#c36b24" font-weight="700">多视图：同一CAD点必须投到同一坐标约定</text><text x="715" y="815" font-size="19" fill="#18334c" font-weight="400">X → 物体姿态R,t → 参考坐标</text><text x="715" y="844" font-size="19" fill="#18334c" font-weight="400">参考坐标 → 相机v外参 → 透视投影</text><text x="715" y="873" font-size="19" fill="#18334c" font-weight="400">各相机像素残差联合约束同一姿态</text><text x="715" y="902" font-size="19" fill="#18334c" font-weight="400">179°与−179°只差2°，不能平均成0°</text><text x="715" y="931" font-size="19" fill="#18334c" font-weight="400">互近邻仍可能错配；对称性不自动消失</text><rect x="28" y="980" width="1344" height="225" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="1014" font-size="24" fill="#18334c" font-weight="700">04  训练与成本：匹配概率、候选排序、分割分别监督</text><text x="55" y="1047" font-size="22" fill="#18334c" font-weight="700">训练真姿态给对应像素：−log p_GT；推理边缘匹配范围与训练Seg[Z]不同。</text><text x="55" y="1095" font-size="21" fill="#7750ad" font-weight="400">5个扰动姿态经一步精修后学习排序；分割用BCE，最终置信不是检测分数的别名。</text><text x="55" y="1143" font-size="22" fill="#2376c5" font-weight="400">首轮工作随实例M × 候选K × 视图V增加；缓存模板不消除精修渲染成本。</text><text x="55" y="1185" font-size="20" fill="#586d80" font-weight="400">依据Fig.5、§3.1–3.3、式1，PDF4–6；未执行机器人操作或复现实验。</text><text x="36" y="1227" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>
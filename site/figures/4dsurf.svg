<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">4DSurf：让“怎么动”和“表面怎么变”互相校验</title><desc id="desc">重叠分段缓解大形变；连续性来自约束和初始化传递，不是对任意形变的保证。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#6e8a83"/></marker><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#dde6dd"/></pattern></defs><rect width="1200" height="660" rx="20" fill="#fafcf8"/><rect y="110" width="1200" height="490" fill="url(#dots)"/><g font-family="Inter,Segoe UI,Microsoft YaHei,sans-serif"><text x="40" y="38" fill="#688279" font-size="11" font-weight="650">PAPER ATLAS / METHOD EXPLAINED</text><text x="40" y="75" fill="#1f3d34" font-size="28" font-weight="650">4DSurf：让“怎么动”和“表面怎么变”互相校验</text><text x="40" y="103" fill="#71867e" font-size="13" font-weight="400">重叠分段缓解大形变；连续性来自约束和初始化传递，不是对任意形变的保证。</text><rect x="40" y="150" width="235" height="145" rx="14" fill="#e7effb" stroke="#3b6fba" stroke-opacity=".25"/><text x="60" y="182" fill="#3b6fba" font-size="18" font-weight="650">分段规范高斯</text><text x="60" y="211" fill="#253d3c" font-size="14" font-weight="400">多视角 RGB + 前景 mask</text><text x="60" y="236" fill="#253d3c" font-size="14" font-weight="400">2D 高斯 / canonical shape</text><rect x="355" y="135" width="325" height="145" rx="14" fill="#f0eafa" stroke="#7753a8" stroke-opacity=".25"/><text x="375" y="167" fill="#7753a8" font-size="18" font-weight="650">运动侧：速度场 GVF</text><text x="375" y="196" fill="#253d3c" font-size="14" font-weight="400">预测线速度 v / 角速度 ω</text><text x="375" y="221" fill="#253d3c" font-size="14" font-weight="400">由局部刚性运动推导 SDF flow</text><text x="375" y="246" fill="#253d3c" font-size="14" font-weight="400">f = −(ω × Rx + v) · n</text><rect x="355" y="340" width="325" height="145" rx="14" fill="#e5f3ec" stroke="#237958" stroke-opacity=".25"/><text x="375" y="372" fill="#237958" font-size="18" font-weight="650">几何侧：渲染深度</text><text x="375" y="401" fill="#253d3c" font-size="14" font-weight="400">深度图作为伪表面</text><text x="375" y="426" fill="#253d3c" font-size="14" font-weight="400">估计 signed-distance 随时间变化</text><text x="375" y="451" fill="#253d3c" font-size="14" font-weight="400">f̃ = ∂(D − d) / ∂t</text><rect x="820" y="235" width="330" height="145" rx="14" fill="#fcebea" stroke="#b45853" stroke-opacity=".25"/><text x="840" y="267" fill="#b45853" font-size="18" font-weight="650">表面演化一致性</text><text x="840" y="296" fill="#253d3c" font-size="14" font-weight="400">Lflow = Σ |f − f̃|</text><text x="840" y="321" fill="#253d3c" font-size="14" font-weight="400">加颜色 / 法向 / 深度 / mask 损失</text><text x="840" y="346" fill="#253d3c" font-size="14" font-weight="400">约束表面变化与运动一致</text><path d="M275 205 L355 205" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M275 255 L355 410" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M680 205 L820 280" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M680 410 L820 335" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><text x="45" y="550" fill="#253d3c" font-size="13" font-weight="400">段 1</text><text x="385" y="550" fill="#253d3c" font-size="13" font-weight="400">共享虚拟时间 → 初始化下一段</text><text x="925" y="550" fill="#253d3c" font-size="13" font-weight="400">段 2；可用 LoRA 调运动场</text><path d="M100 560H340 M700 560H900" stroke="#6e8a83" stroke-width="3"/><path d="M40 606H1160" stroke="#dae5dc"/><text x="40" y="631" fill="#71867e" font-size="12" font-weight="400">依据原论文 Fig.2 / §4.1–4.3 重绘；深度仅近似 SDF，LoRA 只压缩运动场增量。</text><text x="1000" y="631" fill="#71867e" font-size="11" font-weight="400">原创概念重绘 · 非原图</text></g></svg>
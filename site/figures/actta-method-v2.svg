4 293.50,396.56 295.75,396.27 298.00,395.99 300.25,395.72 302.50,395.45 304.75,395.18 307.00,394.92 309.25,394.67 311.50,394.42 313.75,394.17 316.00,393.94 318.25,393.70 320.50,393.47 322.75,393.25 325.00,393.04 327.25,392.83 329.50,392.62 331.75,392.42 334.00,392.23 336.25,392.04 338.50,391.86 340.75,391.69 343.00,391.52 345.25,391.36 347.50,391.20 349.75,391.05 352.00,390.91 354.25,390.77 356.50,390.64 358.75,390.52 361.00,390.40 363.25,390.29 365.50,390.19 367.75,390.09 370.00,390.00 372.25,388.17 374.50,386.34 376.75,384.52 379.00,382.70 381.25,380.89 383.50,379.09 385.75,377.30 388.00,375.51 390.25,373.73 392.50,371.95 394.75,370.18 397.00,368.42 399.25,366.66 401.50,364.91 403.75,363.17 406.00,361.43 408.25,359.70 410.50,357.97 412.75,356.25 415.00,354.54 417.25,352.83 419.50,351.12 421.75,349.43 424.00,347.74 426.25,346.05 428.50,344.37 430.75,342.69 433.00,341.02 435.25,339.36 437.50,337.70 439.75,336.04 442.00,334.39 444.25,332.75 446.50,331.11 448.75,329.47 451.00,327.84 453.25,326.21 455.50,324.59 457.75,322.97 460.00,321.35 462.25,319.74 464.50,318.13 466.75,316.53 469.00,314.93 471.25,313.33 473.50,311.74 475.75,310.15 478.00,308.57 480.25,306.98 482.50,305.40 484.75,303.83 487.00,302.25 489.25,300.68 491.50,299.11 493.75,297.55 496.00,295.98 498.25,294.42 500.50,292.86 502.75,291.31 505.00,289.75 507.25,288.20 509.50,286.65 511.75,285.10 514.00,283.56 516.25,282.01 518.50,280.47 520.75,278.93 523.00,277.39 525.25,275.85 527.50,274.31 529.75,272.77 532.00,271.24 534.25,269.70 536.50,268.17 538.75,266.64 541.00,265.11 543.25,263.58 545.50,262.05 547.75,260.52 550.00,258.99" fill="none" stroke="#c36b24" stroke-width="3"/><text x="650" y="195" font-size="23" fill="#18334c" font-weight="700">β=1，c=.5，λ_neg=.2，λ_pos=−.1</text><text x="650" y="245" font-size="22" fill="#18334c" font-weight="400">u=x−c；s=σ(βu)；a=.2(1−s)−.1s</text><text x="650" y="295" font-size="21" fill="#c36b24" font-weight="400">x=−.5 → g≈−.1193；x=1.5 → g≈.9807</text><text x="650" y="345" font-size="22" fill="#2376c5" font-weight="400">原函数 + 输入相关线性残差，不只是平移。</text><text x="650" y="395" font-size="21" fill="#586d80" font-weight="400">图为公式计算，不是作者训练出的参数。</text><rect x="28" y="490" width="1344" height="240" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="524" font-size="24" fill="#18334c" font-weight="700">02  完整导数：a(u)不能直接当作g的斜率</text><text x="55" y="558" font-size="26" fill="#2376c5" font-weight="700">g′(x)=φ′(u)+a(u)+uβ(λ_pos−λ_neg)s(1−s)</text><text x="55" y="607" font-size="22" fill="#c36b24" font-weight="400">教学u=1：a≈−.0193，但完整导数≈.9217；正侧还有基础ReLU斜率1。</text><text x="55" y="655" font-size="22" fill="#7750ad" font-weight="400">参数梯度：∂g/∂λ_pos=us；∂g/∂λ_neg=u(1−s)；∂g/∂c=−g′。</text><text x="55" y="700" font-size="21" fill="#586d80" font-weight="400">ReLU在u=0不可经典求导；实现使用框架次梯度，不能说所有位置都光滑。</text><rect x="28" y="755" width="1344" height="200" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="789" font-size="24" fill="#18334c" font-weight="700">03  零初始化：输入梯度与参数梯度分开</text><text x="55" y="823" font-size="23" fill="#18334c" font-weight="700">c=λ_pos=λ_neg=0 → g=原激活；对ReLU负输入x=−1，g′=0。</text><text x="55" y="872" font-size="22" fill="#17816c" font-weight="400">但β=1时两个λ参数梯度约−.269、−.731；有上游梯度时仍可能更新。</text><text x="55" y="920" font-size="21" fill="#c36b24" font-weight="400">不能说“初始化时所有负侧输入梯度立即非零”；也不能保证适应后始终单调。</text><rect x="28" y="980" width="1344" height="225" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="1014" font-size="24" fill="#18334c" font-weight="700">04  测试更新与代价</text><text x="55" y="1047" font-size="21" fill="#18334c" font-weight="700">无标签batch → 概率 / 原TTA损失 → 反传到允许参数 → 更新 → 按协议预测与重置。</text><text x="55" y="1095" font-size="21" fill="#7750ad" font-weight="400">CNN常只适应激活；ViT还更新LN仿射。BN仿射冻结不自动说明统计冻结。</text><text x="55" y="1143" font-size="22" fill="#c36b24" font-weight="400">少量新增参数仍有反传开销；低熵可以自信地错，需同时比较冻结源模型。</text><text x="55" y="1185" font-size="20" fill="#586d80" font-weight="400">依据式1、§3.2–4.5，PDF3–5；导数为阅读推导，未运行TTA实验。</text><text x="36" y="1227" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>
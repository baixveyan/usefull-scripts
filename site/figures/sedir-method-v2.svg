<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1250" viewBox="0 0 1400 1250" role="img" aria-labelledby="title desc"><title id="title">SeDiR ｜先分清类别，再用几何条件重建局部特征</title><desc id="desc">原创中文详图：多尺度共享中心、监督对比归约与异常评分尺度分别解释。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1250" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">SeDiR ｜先分清类别，再用几何条件重建局部特征</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">原创中文详图：多尺度共享中心、监督对比归约与异常评分尺度分别解释。</text><rect x="28" y="115" width="1344" height="245" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  共享FPS中心：改变邻域大小，不改变中心对应关系</text><rect x="52" y="179" width="385" height="165" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="211" font-size="23" fill="#2376c5" font-weight="700">N×3点云 → g个中心</text><text x="70" y="244" font-size="19" fill="#18334c" font-weight="400">每中心k/2、k、2k近邻</text><text x="70" y="273" font-size="19" fill="#18334c" font-weight="400">三套局部编码均为g×d</text><text x="70" y="302" font-size="19" fill="#18334c" font-weight="400">教学g=4,k=8：邻域4/8/16点</text><text x="70" y="331" font-size="19" fill="#18334c" font-weight="400">编码结果都为4×d</text><path d="M437,255 L483,255" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="498" y="179" width="395" height="165" fill="#fff" stroke="#17816c" rx="16"/><text x="516" y="211" font-size="23" fill="#17816c" font-weight="700">共享Transformer + 基准ACT</text><text x="516" y="244" font-size="19" fill="#18334c" font-weight="400">基准(g+1)×d；另两尺度g×d</text><text x="516" y="273" font-size="19" fill="#18334c" font-weight="400">跨尺度按同一中心对齐</text><text x="516" y="302" font-size="19" fill="#18334c" font-weight="400">三尺度GAP + ACT → 4d</text><text x="516" y="331" font-size="19" fill="#18334c" font-weight="400">分类头与投影头用途不同</text><path d="M893,255 L939,255" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="954" y="179" width="380" height="165" fill="#fff" stroke="#7750ad" rx="16"/><text x="972" y="211" font-size="23" fill="#7750ad" font-weight="700">投影、归一化 → z</text><text x="972" y="244" font-size="19" fill="#18334c" font-weight="400">两层MLP / LayerNorm / GeLU</text><text x="972" y="273" font-size="19" fill="#18334c" font-weight="400">缓存64个(z,类别)</text><text x="972" y="302" font-size="19" fill="#18334c" font-weight="400">同类为正，异类为负</text><text x="972" y="331" font-size="19" fill="#18334c" font-weight="400">只用正常样本仍需类别标签</text><rect x="28" y="385" width="1344" height="245" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="419" font-size="24" fill="#18334c" font-weight="700">02  损失归约：正样本逐个取log，不能先把概率加起来</text><rect x="52" y="451" width="595" height="165" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="483" font-size="23" fill="#2376c5" font-weight="700">教学：两个正样本相似度1，一个负样本0</text><text x="70" y="516" font-size="19" fill="#18334c" font-weight="400">τ=1，每个正样本概率e/(2e+1)≈.422</text><text x="70" y="545" font-size="19" fill="#18334c" font-weight="400">两个−log取平均≈.862</text><text x="70" y="574" font-size="19" fill="#18334c" font-weight="400">先合并正概率再−log≈.169：不同目标</text><text x="70" y="603" font-size="19" fill="#18334c" font-weight="400">空正集、自匹配和缓存detach需核对</text><rect x="697" y="451" width="640" height="165" fill="#fff" stroke="#c36b24" rx="16"/><text x="715" y="483" font-size="23" fill="#c36b24" font-weight="700">跨尺度与重建不要混为一谈</text><text x="715" y="516" font-size="19" fill="#18334c" font-weight="400">L_cos除以g，未再除以两种尺度关系</text><text x="715" y="545" font-size="19" fill="#18334c" font-weight="400">重建条件是带波浪F；目标是不带波浪F</text><text x="715" y="574" font-size="19" fill="#18334c" font-weight="400">L_rec按中心平均，特征维内部平方求和</text><text x="715" y="603" font-size="19" fill="#18334c" font-weight="400">推理用L2距离，不是训练平方距离</text><rect x="28" y="655" width="1344" height="245" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="689" font-size="24" fill="#18334c" font-weight="700">03  几何偏置先加logits，再softmax</text><rect x="52" y="721" width="595" height="165" fill="#fff" stroke="#17816c" rx="16"/><text x="70" y="753" font-size="23" fill="#17816c" font-weight="700">语义项 + β B_geo → 权重</text><text x="70" y="786" font-size="19" fill="#18334c" font-weight="400">教学语义logits=(0,0)</text><text x="70" y="815" font-size="19" fill="#18334c" font-weight="400">偏置=(0,ln3)，β=1</text><text x="70" y="844" font-size="19" fill="#18334c" font-weight="400">权重从(.5,.5)变成(.25,.75)</text><text x="70" y="873" font-size="19" fill="#18334c" font-weight="400">不是输出后乘二值mask</text><rect x="697" y="721" width="640" height="165" fill="#fff" stroke="#7750ad" rx="16"/><text x="715" y="753" font-size="23" fill="#7750ad" font-weight="700">形状必须闭合</text><text x="715" y="786" font-size="19" fill="#18334c" font-weight="400">Q:nq×dh，K:g×dh → logits:nq×g</text><text x="715" y="815" font-size="19" fill="#18334c" font-weight="400">B_geo须与该矩阵兼容</text><text x="715" y="844" font-size="19" fill="#18334c" font-weight="400">若nq=1，输出一行，不会自动变成g行</text><text x="715" y="873" font-size="19" fill="#18334c" font-weight="400">Fig.4两路/残差展开需实现核验</text><rect x="28" y="925" width="1344" height="280" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="959" font-size="24" fill="#18334c" font-weight="700">04  评分顺序：单实例归一化 → 一维滤波 → 最大值</text><text x="55" y="992" font-size="23" fill="#18334c" font-weight="700">教学A=(1,2,3)，B=(10,20,30)：各自min–max后都为(0,.5,1)。</text><text x="55" y="1040" font-size="22" fill="#c36b24" font-weight="400">滤波前最大值都为1；绝对误差尺度消失，滤波后依赖局部形状和边界规则。</text><text x="55" y="1088" font-size="22" fill="#7750ad" font-weight="400">误差全相同时分母为0；FPS序列相邻不一定空间相邻，点插值也需明确。</text><text x="55" y="1136" font-size="22" fill="#2376c5" font-weight="400">正常样本可重建，不证明异常必然不可重建；AUROC也不是固定阈值准确率。</text><text x="55" y="1180" font-size="20" fill="#586d80" font-weight="400">依据式1–13、Fig.4，PDF4–5；教学算例非实验数据，未运行检测器。</text><text x="36" y="1227" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>
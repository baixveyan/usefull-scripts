<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1240" viewBox="0 0 1400 1240" role="img" aria-labelledby="title desc"><title id="title">Ga4DPF ｜局部升维与全局旋转参考怎样配合</title><desc id="desc">依据原文 Fig.2、式6–20、§4，PDF 3–6；固定点、四元数与损失分支为独立核查。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1240" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">Ga4DPF ｜局部升维与全局旋转参考怎样配合</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据原文 Fig.2、式6–20、§4，PDF 3–6；固定点、四元数与损失分支为独立核查。</text><rect x="28" y="115" width="1344" height="250" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  局部特征：先等变，再用距离与夹角提取不变量</text><rect x="52" y="179" width="380" height="165" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="211" font-size="23" fill="#2376c5" font-weight="700">3D点 + 局部参考轴</text><text x="70" y="244" font-size="19" fill="#18334c" font-weight="400">法向与邻域重心方向构LRF</text><text x="70" y="273" font-size="19" fill="#18334c" font-weight="400">共线 / 零重心偏移会退化</text><text x="70" y="302" font-size="19" fill="#18334c" font-weight="400">法向方向和归一化需固定</text><text x="70" y="331" font-size="19" fill="#18334c" font-weight="400">坐标输入 ≠ 不需要方向构造</text><path d="M432,258 L484,258" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="494" y="179" width="395" height="165" fill="#fff" stroke="#7750ad" rx="16"/><text x="512" y="211" font-size="23" fill="#7750ad" font-weight="700">5D嵌入 → 4个滤波响应</text><text x="512" y="244" font-size="19" fill="#18334c" font-weight="400">共享球面滤波器 B(S)：4×5</text><text x="512" y="273" font-size="19" fill="#18334c" font-weight="400">ST(Rp) = V_R ST(p)</text><text x="512" y="302" font-size="19" fill="#18334c" font-weight="400">V_R作用在4D，不是原3×3旋转</text><text x="512" y="331" font-size="19" fill="#18334c" font-weight="400">四维是特征，不是动态时间</text><path d="M889,258 L941,258" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="951" y="179" width="385" height="165" fill="#fff" stroke="#17816c" rx="16"/><text x="969" y="211" font-size="23" fill="#17816c" font-weight="700">每点对4DPPF：4个标量</text><text x="969" y="244" font-size="19" fill="#18334c" font-weight="400">点对距离 + 三个夹角余弦</text><text x="969" y="273" font-size="19" fill="#18334c" font-weight="400">共同正交变换保持距离 / 内积</text><text x="969" y="302" font-size="19" fill="#18334c" font-weight="400">零向量的角度需数值处理</text><text x="969" y="331" font-size="19" fill="#18334c" font-weight="400">后续还要聚合邻域与多层特征</text><rect x="28" y="390" width="1344" height="250" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="424" font-size="24" fill="#18334c" font-weight="700">02  全局锚点：代表旋转怎样生成，怎样接到局部点对</text><rect x="52" y="456" width="380" height="165" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="488" font-size="23" fill="#2376c5" font-weight="700">Bingham分布定义在 S³</text><text x="70" y="521" font-size="19" fill="#18334c" font-weight="400">q 与 −q 是同一个3D旋转</text><text x="70" y="550" font-size="19" fill="#18334c" font-weight="400">二次型密度天然反极对称</text><text x="70" y="579" font-size="19" fill="#18334c" font-weight="400">学习正交轴 V 与集中度 Λ</text><text x="70" y="608" font-size="19" fill="#18334c" font-weight="400">默认采样 N_s=10</text><path d="M432,535 L484,535" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="494" y="456" width="395" height="165" fill="#fff" stroke="#7750ad" rx="16"/><text x="512" y="488" font-size="23" fill="#7750ad" font-weight="700">外积和的主特征向量</text><text x="512" y="521" font-size="19" fill="#18334c" font-weight="400">A = Σ_i q_i q_iᵀ → 主方向 q_g</text><text x="512" y="550" font-size="19" fill="#18334c" font-weight="400">教学 q 和 −q：直接均值为0</text><text x="512" y="579" font-size="19" fill="#18334c" font-weight="400">外积和 2qqᵀ 仍给出 ±q</text><text x="512" y="608" font-size="19" fill="#18334c" font-weight="400">重特征值会带来方向不唯一</text><path d="M889,535 L941,535" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="951" y="456" width="385" height="165" fill="#fff" stroke="#17816c" rx="16"/><text x="969" y="488" font-size="23" fill="#17816c" font-weight="700">R_g → 锚点 → 8维描述符</text><text x="969" y="521" font-size="19" fill="#18334c" font-weight="400">p† = ST(p R_g)</text><text x="969" y="550" font-size="19" fill="#18334c" font-weight="400">局部4DPPF + 锚点4DPPF</text><text x="969" y="579" font-size="19" fill="#18334c" font-weight="400">输入旋转时锚点须一致变化</text><text x="969" y="608" font-size="19" fill="#18334c" font-weight="400">固定R_g一般不与任意Q交换</text><rect x="28" y="665" width="1344" height="220" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="699" font-size="24" fill="#18334c" font-weight="700">03  旋转一致性的独立核查：固定点不能被等变映射凭空转走</text><text x="55" y="733" font-size="25" fill="#18334c" font-weight="700">若 Rp_r = p_r 且 ST(Rp) = V_R ST(p)，则 V_R ST(p_r) = ST(p_r)。</text><text x="55" y="780" font-size="23" fill="#c36b24" font-weight="400">因此“轴上参考点固定”和“提升后通常不是固定向量”不能无条件同时使用。</text><text x="55" y="827" font-size="22" fill="#586d80" font-weight="400">要区分整体旋转与只改局部构型；准确率接近不等于证明所有对称结构均无歧义。</text><rect x="28" y="910" width="1344" height="260" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="944" font-size="24" fill="#18334c" font-weight="700">04  联合目标有两个分支；采样与不变性也需分别验证</text><text x="55" y="978" font-size="24" fill="#18334c" font-weight="700">L = L_task + 0.8 |L_B − 0.1 L_task|，不是永远正号相加的两个独立损失。</text><rect x="52" y="1005" width="585" height="132" fill="#fff" stroke="#7750ad" rx="16"/><text x="70" y="1037" font-size="23" fill="#7750ad" font-weight="700">当 L_B − 0.1 L_task &gt; 0</text><text x="70" y="1070" font-size="19" fill="#18334c" font-weight="400">L = 0.92 L_task + 0.8 L_B</text><text x="70" y="1099" font-size="19" fill="#18334c" font-weight="400">另一侧则为 1.08 L_task − 0.8 L_B</text><text x="70" y="1128" font-size="19" fill="#18334c" font-weight="400">连续密度NLL可为负，不能直接删掉该分支</text><rect x="697" y="1005" width="639" height="132" fill="#fff" stroke="#c36b24" rx="16"/><text x="715" y="1037" font-size="23" fill="#c36b24" font-weight="700">复现需要单列的检查</text><text x="715" y="1070" font-size="19" fill="#18334c" font-weight="400">LRF退化 / 嵌入维度 / 锚点变换 / 采样梯度</text><text x="715" y="1099" font-size="19" fill="#18334c" font-weight="400">固定与重采样随机种子分别测旋转误差</text><text x="715" y="1128" font-size="19" fill="#18334c" font-weight="400">四元数与固定点例为数学核查，未运行点云模型</text><text x="36" y="1217" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>
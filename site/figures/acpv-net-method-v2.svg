<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1290" viewBox="0 0 1400 1290" role="img" aria-labelledby="title desc"><title id="title">ACPV-Net ｜先学语义与角点，再用共享图恢复多边形</title><desc id="desc">原创中文详图：张量监督、三岔口与直角投影算例；拓扑有效不等于语义正确。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1290" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">ACPV-Net ｜先学语义与角点，再用共享图恢复多边形</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">原创中文详图：张量监督、三岔口与直角投影算例；拓扑有效不等于语义正确。</text><rect x="28" y="115" width="1344" height="245" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  学习阶段：语义条件与顶点热图是两条监督路径</text><rect x="52" y="178" width="385" height="165" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="210" font-size="23" fill="#2376c5" font-weight="700">真实角点 → 热图 → 冻结VAE</text><text x="70" y="243" font-size="19" fill="#18334c" font-weight="400">H×W → Cz×H/4×W/4</text><text x="70" y="272" font-size="19" fill="#18334c" font-weight="400">图2示例Cz=3；512²→128²×3</text><text x="70" y="301" font-size="19" fill="#18334c" font-weight="400">加噪得到z_t；噪声与时间输入UNet</text><text x="70" y="330" font-size="19" fill="#18334c" font-weight="400">推理时不读取真实角点</text><rect x="496" y="178" width="390" height="165" fill="#fff" stroke="#17816c" rx="16"/><text x="514" y="210" font-size="23" fill="#17816c" font-weight="700">航片 → 可训练语义编码器</text><text x="514" y="243" font-size="19" fill="#18334c" font-weight="400">Cs×H/4×W/4条件与z_t拼接</text><text x="514" y="272" font-size="19" fill="#18334c" font-weight="400">分割头受真实类别监督</text><text x="514" y="301" font-size="19" fill="#18334c" font-weight="400">三项：噪声L1 / 潜变量L1 / 分割</text><text x="514" y="330" font-size="19" fill="#18334c" font-weight="400">VAE冻结；编码器和去噪器更新</text><rect x="945" y="178" width="395" height="165" fill="#fff" stroke="#7750ad" rx="16"/><text x="963" y="210" font-size="23" fill="#7750ad" font-weight="700">推理得到两份几何证据</text><text x="963" y="243" font-size="19" fill="#18334c" font-weight="400">预测掩码：哪些区域接壤</text><text x="963" y="272" font-size="19" fill="#18334c" font-weight="400">预测峰：哪些位置可能是拐角</text><text x="963" y="301" font-size="19" fill="#18334c" font-weight="400">冻结解码器把潜变量还原成热图</text><text x="963" y="330" font-size="19" fill="#18334c" font-weight="400">最终多边形由几何算法重建</text><rect x="28" y="385" width="1344" height="300" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="419" font-size="24" fill="#18334c" font-weight="700">02  共享图：三个面共用一个三岔口，公共边只存一次</text><path d="M75 460 H385 V640 H75 Z" fill="#e8f3ef" stroke="#18334c" stroke-width="3"/><path d="M230 460 V550 H385 V460 Z" fill="#e5effb"/><path d="M230 550 H385 V640 H230 Z" fill="#f9e9d7"/><path d="M230 460 V640 M230 550 H385" stroke="#2376c5" stroke-width="5" fill="none"/><circle cx="230" cy="550" r="8" fill="#c36b24"/><text x="115" y="552" font-size="30" fill="#17816c" font-weight="700">A</text><text x="300" y="505" font-size="30" fill="#2376c5" font-weight="700">B</text><text x="300" y="605" font-size="30" fill="#c36b24" font-weight="700">C</text><text x="190" y="582" font-size="22" fill="#c36b24" font-weight="700">J</text><text x="445" y="475" font-size="23" fill="#18334c" font-weight="700">J度数为3 → 保留为锚点；其余链在锚点之间追踪。</text><text x="445" y="525" font-size="22" fill="#2376c5" font-weight="400">A与B反向遍历同一条边，不是各自拟合一条近似边。</text><text x="445" y="575" font-size="22" fill="#7750ad" font-weight="400">图块外框也参加构图；域外面、孔洞要单独处理。</text><text x="445" y="625" font-size="22" fill="#c36b24" font-weight="400">无缝是几何关系：把A错误识别为道路，仍可能无缝。</text><rect x="28" y="710" width="1344" height="310" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="744" font-size="24" fill="#18334c" font-weight="700">03  投影与删点：靠近边界不等于找到了唯一正确拐角</text><path d="M90 950 H290 V750" fill="none" stroke="#2376c5" stroke-width="5"/><path d="M90 950 L290 750" fill="none" stroke="#c36b24" stroke-width="3" stroke-dasharray="8 6"/><circle cx="270" cy="930" r="7" fill="#7750ad"/><text x="60" y="987" font-size="19" fill="#18334c" font-weight="400">A(0,0)</text><text x="300" y="977" font-size="19" fill="#18334c" font-weight="400">B(2,0)</text><text x="300" y="785" font-size="19" fill="#18334c" font-weight="400">C(2,2)</text><text x="95" y="900" font-size="19" fill="#7750ad" font-weight="400">p=(1.8,.2)</text><text x="465" y="790" font-size="22" fill="#18334c" font-weight="700">p到两段都为.2；τ=.25时两个投影均满足半径。</text><text x="465" y="840" font-size="22" fill="#7750ad" font-weight="400">候选弧长1.8与2.2：需平局规则，再沿链排序。</text><text x="465" y="890" font-size="22" fill="#2376c5" font-weight="400">B度数为2，但不能因此删掉：直角会变成斜线。</text><text x="465" y="940" font-size="22" fill="#c36b24" font-weight="400">B到虚线距离√2；预测漏峰需要几何保护策略。</text><text x="465" y="985" font-size="20" fill="#586d80" font-weight="400">均为教学坐标与阈值；不是作者默认参数。</text><rect x="28" y="1045" width="1344" height="190" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="1079" font-size="24" fill="#18334c" font-weight="700">04  最后追踪面，并核查充分条件</text><text x="55" y="1115" font-size="23" fill="#18334c" font-weight="700">共享链简化 → 面边界闭环 → 内孔 / 外部面处理 → 按预测掩码赋类别。</text><text x="55" y="1162" font-size="22" fill="#c36b24" font-weight="400">还需检查交叉、遗漏拐角与边界偏离；命题的条件不能被学习峰自动保证。</text><text x="55" y="1206" font-size="20" fill="#586d80" font-weight="400">依据§3–4.2、Fig.2，PDF3–5；图示仅解释几何，未执行模型或重建程序。</text><text x="36" y="1267" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>
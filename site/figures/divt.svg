<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">DiVT：把重复 patch 组织成更紧凑的视觉单元</title><desc id="desc">示意颜色表示特征相近，不是原文分割标签；图中 token 数不是实验统计。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#6e8a83"/></marker><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#dde6dd"/></pattern></defs><rect width="1200" height="660" rx="20" fill="#fafcf8"/><rect y="110" width="1200" height="490" fill="url(#dots)"/><g font-family="Inter,Segoe UI,Microsoft YaHei,sans-serif"><text x="40" y="38" fill="#688279" font-size="11" font-weight="650">PAPER ATLAS / METHOD EXPLAINED</text><text x="40" y="75" fill="#1f3d34" font-size="28" font-weight="650">DiVT：把重复 patch 组织成更紧凑的视觉单元</text><text x="40" y="103" fill="#71867e" font-size="13" font-weight="400">示意颜色表示特征相近，不是原文分割标签；图中 token 数不是实验统计。</text><rect x="50" y="170" width="26" height="26" rx="4" fill="#b8d6ee"/><rect x="80" y="170" width="26" height="26" rx="4" fill="#b8d6ee"/><rect x="110" y="170" width="26" height="26" rx="4" fill="#b8d6ee"/><rect x="140" y="170" width="26" height="26" rx="4" fill="#b8d6ee"/><rect x="170" y="170" width="26" height="26" rx="4" fill="#b8d6ee"/><rect x="200" y="170" width="26" height="26" rx="4" fill="#b8d6ee"/><rect x="50" y="200" width="26" height="26" rx="4" fill="#b8d6ee"/><rect x="80" y="200" width="26" height="26" rx="4" fill="#b8d6ee"/><rect x="110" y="200" width="26" height="26" rx="4" fill="#b8d6ee"/><rect x="140" y="200" width="26" height="26" rx="4" fill="#b8d6ee"/><rect x="170" y="200" width="26" height="26" rx="4" fill="#b8d6ee"/><rect x="200" y="200" width="26" height="26" rx="4" fill="#b8d6ee"/><rect x="50" y="230" width="26" height="26" rx="4" fill="#b8d6ee"/><rect x="80" y="230" width="26" height="26" rx="4" fill="#b8d6ee"/><rect x="110" y="230" width="26" height="26" rx="4" fill="#b8d6ee"/><rect x="140" y="230" width="26" height="26" rx="4" fill="#d7bee8"/><rect x="170" y="230" width="26" height="26" rx="4" fill="#d7bee8"/><rect x="200" y="230" width="26" height="26" rx="4" fill="#d7bee8"/><rect x="50" y="260" width="26" height="26" rx="4" fill="#b8d6ee"/><rect x="80" y="260" width="26" height="26" rx="4" fill="#b8d6ee"/><rect x="110" y="260" width="26" height="26" rx="4" fill="#b8d6ee"/><rect x="140" y="260" width="26" height="26" rx="4" fill="#d7bee8"/><rect x="170" y="260" width="26" height="26" rx="4" fill="#d7bee8"/><rect x="200" y="260" width="26" height="26" rx="4" fill="#d7bee8"/><rect x="50" y="290" width="26" height="26" rx="4" fill="#d7bee8"/><rect x="80" y="290" width="26" height="26" rx="4" fill="#d7bee8"/><rect x="110" y="290" width="26" height="26" rx="4" fill="#d7bee8"/><rect x="140" y="290" width="26" height="26" rx="4" fill="#b9dccb"/><rect x="170" y="290" width="26" height="26" rx="4" fill="#b9dccb"/><rect x="200" y="290" width="26" height="26" rx="4" fill="#b9dccb"/><rect x="50" y="320" width="26" height="26" rx="4" fill="#d7bee8"/><rect x="80" y="320" width="26" height="26" rx="4" fill="#d7bee8"/><rect x="110" y="320" width="26" height="26" rx="4" fill="#d7bee8"/><rect x="140" y="320" width="26" height="26" rx="4" fill="#b9dccb"/><rect x="170" y="320" width="26" height="26" rx="4" fill="#b9dccb"/><rect x="200" y="320" width="26" height="26" rx="4" fill="#b9dccb"/><text x="45" y="395" fill="#253d3c" font-size="16" font-weight="400">N 个 patch 特征</text><rect x="330" y="165" width="285" height="170" rx="14" fill="#f0eafa" stroke="#7753a8" stroke-opacity=".25"/><text x="350" y="197" fill="#7753a8" font-size="18" font-weight="650">特征空间聚类</text><text x="350" y="226" fill="#253d3c" font-size="14" font-weight="400">余弦相似度图 + 阈值 θ</text><text x="350" y="251" fill="#253d3c" font-size="14" font-weight="400">密集中心选择 → 重新分配</text><text x="350" y="276" fill="#253d3c" font-size="14" font-weight="400">按空间位置排列中心</text><text x="350" y="301" fill="#253d3c" font-size="14" font-weight="400">θ 越高，通常 token 越多</text><path d="M240 260 L330 260" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="720" y="165" width="290" height="170" rx="14" fill="#e5f3ec" stroke="#237958" stroke-opacity=".25"/><text x="740" y="197" fill="#237958" font-size="18" font-weight="650">簇内注意力聚合</text><text x="740" y="226" fill="#253d3c" font-size="14" font-weight="400">中心作 Q，簇内 patch 作 K/V</text><text x="740" y="251" fill="#253d3c" font-size="14" font-weight="400">位置编码只进入 V</text><text x="740" y="276" fill="#253d3c" font-size="14" font-weight="400">每簇形成连续视觉 token</text><text x="740" y="301" fill="#253d3c" font-size="14" font-weight="400">MLP → LLM 输入空间</text><path d="M615 260 L720 260" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><text x="45" y="495" fill="#253d3c" font-size="20" font-weight="400">更细 θ ↑</text><text x="45" y="540" fill="#253d3c" font-size="20" font-weight="400">更粗 θ ↓</text><rect x="330" y="480" width="35" height="30" rx="7" fill="#b8d6ee"/><rect x="380" y="480" width="35" height="30" rx="7" fill="#d7bee8"/><rect x="430" y="480" width="35" height="30" rx="7" fill="#b9dccb"/><rect x="480" y="480" width="35" height="30" rx="7" fill="#eecfa5"/><rect x="530" y="480" width="35" height="30" rx="7" fill="#b8d6ee"/><rect x="580" y="480" width="35" height="30" rx="7" fill="#d7bee8"/><rect x="630" y="480" width="35" height="30" rx="7" fill="#b9dccb"/><rect x="680" y="480" width="35" height="30" rx="7" fill="#eecfa5"/><rect x="730" y="480" width="35" height="30" rx="7" fill="#b8d6ee"/><rect x="780" y="480" width="35" height="30" rx="7" fill="#d7bee8"/><rect x="830" y="480" width="35" height="30" rx="7" fill="#b9dccb"/><rect x="880" y="480" width="35" height="30" rx="7" fill="#eecfa5"/><rect x="330" y="525" width="35" height="30" rx="7" fill="#b8d6ee"/><rect x="380" y="525" width="35" height="30" rx="7" fill="#d7bee8"/><rect x="430" y="525" width="35" height="30" rx="7" fill="#b9dccb"/><rect x="480" y="525" width="35" height="30" rx="7" fill="#eecfa5"/><text x="45" y="585" fill="#253d3c" font-size="15" font-weight="400">token 数由内容与阈值共同决定；聚合不是无损编码，每簇也未必等于一个物体。</text><path d="M40 606H1160" stroke="#dae5dc"/><text x="40" y="631" fill="#71867e" font-size="12" font-weight="400">依据原论文 Fig.3 / Algorithm1 / §3 重绘；省略投影矩阵与训练数据。</text><text x="1000" y="631" fill="#71867e" font-size="11" font-weight="400">原创概念重绘 · 非原图</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">4DWorldBench：精美之外，还要检查什么？</title><desc id="desc">四个维度互补：感知质量、条件对齐、物理合理性、时空一致性。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#6e8a83"/></marker><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#dde6dd"/></pattern></defs><rect width="1200" height="660" rx="20" fill="#fafcf8"/><rect y="110" width="1200" height="490" fill="url(#dots)"/><g font-family="Inter,Segoe UI,Microsoft YaHei,sans-serif"><text x="40" y="38" fill="#688279" font-size="11" font-weight="650">PAPER ATLAS / METHOD EXPLAINED</text><text x="40" y="75" fill="#1f3d34" font-size="28" font-weight="650">4DWorldBench：精美之外，还要检查什么？</text><text x="40" y="103" fill="#71867e" font-size="13" font-weight="400">四个维度互补：感知质量、条件对齐、物理合理性、时空一致性。</text><rect x="40" y="190" width="215" height="150" rx="14" fill="#e7effb" stroke="#3b6fba" stroke-opacity=".25"/><text x="60" y="222" fill="#3b6fba" font-size="18" font-weight="650">输入条件与生成视频</text><text x="60" y="251" fill="#253d3c" font-size="14" font-weight="400">文本 / 图像 / 视频</text><text x="60" y="276" fill="#253d3c" font-size="14" font-weight="400">统一条件文字描述</text><rect x="350" y="140" width="350" height="150" rx="14" fill="#f0eafa" stroke="#7753a8" stroke-opacity=".25"/><text x="370" y="172" fill="#7753a8" font-size="18" font-weight="650">物理与条件问答</text><text x="370" y="201" fill="#253d3c" font-size="14" font-weight="400">按语义选择相关维度</text><text x="370" y="226" fill="#253d3c" font-size="14" font-weight="400">生成问题 → 预测 / 参考答案</text><text x="370" y="251" fill="#253d3c" font-size="14" font-weight="400">物理分支：先字幕，再 LLM 判断</text><rect x="350" y="350" width="350" height="155" rx="14" fill="#e5f3ec" stroke="#237958" stroke-opacity=".25"/><text x="370" y="382" fill="#237958" font-size="18" font-weight="650">视觉与几何指标</text><text x="370" y="411" fill="#253d3c" font-size="14" font-weight="400">感知：质量 / 美学 / 纹理</text><text x="370" y="436" fill="#253d3c" font-size="14" font-weight="400">一致性：重投影 / 光流 / 风格</text><text x="370" y="461" fill="#253d3c" font-size="14" font-weight="400">静态 3D 只评价适用维度</text><rect x="820" y="240" width="330" height="185" rx="14" fill="#fff1df" stroke="#aa6b29" stroke-opacity=".25"/><text x="840" y="272" fill="#aa6b29" font-size="18" font-weight="650">多维报告与人工对照</text><text x="840" y="301" fill="#253d3c" font-size="14" font-weight="400">不是单一“物理正确”证明</text><text x="840" y="326" fill="#253d3c" font-size="14" font-weight="400">保留条件类型和子指标</text><text x="840" y="351" fill="#253d3c" font-size="14" font-weight="400">检查评委偏差与字幕遗漏</text><path d="M255 255 L350 215" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M255 285 L350 420" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M700 215 L820 285" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M700 425 L820 380" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><text x="45" y="560" fill="#253d3c" font-size="16" font-weight="400">Sphy = 正确回答数 / 问题总数；得分依赖问题、参考答案与评委。</text><path d="M40 606H1160" stroke="#dae5dc"/><text x="40" y="631" fill="#71867e" font-size="12" font-weight="400">依据原论文 Fig.1 / Fig.5 / §4 重绘；未展开全部评估器和提示词。</text><text x="1000" y="631" fill="#71867e" font-size="11" font-weight="400">原创概念重绘 · 非原图</text></g></svg>
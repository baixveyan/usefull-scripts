<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1250" viewBox="0 0 1400 1250" role="img" aria-labelledby="title desc"><title id="title">ARCA-GS ｜分辨率适配、像素门控与代理压缩怎样连接</title><desc id="desc">依据Fig.2、式5–14与实施细节，PDF3–7；教学特征与数量不代表作者实验。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1250" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">ARCA-GS ｜分辨率适配、像素门控与代理压缩怎样连接</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据Fig.2、式5–14与实施细节，PDF3–7；教学特征与数量不代表作者实验。</text><rect x="28" y="115" width="1344" height="245" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  同一锚点随渲染尺寸改变特征，再解码高斯属性</text><rect x="52" y="179" width="585" height="165" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="211" font-size="23" fill="#2376c5" font-weight="700">位置与尺寸 → FiLM</text><text x="70" y="244" font-size="19" fill="#18334c" font-weight="400">PE(x_v, ξ) → MLP → γ, β</text><text x="70" y="273" font-size="19" fill="#18334c" font-weight="400">f_hat = (1+γ) ⊙ f + β</text><text x="70" y="302" font-size="19" fill="#18334c" font-weight="400">教学 f=(2,−1), γ=(.5,0), β=(−1,.2)</text><text x="70" y="331" font-size="19" fill="#18334c" font-weight="400">调制结果 (2,−.8)，不是把最终图像resize</text><rect x="697" y="179" width="639" height="165" fill="#fff" stroke="#7750ad" rx="16"/><text x="715" y="211" font-size="23" fill="#7750ad" font-weight="700">属性解码 → 当前相机投影</text><text x="715" y="244" font-size="19" fill="#18334c" font-weight="400">同一锚点可生成多个高斯</text><text x="715" y="273" font-size="19" fill="#18334c" font-weight="400">预测几何、颜色和透明度等属性</text><text x="715" y="302" font-size="19" fill="#18334c" font-weight="400">投影协方差Σ₂D必须使用像素坐标</text><text x="715" y="331" font-size="19" fill="#18334c" font-weight="400">透明度筛选阈值与覆盖门控分开处理</text><rect x="28" y="385" width="1344" height="245" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="419" font-size="24" fill="#18334c" font-weight="700">02  Pixel Coverage Gate：面积是平方量，门控是连续量</text><rect x="52" y="451" width="585" height="165" fill="#fff" stroke="#17816c" rx="16"/><text x="70" y="483" font-size="23" fill="#17816c" font-weight="700">椭圆覆盖面积</text><text x="70" y="516" font-size="19" fill="#18334c" font-weight="400">A = πρ² sqrt(det Σ₂D)，作者ρ=1</text><text x="70" y="545" font-size="19" fill="#18334c" font-weight="400">固定几何时，宽高减半 → 面积变1/4</text><text x="70" y="574" font-size="19" fill="#18334c" font-weight="400">FiLM也改几何时需重新投影计算</text><text x="70" y="603" font-size="19" fill="#18334c" font-weight="400">面积单位不应混成世界坐标长度</text><rect x="697" y="451" width="639" height="165" fill="#fff" stroke="#c36b24" rx="16"/><text x="715" y="483" font-size="23" fill="#c36b24" font-weight="700">有效透明度 α_eff = α sigmoid(κ(A−η))</text><text x="715" y="516" font-size="19" fill="#18334c" font-weight="400">A=η时门控=.5，不是完全保留</text><text x="715" y="545" font-size="19" fill="#18334c" font-weight="400">局部梯度 α κ g(1−g)，两端会饱和</text><text x="715" y="574" font-size="19" fill="#18334c" font-weight="400">alpha合成有前后遮挡耦合</text><text x="715" y="603" font-size="19" fill="#18334c" font-weight="400">仅推理加门控不保证画质不变</text><rect x="28" y="655" width="1344" height="245" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="689" font-size="24" fill="#18334c" font-weight="700">03  代理特征 + 几何条件 → 残差 → 叶特征</text><rect x="52" y="721" width="380" height="165" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="753" font-size="23" fill="#2376c5" font-weight="700">约30%代理保存特征</text><text x="70" y="786" font-size="19" fill="#18334c" font-weight="400">网格内密度感知随机选择</text><text x="70" y="815" font-size="19" fill="#18334c" font-weight="400">其余叶保留恢复所需元数据</text><text x="70" y="844" font-size="19" fill="#18334c" font-weight="400">代理特征先适配目标尺寸</text><text x="70" y="873" font-size="19" fill="#18334c" font-weight="400">不是删除70%的全部几何</text><path d="M432,800 L484,800" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="494" y="721" width="395" height="165" fill="#fff" stroke="#c36b24" rx="16"/><text x="512" y="753" font-size="23" fill="#c36b24" font-weight="700">预测器输入局部关系</text><text x="512" y="786" font-size="19" fill="#18334c" font-weight="400">代理特征 + PE(距离,方向)</text><text x="512" y="815" font-size="19" fill="#18334c" font-weight="400">原式方向 x_proxy−x_leaf</text><text x="512" y="844" font-size="19" fill="#18334c" font-weight="400">文字方向描述与公式相反</text><text x="512" y="873" font-size="19" fill="#18334c" font-weight="400">零距离需额外数值处理</text><path d="M889,800 L941,800" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="951" y="721" width="385" height="165" fill="#fff" stroke="#17816c" rx="16"/><text x="969" y="753" font-size="23" fill="#17816c" font-weight="700">预测叶 = 代理 + 残差</text><text x="969" y="786" font-size="19" fill="#18334c" font-weight="400">教学 (1,2)+(.2,−.3)=(1.2,1.7)</text><text x="969" y="815" font-size="19" fill="#18334c" font-weight="400">同维特征相加，再解码属性</text><text x="969" y="844" font-size="19" fill="#18334c" font-weight="400">特征差不是三维位移</text><text x="969" y="873" font-size="19" fill="#18334c" font-weight="400">省存储，同时增加预测计算</text><rect x="28" y="925" width="1344" height="265" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="959" font-size="24" fill="#18334c" font-weight="700">04  训练只替换部分叶；推理压缩与训练替换比例不同</text><text x="55" y="993" font-size="22" fill="#18334c" font-weight="700">教学100锚点：30代理 + 70叶；一步替换20%的叶，即14预测叶 + 56原叶 + 30代理。</text><text x="55" y="1040" font-size="21" fill="#7750ad" font-weight="400">第一阶段用图像损失；增长剪枝结束后再延迟1k步启动预测器，与特征重建项联合优化。</text><text x="55" y="1087" font-size="22" fill="#2376c5" font-weight="400">重建 = MSE + .1(1−cos)；λ_recon在20k前.1、之后.01，作者总训练30k步。</text><text x="55" y="1134" font-size="21" fill="#586d80" font-weight="400">存特征锚点数 ≠ 渲染高斯数 ≠ FPS；数值例仅用于解释，未渲染场景或复现实验。</text><text x="36" y="1227" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>
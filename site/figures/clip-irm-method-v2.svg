<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1180" viewBox="0 0 1400 1180" role="img" aria-labelledby="title desc"><title id="title">CLIP-IRM ｜把表示学习与过程奖励分开读</title><desc id="desc">依据原文 §3–6、式1/3/9–14，PDF 3–6；词语、logit 与概率均为独立解释例子。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1180" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">CLIP-IRM ｜把表示学习与过程奖励分开读</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据原文 §3–6、式1/3/9–14，PDF 3–6；词语、logit 与概率均为独立解释例子。</text><rect x="28" y="115" width="1344" height="270" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  中期训练：改造正向监督，仍保留原图文覆盖</text><rect x="52" y="178" width="380" height="145" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="210" font-size="23" fill="#2376c5" font-weight="700">解释性 caption</text><text x="70" y="243" font-size="19" fill="#18334c" font-weight="400">dog on a snowy road</text><text x="70" y="272" font-size="19" fill="#18334c" font-weight="400">类别 V：dog → 保留</text><text x="70" y="301" font-size="19" fill="#18334c" font-weight="400">环境 E：snowy road → 剪裁</text><path d="M432,248 L493,248" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="503" y="178" width="390" height="145" fill="#fff" stroke="#7750ad" rx="16"/><text x="521" y="210" font-size="23" fill="#7750ad" font-weight="700">增强 batch D_V</text><text x="521" y="243" font-size="19" fill="#18334c" font-weight="400">去环境短语 + 同类 caption 交换</text><text x="521" y="272" font-size="19" fill="#18334c" font-weight="400">按类别聚合对比监督</text><text x="521" y="301" font-size="19" fill="#18334c" font-weight="400">属性错配与正样本索引需核对</text><path d="M893,248 L955,248" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="965" y="178" width="371" height="145" fill="#fff" stroke="#17816c" rx="16"/><text x="983" y="210" font-size="23" fill="#17816c" font-weight="700">更新 CLIP 双塔 f / g</text><text x="983" y="243" font-size="19" fill="#18334c" font-weight="400">L_V + λ L_D</text><text x="983" y="272" font-size="19" fill="#18334c" font-weight="400">原 batch D 继续参与</text><text x="983" y="301" font-size="19" fill="#18334c" font-weight="400">产物：编码器，不是文本生成器</text><text x="55" y="360" font-size="23" fill="#18334c" font-weight="700">两阶段分开：CLIP-IRM 提供评分空间；MLLM 是另外一个可生成策略。</text><rect x="28" y="410" width="1344" height="140" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="444" font-size="24" fill="#18334c" font-weight="700">02  理论连接有前提，模态共享不自动等于环境不变</text><text x="55" y="478" font-size="24" fill="#7750ad" font-weight="700">可逆光滑生成 / 理想最优 / 无限图文对 → 共享潜变量块可识别</text><text x="55" y="521" font-size="21" fill="#586d80" font-weight="400">再要求类别—环境可分与词表条件，才讨论受约束对齐和 IRM；有限加权训练需另核验</text><rect x="28" y="575" width="1344" height="275" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="609" font-size="24" fill="#18334c" font-weight="700">03  策略训练：滑动文本窗口与图片在奖励塔中比较</text><rect x="52" y="641" width="300" height="142" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="673" font-size="23" fill="#2376c5" font-weight="700">MLLM 策略 πθ</text><text x="70" y="706" font-size="19" fill="#18334c" font-weight="400">图片 + 问题 → token 序列</text><text x="70" y="735" font-size="19" fill="#18334c" font-weight="400">… t_(k−2), t_(k−1), t_k</text><text x="70" y="764" font-size="19" fill="#18334c" font-weight="400">窗口长度 w；不是整篇全文</text><path d="M352,710 L411,710" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="421" y="641" width="430" height="142" fill="#fff" stroke="#7750ad" rx="16"/><text x="439" y="673" font-size="23" fill="#7750ad" font-weight="700">CLIP-IRM 奖励通道</text><text x="439" y="706" font-size="19" fill="#18334c" font-weight="400">g(最近 w 个 token) 与 f(图片)</text><text x="439" y="735" font-size="19" fill="#18334c" font-weight="400">可选：max_m sim(patch_m, 窗口)</text><text x="439" y="764" font-size="19" fill="#18334c" font-weight="400">早期冻结 f/g；后期微调为可选项</text><path d="M851,710 L910,710" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="920" y="641" width="416" height="142" fill="#fff" stroke="#17816c" rx="16"/><text x="938" y="673" font-size="23" fill="#17816c" font-weight="700">任务奖励 + 过程奖励</text><text x="938" y="706" font-size="19" fill="#18334c" font-weight="400">GRPO 更新 πθ，KL 约束参考策略</text><text x="938" y="735" font-size="19" fill="#18334c" font-weight="400">不是把 CLIP 文本塔变成 decoder</text><text x="938" y="764" font-size="19" fill="#18334c" font-weight="400">相似度不等于逐步推导正确性</text><text x="55" y="824" font-size="22" fill="#c36b24" font-weight="700">r_proc 的符号、环境短语惩罚、窗口归一化、冻结日程，均需以实现复核。</text><rect x="28" y="875" width="1344" height="245" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="909" font-size="24" fill="#18334c" font-weight="700">04  必须核对符号：小损失表示匹配好，直接最大化正损失会反向</text><rect x="52" y="941" width="380" height="130" fill="#fff" stroke="#17816c" rx="16"/><text x="70" y="973" font-size="23" fill="#17816c" font-weight="700">代数例：匹配好</text><text x="70" y="1006" font-size="19" fill="#18334c" font-weight="400">正确 logit=2，负例=0</text><text x="70" y="1035" font-size="19" fill="#18334c" font-weight="400">正确概率≈0.881；InfoNCE≈0.127</text><rect x="493" y="941" width="395" height="130" fill="#fff" stroke="#c36b24" rx="16"/><text x="511" y="973" font-size="23" fill="#c36b24" font-weight="700">代数例：匹配差</text><text x="511" y="1006" font-size="19" fill="#18334c" font-weight="400">正确 logit=−2，负例=0</text><text x="511" y="1035" font-size="19" fill="#18334c" font-weight="400">正确概率≈0.119；InfoNCE≈2.127</text><rect x="949" y="941" width="387" height="130" fill="#fff" stroke="#7750ad" rx="16"/><text x="967" y="973" font-size="23" fill="#7750ad" font-weight="700">原文式12：正号写 ℓ_InfoNCE</text><text x="967" y="1006" font-size="19" fill="#18334c" font-weight="400">不能暗中改成 −loss 后称已复现</text><text x="967" y="1035" font-size="19" fill="#18334c" font-weight="400">需确认代码是否另定义 score</text><text x="967" y="1064" font-size="19" fill="#18334c" font-weight="400">例子不代表已证实作者代码错误</text><text x="36" y="1157" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>
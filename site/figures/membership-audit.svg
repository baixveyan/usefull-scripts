<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">成员推断：审计器的置信证据也需要验证</title><desc id="desc">几何量补充原始推断分数；结果是统计证据，不是训练数据归属的确定证明。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#6e8a83"/></marker><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#dde6dd"/></pattern></defs><rect width="1200" height="660" rx="20" fill="#fafcf8"/><rect y="110" width="1200" height="490" fill="url(#dots)"/><g font-family="Inter,Segoe UI,Microsoft YaHei,sans-serif"><text x="40" y="38" fill="#688279" font-size="11" font-weight="650">PAPER ATLAS / METHOD EXPLAINED</text><text x="40" y="75" fill="#1f3d34" font-size="28" font-weight="650">成员推断：审计器的置信证据也需要验证</text><text x="40" y="103" fill="#71867e" font-size="13" font-weight="400">几何量补充原始推断分数；结果是统计证据，不是训练数据归属的确定证明。</text><rect x="40" y="150" width="285" height="170" rx="14" fill="#e7effb" stroke="#3b6fba" stroke-opacity=".25"/><text x="60" y="182" fill="#3b6fba" font-size="18" font-weight="650">审计输入：三种来源</text><text x="60" y="211" fill="#253d3c" font-size="14" font-weight="400">真实训练成员</text><text x="60" y="236" fill="#253d3c" font-size="14" font-weight="400">自然非成员</text><text x="60" y="261" fill="#253d3c" font-size="14" font-weight="400">被微扰的非成员</text><text x="60" y="286" fill="#253d3c" font-size="14" font-weight="400">训练历史不会被输入修改</text><rect x="430" y="150" width="300" height="170" rx="14" fill="#f0eafa" stroke="#7753a8" stroke-opacity=".25"/><text x="450" y="182" fill="#7753a8" font-size="18" font-weight="650">两类统计证据</text><text x="450" y="211" fill="#253d3c" font-size="14" font-weight="400">S：原始成员推断分数</text><text x="450" y="236" fill="#253d3c" font-size="14" font-weight="400">g：输入损失梯度范数</text><text x="450" y="261" fill="#253d3c" font-size="14" font-weight="400">高置信 + 低梯度可能误导</text><text x="450" y="286" fill="#253d3c" font-size="14" font-weight="400">白盒梯度权限是主要假设</text><path d="M325 230 L430 230" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="850" y="150" width="305" height="170" rx="14" fill="#e5f3ec" stroke="#237958" stroke-opacity=".25"/><text x="870" y="182" fill="#237958" font-size="18" font-weight="650">AR-MIA 加权推断</text><text x="870" y="211" fill="#253d3c" font-size="14" font-weight="400">w = tanh(λ g)</text><text x="870" y="236" fill="#253d3c" font-size="14" font-weight="400">成员分数 = w × S</text><text x="870" y="261" fill="#253d3c" font-size="14" font-weight="400">阈值需 shadow 数据校准</text><text x="870" y="286" fill="#253d3c" font-size="14" font-weight="400">不能仅凭梯度认定归属</text><path d="M730 230 L850 230" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="40" y="430" width="690" height="125" rx="14" fill="#fff1df" stroke="#aa6b29" stroke-opacity=".25"/><text x="60" y="462" fill="#aa6b29" font-size="18" font-weight="650">MFD 是另外一个条件检测问题</text><text x="60" y="491" fill="#253d3c" font-size="14" font-weight="400">先筛选被 MIA 判为成员的查询，再区分真成员与伪造成员</text><text x="60" y="516" fill="#253d3c" font-size="14" font-weight="400">筛选后 AUC 不能当作全部查询上的端到端性能</text><rect x="850" y="430" width="305" height="125" rx="14" fill="#fcebea" stroke="#b45853" stroke-opacity=".25"/><text x="870" y="462" fill="#b45853" font-size="18" font-weight="650">边界：小扰动仍难识别</text><text x="870" y="491" fill="#253d3c" font-size="14" font-weight="400">局部定理不是全局保证</text><text x="870" y="516" fill="#253d3c" font-size="14" font-weight="400">式9标签方向另见正文核对</text><path d="M40 606H1160" stroke="#dae5dc"/><text x="40" y="631" fill="#71867e" font-size="12" font-weight="400">依据原论文 §3 / Fig.5–7 重绘；省略扰动优化步骤，聚焦审计与防御路径。</text><text x="1000" y="631" fill="#71867e" font-size="11" font-weight="400">原创概念重绘 · 非原图</text></g></svg>
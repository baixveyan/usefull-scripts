<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">VLM 去偏：分离属性变化，保留共同内容</title><desc id="desc">先定义属性子空间，再讨论公平替代量与效用；不把模型标签当作个人身份。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#6e8a83"/></marker><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#dde6dd"/></pattern></defs><rect width="1200" height="660" rx="20" fill="#fafcf8"/><rect y="110" width="1200" height="490" fill="url(#dots)"/><g font-family="Inter,Segoe UI,Microsoft YaHei,sans-serif"><text x="40" y="38" fill="#688279" font-size="11" font-weight="650">PAPER ATLAS / METHOD EXPLAINED</text><text x="40" y="75" fill="#1f3d34" font-size="28" font-weight="650">VLM 去偏：分离属性变化，保留共同内容</text><text x="40" y="103" fill="#71867e" font-size="13" font-weight="400">先定义属性子空间，再讨论公平替代量与效用；不把模型标签当作个人身份。</text><rect x="40" y="155" width="250" height="145" rx="14" fill="#e7effb" stroke="#3b6fba" stroke-opacity=".25"/><text x="60" y="187" fill="#3b6fba" font-size="18" font-weight="650">群体提示与变体</text><text x="60" y="216" fill="#253d3c" font-size="14" font-weight="400">围绕同一内容构造</text><text x="60" y="241" fill="#253d3c" font-size="14" font-weight="400">锚点 + 变体 → 球面均值</text><text x="60" y="266" fill="#253d3c" font-size="14" font-weight="400">得到群体原型 p₁, p₂, …</text><rect x="390" y="155" width="300" height="145" rx="14" fill="#f0eafa" stroke="#7753a8" stroke-opacity=".25"/><text x="410" y="187" fill="#7753a8" font-size="18" font-weight="650">属性差子空间 A</text><text x="410" y="216" fill="#253d3c" font-size="14" font-weight="400">span{p₂ − p₁, p₃ − p₁, …}</text><text x="410" y="241" fill="#253d3c" font-size="14" font-weight="400">保留共同内容方向</text><text x="410" y="266" fill="#253d3c" font-size="14" font-weight="400">原型定义影响去偏含义</text><path d="M290 225 L390 225" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="40" y="380" width="250" height="145" rx="14" fill="#e7effb" stroke="#3b6fba" stroke-opacity=".25"/><text x="60" y="412" fill="#3b6fba" font-size="18" font-weight="650">原图像 / 文字嵌入 e</text><text x="60" y="441" fill="#253d3c" font-size="14" font-weight="400">分类与检索：两端处理</text><text x="60" y="466" fill="#253d3c" font-size="14" font-weight="400">生成：只处理文本端</text><rect x="390" y="380" width="300" height="145" rx="14" fill="#e5f3ec" stroke="#237958" stroke-opacity=".25"/><text x="410" y="412" fill="#237958" font-size="18" font-weight="650">正交分解与折中</text><text x="410" y="441" fill="#253d3c" font-size="14" font-weight="400">e = e∥ + e⊥</text><text x="410" y="466" fill="#253d3c" font-size="14" font-weight="400">沿二维曲线选择 u(α)</text><text x="410" y="491" fill="#253d3c" font-size="14" font-weight="400">减少属性泄漏，控制表示变化</text><path d="M290 455 L390 455" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M540 300 L540 380" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="825" y="270" width="320" height="180" rx="14" fill="#fff1df" stroke="#aa6b29" stroke-opacity=".25"/><text x="845" y="302" fill="#aa6b29" font-size="18" font-weight="650">任务继续使用 u</text><text x="845" y="331" fill="#253d3c" font-size="14" font-weight="400">公平：对群体原型相似度</text><text x="845" y="356" fill="#253d3c" font-size="14" font-weight="400">效用界：嵌入余弦变化</text><text x="845" y="381" fill="#253d3c" font-size="14" font-weight="400">不是 F1 / Recall 不下降保证</text><path d="M690 455 L825 385" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><text x="45" y="575" fill="#253d3c" font-size="16" font-weight="400">几何折中不等于现实公平的完整定义；附录证明与闭式公式仍需实现复核。</text><path d="M40 606H1160" stroke="#dae5dc"/><text x="40" y="631" fill="#71867e" font-size="12" font-weight="400">依据原论文 Fig.1–3 / §3–4 重绘；图为概念解释，非定理证明。</text><text x="1000" y="631" fill="#71867e" font-size="11" font-weight="400">原创概念重绘 · 非原图</text></g></svg>
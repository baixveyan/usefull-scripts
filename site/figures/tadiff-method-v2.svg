<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1040" viewBox="0 0 1400 1040" role="img" aria-labelledby="title desc"><title id="title">TADiff ｜特征正则化怎样变成时间边界定位</title><desc id="desc">依据原文 §3.3、Fig.4、式2–4，PDF 4–6；时间与通道数值均为阅读示例。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1040" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">TADiff ｜特征正则化怎样变成时间边界定位</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据原文 §3.3、Fig.4、式2–4，PDF 4–6；时间与通道数值均为阅读示例。</text><rect x="28" y="115" width="1344" height="255" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  被扰动的是视频特征，不是原始画面</text><rect x="52" y="178" width="260" height="132" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="210" font-size="23" fill="#2376c5" font-weight="700">视频 → 视觉特征</text><text x="70" y="243" font-size="19" fill="#18334c" font-weight="400">X：T × C</text><text x="70" y="272" font-size="19" fill="#18334c" font-weight="400">采样步长需查原实现</text><rect x="366" y="178" width="285" height="132" fill="#fff" stroke="#2376c5" rx="16"/><text x="384" y="210" font-size="23" fill="#2376c5" font-weight="700">多尺度时序编码</text><text x="384" y="243" font-size="19" fill="#18334c" font-weight="400">f^(l)：N_l × C</text><text x="384" y="272" font-size="19" fill="#18334c" font-weight="400">细边界 / 粗上下文</text><path d="M312,239 L359,239" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="705" y="178" width="280" height="132" fill="#fff" stroke="#c36b24" rx="16"/><text x="723" y="210" font-size="23" fill="#c36b24" font-weight="700">加噪 x_s</text><text x="723" y="243" font-size="19" fill="#18334c" font-weight="400">√ᾱ_s f + √(1−ᾱ_s) ε</text><text x="723" y="272" font-size="19" fill="#18334c" font-weight="400">形状仍为 N_l × C</text><path d="M651,239 L698,239" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="1040" y="178" width="296" height="132" fill="#fff" stroke="#7750ad" rx="16"/><text x="1058" y="210" font-size="23" fill="#7750ad" font-weight="700">FiLM 时序去噪</text><text x="1058" y="243" font-size="19" fill="#18334c" font-weight="400">步嵌入 s → 通道缩放/偏移</text><text x="1058" y="272" font-size="19" fill="#18334c" font-weight="400">配合 DDIM 式更新，共 S 步</text><path d="M985,239 L1033,239" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><text x="57" y="343" font-size="21" fill="#c36b24" font-weight="700">解释例子：f=2，ᾱ_s=0.64，ε=−1 → x_s = 0.8×2 + 0.6×(−1) = 1.0</text><rect x="28" y="395" width="1344" height="245" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="429" font-size="24" fill="#18334c" font-weight="700">02  一次逆更新：三项都与输入特征同形状</text><rect x="52" y="457" width="365" height="124" fill="#fff" stroke="#17816c" rx="16"/><text x="70" y="489" font-size="23" fill="#17816c" font-weight="700">信号项</text><text x="70" y="522" font-size="19" fill="#18334c" font-weight="400">√ᾱ_(s−1) · x̂_0</text><text x="70" y="551" font-size="19" fill="#18334c" font-weight="400">判别特征估计，不是“真实原视频”</text><text x="438" y="526" font-size="36" fill="#586d80" font-weight="400">+</text><rect x="478" y="457" width="385" height="124" fill="#fff" stroke="#2376c5" rx="16"/><text x="496" y="489" font-size="23" fill="#2376c5" font-weight="700">残余项</text><text x="496" y="522" font-size="19" fill="#18334c" font-weight="400">√(1−ᾱ_(s−1)−σ²_s) · ε̂</text><text x="496" y="551" font-size="19" fill="#18334c" font-weight="400">匹配下一步噪声水平</text><text x="883" y="526" font-size="36" fill="#586d80" font-weight="400">+</text><rect x="923" y="457" width="413" height="124" fill="#fff" stroke="#c36b24" rx="16"/><text x="941" y="489" font-size="23" fill="#c36b24" font-weight="700">随机项</text><text x="941" y="522" font-size="19" fill="#18334c" font-weight="400">σ_s · z；仅 σ_s=0 时不再加噪</text><text x="941" y="551" font-size="19" fill="#18334c" font-weight="400">初始 ε 仍可使整条链具有随机性</text><text x="54" y="616" font-size="21" fill="#7750ad" font-weight="700">监督来自定位损失：focal 分类 + SmoothL1 边界；未额外用噪声 MSE 当核心目标。</text><rect x="28" y="665" width="1344" height="315" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="699" font-size="24" fill="#18334c" font-weight="700">03  两个输出头：哪里可疑，以及区间从哪里到哪里</text><rect x="52" y="730" width="300" height="142" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="762" font-size="23" fill="#2376c5" font-weight="700">各尺度每个位置</text><text x="70" y="795" font-size="19" fill="#18334c" font-weight="400">置信分数 p</text><text x="70" y="824" font-size="19" fill="#18334c" font-weight="400">左边界距离 d⁻</text><text x="70" y="853" font-size="19" fill="#18334c" font-weight="400">右边界距离 d⁺</text><path d="M352,800 L411,800" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><text x="448" y="733" font-size="22" fill="#18334c" font-weight="700">例：u = 21 s，d⁻ = 3 s，d⁺ = 3 s</text><path d="M440,807 L1305,807" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><path d="M470,799 L470,817" stroke="#18334c" stroke-width="2"/><text x="460" y="845" font-size="18" fill="#18334c" font-weight="400">17 s</text><path d="M570,799 L570,817" stroke="#18334c" stroke-width="2"/><text x="560" y="845" font-size="18" fill="#18334c" font-weight="400">18 s</text><path d="M870,799 L870,817" stroke="#18334c" stroke-width="2"/><text x="860" y="845" font-size="18" fill="#18334c" font-weight="400">21 s</text><path d="M1170,799 L1170,817" stroke="#18334c" stroke-width="2"/><text x="1160" y="845" font-size="18" fill="#18334c" font-weight="400">24 s</text><path d="M1270,799 L1270,817" stroke="#18334c" stroke-width="2"/><text x="1260" y="845" font-size="18" fill="#18334c" font-weight="400">25 s</text><rect x="570" y="770" width="600" height="26" fill="#b9e8d9" stroke="#17816c" rx="3"/><text x="730" y="760" font-size="20" fill="#17816c" font-weight="400">真值 / 紧贴预测：[18,24]</text><rect x="470" y="872" width="800" height="24" fill="#f7dfc9" stroke="#c36b24" rx="3"/><text x="588" y="927" font-size="22" fill="#c36b24" font-weight="700">宽预测 [17,25]：tIoU = 6 / 8 = 0.75，而不是 1.0</text><text x="442" y="959" font-size="18" fill="#586d80" font-weight="400">候选需按置信排序并处理重叠；精确后处理与训练/推理随机性需查实现。</text><text x="36" y="1017" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1320" viewBox="0 0 1400 1320" role="img" aria-labelledby="title desc"><title id="title">C-Flat Turbo ｜测量四个点，缓存两类修正</title><desc id="desc">依据正文 §3 与补充 Algorithm 1；向量与统计数值为教学例子，未训练模型。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1320" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">C-Flat Turbo ｜测量四个点，缓存两类修正</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据正文 §3 与补充 Algorithm 1；向量与统计数值为教学例子，未训练模型。</text><rect x="28" y="115" width="1344" height="290" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  完整 C-Flat：四个梯度读数，最后只更新原参数一次</text><rect x="52" y="178" width="285" height="160" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="210" font-size="23" fill="#2376c5" font-weight="700">原点 θ</text><text x="70" y="243" font-size="19" fill="#18334c" font-weight="400">g = ∇L(θ)</text><text x="70" y="272" font-size="19" fill="#18334c" font-weight="400">第 1 次反向</text><text x="70" y="301" font-size="19" fill="#18334c" font-weight="400">ε₀ = ρ g / ‖g‖</text><rect x="386" y="178" width="285" height="160" fill="#fff" stroke="#17816c" rx="16"/><text x="404" y="210" font-size="23" fill="#17816c" font-weight="700">SAM 点 θ + ε₀</text><text x="404" y="243" font-size="19" fill="#18334c" font-weight="400">gₛ = ∇L(θ + ε₀)</text><text x="404" y="272" font-size="19" fill="#18334c" font-weight="400">第 2 次反向</text><text x="404" y="301" font-size="19" fill="#18334c" font-weight="400">d = gₛ − g</text><rect x="720" y="178" width="285" height="160" fill="#fff" stroke="#c36b24" rx="16"/><text x="738" y="210" font-size="23" fill="#c36b24" font-weight="700">代理点 θ + ε₁</text><text x="738" y="243" font-size="19" fill="#18334c" font-weight="400">ε₁ = ρ d / ‖d‖</text><text x="738" y="272" font-size="19" fill="#18334c" font-weight="400">g₀ = ∇L(θ + ε₁)</text><text x="738" y="301" font-size="19" fill="#18334c" font-weight="400">第 3 次反向</text><rect x="1054" y="178" width="285" height="160" fill="#fff" stroke="#7750ad" rx="16"/><text x="1072" y="210" font-size="23" fill="#7750ad" font-weight="700">代理点再扰动</text><text x="1072" y="243" font-size="19" fill="#18334c" font-weight="400">沿 g₀ 方向扰动</text><text x="1072" y="272" font-size="19" fill="#18334c" font-weight="400">测 g₁：第 4 次反向</text><text x="1072" y="301" font-size="19" fill="#18334c" font-weight="400">g_f = g₁ − g₀</text><path d="M337,250 L379,250" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><path d="M671,250 L713,250" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><path d="M1005,250 L1047,250" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><text x="70" y="378" font-size="21" fill="#18334c" font-weight="700">完整方向 u = gₛ + λ(g₁ − g₀)；代理点从 θ 出发，不叠加 ε₀；附录差分步长 ρ′ 与权重需配套。</text><rect x="28" y="429" width="1344" height="330" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="463" font-size="24" fill="#18334c" font-weight="700">02  投影例子：只缓存垂直分量；下一步方向改变就可能失效</text><path d="M100,690 L370,690" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><path d="M100,690 L100,540" fill="none" stroke="#c36b24" stroke-width="3" marker-end="url(#c36b24)" /><path d="M100,690 L250,540" fill="none" stroke="#7750ad" stroke-width="3" marker-end="url(#7750ad)" /><path d="M250,690 L250,540" fill="none" stroke="#17816c" stroke-width="3" marker-end="url(#17816c)" stroke-dasharray="9 6"/><text x="150" y="724" font-size="20" fill="#2376c5" font-weight="400">g₀ = (2, 0)</text><text x="110" y="514" font-size="20" fill="#c36b24" font-weight="400">v_f = (0, 2)</text><text x="265" y="548" font-size="20" fill="#7750ad" font-weight="400">g_f = (1, 2)</text><text x="195" y="680" font-size="18" fill="#17816c" font-weight="400">投影 (1, 0)</text><rect x="502" y="494" width="385" height="206" fill="#fff" stroke="#17816c" rx="16"/><text x="520" y="526" font-size="23" fill="#17816c" font-weight="700">从 g_f 去掉沿 g₀ 的部分</text><text x="520" y="559" font-size="19" fill="#18334c" font-weight="400">v_f = g_f − proj(g_f | g₀)</text><text x="520" y="588" font-size="19" fill="#18334c" font-weight="400">(1, 2) − (1, 0) = (0, 2)</text><text x="520" y="617" font-size="19" fill="#18334c" font-weight="400">缓存项范数 = β ‖当前 g₀‖</text><text x="520" y="646" font-size="19" fill="#18334c" font-weight="400">β = 0.8 → 缩放缓存 (0, 1.6)</text><text x="520" y="675" font-size="19" fill="#18334c" font-weight="400">代理平坦方向 = (2, 1.6)</text><rect x="936" y="494" width="400" height="206" fill="#fff" stroke="#c36b24" rx="16"/><text x="954" y="526" font-size="23" fill="#c36b24" font-weight="700">方向变化的反例</text><text x="954" y="559" font-size="19" fill="#18334c" font-weight="400">若下一步 g₀ 变成 (0, 2)</text><text x="954" y="588" font-size="19" fill="#18334c" font-weight="400">旧 v_f = (0, 2) 与它平行</text><text x="954" y="617" font-size="19" fill="#18334c" font-weight="400">点积 = 4，已不再正交</text><text x="954" y="646" font-size="19" fill="#18334c" font-weight="400">慢变化是经验，不是恒等式</text><text x="954" y="675" font-size="19" fill="#18334c" font-weight="400">首次缓存 / 重置规则需源码核对</text><rect x="28" y="783" width="1344" height="245" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="817" font-size="24" fill="#18334c" font-weight="700">03  k = 5 的时间轴：缓存步仍计算 g 与 g₀</text><rect x="65" y="850" width="185" height="98" fill="#edf3ff" stroke="#2376c5" rx="16"/><text x="80" y="879" font-size="21" fill="#2376c5" font-weight="700">刷新</text><text x="80" y="915" font-size="22" fill="#18334c" font-weight="400">4 次反向</text><rect x="278" y="850" width="185" height="98" fill="#eaf7f2" stroke="#17816c" rx="16"/><text x="293" y="879" font-size="21" fill="#17816c" font-weight="700">缓存</text><text x="293" y="915" font-size="22" fill="#18334c" font-weight="400">2 次反向</text><rect x="491" y="850" width="185" height="98" fill="#eaf7f2" stroke="#17816c" rx="16"/><text x="506" y="879" font-size="21" fill="#17816c" font-weight="700">缓存</text><text x="506" y="915" font-size="22" fill="#18334c" font-weight="400">2 次反向</text><rect x="704" y="850" width="185" height="98" fill="#eaf7f2" stroke="#17816c" rx="16"/><text x="719" y="879" font-size="21" fill="#17816c" font-weight="700">缓存</text><text x="719" y="915" font-size="22" fill="#18334c" font-weight="400">2 次反向</text><rect x="917" y="850" width="185" height="98" fill="#eaf7f2" stroke="#17816c" rx="16"/><text x="932" y="879" font-size="21" fill="#17816c" font-weight="700">缓存</text><text x="932" y="915" font-size="22" fill="#18334c" font-weight="400">2 次反向</text><rect x="1130" y="850" width="185" height="98" fill="#edf3ff" stroke="#2376c5" rx="16"/><text x="1145" y="879" font-size="21" fill="#2376c5" font-weight="700">刷新</text><text x="1145" y="915" font-size="22" fill="#18334c" font-weight="400">4 次反向</text><text x="67" y="986" font-size="22" fill="#18334c" font-weight="700">两门均触发时：平均 (4 + 4×2) / 5 = 2.4 次反向；对比完整路径少 40%，不是每步一次。</text><rect x="28" y="1052" width="1344" height="215" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="1086" font-size="24" fill="#18334c" font-weight="700">04  两道统计门：比较范数平方，再决定是否加正则</text><rect x="55" y="1113" width="600" height="121" fill="#fff" stroke="#2376c5" rx="16"/><text x="73" y="1145" font-size="23" fill="#2376c5" font-weight="700">sharpness 门看 ‖g‖²；flatness 门看 ‖g₀‖²</text><text x="73" y="1178" font-size="19" fill="#18334c" font-weight="400">μ ← 0.9 μ + 0.1 x；σ ← 0.9 σ + 0.1(x − μ)²</text><text x="73" y="1207" font-size="19" fill="#18334c" font-weight="400">示例：μ旧=1、σ旧=.01、x=4 → 阈值 2.038</text><rect x="705" y="1113" width="632" height="121" fill="#fff" stroke="#c36b24" rx="16"/><text x="723" y="1145" font-size="23" fill="#c36b24" font-weight="700">原文执行缺口与统计量量纲必须保留</text><text x="723" y="1178" font-size="19" fill="#18334c" font-weight="400">σ 像方差，却直接与 μ 相加；不可自作主张开平方</text><text x="723" y="1207" font-size="19" fill="#18334c" font-weight="400">代理点及统计更新时序有缺口，正文逐项说明</text><text x="36" y="1297" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>
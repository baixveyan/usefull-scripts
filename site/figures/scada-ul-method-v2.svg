<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1230" viewBox="0 0 1400 1230" role="img" aria-labelledby="title desc"><title id="title">SCADA-UL ｜先激活遗忘响应，再交替改写模型行为</title><desc id="desc">依据原文 Fig.3、Algorithm 1、式3–8，PDF 4–6；概率和梯度为教学例子，未训练模型。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1230" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">SCADA-UL ｜先激活遗忘响应，再交替改写模型行为</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据原文 Fig.3、Algorithm 1、式3–8，PDF 4–6；概率和梯度为教学例子，未训练模型。</text><rect x="28" y="115" width="1344" height="205" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  起点是源模型与无标签目标数据；不是取得源训练集</text><rect x="52" y="179" width="380" height="112" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="211" font-size="23" fill="#2376c5" font-weight="700">源权重 w_S → 当前 w</text><text x="70" y="244" font-size="19" fill="#18334c" font-weight="400">已知当前遗忘类别 c_F</text><text x="70" y="273" font-size="19" fill="#18334c" font-weight="400">多类别请求需循环处理</text><rect x="493" y="179" width="395" height="112" fill="#fff" stroke="#17816c" rx="16"/><text x="511" y="211" font-size="23" fill="#17816c" font-weight="700">目标保留数据 D_r^T</text><text x="511" y="244" font-size="19" fill="#18334c" font-weight="400">无标签；支撑域适配损失</text><text x="511" y="273" font-size="19" fill="#18334c" font-weight="400">真实遗忘训练图片不可用</text><rect x="949" y="179" width="387" height="112" fill="#fff" stroke="#c36b24" rx="16"/><text x="967" y="211" font-size="23" fill="#c36b24" font-weight="700">评价与训练数据分开</text><text x="967" y="244" font-size="19" fill="#18334c" font-weight="400">研究可另持遗忘测试集</text><text x="967" y="273" font-size="19" fill="#18334c" font-weight="400">理想重训只是参照目标</text><rect x="28" y="345" width="1344" height="345" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="379" font-size="24" fill="#18334c" font-weight="700">02  每轮交替更新：输入步与模型步固定的变量正好相反</text><rect x="52" y="411" width="355" height="158" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="443" font-size="23" fill="#2376c5" font-weight="700">A  固定模型，优化输入 x̂</text><text x="70" y="476" font-size="19" fill="#18334c" font-weight="400">噪声初始化 → 合成输入</text><text x="70" y="505" font-size="19" fill="#18334c" font-weight="400">最小化 CE(f_w(x̂), c_F)</text><text x="70" y="534" font-size="19" fill="#18334c" font-weight="400">激活当前遗忘类的模型响应</text><text x="70" y="563" font-size="19" fill="#18334c" font-weight="400">高置信度不保证是真实自然图</text><path d="M407,482 L470,482" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="480" y="411" width="385" height="158" fill="#fff" stroke="#7750ad" rx="16"/><text x="498" y="443" font-size="23" fill="#7750ad" font-weight="700">B  固定输入，计算软标签 q</text><text x="498" y="476" font-size="19" fill="#18334c" font-weight="400">p = softmax(f_w(x̂))</text><text x="498" y="505" font-size="19" fill="#18334c" font-weight="400">q_F = 0；其他 q_i = p_i/(1−p_F)</text><text x="498" y="534" font-size="19" fill="#18334c" font-weight="400">保留其余类别的相对概率</text><text x="498" y="563" font-size="19" fill="#18334c" font-weight="400">若 p_F 接近1，数值处理需查代码</text><path d="M865,482 L928,482" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="938" y="411" width="398" height="158" fill="#fff" stroke="#17816c" rx="16"/><text x="956" y="443" font-size="23" fill="#17816c" font-weight="700">C  固定 x̂ 与 q，更新模型 w</text><text x="956" y="476" font-size="19" fill="#18334c" font-weight="400">L = L_SFDA(D_r^T) + λ CE(f_w(x̂),q)</text><text x="956" y="505" font-size="19" fill="#18334c" font-weight="400">目标域适配与遗忘联合更新</text><text x="956" y="534" font-size="19" fill="#18334c" font-weight="400">不能把三步合成同一次变量更新</text><text x="956" y="563" font-size="19" fill="#18334c" font-weight="400">q的梯度停止方式需核对实现</text><path d="M1130 569 L1130 640 L225 640 L225 576" fill="none" stroke="#c36b24" stroke-width="3" marker-end="url(#c36b24)" /><text x="465" y="627" font-size="22" fill="#c36b24" font-weight="700">更新模型后，再优化输入并重新计算软标签</text><rect x="28" y="715" width="1344" height="210" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="749" font-size="24" fill="#18334c" font-weight="700">03  教学例子：把遗忘类质量移给其他类，而非均匀乱标</text><rect x="52" y="780" width="380" height="120" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="812" font-size="23" fill="#2376c5" font-weight="700">当前概率 p</text><text x="70" y="845" font-size="19" fill="#18334c" font-weight="400">遗忘类 / 类A / 类B</text><text x="70" y="874" font-size="19" fill="#18334c" font-weight="400">(0.80, 0.12, 0.08)</text><path d="M432,838 L484,838" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="494" y="780" width="395" height="120" fill="#fff" stroke="#7750ad" rx="16"/><text x="512" y="812" font-size="23" fill="#7750ad" font-weight="700">重缩放标签 q</text><text x="512" y="845" font-size="19" fill="#18334c" font-weight="400">(0, 0.60, 0.40)</text><text x="512" y="874" font-size="19" fill="#18334c" font-weight="400">类A : 类B 仍是 3 : 2</text><path d="M889,838 L941,838" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="951" y="780" width="385" height="120" fill="#fff" stroke="#17816c" rx="16"/><text x="969" y="812" font-size="23" fill="#17816c" font-weight="700">固定 q 时的 logit 梯度</text><text x="969" y="845" font-size="19" fill="#18334c" font-weight="400">p − q = (0.80, −0.48, −0.32)</text><text x="969" y="874" font-size="19" fill="#18334c" font-weight="400">梯度和为0；此为独立代数核查</text><rect x="28" y="950" width="1344" height="215" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="984" font-size="24" fill="#18334c" font-weight="700">04  多类别与安全结论：这些边界不能由一个低指标跳过</text><text x="55" y="1017" font-size="23" fill="#18334c" font-weight="700">本轮 q 只清零当前 c_F；其他遗忘类仍可能在补集里，不能直接画成最终保留类分布。</text><text x="55" y="1064" font-size="22" fill="#c36b24" font-weight="400">遗忘准确率为0也可能来自模型崩溃；需要同时看保留准确率、基线与具体攻击评价。</text><text x="55" y="1111" font-size="21" fill="#586d80" font-weight="400">定理针对特定末层与假设；近似后验不是精确重训证明，MIA结果也不是普遍隐私保证。</text><text x="36" y="1207" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>
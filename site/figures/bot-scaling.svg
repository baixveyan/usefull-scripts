<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">BoT：缩小取低频，扩大补零后合成</title><desc id="desc">把参数看成信号是一种有效初始化假设；丢失高频后不再保持完整原函数。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#6e8a83"/></marker><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#dde6dd"/></pattern></defs><rect width="1200" height="660" rx="20" fill="#fafcf8"/><rect y="110" width="1200" height="490" fill="url(#dots)"/><g font-family="Inter,Segoe UI,Microsoft YaHei,sans-serif"><text x="40" y="38" fill="#688279" font-size="11" font-weight="650">PAPER ATLAS / METHOD EXPLAINED</text><text x="40" y="75" fill="#1f3d34" font-size="28" font-weight="650">BoT：缩小取低频，扩大补零后合成</text><text x="40" y="103" fill="#71867e" font-size="13" font-weight="400">把参数看成信号是一种有效初始化假设；丢失高频后不再保持完整原函数。</text><rect x="40" y="150" width="290" height="145" rx="14" fill="#e7effb" stroke="#3b6fba" stroke-opacity=".25"/><text x="60" y="182" fill="#3b6fba" font-size="18" font-weight="650">按功能跨层堆叠权重</text><text x="60" y="211" fill="#253d3c" font-size="14" font-weight="400">Wqkv / Wo / Wf1 / Wf2</text><text x="60" y="236" fill="#253d3c" font-size="14" font-weight="400">层数 × 输入维 × 输出维</text><text x="60" y="261" fill="#253d3c" font-size="14" font-weight="400">先建立源与目标的 shape 表</text><rect x="430" y="150" width="310" height="145" rx="14" fill="#e5f3ec" stroke="#237958" stroke-opacity=".25"/><text x="450" y="182" fill="#237958" font-size="18" font-weight="650">L2S：3D-DWT</text><text x="450" y="211" fill="#253d3c" font-size="14" font-weight="400">1 个低频 cA + 7 个细节 cD</text><text x="450" y="236" fill="#253d3c" font-size="14" font-weight="400">保留匹配目标形状的低频</text><text x="450" y="261" fill="#253d3c" font-size="14" font-weight="400">拆回较小网络 → 继续训练</text><path d="M330 220 L430 220" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="865" y="165" width="55" height="45" rx="5" fill="#73b69c"/><text x="871" y="192" fill="#253d3c" font-size="12" font-weight="400">cA</text><rect x="930" y="165" width="55" height="45" rx="5" fill="#d9e2e9"/><text x="936" y="192" fill="#253d3c" font-size="12" font-weight="400">cD</text><rect x="995" y="165" width="55" height="45" rx="5" fill="#d9e2e9"/><text x="1001" y="192" fill="#253d3c" font-size="12" font-weight="400">cD</text><rect x="1060" y="165" width="55" height="45" rx="5" fill="#d9e2e9"/><text x="1066" y="192" fill="#253d3c" font-size="12" font-weight="400">cD</text><rect x="865" y="220" width="55" height="45" rx="5" fill="#d9e2e9"/><text x="871" y="247" fill="#253d3c" font-size="12" font-weight="400">cD</text><rect x="930" y="220" width="55" height="45" rx="5" fill="#d9e2e9"/><text x="936" y="247" fill="#253d3c" font-size="12" font-weight="400">cD</text><rect x="995" y="220" width="55" height="45" rx="5" fill="#d9e2e9"/><text x="1001" y="247" fill="#253d3c" font-size="12" font-weight="400">cD</text><rect x="1060" y="220" width="55" height="45" rx="5" fill="#d9e2e9"/><text x="1066" y="247" fill="#253d3c" font-size="12" font-weight="400">cD</text><text x="860" y="315" fill="#253d3c" font-size="14" font-weight="400">只有全部子带保留才可逆</text><rect x="430" y="420" width="310" height="145" rx="14" fill="#f0eafa" stroke="#7753a8" stroke-opacity=".25"/><text x="450" y="452" fill="#7753a8" font-size="18" font-weight="650">S2L：3D-IDWT</text><text x="450" y="481" fill="#253d3c" font-size="14" font-weight="400">小模型权重作为 cA</text><text x="450" y="506" fill="#253d3c" font-size="14" font-weight="400">7 个细节子带补零</text><text x="450" y="531" fill="#253d3c" font-size="14" font-weight="400">合成大网络 → 继续训练</text><rect x="40" y="420" width="290" height="145" rx="14" fill="#e7effb" stroke="#3b6fba" stroke-opacity=".25"/><text x="60" y="452" fill="#3b6fba" font-size="18" font-weight="650">已有小模型权重</text><text x="60" y="481" fill="#253d3c" font-size="14" font-weight="400">作为低分辨率初始化</text><text x="60" y="506" fill="#253d3c" font-size="14" font-weight="400">不是生成新训练知识</text><text x="60" y="531" fill="#253d3c" font-size="14" font-weight="400">形状、边界及归一化需核验</text><path d="M330 490 L430 490" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="850" y="420" width="305" height="145" rx="14" fill="#fff1df" stroke="#aa6b29" stroke-opacity=".25"/><text x="870" y="452" fill="#aa6b29" font-size="18" font-weight="650">免训练的是迁移算子</text><text x="870" y="481" fill="#253d3c" font-size="14" font-weight="400">目标仍需预训练 / 微调</text><text x="870" y="506" fill="#253d3c" font-size="14" font-weight="400">源模型训练成本单独计入</text><text x="870" y="531" fill="#253d3c" font-size="14" font-weight="400">不保证任意尺寸 / 架构兼容</text><path d="M740 490 L850 490" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M40 606H1160" stroke="#dae5dc"/><text x="40" y="631" fill="#71867e" font-size="12" font-weight="400">依据原论文 Fig.2 / §3 重绘；子带示意未对应实际内存布局，任意尺寸处理待核验。</text><text x="1000" y="631" fill="#71867e" font-size="11" font-weight="400">原创概念重绘 · 非原图</text></g></svg>
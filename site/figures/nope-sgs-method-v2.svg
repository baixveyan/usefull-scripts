<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1240" viewBox="0 0 1400 1240" role="img" aria-labelledby="title desc"><title id="title">Nope-SGS ｜先稳定脉冲监督，再交替校正相机与高斯场</title><desc id="desc">依据原文 Fig.2–3、式5–18、§3，PDF 3–5；空间均值、方差与偏差为教学构造。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1240" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">Nope-SGS ｜先稳定脉冲监督，再交替校正相机与高斯场</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据原文 Fig.2–3、式5–18、§3，PDF 3–5；空间均值、方差与偏差为教学构造。</text><rect x="28" y="115" width="1344" height="260" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  积分触发的脉冲：用同刻邻域统计，换取更稳定监督</text><rect x="52" y="179" width="380" height="175" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="211" font-size="23" fill="#2376c5" font-weight="700">光电流积分 → 阈值触发</text><text x="70" y="244" font-size="19" fill="#18334c" font-weight="400">初始相位 V_x 影响单格0/1</text><text x="70" y="273" font-size="19" fill="#18334c" font-weight="400">p = 积分光电流 / φ，须落在[0,1]</text><text x="70" y="302" font-size="19" fill="#18334c" font-weight="400">不是瞬时强度的固定阈值比较</text><text x="70" y="331" font-size="19" fill="#18334c" font-weight="400">场景静态，相机可高速运动</text><path d="M432,258 L484,258" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="494" y="179" width="395" height="175" fill="#fff" stroke="#17816c" rx="16"/><text x="512" y="211" font-size="23" fill="#17816c" font-weight="700">NBDS：同刻 M 像素平均</text><text x="512" y="244" font-size="19" fill="#18334c" font-weight="400">近似独立、同p时 Var=p(1−p)/M</text><text x="512" y="273" font-size="19" fill="#18334c" font-weight="400">教学 p=.25、M=16 → Var=.01172</text><text x="512" y="302" font-size="19" fill="#18334c" font-weight="400">标准差降为1/4，不是方差1/4</text><text x="512" y="331" font-size="19" fill="#18334c" font-weight="400">空间邻域与时间累积不能混用</text><path d="M889,258 L941,258" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="951" y="179" width="385" height="175" fill="#fff" stroke="#c36b24" rx="16"/><text x="969" y="211" font-size="23" fill="#c36b24" font-weight="700">方差下降有前提</text><text x="969" y="244" font-size="19" fill="#18334c" font-weight="400">边缘 p不同，得到局部均值</text><text x="969" y="273" font-size="19" fill="#18334c" font-weight="400">教学 .1/.1/.9/.9 → 平均.5</text><text x="969" y="302" font-size="19" fill="#18334c" font-weight="400">不是每个中心像素都无偏</text><text x="969" y="331" font-size="19" fill="#18334c" font-weight="400">正相关会削弱理想降噪收益</text><rect x="28" y="400" width="1344" height="250" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="434" font-size="24" fill="#18334c" font-weight="700">02  初始化与位姿：渲染也要池化，再比较跨帧变化</text><rect x="52" y="466" width="380" height="165" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="498" font-size="23" fill="#2376c5" font-weight="700">触发间隔图 → MVS先验</text><text x="70" y="531" font-size="19" fill="#18334c" font-weight="400">粗高斯 G + 稀疏位姿轨迹</text><text x="70" y="560" font-size="19" fill="#18334c" font-weight="400">Lie代数插值 → 稠密初轨迹</text><text x="70" y="589" font-size="19" fill="#18334c" font-weight="400">无精确位姿 ≠ 没有初始化</text><text x="70" y="618" font-size="19" fill="#18334c" font-weight="400">单目坐标尺度仍需对齐</text><path d="M432,544 L484,544" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="494" y="466" width="395" height="165" fill="#fff" stroke="#7750ad" rx="16"/><text x="512" y="498" font-size="23" fill="#7750ad" font-weight="700">固定场景，优化相机轨迹</text><text x="512" y="531" font-size="19" fill="#18334c" font-weight="400">池化渲染 Ĉ_k 与 NBDS Ŝ_k 同尺度</text><text x="512" y="560" font-size="19" fill="#18334c" font-weight="400">r_nbds = Ĉ_k − Ŝ_k</text><text x="512" y="589" font-size="19" fill="#18334c" font-weight="400">r_sub = r_k − r_(k−n)</text><text x="512" y="618" font-size="19" fill="#18334c" font-weight="400">参考帧的共同偏置可能相互抵消</text><path d="M889,544 L941,544" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="951" y="466" width="385" height="165" fill="#fff" stroke="#17816c" rx="16"/><text x="969" y="498" font-size="23" fill="#17816c" font-weight="700">按当前误差筛选关键帧</text><text x="969" y="531" font-size="19" fill="#18334c" font-weight="400">F_key：NBDS误差高于阈值</text><text x="969" y="560" font-size="19" fill="#18334c" font-weight="400">F_pose：差分误差高于阈值</text><text x="969" y="589" font-size="19" fill="#18334c" font-weight="400">相机阶段用 F_pose</text><text x="969" y="618" font-size="19" fill="#18334c" font-weight="400">场景阶段用 F_pose ∩ F_key</text><rect x="28" y="675" width="1344" height="270" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="709" font-size="24" fill="#18334c" font-weight="700">03  固定轨迹，更新高斯场景；空间与时间两种监督一起用</text><rect x="52" y="743" width="380" height="175" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="775" font-size="23" fill="#2376c5" font-weight="700">NBDS监督</text><text x="70" y="808" font-size="19" fill="#18334c" font-weight="400">空间平均更稳定</text><text x="70" y="837" font-size="19" fill="#18334c" font-weight="400">渲染与观测需要相同pooling</text><text x="70" y="866" font-size="19" fill="#18334c" font-weight="400">高频边缘可能被平滑</text><text x="70" y="895" font-size="19" fill="#18334c" font-weight="400">关键帧空集退化需查实现</text><rect x="494" y="743" width="395" height="175" fill="#fff" stroke="#c36b24" rx="16"/><text x="512" y="775" font-size="23" fill="#c36b24" font-weight="700">时间累积监督</text><text x="512" y="808" font-size="19" fill="#18334c" font-weight="400">跨多个时刻累计脉冲</text><text x="512" y="837" font-size="19" fill="#18334c" font-weight="400">按各时刻位姿渲染再累计</text><text x="512" y="866" font-size="19" fill="#18334c" font-weight="400">不能只拿一张中央渲染硬比</text><text x="512" y="895" font-size="19" fill="#18334c" font-weight="400">时间窗口与相机运动需对齐</text><rect x="951" y="743" width="385" height="175" fill="#fff" stroke="#7750ad" rx="16"/><text x="969" y="775" font-size="23" fill="#7750ad" font-weight="700">联合场景损失 + 下一轮</text><text x="969" y="808" font-size="19" fill="#18334c" font-weight="400">L = λ_a L_acc + λ_n L_nbds</text><text x="969" y="837" font-size="19" fill="#18334c" font-weight="400">a=acc，n=nbds；场景 / 相机交替</text><text x="969" y="866" font-size="19" fill="#18334c" font-weight="400">作者每轮：位姿500步、场景1000步</text><text x="969" y="895" font-size="19" fill="#18334c" font-weight="400">优化轮数和每轮时长分别记录</text><rect x="28" y="970" width="1344" height="205" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="1004" font-size="24" fill="#18334c" font-weight="700">04  公式与评价边界：不把近似和伪真值画成物理保证</text><text x="55" y="1037" font-size="22" fill="#18334c" font-weight="700">式18写正号SSIM：若指标准相似度，最小化方向有歧义；需查实现是否采用结构损失。</text><text x="55" y="1082" font-size="22" fill="#c36b24" font-weight="400">差分残差小不证明绝对几何正确；平均无偏不覆盖任意边缘，深度伪真值也不是实测。</text><text x="55" y="1127" font-size="21" fill="#586d80" font-weight="400">本图方差与概率全为独立教学算例；未采集传感器数据、未运行MVS或3DGS。</text><text x="36" y="1217" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1250" viewBox="0 0 1400 1250" role="img" aria-labelledby="title desc"><title id="title">3DiMo ｜把动作语义接进视频生成器，再用换视角训练它</title><desc id="desc">依据原文 Fig.2–3、§3.1–3.3，PDF 3–6；阶段步数为作者配置，注意力尺寸为教学例子。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1250" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">3DiMo ｜把动作语义接进视频生成器，再用换视角训练它</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据原文 Fig.2–3、§3.1–3.3，PDF 3–6；阶段步数为作者配置，注意力尺寸为教学例子。</text><rect x="28" y="115" width="1344" height="310" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  三路条件不同：动作、参考人物、文字运镜</text><rect x="52" y="178" width="350" height="158" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="210" font-size="23" fill="#2376c5" font-weight="700">驱动帧 → 双通路编码</text><text x="70" y="243" font-size="19" fill="#18334c" font-weight="400">训练：透视 / 外观增强</text><text x="70" y="272" font-size="19" fill="#18334c" font-weight="400">身体 E_b + 手部 E_h</text><text x="70" y="301" font-size="19" fill="#18334c" font-weight="400">patch与可学习latent交互</text><text x="70" y="330" font-size="19" fill="#18334c" font-weight="400">保留latent输出，拼接 z_b / z_h</text><path d="M402,253 L464,253" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="474" y="178" width="382" height="158" fill="#fff" stroke="#7750ad" rx="16"/><text x="492" y="210" font-size="23" fill="#7750ad" font-weight="700">新增动作 cross-attention</text><text x="492" y="243" font-size="19" fill="#18334c" font-weight="400">Q 来自视频；K/V 来自动作</text><text x="492" y="272" font-size="19" fill="#18334c" font-weight="400">视频 N_v × 动作 N_m 的注意力</text><text x="492" y="301" font-size="19" fill="#18334c" font-weight="400">这个新增子层不更新文字token</text><text x="492" y="330" font-size="19" fill="#18334c" font-weight="400">不要求动作token逐像素对齐</text><path d="M856,253 L919,253" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="929" y="178" width="407" height="158" fill="#fff" stroke="#17816c" rx="16"/><text x="947" y="210" font-size="23" fill="#17816c" font-weight="700">DiT视频主干 → VAE解码</text><text x="947" y="243" font-size="19" fill="#18334c" font-weight="400">参考图latent与加噪视频拼接</text><text x="947" y="272" font-size="19" fill="#18334c" font-weight="400">文字走主干原有交互机制</text><text x="947" y="301" font-size="19" fill="#18334c" font-weight="400">各层动作读取与主干交互配合</text><text x="947" y="330" font-size="19" fill="#18334c" font-weight="400">输出视频，不输出精确相机轨迹</text><text x="55" y="385" font-size="21" fill="#586d80" font-weight="400">每帧 K=5 描述单个tokenizer的latent；双手组织和时域打包未全披露，勿擅算总token数。</text><rect x="28" y="450" width="1344" height="230" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="484" font-size="24" fill="#18334c" font-weight="700">02  跨视角监督：必须是相同动作，而不是任意两段视频</text><rect x="52" y="518" width="380" height="130" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="550" font-size="23" fill="#2376c5" font-weight="700">驱动：相机 A 的动作</text><text x="70" y="583" font-size="19" fill="#18334c" font-weight="400">例如：正面观察抬右手</text><text x="70" y="612" font-size="19" fill="#18334c" font-weight="400">编码器提取可迁移动作线索</text><text x="70" y="641" font-size="19" fill="#18334c" font-weight="400">不把A的二维坐标直接画到B</text><path d="M432,581 L484,581" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="494" y="518" width="395" height="130" fill="#fff" stroke="#17816c" rx="16"/><text x="512" y="550" font-size="23" fill="#17816c" font-weight="700">目标：相机 B 的同一动作</text><text x="512" y="583" font-size="19" fill="#18334c" font-weight="400">同步配对视频作为监督</text><text x="512" y="612" font-size="19" fill="#18334c" font-weight="400">参考图取目标B的首帧</text><text x="512" y="641" font-size="19" fill="#18334c" font-weight="400">文字也描述目标B的视角</text><path d="M889,581 L941,581" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="951" y="518" width="385" height="130" fill="#fff" stroke="#c36b24" rx="16"/><text x="969" y="550" font-size="23" fill="#c36b24" font-weight="700">学习压力来自跨视角对应</text><text x="969" y="583" font-size="19" fill="#18334c" font-weight="400">A→B再现，或A→A重建</text><text x="969" y="612" font-size="19" fill="#18334c" font-weight="400">目标与输入身份/时间需对应</text><text x="969" y="641" font-size="19" fill="#18334c" font-weight="400">好看不等于唯一恢复真实3D</text><rect x="28" y="705" width="1344" height="265" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="739" font-size="24" fill="#18334c" font-weight="700">03  训练日程：几何教师逐渐退出，跨视角任务逐渐加强</text><rect x="52" y="773" width="380" height="155" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="805" font-size="23" fill="#2376c5" font-weight="700">阶段 1 ｜10K步</text><text x="70" y="838" font-size="19" fill="#18334c" font-weight="400">仅单视角重建</text><text x="70" y="867" font-size="19" fill="#18334c" font-weight="400">SMPL / MANO姿态辅助监督</text><text x="70" y="896" font-size="19" fill="#18334c" font-weight="400">全局根朝向不参与回归</text><text x="70" y="925" font-size="19" fill="#18334c" font-weight="400">先让动作条件确实被模型使用</text><path d="M432,845 L484,845" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="494" y="773" width="395" height="155" fill="#fff" stroke="#7750ad" rx="16"/><text x="512" y="805" font-size="23" fill="#7750ad" font-weight="700">阶段 2 ｜15K步</text><text x="512" y="838" font-size="19" fill="#18334c" font-weight="400">重建 + 跨视角任务混合</text><text x="512" y="867" font-size="19" fill="#18334c" font-weight="400">几何损失权重逐步退到零</text><text x="512" y="896" font-size="19" fill="#18334c" font-weight="400">后段不再使用几何辅助损失</text><text x="512" y="925" font-size="19" fill="#18334c" font-weight="400">精确退火函数与采样比例未披露</text><path d="M889,845 L941,845" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="951" y="773" width="385" height="155" fill="#fff" stroke="#17816c" rx="16"/><text x="969" y="805" font-size="23" fill="#17816c" font-weight="700">阶段 3 ｜5K步</text><text x="969" y="838" font-size="19" fill="#18334c" font-weight="400">仅多视角与运动相机任务</text><text x="969" y="867" font-size="19" fill="#18334c" font-weight="400">不使用几何辅助损失</text><text x="969" y="896" font-size="19" fill="#18334c" font-weight="400">协调动作与文字视角变化</text><text x="969" y="925" font-size="19" fill="#18334c" font-weight="400">不等于推理时再训练30K步</text><rect x="28" y="995" width="1344" height="190" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="1029" font-size="24" fill="#18334c" font-weight="700">04  解释边界与独立接口核查</text><text x="55" y="1062" font-size="23" fill="#18334c" font-weight="700">教学尺寸：100个视频查询 × 10个动作条件 → 100×10注意力；不是实际模型配置。</text><text x="55" y="1106" font-size="22" fill="#7750ad" font-weight="400">训练步 s 控制几何退火；flow时间 τ 控制加噪/采样，两者不能合并成一个时间变量。</text><text x="55" y="1150" font-size="21" fill="#586d80" font-weight="400">小瓶颈不保证无身份/视角；后期移除几何损失，也不抹去早期学到的几何先验。</text><text x="36" y="1227" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>
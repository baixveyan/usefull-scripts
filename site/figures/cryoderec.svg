<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">cryoDeRec：以模拟真值连接去噪和缺失楔补全</title><desc id="desc">观测信息与学习先验分开：未采到的频率不是由测量唯一确定。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#6e8a83"/></marker><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#dde6dd"/></pattern></defs><rect width="1200" height="660" rx="20" fill="#fafcf8"/><rect y="110" width="1200" height="490" fill="url(#dots)"/><g font-family="Inter,Segoe UI,Microsoft YaHei,sans-serif"><text x="40" y="38" fill="#688279" font-size="11" font-weight="650">PAPER ATLAS / METHOD EXPLAINED</text><text x="40" y="75" fill="#1f3d34" font-size="28" font-weight="650">cryoDeRec：以模拟真值连接去噪和缺失楔补全</text><text x="40" y="103" fill="#71867e" font-size="13" font-weight="400">观测信息与学习先验分开：未采到的频率不是由测量唯一确定。</text><rect x="40" y="150" width="285" height="175" rx="14" fill="#e7effb" stroke="#3b6fba" stroke-opacity=".25"/><text x="60" y="182" fill="#3b6fba" font-size="18" font-weight="650">模拟成对数据</text><text x="60" y="211" fill="#253d3c" font-size="14" font-weight="400">EMDB 密度 → 干净全角度 WBP</text><text x="60" y="236" fill="#253d3c" font-size="14" font-weight="400">有限角投影 + CTF + GAN 噪声</text><text x="60" y="261" fill="#253d3c" font-size="14" font-weight="400">形成 noisy / clean 配对体积</text><text x="60" y="308" fill="#3b6fba" font-size="11" font-weight="600">训练数据包含显式干净目标</text><rect x="435" y="150" width="300" height="175" rx="14" fill="#f0eafa" stroke="#7753a8" stroke-opacity=".25"/><text x="455" y="182" fill="#7753a8" font-size="18" font-weight="650">共享 3D U-Net</text><text x="455" y="211" fill="#253d3c" font-size="14" font-weight="400">路径 A：原始 noisy patch</text><text x="455" y="236" fill="#253d3c" font-size="14" font-weight="400">路径 B：旋转 + 再遮蔽频域</text><text x="455" y="261" fill="#253d3c" font-size="14" font-weight="400">两条路径都预测干净目标</text><path d="M325 235 L435 235" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="850" y="150" width="305" height="175" rx="14" fill="#fff1df" stroke="#aa6b29" stroke-opacity=".25"/><text x="870" y="182" fill="#aa6b29" font-size="18" font-weight="650">训练目标</text><text x="870" y="211" fill="#253d3c" font-size="14" font-weight="400">L = Lfidelity + 0.1 Lrecon</text><text x="870" y="236" fill="#253d3c" font-size="14" font-weight="400">同一旋转对齐输入与目标</text><text x="870" y="261" fill="#253d3c" font-size="14" font-weight="400">缺失信息依赖结构先验</text><path d="M735 235 L850 235" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="40" y="425" width="1115" height="130" rx="14" fill="#e5f3ec" stroke="#237958" stroke-opacity=".25"/><text x="60" y="457" fill="#237958" font-size="18" font-weight="650">真实推理：倾转投影 → WBP → 切块 → 固定 U-Net → 拼接</text><text x="60" y="486" fill="#253d3c" font-size="14" font-weight="400">不重新拟合噪声 GAN；不需要真实干净体积作为输入</text><text x="60" y="511" fill="#253d3c" font-size="14" font-weight="400">背景更平滑不等于分子结构全部真实；需独立验证未观测频带</text><path d="M40 606H1160" stroke="#dae5dc"/><text x="40" y="631" fill="#71867e" font-size="12" font-weight="400">依据原论文 Fig.2 / §3 重绘；省略成像参数，真实推理不含训练 GAN。</text><text x="1000" y="631" fill="#71867e" font-size="11" font-weight="400">原创概念重绘 · 非原图</text></g></svg>
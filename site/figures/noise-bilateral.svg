<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">先噪声，再滤波：互补收益也需要严格攻击验证</title><desc id="desc">默认顺序不交换；随机性与梯度遮蔽可能让普通攻击高估鲁棒性。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#6e8a83"/></marker><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#dde6dd"/></pattern></defs><rect width="1200" height="660" rx="20" fill="#fafcf8"/><rect y="110" width="1200" height="490" fill="url(#dots)"/><g font-family="Inter,Segoe UI,Microsoft YaHei,sans-serif"><text x="40" y="38" fill="#688279" font-size="11" font-weight="650">PAPER ATLAS / METHOD EXPLAINED</text><text x="40" y="75" fill="#1f3d34" font-size="28" font-weight="650">先噪声，再滤波：互补收益也需要严格攻击验证</text><text x="40" y="103" fill="#71867e" font-size="13" font-weight="400">默认顺序不交换；随机性与梯度遮蔽可能让普通攻击高估鲁棒性。</text><rect x="40" y="190" width="220" height="145" rx="14" fill="#e7effb" stroke="#3b6fba" stroke-opacity=".25"/><text x="60" y="222" fill="#3b6fba" font-size="18" font-weight="650">输入图像 x</text><text x="60" y="251" fill="#253d3c" font-size="14" font-weight="400">干净样本或对抗样本</text><text x="60" y="276" fill="#253d3c" font-size="14" font-weight="400">统一输入尺度与范数预算</text><rect x="360" y="190" width="240" height="145" rx="14" fill="#f0eafa" stroke="#7753a8" stroke-opacity=".25"/><text x="380" y="222" fill="#7753a8" font-size="18" font-weight="650">独立高斯噪声</text><text x="380" y="251" fill="#253d3c" font-size="14" font-weight="400">ε ~ N(0, σ²I)</text><text x="380" y="276" fill="#253d3c" font-size="14" font-weight="400">使攻击需覆盖随机邻域</text><text x="380" y="301" fill="#253d3c" font-size="14" font-weight="400">训练和推理均加入</text><rect x="700" y="190" width="245" height="145" rx="14" fill="#e5f3ec" stroke="#237958" stroke-opacity=".25"/><text x="720" y="222" fill="#237958" font-size="18" font-weight="650">重复双边滤波</text><text x="720" y="251" fill="#253d3c" font-size="14" font-weight="400">空间邻近 + 强度相近</text><text x="720" y="276" fill="#253d3c" font-size="14" font-weight="400">平滑扰动并保留边缘</text><text x="720" y="301" fill="#253d3c" font-size="14" font-weight="400">训练 / 推理 K 可不同</text><path d="M260 260 L360 260" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M600 260 L700 260" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M945 260 L1020 260" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><text x="1005" y="225" fill="#253d3c" font-size="22" font-weight="400">CNN</text><text x="1005" y="295" fill="#253d3c" font-size="18" font-weight="400">类别</text><rect x="150" y="420" width="400" height="125" rx="14" fill="#e7effb" stroke="#3b6fba" stroke-opacity=".25"/><text x="170" y="452" fill="#3b6fba" font-size="18" font-weight="650">训练：适应预处理分布</text><text x="170" y="481" fill="#253d3c" font-size="14" font-weight="400">基础 CNN；或再结合 TRADES 与合成数据</text><text x="170" y="506" fill="#253d3c" font-size="14" font-weight="400">不是仅给冻结分类器套一个滤镜</text><rect x="650" y="420" width="400" height="125" rx="14" fill="#fff1df" stroke="#aa6b29" stroke-opacity=".25"/><text x="670" y="452" fill="#aa6b29" font-size="18" font-weight="650">评价：攻击必须考虑预处理</text><text x="670" y="481" fill="#253d3c" font-size="14" font-weight="400">普通攻击 + EoT + BPDA / TABPDA</text><text x="670" y="506" fill="#253d3c" font-size="14" font-weight="400">同时报告干净精度、鲁棒精度和总成本</text><path d="M40 606H1160" stroke="#dae5dc"/><text x="40" y="631" fill="#71867e" font-size="12" font-weight="400">依据原论文 §3–5 重绘；理想几何分析不等于实际模型认证鲁棒性。</text><text x="1000" y="631" fill="#71867e" font-size="11" font-weight="400">原创概念重绘 · 非原图</text></g></svg>
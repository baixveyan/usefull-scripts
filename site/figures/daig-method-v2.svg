<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1320" viewBox="0 0 1400 1320" role="img" aria-labelledby="title desc"><title id="title">DAIG ｜把少样本用于造数据，再分两阶段适应检索器</title><desc id="desc">依据原文 §3、Fig.2，PDF3–5；参数与统计数值为教学例，未生成图像或训练模型。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1320" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">DAIG ｜把少样本用于造数据，再分两阶段适应检索器</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据原文 §3、Fig.2，PDF3–5；参数与统计数值为教学例，未生成图像或训练模型。</text><rect x="28" y="115" width="1344" height="255" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  先适应生成器，再合成检索数据；最终部署只需要检索器</text><rect x="52" y="177" width="365" height="150" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="209" font-size="23" fill="#2376c5" font-weight="700">32 条真实训练三元组</text><text x="70" y="242" font-size="19" fill="#18334c" font-weight="400">参考图 | 目标图 → 左右拼接</text><text x="70" y="271" font-size="19" fill="#18334c" font-weight="400">224×448；描述含左 / 改 / 右</text><text x="70" y="300" font-size="19" fill="#18334c" font-weight="400">Flux 底座冻结，只学习增量</text><rect x="476" y="177" width="390" height="150" fill="#fff" stroke="#7750ad" rx="16"/><text x="494" y="209" font-size="23" fill="#7750ad" font-weight="700">LLM → 20k 文本三元组</text><text x="494" y="242" font-size="19" fill="#18334c" font-weight="400">对象 + 编辑 + 领域示例</text><text x="494" y="271" font-size="19" fill="#18334c" font-weight="400">生成 (Tr, Tc, Tt) 布局描述</text><text x="494" y="300" font-size="19" fill="#18334c" font-weight="400">适应后的 Flux 画左右两半</text><rect x="920" y="177" width="418" height="150" fill="#fff" stroke="#17816c" rx="16"/><text x="938" y="209" font-size="23" fill="#17816c" font-weight="700">裁切为 (Ir, Tc, It)</text><text x="938" y="242" font-size="19" fill="#18334c" font-weight="400">查询：参考 Ir + 修改 Tc</text><text x="938" y="271" font-size="19" fill="#18334c" font-weight="400">目标：右图 It</text><text x="938" y="300" font-size="19" fill="#18334c" font-weight="400">Tt 不作为额外检索查询输入</text><path d="M417,250 L469,250" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><path d="M866,250 L913,250" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="28" y="396" width="1344" height="233" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="430" font-size="24" fill="#18334c" font-weight="700">02  CIR-LoRA：描述路由多个低秩专家，而非更新整个生成模型</text><rect x="52" y="455" width="390" height="145" fill="#fff" stroke="#c36b24" rx="16"/><text x="70" y="487" font-size="23" fill="#c36b24" font-weight="700">每投影的矩阵形状</text><text x="70" y="520" font-size="19" fill="#18334c" font-weight="400">输入 l → A：r×l → B：d×r</text><text x="70" y="549" font-size="19" fill="#18334c" font-weight="400">K=2，r=32</text><text x="70" y="578" font-size="19" fill="#18334c" font-weight="400">W′ = W + β Σᵢ rᵢ Bᵢ Aᵢ</text><rect x="496" y="455" width="840" height="145" fill="#fff" stroke="#2376c5" rx="16"/><text x="514" y="487" font-size="23" fill="#2376c5" font-weight="700">参数计数示例：d=l=1024，不代表整个 Flux 配置</text><text x="514" y="520" font-size="19" fill="#18334c" font-weight="400">每专家 32×(1024+1024)=65,536；两专家 131,072</text><text x="514" y="549" font-size="19" fill="#18334c" font-weight="400">完整单矩阵 1,048,576；未含路由 MLP 与层缩放 β</text><text x="514" y="578" font-size="19" fill="#18334c" font-weight="400">路由归一化 / top 专家规则正文未完整给出，不能补猜</text><rect x="28" y="653" width="1344" height="301" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="687" font-size="24" fill="#18334c" font-weight="700">03  DRSP：token 轴取每图统计，batch 轴估计统计波动</text><rect x="52" y="714" width="400" height="180" fill="#fff" stroke="#17816c" rx="16"/><text x="70" y="746" font-size="23" fill="#17816c" font-weight="700">教学例：B=2、L=2、D=1</text><text x="70" y="779" font-size="19" fill="#18334c" font-weight="400">v₁=[1,3]，v₂=[2,6]</text><text x="70" y="808" font-size="19" fill="#18334c" font-weight="400">常规定义 μ=[2,4]、σ=[1,2]</text><text x="70" y="837" font-size="19" fill="#18334c" font-weight="400">批波动 Σμ=1、Σσ=.5</text><text x="70" y="866" font-size="19" fill="#18334c" font-weight="400">第一图噪声取1 → μ̃=3、σ̃=1.5</text><rect x="507" y="714" width="828" height="180" fill="#fff" stroke="#c36b24" rx="16"/><text x="525" y="746" font-size="23" fill="#c36b24" font-weight="700">印刷公式不同会得到不同结果：不能静默修正</text><text x="525" y="779" font-size="19" fill="#18334c" font-weight="400">第一图标准化 [-1,1]</text><text x="525" y="808" font-size="19" fill="#18334c" font-weight="400">原式4：μ̃ × 标准化 + σ̃ → [-1.5,4.5]</text><text x="525" y="837" font-size="19" fill="#18334c" font-weight="400">常见替换：σ̃ × 标准化 + μ̃ → [1.5,4.5]</text><text x="525" y="866" font-size="19" fill="#18334c" font-weight="400">式2漏平方、式4缩放/平移次序需代码核查；此处非作者运行结果</text><rect x="28" y="980" width="1344" height="290" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="1014" font-size="24" fill="#18334c" font-weight="700">04  FRA 与推理：训练只给正样本加角度；查询图库时不加标签间隔</text><rect x="52" y="1041" width="610" height="181" fill="#fff" stroke="#7750ad" rx="16"/><text x="70" y="1073" font-size="23" fill="#7750ad" font-weight="700">真实数据细调</text><text x="70" y="1106" font-size="19" fill="#18334c" font-weight="400">查询 B×d；目标 B×d → 相似度 B×B</text><text x="70" y="1135" font-size="19" fill="#18334c" font-weight="400">对角 θ = arccos(s) + φ，φ=.003</text><text x="70" y="1164" font-size="19" fill="#18334c" font-weight="400">s=.8 → 加间隔后 cosθ≈.798196</text><text x="70" y="1193" font-size="19" fill="#18334c" font-weight="400">式5把 τ 放在 cos 内，保留原文歧义</text><rect x="713" y="1041" width="622" height="181" fill="#fff" stroke="#2376c5" rx="16"/><text x="731" y="1073" font-size="23" fill="#2376c5" font-weight="700">检索推理</text><text x="731" y="1106" font-size="19" fill="#18334c" font-weight="400">关闭视觉统计扰动；不需要正样本标签</text><text x="731" y="1135" font-size="19" fill="#18334c" font-weight="400">查询 1×d；图库 G×d → G 个余弦分数</text><text x="731" y="1164" font-size="19" fill="#18334c" font-weight="400">取 top-K；生成器 / LLM 不进入链路</text><text x="731" y="1193" font-size="19" fill="#18334c" font-weight="400">“推理无新增成本”不包含前置合成和训练</text><text x="36" y="1297" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>
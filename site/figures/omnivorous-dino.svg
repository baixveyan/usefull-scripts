<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">Omnivorous DINO：多模态对齐，也保留原来的区分力</title><desc id="desc">训练是后期少层适配；共享空间不等于原始传感器信号可以直接互换。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#6e8a83"/></marker><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#dde6dd"/></pattern></defs><rect width="1200" height="660" rx="20" fill="#fafcf8"/><rect y="110" width="1200" height="490" fill="url(#dots)"/><g font-family="Inter,Segoe UI,Microsoft YaHei,sans-serif"><text x="40" y="38" fill="#688279" font-size="11" font-weight="650">PAPER ATLAS / METHOD EXPLAINED</text><text x="40" y="75" fill="#1f3d34" font-size="28" font-weight="650">Omnivorous DINO：多模态对齐，也保留原来的区分力</text><text x="40" y="103" fill="#71867e" font-size="13" font-weight="400">训练是后期少层适配；共享空间不等于原始传感器信号可以直接互换。</text><rect x="40" y="145" width="265" height="185" rx="14" fill="#e7effb" stroke="#3b6fba" stroke-opacity=".25"/><text x="60" y="177" fill="#3b6fba" font-size="18" font-weight="650">同场景三种视觉模态</text><text x="60" y="206" fill="#253d3c" font-size="14" font-weight="400">RGB / Depth / Segmentation</text><text x="60" y="231" fill="#253d3c" font-size="14" font-weight="400">深度与分割：RGB 调色板着色</text><text x="60" y="256" fill="#253d3c" font-size="14" font-weight="400">训练：再混入 0–50% RGB</text><text x="60" y="281" fill="#253d3c" font-size="14" font-weight="400">评价：不混合，但仍采用着色</text><rect x="410" y="145" width="295" height="185" rx="14" fill="#e5f3ec" stroke="#237958" stroke-opacity=".25"/><text x="430" y="177" fill="#237958" font-size="18" font-weight="650">共享学生编码器</text><text x="430" y="206" fill="#253d3c" font-size="14" font-weight="400">前 8 块冻结</text><text x="430" y="231" fill="#253d3c" font-size="14" font-weight="400">末 4 块适配（ViT-B）</text><text x="430" y="256" fill="#253d3c" font-size="14" font-weight="400">各模态共用参数</text><text x="430" y="281" fill="#253d3c" font-size="14" font-weight="400">输出归一化语义特征</text><path d="M305 235 L410 235" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="825" y="145" width="330" height="185" rx="14" fill="#f0eafa" stroke="#7753a8" stroke-opacity=".25"/><text x="845" y="177" fill="#7753a8" font-size="18" font-weight="650">双目标监督</text><text x="845" y="206" fill="#253d3c" font-size="14" font-weight="400">跨模态：同场景特征接近</text><text x="845" y="231" fill="#253d3c" font-size="14" font-weight="400">跨场景：负例保持区分</text><text x="845" y="256" fill="#253d3c" font-size="14" font-weight="400">教师锚定：减少语义漂移</text><text x="845" y="281" fill="#253d3c" font-size="14" font-weight="400">L = Lalign + 10 Lanchor</text><path d="M705 235 L825 235" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="410" y="425" width="295" height="120" rx="14" fill="#e7effb" stroke="#3b6fba" stroke-opacity=".25"/><text x="430" y="457" fill="#3b6fba" font-size="18" font-weight="650">冻结教师原 DINOv2</text><text x="430" y="486" fill="#253d3c" font-size="14" font-weight="400">同模态目标作为稳定锚点</text><text x="430" y="511" fill="#253d3c" font-size="14" font-weight="400">不更新教师参数</text><path d="M705 475 L990 330" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="7 6"/><text x="852.5" y="393.5" fill="#627b73" font-size="11" font-weight="400">锚定监督</text><text x="45" y="575" fill="#253d3c" font-size="15" font-weight="400">对齐更好不表示所有下游任务都提高；独立模态部署须核对 RGB 着色依赖。</text><path d="M40 606H1160" stroke="#dae5dc"/><text x="40" y="631" fill="#71867e" font-size="12" font-weight="400">依据原论文 Fig.2–3 / §3 重绘；图中冻结层数针对默认 ViT-B。</text><text x="1000" y="631" fill="#71867e" font-size="11" font-weight="400">原创概念重绘 · 非原图</text></g></svg>
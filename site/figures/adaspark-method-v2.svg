<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1330" viewBox="0 0 1400 1330" role="img" aria-labelledby="title desc"><title id="title">AdaSpark ｜块选择与 token 补偿的两级稀疏计算</title><desc id="desc">依据原文 §3、Fig.2，PDF3–5；尺寸与向量为教学示意，未运行模型。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1330" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">AdaSpark ｜块选择与 token 补偿的两级稀疏计算</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据原文 §3、Fig.2，PDF3–5；尺寸与向量为教学示意，未运行模型。</text><rect x="28" y="115" width="1344" height="185" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  时空 cube 是 token 网格：示例 8×8×8 → 16 块，每块 32 token</text><rect x="52" y="172" width="365" height="105" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="204" font-size="23" fill="#2376c5" font-weight="700">先编码，再分块</text><text x="70" y="237" font-size="19" fill="#18334c" font-weight="400">隐藏状态 X：512×D</text><text x="70" y="266" font-size="19" fill="#18334c" font-weight="400">示例 t×h×w = 2×4×4</text><rect x="474" y="172" width="390" height="105" fill="#fff" stroke="#17816c" rx="16"/><text x="492" y="204" font-size="23" fill="#17816c" font-weight="700">每头分别路由</text><text x="492" y="237" font-size="19" fill="#18334c" font-weight="400">一个 query：dk 维</text><text x="492" y="266" font-size="19" fill="#18334c" font-weight="400">块摘要：均值 key，仍为 dk 维</text><rect x="918" y="172" width="420" height="105" fill="#fff" stroke="#7750ad" rx="16"/><text x="936" y="204" font-size="23" fill="#7750ad" font-weight="700">没有永久删 token</text><text x="936" y="237" font-size="19" fill="#18334c" font-weight="400">稀疏计算后仍为 512×D</text><text x="936" y="266" font-size="19" fill="#18334c" font-weight="400">下一层可以重新选中旧跳过者</text><path d="M417,226 L467,226" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><path d="M864,226 L911,226" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="28" y="325" width="1344" height="328" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="359" font-size="24" fill="#18334c" font-weight="700">02  两次 softmax：先选完整块，再在真实 token 上重新归一化</text><text x="65" y="422" font-size="21" fill="#18334c" font-weight="400">C1</text><rect x="115" y="400" width="270.0" height="30" fill="#2376c5" stroke="#fff" rx="3"/><text x="410" y="422" font-size="21" fill="#18334c" font-weight="400">0.6</text><text x="65" y="482" font-size="21" fill="#18334c" font-weight="400">C2</text><rect x="115" y="460" width="112.5" height="30" fill="#2376c5" stroke="#fff" rx="3"/><text x="410" y="482" font-size="21" fill="#18334c" font-weight="400">0.25</text><text x="65" y="542" font-size="21" fill="#18334c" font-weight="400">C3</text><rect x="115" y="520" width="67.5" height="30" fill="#b6c7d6" stroke="#fff" rx="3"/><text x="410" y="542" font-size="21" fill="#18334c" font-weight="400">0.15</text><text x="65" y="610" font-size="20" fill="#17816c" font-weight="700">p=.7：.60 不足，.60+.25=.85 → 选 C1、C2</text><rect x="594" y="387" width="742" height="208" fill="#fff" stroke="#2376c5" rx="16"/><text x="612" y="419" font-size="23" fill="#2376c5" font-weight="700">块概率不是最终注意力权重</text><text x="612" y="452" font-size="19" fill="#18334c" font-weight="400">2 个前序块 × 32 token + 本地前序 5 token = 69</text><text x="612" y="481" font-size="19" fill="#18334c" font-weight="400">Katt：69×dk；Vatt：69×dv</text><text x="612" y="510" font-size="19" fill="#18334c" font-weight="400">第二次 softmax 在这 69 个真实 token 上计算</text><text x="612" y="539" font-size="19" fill="#18334c" font-weight="400">本 cube 的未来 token 排除；首 token 空集合需实现核查</text><text x="612" y="568" font-size="19" fill="#18334c" font-weight="400">文本对视觉用 cube，文本对文本保持 token 注意力</text><rect x="28" y="678" width="1344" height="340" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="712" font-size="24" fill="#18334c" font-weight="700">03  FFN 四 token 算例：均值补偿平均的是 Δ，不能平均残差输出</text><rect x="52" y="739" width="376" height="191" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="771" font-size="23" fill="#2376c5" font-weight="700">范数 → Top-p</text><text x="70" y="804" font-size="19" fill="#18334c" font-weight="400">x₁=(4,0)；x₂=(3,0)</text><text x="70" y="833" font-size="19" fill="#18334c" font-weight="400">x₃=(2,0)；x₄=(1,0)</text><text x="70" y="862" font-size="19" fill="#18334c" font-weight="400">概率 .4 / .3 / .2 / .1</text><text x="70" y="891" font-size="19" fill="#18334c" font-weight="400">p=.7 → 精算 1、2</text><rect x="478" y="739" width="376" height="191" fill="#fff" stroke="#c36b24" rx="16"/><text x="496" y="771" font-size="23" fill="#c36b24" font-weight="700">只精算两条变换</text><text x="496" y="804" font-size="19" fill="#18334c" font-weight="400">给定 Δ₁ = (1,2)</text><text x="496" y="833" font-size="19" fill="#18334c" font-weight="400">给定 Δ₂ = (3,0)</text><text x="496" y="862" font-size="19" fill="#18334c" font-weight="400">均值 m = (2,1)</text><text x="496" y="891" font-size="19" fill="#18334c" font-weight="400">不是平均 x，也不是平均 y</text><rect x="904" y="739" width="432" height="191" fill="#fff" stroke="#17816c" rx="16"/><text x="922" y="771" font-size="23" fill="#17816c" font-weight="700">每个 token 保留自身残差</text><text x="922" y="804" font-size="19" fill="#18334c" font-weight="400">y₁ = (5,2)；y₂ = (6,0)</text><text x="922" y="833" font-size="19" fill="#18334c" font-weight="400">y₃ = (4,1)；y₄ = (3,1)</text><text x="922" y="862" font-size="19" fill="#18334c" font-weight="400">跳过者加 m，但不相互合并</text><text x="922" y="891" font-size="19" fill="#18334c" font-weight="400">四行继续进入下一层</text><path d="M428,830 L471,830" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><path d="M854,830 L897,830" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><text x="66" y="982" font-size="20" fill="#18334c" font-weight="700">所选 token 经 FFN 的 Δ 为教学给定值；对固定选择集合，跳过者的均值梯度分到两条精算支路。</text><rect x="28" y="1043" width="1344" height="240" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="1077" font-size="24" fill="#18334c" font-weight="700">04  时序与成本：Attention mask 不能单独证明整个模型的流式因果</text><rect x="52" y="1101" width="610" height="145" fill="#fff" stroke="#c36b24" rx="16"/><text x="70" y="1133" font-size="23" fill="#c36b24" font-weight="700">Attention：前序块 + 本块前序 token</text><text x="70" y="1166" font-size="19" fill="#18334c" font-weight="400">FFN：正文按整 cube 比范数并作平均补偿</text><text x="70" y="1195" font-size="19" fill="#18334c" font-weight="400">跨时间 cube 的依赖边界需查实现</text><text x="70" y="1224" font-size="19" fill="#18334c" font-weight="400">离线看完整视频，与边采集边回答的约束不同</text><rect x="713" y="1101" width="622" height="145" fill="#fff" stroke="#7750ad" rx="16"/><text x="731" y="1133" font-size="23" fill="#7750ad" font-weight="700">计算节约仍有路由与存储开销</text><text x="731" y="1166" font-size="19" fill="#18334c" font-weight="400">比较块均值、排序、访问所选 K/V 都需要计算</text><text x="731" y="1195" font-size="19" fill="#18334c" font-weight="400">保留所有 token 状态；文本 FFN 仍稠密</text><text x="731" y="1224" font-size="19" fill="#18334c" font-weight="400">FLOPs 降低不等于墙钟时间或显存同比降低</text><text x="36" y="1307" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">ET3：降低代理能量，再检查是否真正更稳健</title><desc id="desc">免训练仍有图像梯度计算；低能量本身不能证明输出正确。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#6e8a83"/></marker><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#dde6dd"/></pattern></defs><rect width="1200" height="660" rx="20" fill="#fafcf8"/><rect y="110" width="1200" height="490" fill="url(#dots)"/><g font-family="Inter,Segoe UI,Microsoft YaHei,sans-serif"><text x="40" y="38" fill="#688279" font-size="11" font-weight="650">PAPER ATLAS / METHOD EXPLAINED</text><text x="40" y="75" fill="#1f3d34" font-size="28" font-weight="650">ET3：降低代理能量，再检查是否真正更稳健</text><text x="40" y="103" fill="#71867e" font-size="13" font-weight="400">免训练仍有图像梯度计算；低能量本身不能证明输出正确。</text><rect x="40" y="170" width="225" height="150" rx="14" fill="#e7effb" stroke="#3b6fba" stroke-opacity=".25"/><text x="60" y="202" fill="#3b6fba" font-size="18" font-weight="650">输入图像 x</text><text x="60" y="231" fill="#253d3c" font-size="14" font-weight="400">可能为干净 / 对抗图</text><text x="60" y="256" fill="#253d3c" font-size="14" font-weight="400">冻结模型参数</text><rect x="365" y="170" width="305" height="150" rx="14" fill="#f0eafa" stroke="#7753a8" stroke-opacity=".25"/><text x="385" y="202" fill="#7753a8" font-size="18" font-weight="650">分类器 / CLIP</text><text x="385" y="231" fill="#253d3c" font-size="14" font-weight="400">图像 → 类别相似度 logits</text><text x="385" y="256" fill="#253d3c" font-size="14" font-weight="400">代理标签：ImageNet21k</text><text x="385" y="281" fill="#253d3c" font-size="14" font-weight="400">不通过 LVLM 本体优化</text><path d="M265 245 L365 245" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="800" y="170" width="350" height="150" rx="14" fill="#e5f3ec" stroke="#237958" stroke-opacity=".25"/><text x="820" y="202" fill="#237958" font-size="18" font-weight="650">能量下降与预算投影</text><text x="820" y="231" fill="#253d3c" font-size="14" font-weight="400">E(x) = − log Σ exp(logit)</text><text x="820" y="256" fill="#253d3c" font-size="14" font-weight="400">图像梯度步 → 投影回防御球</text><text x="820" y="281" fill="#253d3c" font-size="14" font-weight="400">默认通常迭代 2 步</text><path d="M670 245 L800 245" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M975 320 V365 H150 V320" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="7 6"/><rect x="800" y="435" width="350" height="120" rx="14" fill="#e5f3ec" stroke="#237958" stroke-opacity=".25"/><text x="820" y="467" fill="#237958" font-size="18" font-weight="650">变换后的图像 → 下游任务</text><text x="820" y="496" fill="#253d3c" font-size="14" font-weight="400">零样本分类 / 描述 / VQA</text><text x="820" y="521" fill="#253d3c" font-size="14" font-weight="400">同时测自适应攻击与干净性能</text><path d="M1080 320 L1080 435" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="45" y="435" width="610" height="120" rx="14" fill="#fff1df" stroke="#aa6b29" stroke-opacity=".25"/><text x="65" y="467" fill="#aa6b29" font-size="18" font-weight="650">定理适用条件</text><text x="65" y="496" fill="#253d3c" font-size="14" font-weight="400">二分类、局部线性、真类加权梯度占优、足够预算</text><text x="65" y="521" fill="#253d3c" font-size="14" font-weight="400">不是所有 LVLM 的无条件认证防御</text><path d="M40 606H1160" stroke="#dae5dc"/><text x="40" y="631" fill="#71867e" font-size="12" font-weight="400">依据原论文 Fig.2 / 式1–2 / Theorem4.1 重绘；省略定量梯度比条件。</text><text x="1000" y="631" fill="#71867e" font-size="11" font-weight="400">原创概念重绘 · 非原图</text></g></svg>
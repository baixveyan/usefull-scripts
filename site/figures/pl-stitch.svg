<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">PL-Stitch：从“画面有什么”走向“流程先后如何”</title><desc id="desc">PL 分数组织相对顺序；方向敏感与真正理解因果流程仍是不同概念。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#6e8a83"/></marker><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#dde6dd"/></pattern></defs><rect width="1200" height="660" rx="20" fill="#fafcf8"/><rect y="110" width="1200" height="490" fill="url(#dots)"/><g font-family="Inter,Segoe UI,Microsoft YaHei,sans-serif"><text x="40" y="38" fill="#688279" font-size="11" font-weight="650">PAPER ATLAS / METHOD EXPLAINED</text><text x="40" y="75" fill="#1f3d34" font-size="28" font-weight="650">PL-Stitch：从“画面有什么”走向“流程先后如何”</text><text x="40" y="103" fill="#71867e" font-size="13" font-weight="400">PL 分数组织相对顺序；方向敏感与真正理解因果流程仍是不同概念。</text><rect x="40" y="150" width="255" height="165" rx="14" fill="#e7effb" stroke="#3b6fba" stroke-opacity=".25"/><text x="60" y="182" fill="#3b6fba" font-size="18" font-weight="650">共享 ViT 帧编码器</text><text x="60" y="211" fill="#253d3c" font-size="14" font-weight="400">无流程标签预训练</text><text x="60" y="236" fill="#253d3c" font-size="14" font-weight="400">同一骨干服务两个分支</text><text x="60" y="261" fill="#253d3c" font-size="14" font-weight="400">训练保留时间顺序监督</text><rect x="400" y="150" width="330" height="165" rx="14" fill="#f0eafa" stroke="#7753a8" stroke-opacity=".25"/><text x="420" y="182" fill="#7753a8" font-size="18" font-weight="650">视频：PL 时间排序</text><text x="420" y="211" fill="#253d3c" font-size="14" font-weight="400">稀疏 8 帧 CLS</text><text x="420" y="236" fill="#253d3c" font-size="14" font-weight="400">时间头输出列表分数 s</text><text x="420" y="261" fill="#253d3c" font-size="14" font-weight="400">最大化真实顺序概率</text><text x="420" y="286" fill="#253d3c" font-size="14" font-weight="400">不枚举 K! 排列</text><rect x="400" y="405" width="330" height="165" rx="14" fill="#e5f3ec" stroke="#237958" stroke-opacity=".25"/><text x="420" y="437" fill="#237958" font-size="18" font-weight="650">图像：局部对应与掩码</text><text x="420" y="466" fill="#253d3c" font-size="14" font-weight="400">当前帧 MIM，遮蔽 30%</text><text x="420" y="491" fill="#253d3c" font-size="14" font-weight="400">前后 1.5–2.5s 帧作上下文</text><text x="420" y="516" fill="#253d3c" font-size="14" font-weight="400">PL patch 拼图顺序</text><path d="M295 225 L400 225" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M165 315 L400 475" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="850" y="260" width="300" height="170" rx="14" fill="#fff1df" stroke="#aa6b29" stroke-opacity=".25"/><text x="870" y="292" fill="#aa6b29" font-size="18" font-weight="650">联合训练 → 冻结评估</text><text x="870" y="321" fill="#253d3c" font-size="14" font-weight="400">Lvid + LMIM + 0.4 Ljigsaw</text><text x="870" y="346" fill="#253d3c" font-size="14" font-weight="400">下游线性探针 / kNN</text><text x="870" y="371" fill="#253d3c" font-size="14" font-weight="400">训练需未来上下文</text><text x="870" y="396" fill="#253d3c" font-size="14" font-weight="400">推理头按评价协议使用</text><path d="M730 230 L850 310" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M730 480 L850 385" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M40 606H1160" stroke="#dae5dc"/><text x="40" y="631" fill="#71867e" font-size="12" font-weight="400">依据原论文 Fig.3–4 / §3 重绘；输入置乱与位置编码处理需源码核验。</text><text x="1000" y="631" fill="#71867e" font-size="11" font-weight="400">原创概念重绘 · 非原图</text></g></svg>
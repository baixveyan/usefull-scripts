<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1250" viewBox="0 0 1400 1250" role="img" aria-labelledby="title desc"><title id="title">L²DGS ｜动态高斯如何解释明亮场景与暗光观测</title><desc id="desc">原创中文详图：L²指Low-Light；渲染分量、幂退化和可见性分别计算。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1250" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">L²DGS ｜动态高斯如何解释明亮场景与暗光观测</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">原创中文详图：L²指Low-Light；渲染分量、幂退化和可见性分别计算。</text><rect x="28" y="115" width="1344" height="245" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  暗光RGB + 位姿 + 点云：优化一个动态3D场景</text><rect x="52" y="179" width="385" height="165" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="211" font-size="23" fill="#2376c5" font-weight="700">规范高斯 → 时刻t几何</text><text x="70" y="244" font-size="19" fill="#18334c" font-weight="400">中心3维，协方差3×3</text><text x="70" y="273" font-size="19" fill="#18334c" font-weight="400">HexPlane六平面编码时空</text><text x="70" y="302" font-size="19" fill="#18334c" font-weight="400">三MLP头更新位置 / 旋转 / 尺度</text><text x="70" y="331" font-size="19" fill="#18334c" font-weight="400">不依赖曝光元数据≠不需要位姿</text><path d="M437,255 L483,255" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="498" y="179" width="395" height="165" fill="#fff" stroke="#17816c" rx="16"/><text x="516" y="211" font-size="23" fill="#17816c" font-weight="700">照明与反射率分开</text><text x="516" y="244" font-size="19" fill="#18334c" font-weight="400">球谐描述方向依赖照明</text><text x="516" y="273" font-size="19" fill="#18334c" font-weight="400">OCD-Net给每基时间增益</text><text x="516" y="302" font-size="19" fill="#18334c" font-weight="400">高斯反射率RGB不显式随时间变</text><text x="516" y="331" font-size="19" fill="#18334c" font-weight="400">屏幕R图仍受投影 / 遮挡影响</text><path d="M893,255 L939,255" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="954" y="179" width="380" height="165" fill="#fff" stroke="#7750ad" rx="16"/><text x="972" y="211" font-size="23" fill="#7750ad" font-weight="700">按深度排序与透射率混合</text><text x="972" y="244" font-size="19" fill="#18334c" font-weight="400">T_i=前面所有(1−α)的乘积</text><text x="972" y="273" font-size="19" fill="#18334c" font-weight="400">L图H×W；R图H×W×3</text><text x="972" y="302" font-size="19" fill="#18334c" font-weight="400">两图分别混合，再I=L⊙R</text><text x="972" y="331" font-size="19" fill="#18334c" font-weight="400">不是逐高斯先乘颜色再混合</text><rect x="28" y="385" width="1344" height="245" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="419" font-size="24" fill="#18334c" font-weight="700">02  混合顺序教学：两个高斯α均为.5，权重为.5与.25</text><rect x="52" y="451" width="595" height="165" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="483" font-size="23" fill="#2376c5" font-weight="700">照明(1,.5)，单色反射率(.8,.2)</text><text x="70" y="516" font-size="19" fill="#18334c" font-weight="400">L=.5×1+.25×.5=.625</text><text x="70" y="545" font-size="19" fill="#18334c" font-weight="400">R=.5×.8+.25×.2=.45</text><text x="70" y="574" font-size="19" fill="#18334c" font-weight="400">混合后乘：I=.28125</text><text x="70" y="603" font-size="19" fill="#18334c" font-weight="400">本例不加背景项，非实际像素测量</text><rect x="697" y="451" width="640" height="165" fill="#fff" stroke="#c36b24" rx="16"/><text x="715" y="483" font-size="23" fill="#c36b24" font-weight="700">先乘再混合会得到不同数值</text><text x="715" y="516" font-size="19" fill="#18334c" font-weight="400">.5×(1×.8)+.25×(.5×.2)=.425</text><text x="715" y="545" font-size="19" fill="#18334c" font-weight="400">与论文的.28125不相等</text><text x="715" y="574" font-size="19" fill="#18334c" font-weight="400">OCD亮度增益不能替代几何可见性排序</text><text x="715" y="603" font-size="19" fill="#18334c" font-weight="400">新相机 / 时间会改变混合权重</text><rect x="28" y="655" width="1344" height="245" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="689" font-size="24" fill="#18334c" font-weight="700">03  训练退化分支：BAF先投影，再预测逐像素指数</text><rect x="52" y="721" width="595" height="165" fill="#fff" stroke="#17816c" rx="16"/><text x="70" y="753" font-size="23" fill="#17816c" font-weight="700">每高斯b1,b2 → 两张BAF图</text><text x="70" y="786" font-size="19" fill="#18334c" font-weight="400">同一光栅权重投影为Bhat1/Bhat2</text><text x="70" y="815" font-size="19" fill="#18334c" font-weight="400">H×W×2 → BAFE-Net → B1/B2</text><text x="70" y="844" font-size="19" fill="#18334c" font-weight="400">暗图 = L的B2次幂 ⊙ R的B1次幂</text><text x="70" y="873" font-size="19" fill="#18334c" font-weight="400">两个幂结果之间才是逐元素乘</text><rect x="697" y="721" width="640" height="165" fill="#fff" stroke="#7750ad" rx="16"/><text x="715" y="753" font-size="23" fill="#7750ad" font-weight="700">教学L=.8，R=.6，B2=2，B1=1</text><text x="715" y="786" font-size="19" fill="#18334c" font-weight="400">明亮图=.48；退化后=.384</text><text x="715" y="815" font-size="19" fill="#18334c" font-weight="400">0&lt;a&lt;1时指数&gt;1变暗，&lt;1变亮</text><text x="715" y="844" font-size="19" fill="#18334c" font-weight="400">多个L/R/B组合可解释相同暗图</text><text x="715" y="873" font-size="19" fill="#18334c" font-weight="400">所以数据项之外必须明确正则偏好</text><rect x="28" y="925" width="1344" height="280" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="959" font-size="24" fill="#18334c" font-weight="700">04  正则与粗细阶段：明亮推理不保留退化分支</text><text x="55" y="992" font-size="22" fill="#18334c" font-weight="700">曝光约束R的16×16窗口均值≈.6；SAR把L拉向1，不是无限增大照明。</text><text x="55" y="1040" font-size="21" fill="#c36b24" font-weight="400">SASR匹配指数图与分量梯度；深度平滑在图像强边缘处放松，不是几何真值。</text><text x="55" y="1088" font-size="22" fill="#2376c5" font-weight="400">前3000步关闭运动场/OCD，后20000步全部启用；粗阶段仍做场景分解。</text><text x="55" y="1136" font-size="22" fill="#7750ad" font-weight="400">明图推理去掉BAFs/BAFE-Net；仍需动态几何、照明和光栅化，训练非实时。</text><text x="55" y="1180" font-size="20" fill="#586d80" font-weight="400">依据式1–15、§3–4，PDF3–6；原创教学例，未执行训练或渲染。</text><text x="36" y="1227" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>
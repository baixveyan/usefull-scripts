<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">跨视角抓取：多看一眼，只融合要抓的附近</title><desc id="desc">局部几何补全带来收益；相机移动、标定和执行时间也必须计入。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#6e8a83"/></marker><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#dde6dd"/></pattern></defs><rect width="1200" height="660" rx="20" fill="#fafcf8"/><rect y="110" width="1200" height="490" fill="url(#dots)"/><g font-family="Inter,Segoe UI,Microsoft YaHei,sans-serif"><text x="40" y="38" fill="#688279" font-size="11" font-weight="650">PAPER ATLAS / METHOD EXPLAINED</text><text x="40" y="75" fill="#1f3d34" font-size="28" font-weight="650">跨视角抓取：多看一眼，只融合要抓的附近</text><text x="40" y="103" fill="#71867e" font-size="13" font-weight="400">局部几何补全带来收益；相机移动、标定和执行时间也必须计入。</text><rect x="40" y="155" width="235" height="145" rx="14" fill="#e7effb" stroke="#3b6fba" stroke-opacity=".25"/><text x="60" y="187" fill="#3b6fba" font-size="18" font-weight="650">主视角 + 辅助视角</text><text x="60" y="216" fill="#253d3c" font-size="14" font-weight="400">RGB-D → 各自点云特征</text><text x="60" y="241" fill="#253d3c" font-size="14" font-weight="400">共享 ResUNet14</text><text x="60" y="266" fill="#253d3c" font-size="14" font-weight="400">需要已知相对位姿</text><rect x="355" y="155" width="270" height="145" rx="14" fill="#f0eafa" stroke="#7753a8" stroke-opacity=".25"/><text x="375" y="187" fill="#7753a8" font-size="18" font-weight="650">种子与圆柱邻域</text><text x="375" y="216" fill="#253d3c" font-size="14" font-weight="400">预测抓取种子 / 接近方向</text><text x="375" y="241" fill="#253d3c" font-size="14" font-weight="400">两视角收集局部点</text><text x="375" y="266" fill="#253d3c" font-size="14" font-weight="400">按坐标与特征寻找对应</text><rect x="735" y="155" width="300" height="145" rx="14" fill="#e5f3ec" stroke="#237958" stroke-opacity=".25"/><text x="755" y="187" fill="#237958" font-size="18" font-weight="650">任务相关后融合</text><text x="755" y="216" fill="#253d3c" font-size="14" font-weight="400">圆柱坐标位置编码</text><text x="755" y="241" fill="#253d3c" font-size="14" font-weight="400">局部自注意力 ↔ 种子交叉注意力</text><text x="755" y="266" fill="#253d3c" font-size="14" font-weight="400">保留原视角和重叠区域</text><path d="M275 225 L355 225" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M625 225 L735 225" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="40" y="395" width="390" height="140" rx="14" fill="#fff1df" stroke="#aa6b29" stroke-opacity=".25"/><text x="60" y="427" fill="#aa6b29" font-size="18" font-weight="650">仅训练：跨视角对比约束</text><text x="60" y="456" fill="#253d3c" font-size="14" font-weight="400">同位置点 → 特征接近</text><text x="60" y="481" fill="#253d3c" font-size="14" font-weight="400">同物体不同抓取方向 → 特征分离</text><text x="60" y="506" fill="#253d3c" font-size="14" font-weight="400">仍需有监督抓取标签</text><path d="M235 395 L160 300" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="7 6"/><text x="202.5" y="338.5" fill="#627b73" font-size="11" font-weight="400">特征正则</text><rect x="660" y="395" width="375" height="140" rx="14" fill="#e5f3ec" stroke="#237958" stroke-opacity=".25"/><text x="680" y="427" fill="#237958" font-size="18" font-weight="650">抓取参数候选评分</text><text x="680" y="456" fill="#253d3c" font-size="14" font-weight="400">离散方向 / 面内旋转 / 深度</text><text x="680" y="481" fill="#253d3c" font-size="14" font-weight="400">预测质量分数与夹爪宽度</text><text x="680" y="506" fill="#253d3c" font-size="14" font-weight="400">选择后再由机器人执行</text><path d="M885 300 L885 395" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M40 606H1160" stroke="#dae5dc"/><text x="40" y="631" fill="#71867e" font-size="12" font-weight="400">依据原论文 Fig.2 / §3 重绘；省略骨干层与碰撞检测执行细节。</text><text x="1000" y="631" fill="#71867e" font-size="11" font-weight="400">原创概念重绘 · 非原图</text></g></svg>
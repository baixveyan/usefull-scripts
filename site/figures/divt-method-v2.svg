<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1250" viewBox="0 0 1400 1250" role="img" aria-labelledby="title desc"><title id="title">DiVT ｜从动态选中心到簇内视觉token</title><desc id="desc">原创中文详图：区分初始删除与最终重分配，并逐项核对位置注入与mask。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1250" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">DiVT ｜从动态选中心到簇内视觉token</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">原创中文详图：区分初始删除与最终重分配，并逐项核对位置注入与mask。</text><rect x="28" y="115" width="1344" height="245" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  特征相似图：度数只计算一次，候选排序只做一次</text><rect x="52" y="179" width="385" height="165" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="211" font-size="23" fill="#2376c5" font-weight="700">N×D编码特征 → N×N相似度</text><text x="70" y="244" font-size="19" fill="#18334c" font-weight="400">S为两两余弦，不是空间距离</text><text x="70" y="273" font-size="19" fill="#18334c" font-weight="400">n_i统计S_ij &gt; θ，含自身</text><text x="70" y="302" font-size="19" fill="#18334c" font-weight="400">先按n_i降序排列候选</text><text x="70" y="331" font-size="19" fill="#18334c" font-weight="400">循环删邻居，不重新计算度数</text><path d="M437,255 L483,255" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="498" y="179" width="395" height="165" fill="#fff" stroke="#17816c" rx="16"/><text x="516" y="211" font-size="23" fill="#17816c" font-weight="700">先选择代表，再重新归属</text><text x="516" y="244" font-size="19" fill="#18334c" font-weight="400">取剩余列表第一项作中心</text><text x="516" y="273" font-size="19" fill="#18334c" font-weight="400">删去与它相似度 &gt; θ的候选</text><text x="516" y="302" font-size="19" fill="#18334c" font-weight="400">所有原patch再比较全部中心</text><text x="516" y="331" font-size="19" fill="#18334c" font-weight="400">argmax决定最后的簇内mask</text><path d="M893,255 L939,255" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="954" y="179" width="380" height="165" fill="#fff" stroke="#7750ad" rx="16"/><text x="972" y="211" font-size="23" fill="#7750ad" font-weight="700">输出K随图像变化</text><text x="972" y="244" font-size="19" fill="#18334c" font-weight="400">中心是实际patch，不更新均值</text><text x="972" y="273" font-size="19" fill="#18334c" font-weight="400">两中心之间相似度 ≤ θ</text><text x="972" y="302" font-size="19" fill="#18334c" font-weight="400">θ &lt; 1使非零中心可删除自身</text><text x="972" y="331" font-size="19" fill="#18334c" font-weight="400">空间排序细节需要代码核验</text><rect x="28" y="385" width="1344" height="265" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="419" font-size="24" fill="#18334c" font-weight="700">02  单位特征方向教学例：θ=.8；角度不是图像位置</text><text x="55" y="452" font-size="24" fill="#18334c" font-weight="700">方向角：0°、20°、45°、60°；含自身度数：(2,3,3,2)。</text><text x="55" y="498" font-size="23" fill="#2376c5" font-weight="400">并列按索引 → 先选20°，删除0°/20°/45°；再选60°。</text><text x="55" y="544" font-size="22" fill="#c36b24" font-weight="400">45°最初被20°覆盖，但重分配比较：cos25°=.906 &lt; cos15°=.966。</text><rect x="55" y="569" width="590" height="56" fill="#eef5ff" stroke="#d9e3ec" rx="16"/><text x="76" y="606" font-size="24" fill="#2376c5" font-weight="700">最终簇A：0°、20° → 中心20°</text><rect x="697" y="569" width="640" height="56" fill="#edf8f1" stroke="#d9e3ec" rx="16"/><text x="718" y="606" font-size="24" fill="#17816c" font-weight="700">最终簇B：45°、60° → 中心60°</text><rect x="28" y="675" width="1344" height="245" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="709" font-size="24" fill="#18334c" font-weight="700">03  聚合顺序：先给value输入加位置，再投影与簇内加权</text><rect x="52" y="741" width="385" height="165" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="773" font-size="23" fill="#2376c5" font-weight="700">Q与K只读语义特征</text><text x="70" y="806" font-size="19" fill="#18334c" font-weight="400">中心 → WQ → K个query</text><text x="70" y="835" font-size="19" fill="#18334c" font-weight="400">原patch → WK → N个key</text><text x="70" y="864" font-size="19" fill="#18334c" font-weight="400">注意力分数是K×N矩阵</text><text x="70" y="893" font-size="19" fill="#18334c" font-weight="400">簇外加−∞后权重为0</text><path d="M437,815 L483,815" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="498" y="741" width="395" height="165" fill="#fff" stroke="#c36b24" rx="16"/><text x="516" y="773" font-size="23" fill="#c36b24" font-weight="700">V = WV(x + P)</text><text x="516" y="806" font-size="19" fill="#18334c" font-weight="400">P先加到原patch特征</text><text x="516" y="835" font-size="19" fill="#18334c" font-weight="400">再通过WV改变通道维度</text><text x="516" y="864" font-size="19" fill="#18334c" font-weight="400">一般不等于WV(x) + P</text><text x="516" y="893" font-size="19" fill="#18334c" font-weight="400">位置在内容中，不直接加到Q/K</text><path d="M893,815 L939,815" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="954" y="741" width="380" height="165" fill="#fff" stroke="#7750ad" rx="16"/><text x="972" y="773" font-size="23" fill="#7750ad" font-weight="700">每簇一个连续token</text><text x="972" y="806" font-size="19" fill="#18334c" font-weight="400">权重(.75,.25)，value(2,0)/(0,4)</text><text x="972" y="835" font-size="19" fill="#18334c" font-weight="400">加权和为(1.5,1)，再经MLP</text><text x="972" y="864" font-size="19" fill="#18334c" font-weight="400">输出K×D_LM，非离散文字词表</text><text x="972" y="893" font-size="19" fill="#18334c" font-weight="400">本框为独立聚合教学数值</text><rect x="28" y="945" width="1344" height="250" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="979" font-size="24" fill="#18334c" font-weight="700">04  实现与信息边界：少token不等于全流程无开销</text><text x="55" y="1012" font-size="22" fill="#18334c" font-weight="700">相似矩阵O(N²D)；稠密mask不自动得到稀疏计算；需测真实端到端延迟。</text><text x="55" y="1060" font-size="22" fill="#2376c5" font-weight="400">选中心 / argmax无已给出的可微松弛；Q/K/V、P和MLP仍需要训练。</text><text x="55" y="1108" font-size="22" fill="#c36b24" font-weight="400">所有patch有归属 ≠ 聚合可逆；小字仍可能被合并，阈值调节存在质量折中。</text><text x="55" y="1156" font-size="20" fill="#586d80" font-weight="400">依据Algorithm1、式1–4、§3–4，PDF4–6；原创教学例，未执行训练。</text><text x="36" y="1227" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>
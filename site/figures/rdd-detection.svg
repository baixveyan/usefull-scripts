<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">RDD：用对照误差抑制错误线索</title><desc id="desc">简单背景也容易重建；潜变量范数也会影响误差，因此需要两个校正分支。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#6e8a83"/></marker><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#dde6dd"/></pattern></defs><rect width="1200" height="660" rx="20" fill="#fafcf8"/><rect y="110" width="1200" height="490" fill="url(#dots)"/><g font-family="Inter,Segoe UI,Microsoft YaHei,sans-serif"><text x="40" y="38" fill="#688279" font-size="11" font-weight="650">PAPER ATLAS / METHOD EXPLAINED</text><text x="40" y="75" fill="#1f3d34" font-size="28" font-weight="650">RDD：用对照误差抑制错误线索</text><text x="40" y="103" fill="#71867e" font-size="13" font-weight="400">简单背景也容易重建；潜变量范数也会影响误差，因此需要两个校正分支。</text><rect x="40" y="260" width="200" height="140" rx="14" fill="#e7effb" stroke="#3b6fba" stroke-opacity=".25"/><text x="60" y="292" fill="#3b6fba" font-size="18" font-weight="650">待检图片 x</text><text x="60" y="321" fill="#253d3c" font-size="14" font-weight="400">预训练模型保持冻结</text><text x="60" y="346" fill="#253d3c" font-size="14" font-weight="400">不训练新分类器</text><rect x="335" y="155" width="370" height="150" rx="14" fill="#f0eafa" stroke="#7753a8" stroke-opacity=".25"/><text x="355" y="187" fill="#7753a8" font-size="18" font-weight="650">图像：校正背景干扰</text><text x="355" y="216" fill="#253d3c" font-size="14" font-weight="400">AE 误差 f(x)</text><text x="355" y="241" fill="#253d3c" font-size="14" font-weight="400">低通 F / 旋转 R / 组合 FR</text><text x="355" y="266" fill="#253d3c" font-size="14" font-weight="400">四项作差 → Simage</text><rect x="335" y="375" width="370" height="150" rx="14" fill="#e5f3ec" stroke="#237958" stroke-opacity=".25"/><text x="355" y="407" fill="#237958" font-size="18" font-weight="650">潜空间：校正范数干扰</text><text x="355" y="436" fill="#253d3c" font-size="14" font-weight="400">编码 z → 小噪声预测误差</text><text x="355" y="461" fill="#253d3c" font-size="14" font-weight="400">比较 z 与旋转 Rz</text><text x="355" y="486" fill="#253d3c" font-size="14" font-weight="400">两项作差 → Slatent</text><path d="M240 305 L335 235" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M240 365 L335 450" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="840" y="255" width="310" height="155" rx="14" fill="#fff1df" stroke="#aa6b29" stroke-opacity=".25"/><text x="860" y="287" fill="#aa6b29" font-size="18" font-weight="650">融合检测分数</text><text x="860" y="316" fill="#253d3c" font-size="14" font-weight="400">SRDD = Simage × Slatent²</text><text x="860" y="341" fill="#253d3c" font-size="14" font-weight="400">较低分数更偏向生成</text><text x="860" y="366" fill="#253d3c" font-size="14" font-weight="400">AUROC 不等于单张真假证明</text><path d="M705 235 L840 300" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M705 450 L840 365" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><text x="45" y="575" fill="#253d3c" font-size="15" font-weight="400">增强只用于对照误差；“去偏”不表示修改图片真实性或完成社会公平去偏。</text><path d="M40 606H1160" stroke="#dae5dc"/><text x="40" y="631" fill="#71867e" font-size="12" font-weight="400">依据原论文 Fig.1 / 式1–7 重绘；latent展开符号问题见正文说明。</text><text x="1000" y="631" fill="#71867e" font-size="11" font-weight="400">原创概念重绘 · 非原图</text></g></svg>
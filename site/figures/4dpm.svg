<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">4DPM：把跨时间的几何碎片粘起来</title><desc id="desc">持久性意味着保留曾经见过的表面，而不只是重建当前帧。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#6e8a83"/></marker><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#dde6dd"/></pattern></defs><rect width="1200" height="660" rx="20" fill="#fafcf8"/><rect y="110" width="1200" height="490" fill="url(#dots)"/><g font-family="Inter,Segoe UI,Microsoft YaHei,sans-serif"><text x="40" y="38" fill="#688279" font-size="11" font-weight="650">PAPER ATLAS / METHOD EXPLAINED</text><text x="40" y="75" fill="#1f3d34" font-size="28" font-weight="650">4DPM：把跨时间的几何碎片粘起来</text><text x="40" y="103" fill="#71867e" font-size="13" font-weight="400">持久性意味着保留曾经见过的表面，而不只是重建当前帧。</text><rect x="40" y="155" width="235" height="120" rx="14" fill="#e7effb" stroke="#3b6fba" stroke-opacity=".25"/><text x="60" y="187" fill="#3b6fba" font-size="18" font-weight="650">局部观测 t = 0</text><text x="60" y="216" fill="#253d3c" font-size="14" font-weight="400">π³ 点图 + SAM2 分区</text><text x="60" y="241" fill="#253d3c" font-size="14" font-weight="400">仅包含当时可见的表面</text><rect x="60" y="300" width="42" height="28" rx="5" fill="#79bca1"/><rect x="115" y="300" width="42" height="28" rx="5" fill="#9fbbe5"/><rect x="170" y="300" width="42" height="28" rx="5" fill="#c9ace5"/><path d="M275 215 L330 215" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><text x="307.5" y="206.0" fill="#627b73" font-size="11" font-weight="400">跟踪</text><rect x="330" y="155" width="235" height="120" rx="14" fill="#e7effb" stroke="#3b6fba" stroke-opacity=".25"/><text x="350" y="187" fill="#3b6fba" font-size="18" font-weight="650">局部观测 t = 1</text><text x="350" y="216" fill="#253d3c" font-size="14" font-weight="400">π³ 点图 + SAM2 分区</text><text x="350" y="241" fill="#253d3c" font-size="14" font-weight="400">仅包含当时可见的表面</text><rect x="350" y="300" width="42" height="28" rx="5" fill="#79bca1"/><rect x="405" y="300" width="42" height="28" rx="5" fill="#9fbbe5"/><rect x="460" y="300" width="42" height="28" rx="5" fill="#c9ace5"/><path d="M565 215 L620 215" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><text x="597.5" y="206.0" fill="#627b73" font-size="11" font-weight="400">跟踪</text><rect x="620" y="155" width="235" height="120" rx="14" fill="#e7effb" stroke="#3b6fba" stroke-opacity=".25"/><text x="640" y="187" fill="#3b6fba" font-size="18" font-weight="650">局部观测 t = 2</text><text x="640" y="216" fill="#253d3c" font-size="14" font-weight="400">π³ 点图 + SAM2 分区</text><text x="640" y="241" fill="#253d3c" font-size="14" font-weight="400">仅包含当时可见的表面</text><rect x="640" y="300" width="42" height="28" rx="5" fill="#79bca1"/><rect x="695" y="300" width="42" height="28" rx="5" fill="#9fbbe5"/><rect x="750" y="300" width="42" height="28" rx="5" fill="#c9ace5"/><rect x="930" y="155" width="230" height="175" rx="14" fill="#f0eafa" stroke="#7753a8" stroke-opacity=".25"/><text x="950" y="187" fill="#7753a8" font-size="18" font-weight="650">共享物体坐标</text><text x="950" y="216" fill="#253d3c" font-size="14" font-weight="400">稠密 2D 对应 → 3D 配对</text><text x="950" y="241" fill="#253d3c" font-size="14" font-weight="400">Huber + Gauss–Newton</text><text x="950" y="266" fill="#253d3c" font-size="14" font-weight="400">一段 primitive 一个 SE(3)</text><text x="950" y="313" fill="#7753a8" font-size="11" font-weight="600">把不同时间的碎片粘合</text><path d="M855 215 L930 215" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="40" y="390" width="370" height="150" rx="14" fill="#e5f3ec" stroke="#237958" stroke-opacity=".25"/><text x="60" y="422" fill="#237958" font-size="18" font-weight="650">时间重映射</text><text x="60" y="451" fill="#253d3c" font-size="14" font-weight="400">T(p → q) = T(q)⁻¹ T(p)</text><text x="60" y="476" fill="#253d3c" font-size="14" font-weight="400">所有已见表面移到目标时间 q</text><text x="60" y="501" fill="#253d3c" font-size="14" font-weight="400">得到完整、可重放的场景</text><rect x="490" y="390" width="360" height="150" rx="14" fill="#fff1df" stroke="#aa6b29" stroke-opacity=".25"/><text x="510" y="422" fill="#aa6b29" font-size="18" font-weight="650">暂时不可见的物体</text><text x="510" y="451" fill="#253d3c" font-size="14" font-weight="400">包围盒接触 + 速度相似</text><text x="510" y="476" fill="#253d3c" font-size="14" font-weight="400">建立父子运动组，支持传递关联</text><text x="510" y="501" fill="#253d3c" font-size="14" font-weight="400">例如：抽屉关上，内部物体随动</text><text x="510" y="523" fill="#aa6b29" font-size="11" font-weight="600">运动延续基于假设，而非重新观测</text><path d="M1045 330 L1045 465" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M1045 465 L850 465" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M490 465 L410 465" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M40 606H1160" stroke="#dae5dc"/><text x="40" y="631" fill="#71867e" font-size="12" font-weight="400">依据原论文 Fig.2 / §3.4–3.6 重绘；刚性分块与运动组假设必须成立。</text><text x="1000" y="631" fill="#71867e" font-size="11" font-weight="400">原创概念重绘 · 非原图</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">DevDet：让多域输入共用更可靠的真假判断</title><desc id="desc">训练与推理条件分开；增强检测器证据不等于恢复真实伪造过程。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#6e8a83"/></marker><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#dde6dd"/></pattern></defs><rect width="1200" height="660" rx="20" fill="#fafcf8"/><rect y="110" width="1200" height="490" fill="url(#dots)"/><g font-family="Inter,Segoe UI,Microsoft YaHei,sans-serif"><text x="40" y="38" fill="#688279" font-size="11" font-weight="650">PAPER ATLAS / METHOD EXPLAINED</text><text x="40" y="75" fill="#1f3d34" font-size="28" font-weight="650">DevDet：让多域输入共用更可靠的真假判断</text><text x="40" y="103" fill="#71867e" font-size="13" font-weight="400">训练与推理条件分开；增强检测器证据不等于恢复真实伪造过程。</text><rect x="40" y="150" width="270" height="175" rx="14" fill="#e7effb" stroke="#3b6fba" stroke-opacity=".25"/><text x="60" y="182" fill="#3b6fba" font-size="18" font-weight="650">准备：多域检测器</text><text x="60" y="211" fill="#253d3c" font-size="14" font-weight="400">多已见域真 / 假数据训练</text><text x="60" y="236" fill="#253d3c" font-size="14" font-weight="400">挑出难假与易真样本</text><text x="60" y="261" fill="#253d3c" font-size="14" font-weight="400">不是完全未知域零样本</text><rect x="410" y="150" width="315" height="175" rx="14" fill="#f0eafa" stroke="#7753a8" stroke-opacity=".25"/><text x="430" y="182" fill="#7753a8" font-size="18" font-weight="650">阶段 1：训练 DevGen</text><text x="430" y="211" fill="#253d3c" font-size="14" font-weight="400">冻结检测器，学习图像残差</text><text x="430" y="236" fill="#253d3c" font-size="14" font-weight="400">难假 → 更可识别</text><text x="430" y="261" fill="#253d3c" font-size="14" font-weight="400">易真 → 保持真</text><text x="430" y="286" fill="#253d3c" font-size="14" font-weight="400">交叉熵 + TV 正则</text><path d="M310 235 L410 235" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="825" y="150" width="330" height="175" rx="14" fill="#e5f3ec" stroke="#237958" stroke-opacity=".25"/><text x="845" y="182" fill="#237958" font-size="18" font-weight="650">阶段 2：剂量自适应微调</text><text x="845" y="211" fill="#253d3c" font-size="14" font-weight="400">冻结 DevGen</text><text x="845" y="236" fill="#253d3c" font-size="14" font-weight="400">难假特征学习稀疏字典 D</text><text x="845" y="261" fill="#253d3c" font-size="14" font-weight="400">接近字典 → 更高显影剂量</text><text x="845" y="286" fill="#253d3c" font-size="14" font-weight="400">微调检测器适应显影图</text><path d="M725 235 L825 235" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="420" y="425" width="735" height="130" rx="14" fill="#e5f3ec" stroke="#237958" stroke-opacity=".25"/><text x="440" y="457" fill="#237958" font-size="18" font-weight="650">推理：x → DoseDict 剂量 εa → x + εa G(x) → 检测</text><text x="440" y="486" fill="#253d3c" font-size="14" font-weight="400">固定阈值与混合域评价；AUC 排序好不等于单张分类一定准确</text><text x="440" y="511" fill="#253d3c" font-size="14" font-weight="400">字典不匹配时减弱处理；不能保证每个未见域泛化无损</text><path d="M40 606H1160" stroke="#dae5dc"/><text x="40" y="631" fill="#71867e" font-size="12" font-weight="400">依据原论文 Fig.3 / §4 重绘；DoseDict 的 Norm 映射与采样阈值需实现核验。</text><text x="1000" y="631" fill="#71867e" font-size="11" font-weight="400">原创概念重绘 · 非原图</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1250" viewBox="0 0 1400 1250" role="img" aria-labelledby="title desc"><title id="title">Adapter Shield ｜先学特征变换，再把目标落实到公开图</title><desc id="desc">原创中文教学图：理想特征、实际保护图、正确恢复与错误密钥分别标注。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1250" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">Adapter Shield ｜先学特征变换，再把目标落实到公开图</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">原创中文教学图：理想特征、实际保护图、正确恢复与错误密钥分别标注。</text><rect x="28" y="115" width="1344" height="245" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  第一阶段训练Enc / Dec：正确与错误密钥走不同目标</text><rect x="52" y="179" width="380" height="165" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="211" font-size="23" fill="#2376c5" font-weight="700">原图 → 固定图像编码器</text><text x="70" y="244" font-size="19" fill="#18334c" font-weight="400">原特征 E_ori</text><text x="70" y="273" font-size="19" fill="#18334c" font-weight="400">Enc(E_ori,P) → 替代表征</text><text x="70" y="302" font-size="19" fill="#18334c" font-weight="400">密钥条件进入cross-attention</text><text x="70" y="331" font-size="19" fill="#18334c" font-weight="400">每个编码接口分别训练网络</text><path d="M432,258 L484,258" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="494" y="179" width="395" height="165" fill="#fff" stroke="#17816c" rx="16"/><text x="512" y="211" font-size="23" fill="#17816c" font-weight="700">正确密钥恢复</text><text x="512" y="244" font-size="19" fill="#18334c" font-weight="400">Enc输出应远离原特征</text><text x="512" y="273" font-size="19" fill="#18334c" font-weight="400">Dec(E_enc,P_correct)应接近原特征</text><text x="512" y="302" font-size="19" fill="#18334c" font-weight="400">正确恢复损失权重作者设5</text><text x="512" y="331" font-size="19" fill="#18334c" font-weight="400">余弦接近不代表逐比特可逆</text><path d="M889,258 L941,258" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="951" y="179" width="385" height="165" fill="#fff" stroke="#c36b24" rx="16"/><text x="969" y="211" font-size="23" fill="#c36b24" font-weight="700">错误密钥与多样性</text><text x="969" y="244" font-size="19" fill="#18334c" font-weight="400">错误密钥解码应远离原特征</text><text x="969" y="273" font-size="19" fill="#18334c" font-weight="400">跨样本 / 密钥输出不要塌缩</text><text x="969" y="302" font-size="19" fill="#18334c" font-weight="400">成对项1/2只消除双计数</text><text x="969" y="331" font-size="19" fill="#18334c" font-weight="400">batch变化也改变损失尺度</text><rect x="28" y="385" width="1344" height="245" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="419" font-size="24" fill="#18334c" font-weight="700">02  第二阶段优化像素：一张保护图同时追踪多个特征目标</text><rect x="52" y="451" width="585" height="165" fill="#fff" stroke="#7750ad" rx="16"/><text x="70" y="483" font-size="23" fill="#7750ad" font-weight="700">每个编码器先得到自己的E_target</text><text x="70" y="516" font-size="19" fill="#18334c" font-weight="400">目标=Enc_i(IE_i(原图),P)</text><text x="70" y="545" font-size="19" fill="#18334c" font-weight="400">IE_i(保护图)与各自目标比较余弦</text><text x="70" y="574" font-size="19" fill="#18334c" font-weight="400">不同维度先变成标量损失再求和</text><text x="70" y="603" font-size="19" fill="#18334c" font-weight="400">不能直接将512维与1024维相减</text><rect x="697" y="451" width="639" height="165" fill="#fff" stroke="#c36b24" rx="16"/><text x="715" y="483" font-size="23" fill="#c36b24" font-weight="700">共享扰动δ + 可微失真 + 预算投影</text><text x="715" y="516" font-size="19" fill="#18334c" font-weight="400">优化像素，不是在第二阶段重训生成器</text><text x="715" y="545" font-size="19" fill="#18334c" font-weight="400">逐像素扰动约束在[−ε,ε]</text><text x="715" y="574" font-size="19" fill="#18334c" font-weight="400">式11无sign，与FGSM文字需核对</text><text x="715" y="603" font-size="19" fill="#18334c" font-weight="400">算法停止条件与文字方向不一致</text><rect x="28" y="655" width="1344" height="245" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="689" font-size="24" fill="#18334c" font-weight="700">03  授权路径必须从公开图的实际特征开始</text><text x="55" y="723" font-size="23" fill="#18334c" font-weight="700">保护图 → IE(保护图) ≈ 理想E_enc → Dec(实际特征,正确密钥) ≈ E_ori → 生成器。</text><text x="55" y="771" font-size="22" fill="#7750ad" font-weight="400">不能直接用理想E_enc或原图特征代替保护图特征来宣称授权恢复成功。</text><text x="55" y="819" font-size="22" fill="#c36b24" font-weight="400">误差来源：像素优化残差 + 后处理变化 + 神经解码近似；解码还可能放大输入误差。</text><text x="55" y="867" font-size="22" fill="#2376c5" font-weight="400">教学：(1,0)恢复成(2,0)，余弦仍是1，但逐维平方误差为1。</text><rect x="28" y="925" width="1344" height="265" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="959" font-size="24" fill="#18334c" font-weight="700">04  威胁范围与评价边界</text><text x="55" y="993" font-size="23" fill="#18334c" font-weight="700">图像仍可被观看和复制；目标是限制指定编码器的生成使用，不是加密图片文件。</text><text x="55" y="1040" font-size="21" fill="#c36b24" font-weight="400">同维密钥条件 + 神经网络恢复，不自动构成标准口令派生、认证协议或密码安全证明。</text><text x="55" y="1087" font-size="21" fill="#7750ad" font-weight="400">跨任务的身份生成相似度和作品表征相似度定义不同；JPEG实验显示保护可明显削弱。</text><text x="55" y="1134" font-size="21" fill="#586d80" font-weight="400">依据式1–11、Algorithm 1，PDF4–5；未训练模型、未处理真实个人图片或复现实验。</text><text x="36" y="1227" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>
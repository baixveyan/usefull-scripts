<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">GAI-GS：用场景几何组织无线传播信息</title><desc id="desc">多路径、遮挡与发射机条件共同影响接收场；质量、渲染耗时和总推理分开评价。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#6e8a83"/></marker><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#dde6dd"/></pattern></defs><rect width="1200" height="660" rx="20" fill="#fafcf8"/><rect y="110" width="1200" height="490" fill="url(#dots)"/><g font-family="Inter,Segoe UI,Microsoft YaHei,sans-serif"><text x="40" y="38" fill="#688279" font-size="11" font-weight="650">PAPER ATLAS / METHOD EXPLAINED</text><text x="40" y="75" fill="#1f3d34" font-size="28" font-weight="650">GAI-GS：用场景几何组织无线传播信息</text><text x="40" y="103" fill="#71867e" font-size="13" font-weight="400">多路径、遮挡与发射机条件共同影响接收场；质量、渲染耗时和总推理分开评价。</text><rect x="40" y="155" width="255" height="160" rx="14" fill="#e7effb" stroke="#3b6fba" stroke-opacity=".25"/><text x="60" y="187" fill="#3b6fba" font-size="18" font-weight="650">场景高斯与 Tx</text><text x="60" y="216" fill="#253d3c" font-size="14" font-weight="400">N 个高斯 + 发射机位置</text><text x="60" y="241" fill="#253d3c" font-size="14" font-weight="400">选高不透明度 M 个锚点</text><text x="60" y="266" fill="#253d3c" font-size="14" font-weight="400">M ≪ N；训练中更新</text><rect x="400" y="155" width="330" height="160" rx="14" fill="#f0eafa" stroke="#7753a8" stroke-opacity=".25"/><text x="420" y="187" fill="#7753a8" font-size="18" font-weight="650">双流 tokenizer</text><text x="420" y="216" fill="#253d3c" font-size="14" font-weight="400">GA Transformer → 全局 CLS</text><text x="420" y="241" fill="#253d3c" font-size="14" font-weight="400">欧氏位置 → 距离 / 布局编码</text><text x="420" y="266" fill="#253d3c" font-size="14" font-weight="400">CLS 广播到全部 N 个高斯</text><path d="M295 235 L400 235" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="840" y="155" width="315" height="160" rx="14" fill="#e5f3ec" stroke="#237958" stroke-opacity=".25"/><text x="860" y="187" fill="#237958" font-size="18" font-weight="650">衰减 / 信号分支</text><text x="860" y="216" fill="#253d3c" font-size="14" font-weight="400">发射机条件 MLP</text><text x="860" y="241" fill="#253d3c" font-size="14" font-weight="400">几何 / 信号 / 不透明度残差</text><text x="860" y="266" fill="#253d3c" font-size="14" font-weight="400">残差正则约束</text><path d="M730 235 L840 235" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="840" y="405" width="315" height="145" rx="14" fill="#e5f3ec" stroke="#237958" stroke-opacity=".25"/><text x="860" y="437" fill="#237958" font-size="18" font-weight="650">角度投影与累积</text><text x="860" y="466" fill="#253d3c" font-size="14" font-weight="400">投影到接收机角度平面</text><text x="860" y="491" fill="#253d3c" font-size="14" font-weight="400">tile 中排序与信号累积</text><text x="860" y="516" fill="#253d3c" font-size="14" font-weight="400">得到功率谱与 RSSI</text><path d="M995 315 L995 405" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="60" y="405" width="600" height="145" rx="14" fill="#fff1df" stroke="#aa6b29" stroke-opacity=".25"/><text x="80" y="437" fill="#aa6b29" font-size="18" font-weight="650">物理启发的表示 ≠ 完整电磁方程求解</text><text x="80" y="466" fill="#253d3c" font-size="14" font-weight="400">交互算子隐式学习；不要求逐条真实路径标注</text><text x="80" y="491" fill="#253d3c" font-size="14" font-weight="400">注意力 O(M²)，整体映射和渲染仍与 N 有关</text><text x="80" y="516" fill="#253d3c" font-size="14" font-weight="400">GA 签名与注意力的物理解读需对照实现核验</text><path d="M40 606H1160" stroke="#dae5dc"/><text x="40" y="631" fill="#71867e" font-size="12" font-weight="400">依据原论文 Fig.1–3 / §4 重绘；不把隐式特征解释为可验证的真实射线路径。</text><text x="1000" y="631" fill="#71867e" font-size="11" font-weight="400">原创概念重绘 · 非原图</text></g></svg>
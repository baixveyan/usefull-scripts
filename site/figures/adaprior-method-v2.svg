<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1040" viewBox="0 0 1400 1040" role="img" aria-labelledby="title desc"><title id="title">AdaPrior ｜训练时加先验，推理时减先验</title><desc id="desc">依据原文 §3、Fig.2、式4/6/7/9，PDF 2–4；双类别数值与梯度为独立推算示例。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1040" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">AdaPrior ｜训练时加先验，推理时减先验</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据原文 §3、Fig.2、式4/6/7/9，PDF 2–4；双类别数值与梯度为独立推算示例。</text><rect x="28" y="115" width="1344" height="280" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  同一个先验统计，进入训练与推理的位置不同</text><rect x="52" y="178" width="310" height="160" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="210" font-size="23" fill="#2376c5" font-weight="700">原始分类器输出</text><text x="70" y="243" font-size="19" fill="#18334c" font-weight="400">z：B × K logits</text><text x="70" y="272" font-size="19" fill="#18334c" font-weight="400">q = softmax(z)</text><text x="70" y="301" font-size="19" fill="#18334c" font-weight="400">batch均值 b → K 维</text><text x="70" y="330" font-size="19" fill="#18334c" font-weight="400">p_i = (1−γ)p_(i−1) + γb</text><path d="M362,220 L420,220" fill="none" stroke="#c36b24" stroke-width="3" marker-end="url(#c36b24)" /><rect x="430" y="178" width="400" height="160" fill="#fff" stroke="#c36b24" rx="16"/><text x="448" y="210" font-size="23" fill="#c36b24" font-weight="700">训练：给损失加先验</text><text x="448" y="243" font-size="19" fill="#18334c" font-weight="400">u = z + log(p / π)</text><text x="448" y="272" font-size="19" fill="#18334c" font-weight="400">CE(softmax(u), 标签)</text><text x="448" y="301" font-size="19" fill="#18334c" font-weight="400">优化器更新网络，学习补偿偏置</text><text x="448" y="330" font-size="19" fill="#18334c" font-weight="400">p 为 detach 统计，不沿它反传</text><path d="M830,240 L888,240" fill="none" stroke="#17816c" stroke-width="3" marker-end="url(#17816c)" /><rect x="900" y="178" width="436" height="160" fill="#fff" stroke="#17816c" rx="16"/><text x="918" y="210" font-size="23" fill="#17816c" font-weight="700">训练后推理：扣除残余偏向</text><text x="918" y="243" font-size="19" fill="#18334c" font-weight="400">z′ = z + α[log π − log p_final]</text><text x="918" y="272" font-size="19" fill="#18334c" font-weight="400">再归一化 / 排序；不需要测试标签</text><text x="918" y="301" font-size="19" fill="#18334c" font-weight="400">Full 模式重新估计训练后的 p</text><text x="918" y="330" font-size="19" fill="#18334c" font-weight="400">不是把同一 z 上的加减直接抵消</text><text x="55" y="368" font-size="21" fill="#586d80" font-weight="400">π 为目标先验（基准常均匀）；p 为模型预测均值，不等同真实人口比例。</text><rect x="28" y="420" width="1344" height="265" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="454" font-size="24" fill="#18334c" font-weight="700">02  两类别校正：逐步算出归一化概率</text><rect x="55" y="482" width="280" height="118" fill="#fff" stroke="#17816c" rx="16"/><text x="73" y="514" font-size="23" fill="#17816c" font-weight="700">原始预测 q</text><text x="73" y="547" font-size="19" fill="#18334c" font-weight="400">头类 0.60</text><text x="73" y="576" font-size="19" fill="#18334c" font-weight="400">尾类 0.40</text><rect x="385" y="482" width="280" height="118" fill="#fff" stroke="#17816c" rx="16"/><text x="403" y="514" font-size="23" fill="#17816c" font-weight="700">乘目标 / 模型先验</text><text x="403" y="547" font-size="19" fill="#18334c" font-weight="400">0.60 × 0.50 / 0.80 = 0.375</text><text x="403" y="576" font-size="19" fill="#18334c" font-weight="400">0.40 × 0.50 / 0.20 = 1.000</text><rect x="855" y="482" width="480" height="118" fill="#fff" stroke="#17816c" rx="16"/><text x="873" y="514" font-size="23" fill="#17816c" font-weight="700">归一化（α=1）</text><text x="873" y="547" font-size="19" fill="#18334c" font-weight="400">0.375 / 1.375 ≈ 0.273</text><text x="873" y="576" font-size="19" fill="#18334c" font-weight="400">1.000 / 1.375 ≈ 0.727</text><path d="M335,535 L378,535" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><path d="M665,535 L848,535" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><text x="55" y="650" font-size="22" fill="#c36b24" font-weight="700">给定 p=(0.8,0.2)、π=(0.5,0.5)。排序改变 ≠ 校正后的标签一定真实。</text><rect x="28" y="710" width="1344" height="270" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="744" font-size="24" fill="#18334c" font-weight="700">03  为什么训练却加先验？检查一个尾类样本的梯度</text><rect x="55" y="777" width="380" height="150" fill="#fff" stroke="#2376c5" rx="16"/><text x="73" y="809" font-size="23" fill="#2376c5" font-weight="700">原始 logits 相等</text><text x="73" y="842" font-size="19" fill="#18334c" font-weight="400">普通 CE 概率：(0.5,0.5)</text><text x="73" y="871" font-size="19" fill="#18334c" font-weight="400">尾类为真：∂L/∂z_tail = −0.5</text><text x="73" y="900" font-size="19" fill="#18334c" font-weight="400">梯度下降提高尾类 logit</text><path d="M435,850 L491,850" fill="none" stroke="#c36b24" stroke-width="3" marker-end="url(#c36b24)" /><rect x="502" y="777" width="405" height="150" fill="#fff" stroke="#c36b24" rx="16"/><text x="520" y="809" font-size="23" fill="#c36b24" font-weight="700">先验加入训练损失</text><text x="520" y="842" font-size="19" fill="#18334c" font-weight="400">损失内概率变成：(0.8,0.2)</text><text x="520" y="871" font-size="19" fill="#18334c" font-weight="400">尾类为真：∂L/∂z_tail = −0.8</text><text x="520" y="900" font-size="19" fill="#18334c" font-weight="400">更强地要求网络纠正这次尾类样本</text><rect x="964" y="777" width="372" height="150" fill="#fff" stroke="#7750ad" rx="16"/><text x="982" y="809" font-size="23" fill="#7750ad" font-weight="700">理论边界单列</text><text x="982" y="842" font-size="19" fill="#18334c" font-weight="400">固定 γ 的 EMA 留下噪声方差</text><text x="982" y="871" font-size="19" fill="#18334c" font-weight="400">CE+KL 分解不能跳过分母</text><text x="982" y="900" font-size="19" fill="#18334c" font-weight="400">label shift 假设不覆盖所有漂移</text><text x="55" y="958" font-size="20" fill="#586d80" font-weight="400">梯度例子固定 detach 的 p，只解释当前样本；不保证全数据的梯度自动均衡。</text><text x="36" y="1017" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1200" viewBox="0 0 1400 1200" role="img" aria-labelledby="title desc"><title id="title">2D-LFM ｜持续注入对应线索，也保留三维歧义边界</title><desc id="desc">依据原文 Fig.2、式1–5、§3，PDF 3–5；投影维度与平面零解为本笔记独立核查。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1200" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">2D-LFM ｜持续注入对应线索，也保留三维歧义边界</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据原文 Fig.2、式1–5、§3，PDF 3–5；投影维度与平面零解为本笔记独立核查。</text><rect x="28" y="115" width="1344" height="260" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  稀疏点提升：N×2 输入，N×3 输出，不是稠密表面重建</text><rect x="52" y="178" width="280" height="135" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="210" font-size="23" fill="#2376c5" font-weight="700">二维关键点 X</text><text x="70" y="243" font-size="19" fill="#18334c" font-weight="400">类别内部点顺序需固定</text><text x="70" y="272" font-size="19" fill="#18334c" font-weight="400">有效点 / padding mask</text><text x="70" y="301" font-size="19" fill="#18334c" font-weight="400">不是直接输入 RGB纹理</text><path d="M332,245 L388,245" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="398" y="178" width="295" height="135" fill="#fff" stroke="#7750ad" rx="16"/><text x="416" y="210" font-size="23" fill="#7750ad" font-weight="700">Embed(X) + Φ</text><text x="416" y="243" font-size="19" fill="#18334c" font-weight="400">线性坐标投影</text><text x="416" y="272" font-size="19" fill="#18334c" font-weight="400">坐标 TPE(X) + 类别 e_c</text><text x="416" y="301" font-size="19" fill="#18334c" font-weight="400">再加对应编码 Φ</text><path d="M693,245 L747,245" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="757" y="178" width="305" height="135" fill="#fff" stroke="#17816c" rx="16"/><text x="775" y="210" font-size="23" fill="#17816c" font-weight="700">每层 attention + FFN</text><text x="775" y="243" font-size="19" fill="#18334c" font-weight="400">Q = Z W_Q + Φ</text><text x="775" y="272" font-size="19" fill="#18334c" font-weight="400">K = Z W_K + Φ</text><text x="775" y="301" font-size="19" fill="#18334c" font-weight="400">V = Z W_V + Φ</text><path d="M1062,245 L1114,245" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="1124" y="178" width="212" height="135" fill="#fff" stroke="#2376c5" rx="16"/><text x="1142" y="210" font-size="23" fill="#2376c5" font-weight="700">逐点线性输出</text><text x="1142" y="243" font-size="19" fill="#18334c" font-weight="400">Ŷ：N × 3</text><text x="1142" y="272" font-size="19" fill="#18334c" font-weight="400">投影对齐到输入 X</text><text x="1142" y="301" font-size="19" fill="#18334c" font-weight="400">只在有效点计算损失</text><text x="55" y="350" font-size="22" fill="#18334c" font-weight="700">四种量别合并：线性坐标、坐标Fourier特征、类别向量、每层重复的对应编码。</text><rect x="28" y="400" width="1344" height="245" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="434" font-size="24" fill="#18334c" font-weight="700">02  Φ 与 TPE 的分工，关系到置换究竟怎样作用</text><rect x="52" y="465" width="380" height="140" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="497" font-size="23" fill="#2376c5" font-weight="700">TPE(X)：二维坐标函数</text><text x="70" y="530" font-size="19" fill="#18334c" font-weight="400">几何位置随输入点一起变换</text><text x="70" y="559" font-size="19" fill="#18334c" font-weight="400">若行同步重排，特征也同步重排</text><text x="70" y="588" font-size="19" fill="#18334c" font-weight="400">不自动打破所有置换等变</text><rect x="493" y="465" width="395" height="140" fill="#fff" stroke="#7750ad" rx="16"/><text x="511" y="497" font-size="23" fill="#7750ad" font-weight="700">Φ：对应 / 索引编码</text><text x="511" y="530" font-size="19" fill="#18334c" font-weight="400">在每个Q/K/V投影后再次注入</text><text x="511" y="559" font-size="19" fill="#18334c" font-weight="400">需明确类别内点语义与频率范围</text><text x="511" y="588" font-size="19" fill="#18334c" font-weight="400">图编码还要核对拓扑来源</text><rect x="949" y="465" width="387" height="140" fill="#fff" stroke="#c36b24" rx="16"/><text x="967" y="497" font-size="23" fill="#c36b24" font-weight="700">类别 e_c：全体点共享条件</text><text x="967" y="530" font-size="19" fill="#18334c" font-weight="400">告诉模型对象类别</text><text x="967" y="559" font-size="19" fill="#18334c" font-weight="400">不能单独区分该类别内每个点</text><text x="967" y="588" font-size="19" fill="#18334c" font-weight="400">损失mask与attention mask分别核对</text><text x="55" y="625" font-size="22" fill="#586d80" font-weight="400">f(ΠX)=Πf(X) 是等变；不是 f(ΠX)=f(X)，也不是只交换输出就必然同损失。</text><rect x="28" y="670" width="1344" height="195" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="704" font-size="24" fill="#18334c" font-weight="700">03  统一行点记号：投影后形状必须仍是 N×2</text><text x="55" y="739" font-size="26" fill="#18334c" font-weight="700">X̂ = s Ŷ Rᵀ Pᵀ，P=[I₂ | 0]；L = min_(s,R) ‖M_c ⊙ (X − X̂)‖²_F</text><text x="55" y="789" font-size="23" fill="#2376c5" font-weight="400">N×3 · 3×3 · 3×2 → N×2；Procrustes拟合旋转和尺度，不提供新的深度真值。</text><text x="55" y="833" font-size="21" fill="#586d80" font-weight="400">原文列点投影写法需同步转置；绝对坐标、尺度与弱透视条件不能省略。</text><rect x="28" y="890" width="1344" height="245" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="924" font-size="24" fill="#18334c" font-weight="700">04  独立代数核查：逐层PE不改变重投影损失的零解集合</text><rect x="52" y="958" width="585" height="148" fill="#fff" stroke="#c36b24" rx="16"/><text x="70" y="990" font-size="23" fill="#c36b24" font-weight="700">平面构造：Ŷ = [X, 0]</text><text x="70" y="1023" font-size="19" fill="#18334c" font-weight="400">令 R=I、s=1 → 投影恰好等于 X</text><text x="70" y="1052" font-size="19" fill="#18334c" font-weight="400">二维损失可为0，但所有点都在 z=0 平面</text><text x="70" y="1081" font-size="19" fill="#18334c" font-weight="400">这是目标函数的退化例，不是作者实际输出</text><rect x="697" y="958" width="639" height="148" fill="#fff" stroke="#7750ad" rx="16"/><text x="715" y="990" font-size="23" fill="#7750ad" font-weight="700">经验表现与唯一恢复是两种结论</text><text x="715" y="1023" font-size="19" fill="#18334c" font-weight="400">对应编码可改善学习，并不消除单图深度歧义</text><text x="715" y="1052" font-size="19" fill="#18334c" font-weight="400">验证MPJPE使用三维参考；与二维训练标签分开</text><text x="715" y="1081" font-size="19" fill="#18334c" font-weight="400">未读附录/代码的约束与配置不擅自补齐</text><text x="36" y="1177" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>
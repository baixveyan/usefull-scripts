<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">1-bit 视频：把位深预算移到时间与计算中</title><desc id="desc">前端数据减少，后端计算增加；不能据此推断整机无损压缩或实时帧率。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#6e8a83"/></marker><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#dde6dd"/></pattern></defs><rect width="1200" height="660" rx="20" fill="#fafcf8"/><rect y="110" width="1200" height="490" fill="url(#dots)"/><g font-family="Inter,Segoe UI,Microsoft YaHei,sans-serif"><text x="40" y="38" fill="#688279" font-size="11" font-weight="650">PAPER ATLAS / METHOD EXPLAINED</text><text x="40" y="75" fill="#1f3d34" font-size="28" font-weight="650">1-bit 视频：把位深预算移到时间与计算中</text><text x="40" y="103" fill="#71867e" font-size="13" font-weight="400">前端数据减少，后端计算增加；不能据此推断整机无损压缩或实时帧率。</text><rect x="40" y="180" width="235" height="160" rx="14" fill="#e7effb" stroke="#3b6fba" stroke-opacity=".25"/><text x="60" y="212" fill="#3b6fba" font-size="18" font-weight="650">模拟强度 X(t)</text><text x="60" y="241" fill="#253d3c" font-size="14" font-weight="400">每个时刻保留一条强度约束</text><text x="60" y="266" fill="#253d3c" font-size="14" font-weight="400">全帧共享阈值 T(t)</text><text x="60" y="291" fill="#253d3c" font-size="14" font-weight="400">阈值在时间上非平滑变化</text><rect x="365" y="180" width="230" height="160" rx="14" fill="#f0eafa" stroke="#7753a8" stroke-opacity=".25"/><text x="385" y="212" fill="#7753a8" font-size="18" font-weight="650">比较器 → 二值 M</text><text x="385" y="241" fill="#253d3c" font-size="14" font-weight="400">M = H(X − T)</text><text x="385" y="266" fill="#253d3c" font-size="14" font-weight="400">每像素每帧 1 bit</text><text x="385" y="291" fill="#253d3c" font-size="14" font-weight="400">主要实验从已有视频模拟</text><rect x="690" y="180" width="230" height="160" rx="14" fill="#e5f3ec" stroke="#237958" stroke-opacity=".25"/><text x="710" y="212" fill="#237958" font-size="18" font-weight="650">恢复网络</text><text x="710" y="241" fill="#253d3c" font-size="14" font-weight="400">已知阈值参与输入缩放</text><text x="710" y="266" fill="#253d3c" font-size="14" font-weight="400">10 阈值重复 → 20 帧窗口</text><text x="710" y="291" fill="#253d3c" font-size="14" font-weight="400">L1 训练 + 时间先验</text><path d="M275 255 L365 255" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M595 255 L690 255" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M920 255 L975 255" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><text x="1000" y="230" fill="#253d3c" font-size="18" font-weight="400">高位深</text><text x="1000" y="260" fill="#253d3c" font-size="18" font-weight="400">视频估计</text><text x="1000" y="295" fill="#253d3c" font-size="13" font-weight="400">并非唯一解</text><circle cx="90" cy="522.0" r="7" fill="#7753a8"/><circle cx="180" cy="444.0" r="7" fill="#7753a8"/><path d="M90 522.0 L180 444.0" stroke="#bda7d6" fill="none"/><circle cx="270" cy="496.0" r="7" fill="#7753a8"/><path d="M180 444.0 L270 496.0" stroke="#bda7d6" fill="none"/><circle cx="360" cy="418.0" r="7" fill="#7753a8"/><path d="M270 496.0 L360 418.0" stroke="#bda7d6" fill="none"/><circle cx="450" cy="509.0" r="7" fill="#7753a8"/><path d="M360 418.0 L450 509.0" stroke="#bda7d6" fill="none"/><circle cx="540" cy="431.0" r="7" fill="#7753a8"/><path d="M450 509.0 L540 431.0" stroke="#bda7d6" fill="none"/><circle cx="630" cy="483.0" r="7" fill="#7753a8"/><path d="M540 431.0 L630 483.0" stroke="#bda7d6" fill="none"/><circle cx="720" cy="411.5" r="7" fill="#7753a8"/><path d="M630 483.0 L720 411.5" stroke="#bda7d6" fill="none"/><circle cx="810" cy="528.5" r="7" fill="#7753a8"/><path d="M720 411.5 L810 528.5" stroke="#bda7d6" fill="none"/><circle cx="900" cy="457.0" r="7" fill="#7753a8"/><path d="M810 528.5 L900 457.0" stroke="#bda7d6" fill="none"/><text x="45" y="575" fill="#253d3c" font-size="15" font-weight="400">阈值序列示意（非论文实际数值）；跨帧运动过大会降低可恢复性。</text><path d="M40 606H1160" stroke="#dae5dc"/><text x="40" y="631" fill="#71867e" font-size="12" font-weight="400">依据原论文 Fig.1 / §3–4 重绘；省略网络层与硬件电路。</text><text x="1000" y="631" fill="#71867e" font-size="11" font-weight="400">原创概念重绘 · 非原图</text></g></svg>
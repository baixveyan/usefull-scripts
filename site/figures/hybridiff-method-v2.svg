<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1250" viewBox="0 0 1400 1250" role="img" aria-labelledby="title desc"><title id="title">HybriDiff ｜CFG双分支、混合调度与误差传播</title><desc id="desc">原创中文详图：解释可核实的计算依赖；教学时序不冒充作者逐层实现。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1250" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">HybriDiff ｜CFG双分支、混合调度与误差传播</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">原创中文详图：解释可核实的计算依赖；教学时序不冒充作者逐层实现。</text><rect x="28" y="115" width="1344" height="250" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  同一步、同一张潜图：两个前向之后必须汇合</text><rect x="52" y="180" width="300" height="165" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="212" font-size="23" fill="#2376c5" font-weight="700">相同x_t / 不同条件</text><text x="70" y="245" font-size="19" fill="#18334c" font-weight="400">GPU A：f(x_t,t,c) → ε_c</text><text x="70" y="274" font-size="19" fill="#18334c" font-weight="400">GPU B：f(x_t,t,空) → ε_u</text><text x="70" y="303" font-size="19" fill="#18334c" font-weight="400">两个输出都与潜变量同形</text><text x="70" y="332" font-size="19" fill="#18334c" font-weight="400">处理整图，不是左右切图</text><path d="M352,255 L420,255" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="435" y="180" width="435" height="165" fill="#fff" stroke="#17816c" rx="16"/><text x="453" y="212" font-size="23" fill="#17816c" font-weight="700">引导组合 → 采样器更新</text><text x="453" y="245" font-size="19" fill="#18334c" font-weight="400">本文：ε_cfg = ε_c + w(ε_c−ε_u)</text><text x="453" y="274" font-size="19" fill="#18334c" font-weight="400">另一常见记号：ε_u+s(ε_c−ε_u)</text><text x="453" y="303" font-size="19" fill="#18334c" font-weight="400">二者只有s=1+w时对应</text><text x="453" y="332" font-size="19" fill="#18334c" font-weight="400">汇合预测后才得到下一步潜变量</text><path d="M870,255 L930,255" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="945" y="180" width="390" height="165" fill="#fff" stroke="#7750ad" rx="16"/><text x="963" y="212" font-size="23" fill="#7750ad" font-weight="700">教学：ε_c=2，ε_u=1.5</text><text x="963" y="245" font-size="19" fill="#18334c" font-weight="400">w=3 → 2+3×.5=3.5</text><text x="963" y="274" font-size="19" fill="#18334c" font-weight="400">若另一记号也填3 → 3.0</text><text x="963" y="303" font-size="19" fill="#18334c" font-weight="400">仅参数名相似不代表配置相同</text><text x="963" y="332" font-size="19" fill="#18334c" font-weight="400">本方法不反向更新模型权重</text><rect x="28" y="390" width="1344" height="270" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="424" font-size="24" fill="#18334c" font-weight="700">02  执行步j递增；不要与递减的噪声时间t混用</text><rect x="52" y="455" width="380" height="155" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="487" font-size="23" fill="#2376c5" font-weight="700">前段：条件划分</text><text x="70" y="520" font-size="19" fill="#18334c" font-weight="400">保留条件 / 无条件路径</text><text x="70" y="549" font-size="19" fill="#18334c" font-weight="400">收集分支差异指标</text><text x="70" y="578" font-size="19" fill="#18334c" font-weight="400">计算窗口斜率与进入条件</text><path d="M432,528 L478,528" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="493" y="455" width="395" height="155" fill="#fff" stroke="#c36b24" rx="16"/><text x="511" y="487" font-size="23" fill="#c36b24" font-weight="700">中段：额外流水并行</text><text x="511" y="520" font-size="19" fill="#18334c" font-weight="400">跨路径交换与跨步交错</text><text x="511" y="549" font-size="19" fill="#18334c" font-weight="400">引入近似计算 / 依赖变化</text><text x="511" y="578" font-size="19" fill="#18334c" font-weight="400">逐层缓存规格需附录C/F</text><path d="M888,528 L932,528" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="947" y="455" width="390" height="155" fill="#fff" stroke="#17816c" rx="16"/><text x="965" y="487" font-size="23" fill="#17816c" font-weight="700">末段：恢复条件划分</text><text x="965" y="520" font-size="19" fill="#18334c" font-weight="400">继续条件细节精修</text><text x="965" y="549" font-size="19" fill="#18334c" font-weight="400">不是改成一个全连接层</text><text x="965" y="578" font-size="19" fill="#18334c" font-weight="400">结束点是进入后固定k步</text><text x="70" y="640" font-size="22" fill="#7750ad" font-weight="400">教学：j₁=8，k=10 → j₂=18；不是在线检测每幅图下一次真实分歧。</text><rect x="28" y="685" width="1344" height="245" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="719" font-size="24" fill="#18334c" font-weight="700">03  相对差异与近似误差：两个算例各自回答不同问题</text><rect x="52" y="750" width="595" height="165" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="782" font-size="23" fill="#2376c5" font-weight="700">M：分支预测差异的相对尺度</text><text x="70" y="815" font-size="19" fill="#18334c" font-weight="400">ε_u=(1,−1)，ε_c=(1.1,−.9)</text><text x="70" y="844" font-size="19" fill="#18334c" font-weight="400">差的L1=.2；基准L1=2 → M=.1</text><text x="70" y="873" font-size="19" fill="#18334c" font-weight="400">不是图像误差10%，也不是语义准确率</text><text x="70" y="902" font-size="19" fill="#18334c" font-weight="400">期望之比 ≠ 比值的期望</text><rect x="697" y="750" width="640" height="165" fill="#fff" stroke="#c36b24" rx="16"/><text x="715" y="782" font-size="23" fill="#c36b24" font-weight="700">CFG会放大不对称预测误差</text><text x="715" y="815" font-size="19" fill="#18334c" font-weight="400">误差传播：(1+w)d_c − w d_u</text><text x="715" y="844" font-size="19" fill="#18334c" font-weight="400">w=3，d_c=.1，d_u=0 → 偏差.4</text><text x="715" y="873" font-size="19" fill="#18334c" font-weight="400">后续采样把误差带入新的潜变量</text><text x="715" y="902" font-size="19" fill="#18334c" font-weight="400">低M不是最终图像误差上界</text><rect x="28" y="955" width="1344" height="240" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="989" font-size="24" fill="#18334c" font-weight="700">04  调度与性能声明的边界</text><text x="55" y="1022" font-size="22" fill="#18334c" font-weight="700">斜率符号须匹配时间方向；τ_cap来自全局最低点，纯在线获取方式主文未明。</text><text x="55" y="1070" font-size="21" fill="#7750ad" font-weight="400">双卡7.12秒对单卡16.49秒：约2.316×；包含近似策略，不是相同计算免费翻倍。</text><text x="55" y="1118" font-size="22" fill="#2376c5" font-weight="400">多GPU分组生成多张图提升吞吐；单张图的层级流水线是另一种扩展。</text><text x="55" y="1166" font-size="20" fill="#586d80" font-weight="400">依据Fig.3、式1–4、§3–4.5，PDF4–6；未执行多GPU推理或核验附录实现。</text><text x="36" y="1227" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1240" viewBox="0 0 1400 1240" role="img" aria-labelledby="title desc"><title id="title">HistoSelect ｜组织决定分组，问题决定预算与证据</title><desc id="desc">原创中文教学图：分清组级比例、组内排序、硬选择与替代梯度。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1240" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">HistoSelect ｜组织决定分组，问题决定预算与证据</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">原创中文教学图：分清组级比例、组内排序、硬选择与替代梯度。</text><rect x="28" y="115" width="1344" height="245" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  先按组织分组，再让问题决定保留预算</text><rect x="52" y="179" width="380" height="165" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="211" font-size="23" fill="#2376c5" font-weight="700">CONCH图像 / 文本空间</text><text x="70" y="244" font-size="19" fill="#18334c" font-weight="400">224×224图块 → x_i</text><text x="70" y="273" font-size="19" fill="#18334c" font-weight="400">专家组织提示 → t_j</text><text x="70" y="302" font-size="19" fill="#18334c" font-weight="400">最大余弦指定组织类别</text><text x="70" y="331" font-size="19" fill="#18334c" font-weight="400">patch标签不是像素级真值</text><path d="M432,258 L484,258" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="494" y="179" width="395" height="165" fill="#fff" stroke="#7750ad" rx="16"/><text x="512" y="211" font-size="23" fill="#7750ad" font-weight="700">组原型 + 问题 → 比例</text><text x="512" y="244" font-size="19" fill="#18334c" font-weight="400">g_j = 组内特征平均</text><text x="512" y="273" font-size="19" fill="#18334c" font-weight="400">[g_j;q] → 两层网络 → sigmoid</text><text x="512" y="302" font-size="19" fill="#18334c" font-weight="400">r_j是每组比例，不是softmax</text><text x="512" y="331" font-size="19" fill="#18334c" font-weight="400">均值可能稀释少量特殊结构</text><path d="M889,258 L941,258" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="951" y="179" width="385" height="165" fill="#fff" stroke="#17816c" rx="16"/><text x="969" y="211" font-size="23" fill="#17816c" font-weight="700">组内分数 → top-k</text><text x="969" y="244" font-size="19" fill="#18334c" font-weight="400">[x_i;q] → 两层网络 → s_i</text><text x="969" y="273" font-size="19" fill="#18334c" font-weight="400">k_j = ceil(r_j N_j)</text><text x="969" y="302" font-size="19" fill="#18334c" font-weight="400">每组分别按s_i选前k_j</text><text x="969" y="331" font-size="19" fill="#18334c" font-weight="400">不是独立Bernoulli随机抽样</text><rect x="28" y="385" width="1344" height="225" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="419" font-size="24" fill="#18334c" font-weight="700">02  教学例：14个图块选出5个；极小比例仍可能留一个</text><text x="70" y="457" font-size="24" fill="#18334c" font-weight="700">组织组</text><text x="350" y="457" font-size="24" fill="#18334c" font-weight="700">图块数 N_j</text><text x="660" y="457" font-size="24" fill="#18334c" font-weight="700">比例 r_j</text><text x="1000" y="457" font-size="24" fill="#18334c" font-weight="700">保留数 k_j</text><text x="70" y="501" font-size="23" fill="#2376c5" font-weight="400">A</text><text x="350" y="501" font-size="23" fill="#2376c5" font-weight="400">8</text><text x="660" y="501" font-size="23" fill="#2376c5" font-weight="400">.25</text><text x="1000" y="501" font-size="23" fill="#2376c5" font-weight="400">2</text><text x="70" y="544" font-size="23" fill="#7750ad" font-weight="400">B</text><text x="350" y="544" font-size="23" fill="#7750ad" font-weight="400">4</text><text x="660" y="544" font-size="23" fill="#7750ad" font-weight="400">.50</text><text x="1000" y="544" font-size="23" fill="#7750ad" font-weight="400">2</text><text x="70" y="587" font-size="23" fill="#17816c" font-weight="400">C</text><text x="350" y="587" font-size="23" fill="#17816c" font-weight="400">2</text><text x="660" y="587" font-size="23" fill="#17816c" font-weight="400">.10</text><text x="1000" y="587" font-size="23" fill="#17816c" font-weight="400">1</text><rect x="28" y="635" width="1344" height="255" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="669" font-size="24" fill="#18334c" font-weight="700">03  两类梯度：任务通过STE近似，正则直接约束软概率</text><rect x="52" y="701" width="585" height="165" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="733" font-size="23" fill="#2376c5" font-weight="700">前向硬选，反向替代梯度</text><text x="70" y="766" font-size="19" fill="#18334c" font-weight="400">选中patch → 投影 / LLM → 答案负对数似然</text><text x="70" y="795" font-size="19" fill="#18334c" font-weight="400">硬top-k与ceil本身不可微</text><text x="70" y="824" font-size="19" fill="#18334c" font-weight="400">STE反向通过软概率近似传播</text><text x="70" y="853" font-size="19" fill="#18334c" font-weight="400">两级mask及变长操作仍需核对实现</text><rect x="697" y="701" width="639" height="165" fill="#fff" stroke="#c36b24" rx="16"/><text x="715" y="733" font-size="23" fill="#c36b24" font-weight="700">组KL + patch KL</text><text x="715" y="766" font-size="19" fill="#18334c" font-weight="400">KL(B(π)||B(p))将π拉向p</text><text x="715" y="795" font-size="19" fill="#18334c" font-weight="400">教学 π=.8、p=.2 → KL≈.8318</text><text x="715" y="824" font-size="19" fill="#18334c" font-weight="400">先验高时也可能鼓励保留，不是永远压缩</text><text x="715" y="853" font-size="19" fill="#18334c" font-weight="400">余弦可负；Bernoulli需[0,1]，映射未交代</text><rect x="28" y="915" width="1344" height="265" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="949" font-size="24" fill="#18334c" font-weight="700">04  三个不能省略的边界</text><text x="55" y="983" font-size="23" fill="#18334c" font-weight="700">预算：非空组且r_j&gt;0时，ceil至少保留1个；独立比例并不自动满足全局固定K。</text><text x="55" y="1030" font-size="22" fill="#7750ad" font-weight="400">成本：全部图块仍需编码与评分；减少LLM视觉token不等于省掉全部WSI计算。</text><text x="55" y="1077" font-size="22" fill="#c36b24" font-weight="400">解释：被保留的patch可供核查，但不等于因果证据或已验证的临床诊断依据。</text><text x="55" y="1124" font-size="21" fill="#586d80" font-weight="400">依据式1–12与§3.6，PDF4–6；本图数字为教学构造，未处理患者数据或复现实验。</text><text x="36" y="1217" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1250" viewBox="0 0 1400 1250" role="img" aria-labelledby="title desc"><title id="title">Omnivorous DINO ｜跨模态靠近，场景身份与教师方向保留</title><desc id="desc">原创中文详图：共享学生、固定教师、场景级正负例和dense负例排除规则。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1250" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">Omnivorous DINO ｜跨模态靠近，场景身份与教师方向保留</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">原创中文详图：共享学生、固定教师、场景级正负例和dense负例排除规则。</text><rect x="28" y="115" width="1344" height="245" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  输入构造与更新范围：同一套参数处理不同模态</text><rect x="52" y="179" width="380" height="165" fill="#fff" stroke="#c36b24" rx="16"/><text x="70" y="211" font-size="23" fill="#c36b24" font-weight="700">同场景RGB / 深度 / 分割</text><text x="70" y="244" font-size="19" fill="#18334c" font-weight="400">RGB增强 → 64-bin自然调色板</text><text x="70" y="273" font-size="19" fill="#18334c" font-weight="400">深度和分割先着色，再做mixup</text><text x="70" y="302" font-size="19" fill="#18334c" font-weight="400">训练α∈[0,.5]；评价α=0</text><text x="70" y="331" font-size="19" fill="#18334c" font-weight="400">评价着色仍依赖对应RGB</text><path d="M432,255 L480,255" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="495" y="179" width="395" height="165" fill="#fff" stroke="#2376c5" rx="16"/><text x="513" y="211" font-size="23" fill="#2376c5" font-weight="700">冻结前8块 f* → 两个末层分支</text><text x="513" y="244" font-size="19" fill="#18334c" font-weight="400">学生后4块g：可训练，各模态共用</text><text x="513" y="273" font-size="19" fill="#18334c" font-weight="400">教师后4块g*：冻结</text><text x="513" y="302" font-size="19" fill="#18334c" font-weight="400">h=g(f*(x))；h*=g*(f*(x))</text><text x="513" y="331" font-size="19" fill="#18334c" font-weight="400">输出L2归一；不另造三个适配器</text><path d="M890,255 L938,255" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="953" y="179" width="380" height="165" fill="#fff" stroke="#17816c" rx="16"/><text x="971" y="211" font-size="23" fill="#17816c" font-weight="700">两种目标，梯度只进学生</text><text x="971" y="244" font-size="19" fill="#18334c" font-weight="400">对齐：不同模态、同一场景</text><text x="971" y="273" font-size="19" fill="#18334c" font-weight="400">锚定：学生与同模态教师</text><text x="971" y="302" font-size="19" fill="#18334c" font-weight="400">L=L_align+10 L_anchor</text><text x="971" y="331" font-size="19" fill="#18334c" font-weight="400">不是深度学生对RGB教师</text><rect x="28" y="385" width="1344" height="270" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="419" font-size="24" fill="#18334c" font-weight="700">02  场景匹配矩阵：对角正例，异场景负例</text><text x="65" y="460" font-size="23" fill="#18334c" font-weight="700">查询</text><text x="245" y="460" font-size="23" fill="#18334c" font-weight="700">深度A</text><text x="425" y="460" font-size="23" fill="#18334c" font-weight="700">深度B</text><text x="65" y="518" font-size="23" fill="#18334c" font-weight="400">RGB A</text><text x="65" y="584" font-size="23" fill="#18334c" font-weight="400">RGB B</text><text x="245" y="518" font-size="28" fill="#17816c" font-weight="700">正</text><text x="425" y="518" font-size="28" fill="#c36b24" font-weight="700">负</text><text x="245" y="584" font-size="28" fill="#c36b24" font-weight="700">负</text><text x="425" y="584" font-size="28" fill="#17816c" font-weight="700">正</text><text x="650" y="465" font-size="23" fill="#2376c5" font-weight="700">教学N=2、τ=1：相似度为[1,0]</text><text x="650" y="513" font-size="21" fill="#18334c" font-weight="400">正确概率e/(e+1)≈.731；损失≈.313。</text><text x="650" y="561" font-size="21" fill="#18334c" font-weight="400">若全相同[1,1]，损失ln2≈.693。</text><text x="650" y="609" font-size="21" fill="#7750ad" font-weight="400">负例已反对塌缩；锚定额外约束表示漂移。</text><rect x="28" y="680" width="1344" height="270" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="714" font-size="24" fill="#18334c" font-weight="700">03  Dense token与单位球面锚定：分别控制位置与方向</text><rect x="52" y="745" width="595" height="185" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="777" font-size="23" fill="#2376c5" font-weight="700">每图抽64个dense token</text><text x="70" y="810" font-size="19" fill="#18334c" font-weight="400">N=2：目标模态共128个抽样token</text><text x="70" y="839" font-size="19" fill="#18334c" font-weight="400">场景A内其他位置不当作负例</text><text x="70" y="868" font-size="19" fill="#18334c" font-weight="400">场景B的64个位置是负例来源</text><text x="70" y="897" font-size="19" fill="#18334c" font-weight="400">正对不能被mask删掉；精确对应需核查</text><text x="70" y="926" font-size="19" fill="#18334c" font-weight="400">CLS与dense分别计算，最终归约需代码</text><rect x="697" y="745" width="637" height="185" fill="#fff" stroke="#7750ad" rx="16"/><text x="715" y="777" font-size="23" fill="#7750ad" font-weight="700">教学锚定：教师(1,0)，学生(.8,.6)</text><text x="715" y="810" font-size="19" fill="#18334c" font-weight="400">两者均为单位向量；cos=.8</text><text x="715" y="839" font-size="19" fill="#18334c" font-weight="400">1−cos=.2；权重10后为2</text><text x="715" y="868" font-size="19" fill="#18334c" font-weight="400">单位向量上1−u·v=||u−v||²/2</text><text x="715" y="897" font-size="19" fill="#18334c" font-weight="400">约束方向，不保持归一化前的幅值</text><text x="715" y="926" font-size="19" fill="#18334c" font-weight="400">教师固定；跨模态对齐与锚定存在拉扯</text><rect x="28" y="975" width="1344" height="225" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="1009" font-size="24" fill="#18334c" font-weight="700">04  使用阶段：共享编码器不等于没有输入条件</text><text x="55" y="1042" font-size="23" fill="#18334c" font-weight="700">检索用学生CLS或dense均值，再归一化；分别评价6个有向模态对。</text><text x="55" y="1090" font-size="22" fill="#17816c" font-weight="400">下游任务先冻结学生再训练任务头；RGB训练深度头，分割输入仍输出深度。</text><text x="55" y="1138" font-size="22" fill="#c36b24" font-weight="400">τ=0的除法未定义；双向InfoNCE和dense正对构造不能从简写公式猜定。</text><text x="55" y="1180" font-size="20" fill="#586d80" font-weight="400">依据§3–4.3、式1–4，PDF3–5；教学例非实验数据，未训练模型。</text><text x="36" y="1227" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>
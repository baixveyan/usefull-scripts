<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1250" viewBox="0 0 1400 1250" role="img" aria-labelledby="title desc"><title id="title">D²C ｜挑选真实图像，再把语义与视觉知识附加给学生</title><desc id="desc">依据Fig.2/4、式5–12与Table 6，PDF3–8；明确离线缓存、训练梯度与公式核对边界。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1250" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">D²C ｜挑选真实图像，再把语义与视觉知识附加给学生</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据Fig.2/4、式5–12与Table 6，PDF3–8；明确离线缓存、训练梯度与公式核对边界。</text><rect x="28" y="115" width="1344" height="250" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  Select：先核对分数方向，再说明固定预算怎样取排名</text><rect x="52" y="179" width="585" height="165" fill="#fff" stroke="#c36b24" rx="16"/><text x="70" y="211" font-size="23" fill="#c36b24" font-weight="700">评分模型读取真实图像、类别、时间与噪声</text><text x="70" y="244" font-size="19" fill="#18334c" font-weight="400">去噪误差用于估计学习难度</text><text x="70" y="273" font-size="19" fill="#18334c" font-weight="400">原式7印负MSE，但文字说高分更难</text><text x="70" y="302" font-size="19" fill="#18334c" font-weight="400">教学误差 .1 / .9 → 取负 −.1 / −.9</text><text x="70" y="331" font-size="19" fill="#18334c" font-weight="400">排序方向会反转，必须核对实际实现</text><rect x="697" y="179" width="639" height="165" fill="#fff" stroke="#2376c5" rx="16"/><text x="715" y="211" font-size="23" fill="#2376c5" font-weight="700">每类排序 + 间隔取样</text><text x="715" y="244" font-size="19" fill="#18334c" font-weight="400">教学：12张图，每类预算3张</text><text x="715" y="273" font-size="19" fill="#18334c" font-weight="400">k=1：索引0,1,2；k=3：0,3,6；k=5：0,5,10</text><text x="715" y="302" font-size="19" fill="#18334c" font-weight="400">固定取3张才体现覆盖区域变化</text><text x="715" y="331" font-size="19" fill="#18334c" font-weight="400">遍历全列表的集合式还需截断 / 越界规则</text><rect x="28" y="390" width="1344" height="250" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="424" font-size="24" fill="#18334c" font-weight="700">02  Attach：离线缓存两种信息，各自回答不同问题</text><rect x="52" y="456" width="585" height="165" fill="#fff" stroke="#7750ad" rx="16"/><text x="70" y="488" font-size="23" fill="#7750ad" font-weight="700">类别文本：类间语义</text><text x="70" y="521" font-size="19" fill="#18334c" font-weight="400">类别提示 → T5 → 文本token + mask</text><text x="70" y="550" font-size="19" fill="#18334c" font-weight="400">训练时：mask → Conv1d → 残差MLP</text><text x="70" y="579" font-size="19" fill="#18334c" font-weight="400">加可学习类别嵌入 → 条件表示</text><text x="70" y="608" font-size="19" fill="#18334c" font-weight="400">卷积 / 汇聚 / 投影须满足相加维度</text><rect x="697" y="456" width="639" height="165" fill="#fff" stroke="#17816c" rx="16"/><text x="715" y="488" font-size="23" fill="#17816c" font-weight="700">逐图视觉：类内结构</text><text x="715" y="521" font-size="19" fill="#18334c" font-weight="400">选中真实图 → DINOv2 → patch表征</text><text x="715" y="550" font-size="19" fill="#18334c" font-weight="400">缓存前h个token：h须不大于已有token数</text><text x="715" y="579" font-size="19" fill="#18334c" font-weight="400">截取不是自动空间对齐，也不是重要性排序</text><text x="715" y="608" font-size="19" fill="#18334c" font-weight="400">教师缓存固定，作为学生的监督目标</text><rect x="28" y="665" width="1344" height="255" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="699" font-size="24" fill="#18334c" font-weight="700">03  训练：任务预测与中间特征对齐，共同更新目标扩散模型</text><rect x="52" y="731" width="380" height="165" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="763" font-size="23" fill="#2376c5" font-weight="700">学生前向</text><text x="70" y="796" font-size="19" fill="#18334c" font-weight="400">图像 → latent → 随机加噪</text><text x="70" y="825" font-size="19" fill="#18334c" font-weight="400">输入时间、类别与文本条件</text><text x="70" y="854" font-size="19" fill="#18334c" font-weight="400">输出噪声 / 对应骨干训练目标</text><text x="70" y="883" font-size="19" fill="#18334c" font-weight="400">同时读取指定层学生token</text><path d="M432,810 L484,810" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="494" y="731" width="395" height="165" fill="#fff" stroke="#17816c" rx="16"/><text x="512" y="763" font-size="23" fill="#17816c" font-weight="700">视觉辅助目标</text><text x="512" y="796" font-size="19" fill="#18334c" font-weight="400">投影 φ：学生维度 → 教师维度</text><text x="512" y="825" font-size="19" fill="#18334c" font-weight="400">负余弦平均：−mean cos(φ(h),v)</text><text x="512" y="854" font-size="19" fill="#18334c" font-weight="400">梯度经φ回到学生</text><text x="512" y="883" font-size="19" fill="#18334c" font-weight="400">缓存v不随训练更新</text><path d="M889,810 L941,810" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="951" y="731" width="385" height="165" fill="#fff" stroke="#7750ad" rx="16"/><text x="969" y="763" font-size="23" fill="#7750ad" font-weight="700">合并损失</text><text x="969" y="796" font-size="19" fill="#18334c" font-weight="400">L_total = L_diff + .5 L_proj</text><text x="969" y="825" font-size="19" fill="#18334c" font-weight="400">教学：(3,4)与(0,1)余弦=.8</text><text x="969" y="854" font-size="19" fill="#18334c" font-weight="400">L_diff=.6 → 总损失=.2</text><text x="969" y="883" font-size="19" fill="#18334c" font-weight="400">视觉项可为负，不是错误</text><rect x="28" y="945" width="1344" height="245" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="979" font-size="24" fill="#18334c" font-weight="700">04  训练数据比例、推理接口、总成本要分开理解</text><text x="55" y="1013" font-size="22" fill="#18334c" font-weight="700">采样：噪声 + 类别 / 文本条件 → 生成图；视觉缓存用于训练对齐，不是必需参考图。</text><text x="55" y="1060" font-size="22" fill="#c36b24" font-weight="400">0.8%是目标训练子集：评分会看原数据，预训练知识与表征存储并未消失。</text><text x="55" y="1107" font-size="22" fill="#2376c5" font-weight="400">作者Table 6：预训练评分器2.1h + 训练7.4h = 9.5h；自训评分器合计35.5h。</text><text x="55" y="1154" font-size="21" fill="#586d80" font-weight="400">本文索引、向量与损失为教学计算；未训练模型、未生成图像、未下载训练数据。</text><text x="36" y="1227" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>
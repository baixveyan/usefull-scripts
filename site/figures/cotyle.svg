<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">CoTyle：一个 code 是入口，内部仍是一串风格索引</title><desc id="desc">风格复现依赖码本、AR、DiT 与采样版本；不声称数据集之外绝对原创。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#6e8a83"/></marker><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#dde6dd"/></pattern></defs><rect width="1200" height="660" rx="20" fill="#fafcf8"/><rect y="110" width="1200" height="490" fill="url(#dots)"/><g font-family="Inter,Segoe UI,Microsoft YaHei,sans-serif"><text x="40" y="38" fill="#688279" font-size="11" font-weight="650">PAPER ATLAS / METHOD EXPLAINED</text><text x="40" y="75" fill="#1f3d34" font-size="28" font-weight="650">CoTyle：一个 code 是入口，内部仍是一串风格索引</text><text x="40" y="103" fill="#71867e" font-size="13" font-weight="400">风格复现依赖码本、AR、DiT 与采样版本；不声称数据集之外绝对原创。</text><rect x="40" y="145" width="285" height="175" rx="14" fill="#e7effb" stroke="#3b6fba" stroke-opacity=".25"/><text x="60" y="177" fill="#3b6fba" font-size="18" font-weight="650">训练 A：风格码本 + DiT</text><text x="60" y="206" fill="#253d3c" font-size="14" font-weight="400">同风格、不同内容图像对</text><text x="60" y="231" fill="#253d3c" font-size="14" font-weight="400">1024 码字 / 64 维</text><text x="60" y="256" fill="#253d3c" font-size="14" font-weight="400">每图 196 枚风格索引</text><text x="60" y="281" fill="#253d3c" font-size="14" font-weight="400">风格条件通过文本分支注入</text><rect x="440" y="145" width="310" height="175" rx="14" fill="#f0eafa" stroke="#7753a8" stroke-opacity=".25"/><text x="460" y="177" fill="#7753a8" font-size="18" font-weight="650">训练 B：风格 AR</text><text x="460" y="206" fill="#253d3c" font-size="14" font-weight="400">固定码本编码训练图</text><text x="460" y="231" fill="#253d3c" font-size="14" font-weight="400">Qwen2-0.5B 架构从头训练</text><text x="460" y="256" fill="#253d3c" font-size="14" font-weight="400">学习索引序列 next-token</text><text x="460" y="281" fill="#253d3c" font-size="14" font-weight="400">不直接从一个数字恢复图片</text><path d="M325 230 L440 230" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="860" y="145" width="295" height="175" rx="14" fill="#fff1df" stroke="#aa6b29" stroke-opacity=".25"/><text x="880" y="177" fill="#aa6b29" font-size="18" font-weight="650">用户输入：数值 code</text><text x="880" y="206" fill="#253d3c" font-size="14" font-weight="400">设置风格采样种子</text><text x="880" y="231" fill="#253d3c" font-size="14" font-weight="400">固定模型与采样参数</text><text x="880" y="256" fill="#253d3c" font-size="14" font-weight="400">不是跨平台通用风格编号</text><rect x="440" y="425" width="310" height="135" rx="14" fill="#e5f3ec" stroke="#237958" stroke-opacity=".25"/><text x="460" y="457" fill="#237958" font-size="18" font-weight="650">AR → 索引 → 风格 embedding</text><text x="460" y="486" fill="#253d3c" font-size="14" font-weight="400">高频索引抑制</text><text x="460" y="511" fill="#253d3c" font-size="14" font-weight="400">查码本并解码风格</text><text x="460" y="536" fill="#253d3c" font-size="14" font-weight="400">同 code 可搭配不同内容</text><path d="M1000 320 L750 470" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="860" y="425" width="295" height="135" rx="14" fill="#e5f3ec" stroke="#237958" stroke-opacity=".25"/><text x="880" y="457" fill="#237958" font-size="18" font-weight="650">内容文本 + 风格 → DiT</text><text x="880" y="486" fill="#253d3c" font-size="14" font-weight="400">生成一致风格的不同内容</text><text x="880" y="511" fill="#253d3c" font-size="14" font-weight="400">像素噪声可独立变化</text><text x="880" y="536" fill="#253d3c" font-size="14" font-weight="400">多样性与一致性有折中</text><path d="M750 490 L860 490" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M40 606H1160" stroke="#dae5dc"/><text x="40" y="631" fill="#71867e" font-size="12" font-weight="400">依据原论文 Fig.3 / Algorithm1 重绘；损失符号与频率抑制细节见讲解核对点。</text><text x="1000" y="631" fill="#71867e" font-size="11" font-weight="400">原创概念重绘 · 非原图</text></g></svg>
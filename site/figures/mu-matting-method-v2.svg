<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1190" viewBox="0 0 1400 1190" role="img" aria-labelledby="title desc"><title id="title">μMatting ｜把4K算力留给细节，把时间变化交给真值</title><desc id="desc">依据原文 §4、Fig.5、式1–5，PDF 5–6；小网格与alpha变化均为解释例子。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1190" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">μMatting ｜把4K算力留给细节，把时间变化交给真值</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据原文 §4、Fig.5、式1–5，PDF 5–6；小网格与alpha变化均为解释例子。</text><rect x="28" y="115" width="1344" height="270" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  粗定位会缩图；细化路径仍读取原分辨率 RGB</text><rect x="52" y="178" width="280" height="140" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="210" font-size="23" fill="#2376c5" font-weight="700">输入：4帧 RGB</text><text x="70" y="243" font-size="19" fill="#18334c" font-weight="400">T × H × W × 3</text><text x="70" y="272" font-size="19" fill="#18334c" font-weight="400">原始像素保留给细化路径</text><path d="M332,240 L388,240" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="398" y="178" width="295" height="140" fill="#fff" stroke="#7750ad" rx="16"/><text x="416" y="210" font-size="23" fill="#7750ad" font-weight="700">CAP：512 × 512</text><text x="416" y="243" font-size="19" fill="#18334c" font-weight="400">Sapiens 人像先验</text><text x="416" y="272" font-size="19" fill="#18334c" font-weight="400">粗 alpha → 形态学关键区 K</text><text x="416" y="301" font-size="19" fill="#18334c" font-weight="400">A_c 与 K 上采样回原尺寸</text><path d="M693,240 L747,240" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="757" y="178" width="305" height="140" fill="#fff" stroke="#17816c" rx="16"/><text x="775" y="210" font-size="23" fill="#17816c" font-weight="700">FAR：原分辨稀疏细化</text><text x="775" y="243" font-size="19" fill="#18334c" font-weight="400">输入 [RGB, A_c] 共4通道</text><text x="775" y="272" font-size="19" fill="#18334c" font-weight="400">只抽取 K 中的时空位置</text><text x="775" y="301" font-size="19" fill="#18334c" font-weight="400">稀疏3D编码 / 调制 / 解码</text><path d="M1062,240 L1114,240" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="1124" y="178" width="212" height="140" fill="#fff" stroke="#2376c5" rx="16"/><text x="1142" y="210" font-size="23" fill="#2376c5" font-weight="700">融合输出 A</text><text x="1142" y="243" font-size="19" fill="#18334c" font-weight="400">K=1：选 A_d</text><text x="1142" y="272" font-size="19" fill="#18334c" font-weight="400">K=0：保留 A_c</text><text x="1142" y="301" font-size="19" fill="#18334c" font-weight="400">没有自动求平均</text><path d="M190 318 L190 351 L910 351 L910 325" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><text x="390" y="342" font-size="20" fill="#2376c5" font-weight="700">原分辨 RGB 直达细化输入</text><rect x="28" y="410" width="1344" height="230" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="444" font-size="24" fill="#18334c" font-weight="700">02  稀疏表要带坐标；3D 是 t、y、x，不是物理场景 XYZ</text><rect x="65" y="479" width="31" height="27" fill="#e5ebf0" stroke="#d9e3ec" rx="3"/><rect x="101" y="479" width="31" height="27" fill="#b9e8d9" stroke="#17816c" rx="3"/><rect x="137" y="479" width="31" height="27" fill="#b9e8d9" stroke="#17816c" rx="3"/><rect x="173" y="479" width="31" height="27" fill="#e5ebf0" stroke="#d9e3ec" rx="3"/><rect x="209" y="479" width="31" height="27" fill="#e5ebf0" stroke="#d9e3ec" rx="3"/><rect x="245" y="479" width="31" height="27" fill="#e5ebf0" stroke="#d9e3ec" rx="3"/><rect x="65" y="511" width="31" height="27" fill="#e5ebf0" stroke="#d9e3ec" rx="3"/><rect x="101" y="511" width="31" height="27" fill="#b9e8d9" stroke="#17816c" rx="3"/><rect x="137" y="511" width="31" height="27" fill="#e5ebf0" stroke="#d9e3ec" rx="3"/><rect x="173" y="511" width="31" height="27" fill="#b9e8d9" stroke="#17816c" rx="3"/><rect x="209" y="511" width="31" height="27" fill="#e5ebf0" stroke="#d9e3ec" rx="3"/><rect x="245" y="511" width="31" height="27" fill="#e5ebf0" stroke="#d9e3ec" rx="3"/><rect x="65" y="543" width="31" height="27" fill="#e5ebf0" stroke="#d9e3ec" rx="3"/><rect x="101" y="543" width="31" height="27" fill="#e5ebf0" stroke="#d9e3ec" rx="3"/><rect x="137" y="543" width="31" height="27" fill="#b9e8d9" stroke="#17816c" rx="3"/><rect x="173" y="543" width="31" height="27" fill="#e5ebf0" stroke="#d9e3ec" rx="3"/><rect x="209" y="543" width="31" height="27" fill="#b9e8d9" stroke="#17816c" rx="3"/><rect x="245" y="543" width="31" height="27" fill="#e5ebf0" stroke="#d9e3ec" rx="3"/><rect x="65" y="575" width="31" height="27" fill="#e5ebf0" stroke="#d9e3ec" rx="3"/><rect x="101" y="575" width="31" height="27" fill="#e5ebf0" stroke="#d9e3ec" rx="3"/><rect x="137" y="575" width="31" height="27" fill="#e5ebf0" stroke="#d9e3ec" rx="3"/><rect x="173" y="575" width="31" height="27" fill="#b9e8d9" stroke="#17816c" rx="3"/><rect x="209" y="575" width="31" height="27" fill="#b9e8d9" stroke="#17816c" rx="3"/><rect x="245" y="575" width="31" height="27" fill="#e5ebf0" stroke="#d9e3ec" rx="3"/><text x="65" y="625" font-size="19" fill="#586d80" font-weight="400">概念网格：绿色是 K</text><path d="M293,535 L360,535" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="370" y="477" width="475" height="130" fill="#fff" stroke="#17816c" rx="16"/><text x="388" y="509" font-size="23" fill="#17816c" font-weight="700">Gather → S_in：N_K × 4</text><text x="388" y="542" font-size="19" fill="#18334c" font-weight="400">特征：[R,G,B,粗 alpha]</text><text x="388" y="571" font-size="19" fill="#18334c" font-weight="400">另存 (t,y,x) 索引，卷积按坐标找邻居</text><text x="388" y="600" font-size="19" fill="#18334c" font-weight="400">表中相邻两行不一定是空间邻居</text><rect x="903" y="477" width="433" height="130" fill="#fff" stroke="#c36b24" rx="16"/><text x="921" y="509" font-size="23" fill="#c36b24" font-weight="700">Decode → S_out：N_K × 1</text><text x="921" y="542" font-size="19" fill="#18334c" font-weight="400">按原索引 scatter 回原网格</text><text x="921" y="571" font-size="19" fill="#18334c" font-weight="400">K 外粗错误不能由 A_d 直接修好</text><text x="921" y="600" font-size="19" fill="#18334c" font-weight="400">K覆盖越多，稀疏计算成本也会增加</text><rect x="28" y="665" width="1344" height="210" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="699" font-size="24" fill="#18334c" font-weight="700">03  TSCM：整段 CLS 摘要变成通道门控，广播给稀疏特征</text><rect x="52" y="730" width="280" height="108" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="762" font-size="23" fill="#2376c5" font-weight="700">每帧 CLS</text><text x="70" y="795" font-size="19" fill="#18334c" font-weight="400">投影 → 每帧256维</text><text x="70" y="824" font-size="19" fill="#18334c" font-weight="400">T帧序列 → GRU</text><path d="M332,783 L388,783" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="398" y="730" width="295" height="108" fill="#fff" stroke="#7750ad" rx="16"/><text x="416" y="762" font-size="23" fill="#7750ad" font-weight="700">h_T → FC → sigmoid</text><text x="416" y="795" font-size="19" fill="#18334c" font-weight="400">生成 1 × C_feature 门控</text><text x="416" y="824" font-size="19" fill="#18334c" font-weight="400">不是逐像素新掩码</text><path d="M693,783 L747,783" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="757" y="730" width="579" height="108" fill="#fff" stroke="#17816c" rx="16"/><text x="775" y="762" font-size="23" fill="#17816c" font-weight="700">g ⊙ f_enc → 稀疏解码器</text><text x="775" y="795" font-size="19" fill="#18334c" font-weight="400">门控在 N_K 个位置间广播；局部信息仍由稀疏特征保留</text><text x="775" y="824" font-size="19" fill="#18334c" font-weight="400">使用最终 h_T，不能据此声称严格逐帧在线零等待</text><rect x="28" y="900" width="1344" height="235" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="934" font-size="24" fill="#18334c" font-weight="700">04  时间损失匹配真实变化，而不是要求画面静止</text><rect x="52" y="964" width="380" height="115" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="996" font-size="23" fill="#2376c5" font-weight="700">真值 alpha</text><text x="70" y="1029" font-size="19" fill="#18334c" font-weight="400">0.20 → 0.50</text><text x="70" y="1058" font-size="19" fill="#18334c" font-weight="400">前帧减后帧 = −0.30</text><rect x="493" y="964" width="395" height="115" fill="#fff" stroke="#17816c" rx="16"/><text x="511" y="996" font-size="23" fill="#17816c" font-weight="700">预测也在变化</text><text x="511" y="1029" font-size="19" fill="#18334c" font-weight="400">0.25 → 0.55；差值同为 −0.30</text><text x="511" y="1058" font-size="19" fill="#18334c" font-weight="400">时间误差为0，但仍偏高0.05</text><rect x="949" y="964" width="387" height="115" fill="#fff" stroke="#c36b24" rx="16"/><text x="967" y="996" font-size="23" fill="#c36b24" font-weight="700">冻结预测反而有误差</text><text x="967" y="1029" font-size="19" fill="#18334c" font-weight="400">0.20 → 0.20；差值0</text><text x="967" y="1058" font-size="19" fill="#18334c" font-weight="400">(0 − (−0.30))² = 0.09</text><text x="55" y="1110" font-size="22" fill="#586d80" font-weight="400">数值是教学例子；同坐标、相邻帧共同 K 上计算，公式未显式使用光流对齐。</text><text x="36" y="1167" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>
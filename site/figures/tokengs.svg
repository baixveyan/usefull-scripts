<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">TokenGS：把表示预算交给 tokens</title><desc id="desc">两路输入、一个场景表示：图像提供证据，tokens 负责组织高斯。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#6e8a83"/></marker><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#dde6dd"/></pattern></defs><rect width="1200" height="660" rx="20" fill="#fafcf8"/><rect y="110" width="1200" height="490" fill="url(#dots)"/><g font-family="Inter,Segoe UI,Microsoft YaHei,sans-serif"><text x="40" y="38" fill="#688279" font-size="11" font-weight="650">PAPER ATLAS / METHOD EXPLAINED</text><text x="40" y="75" fill="#1f3d34" font-size="28" font-weight="650">TokenGS：把表示预算交给 tokens</text><text x="40" y="103" fill="#71867e" font-size="13" font-weight="400">两路输入、一个场景表示：图像提供证据，tokens 负责组织高斯。</text><rect x="40" y="155" width="235" height="145" rx="14" fill="#e7effb" stroke="#3b6fba" stroke-opacity=".25"/><text x="60" y="187" fill="#3b6fba" font-size="18" font-weight="650">多视图观测</text><text x="60" y="216" fill="#253d3c" font-size="14" font-weight="400">图像 patch 特征</text><text x="60" y="241" fill="#253d3c" font-size="14" font-weight="400">相机参数 → Plücker 射线</text><text x="60" y="283" fill="#3b6fba" font-size="11" font-weight="600">输入仍依赖相机标定</text><rect x="40" y="355" width="235" height="145" rx="14" fill="#f0eafa" stroke="#7753a8" stroke-opacity=".25"/><text x="60" y="387" fill="#7753a8" font-size="18" font-weight="650">可学习高斯 tokens</text><text x="60" y="416" fill="#253d3c" font-size="14" font-weight="400">Nₜ 个场景槽位</text><text x="60" y="441" fill="#253d3c" font-size="14" font-weight="400">数量独立于输入像素</text><text x="60" y="483" fill="#7753a8" font-size="11" font-weight="600">不是一 token 对应一高斯</text><rect x="365" y="155" width="250" height="145" rx="14" fill="#e7effb" stroke="#3b6fba" stroke-opacity=".25"/><text x="385" y="187" fill="#3b6fba" font-size="18" font-weight="650">图像编码器</text><text x="385" y="216" fill="#253d3c" font-size="14" font-weight="400">跨视图 Transformer</text><text x="385" y="241" fill="#253d3c" font-size="14" font-weight="400">组织共享图像证据</text><rect x="365" y="355" width="250" height="145" rx="14" fill="#f0eafa" stroke="#7753a8" stroke-opacity=".25"/><text x="385" y="387" fill="#7753a8" font-size="18" font-weight="650">解码器</text><text x="385" y="416" fill="#253d3c" font-size="14" font-weight="400">tokens 读取图像 K / V</text><text x="385" y="441" fill="#253d3c" font-size="14" font-weight="400">交叉注意力 + 自注意力</text><rect x="725" y="260" width="205" height="145" rx="14" fill="#e5f3ec" stroke="#237958" stroke-opacity=".25"/><text x="745" y="292" fill="#237958" font-size="18" font-weight="650">属性解码</text><text x="745" y="321" fill="#253d3c" font-size="14" font-weight="400">每 token → 64 高斯</text><text x="745" y="346" fill="#253d3c" font-size="14" font-weight="400">位置 / 颜色 / 尺度等</text><text x="745" y="388" fill="#237958" font-size="11" font-weight="600">M = 64 × Nₜ</text><path d="M275 225 L365 225" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M275 425 L365 425" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M490 300 L490 355" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><text x="495.0" y="318.5" fill="#627b73" font-size="11" font-weight="400">K / V</text><path d="M615 425 L725 350" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M930 330 L998 330" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><ellipse cx="1015" cy="270" rx="12" ry="6" transform="rotate(-25 1015 270)" fill="#73b69c" opacity=".8"/><ellipse cx="1039" cy="270" rx="12" ry="6" transform="rotate(-25 1039 270)" fill="#a8c6e2" opacity=".8"/><ellipse cx="1063" cy="270" rx="12" ry="6" transform="rotate(-25 1063 270)" fill="#d5b8e8" opacity=".8"/><ellipse cx="1087" cy="270" rx="12" ry="6" transform="rotate(-25 1087 270)" fill="#73b69c" opacity=".8"/><ellipse cx="1111" cy="270" rx="12" ry="6" transform="rotate(-25 1111 270)" fill="#a8c6e2" opacity=".8"/><ellipse cx="1135" cy="270" rx="12" ry="6" transform="rotate(-25 1135 270)" fill="#d5b8e8" opacity=".8"/><ellipse cx="1015" cy="294" rx="12" ry="6" transform="rotate(-12 1015 294)" fill="#73b69c" opacity=".8"/><ellipse cx="1039" cy="294" rx="12" ry="6" transform="rotate(-12 1039 294)" fill="#a8c6e2" opacity=".8"/><ellipse cx="1063" cy="294" rx="12" ry="6" transform="rotate(-12 1063 294)" fill="#d5b8e8" opacity=".8"/><ellipse cx="1087" cy="294" rx="12" ry="6" transform="rotate(-12 1087 294)" fill="#73b69c" opacity=".8"/><ellipse cx="1111" cy="294" rx="12" ry="6" transform="rotate(-12 1111 294)" fill="#a8c6e2" opacity=".8"/><ellipse cx="1135" cy="294" rx="12" ry="6" transform="rotate(-12 1135 294)" fill="#d5b8e8" opacity=".8"/><ellipse cx="1015" cy="318" rx="12" ry="6" transform="rotate(1 1015 318)" fill="#73b69c" opacity=".8"/><ellipse cx="1039" cy="318" rx="12" ry="6" transform="rotate(1 1039 318)" fill="#a8c6e2" opacity=".8"/><ellipse cx="1063" cy="318" rx="12" ry="6" transform="rotate(1 1063 318)" fill="#d5b8e8" opacity=".8"/><ellipse cx="1087" cy="318" rx="12" ry="6" transform="rotate(1 1087 318)" fill="#73b69c" opacity=".8"/><ellipse cx="1111" cy="318" rx="12" ry="6" transform="rotate(1 1111 318)" fill="#a8c6e2" opacity=".8"/><ellipse cx="1135" cy="318" rx="12" ry="6" transform="rotate(1 1135 318)" fill="#d5b8e8" opacity=".8"/><ellipse cx="1015" cy="342" rx="12" ry="6" transform="rotate(14 1015 342)" fill="#73b69c" opacity=".8"/><ellipse cx="1039" cy="342" rx="12" ry="6" transform="rotate(14 1039 342)" fill="#a8c6e2" opacity=".8"/><ellipse cx="1063" cy="342" rx="12" ry="6" transform="rotate(14 1063 342)" fill="#d5b8e8" opacity=".8"/><ellipse cx="1087" cy="342" rx="12" ry="6" transform="rotate(14 1087 342)" fill="#73b69c" opacity=".8"/><ellipse cx="1111" cy="342" rx="12" ry="6" transform="rotate(14 1111 342)" fill="#a8c6e2" opacity=".8"/><ellipse cx="1135" cy="342" rx="12" ry="6" transform="rotate(14 1135 342)" fill="#d5b8e8" opacity=".8"/><ellipse cx="1015" cy="366" rx="12" ry="6" transform="rotate(27 1015 366)" fill="#73b69c" opacity=".8"/><ellipse cx="1039" cy="366" rx="12" ry="6" transform="rotate(27 1039 366)" fill="#a8c6e2" opacity=".8"/><ellipse cx="1063" cy="366" rx="12" ry="6" transform="rotate(27 1063 366)" fill="#d5b8e8" opacity=".8"/><ellipse cx="1087" cy="366" rx="12" ry="6" transform="rotate(27 1087 366)" fill="#73b69c" opacity=".8"/><ellipse cx="1111" cy="366" rx="12" ry="6" transform="rotate(27 1111 366)" fill="#a8c6e2" opacity=".8"/><ellipse cx="1135" cy="366" rx="12" ry="6" transform="rotate(27 1135 366)" fill="#d5b8e8" opacity=".8"/><text x="1005" y="420" fill="#253d3c" font-size="15" font-weight="400">可微高斯渲染</text><path d="M825 405 L825 545" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M825 545 L155 545" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="7 6"/><text x="495.0" y="536.0" fill="#627b73" font-size="11" font-weight="400">测试时仅调 token；权重固定</text><path d="M155 545 L155 500" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="7 6"/><path d="M40 606H1160" stroke="#dae5dc"/><text x="40" y="631" fill="#71867e" font-size="12" font-weight="400">依据原论文 Fig.2 / §3 重绘；省略层重复、动态分支与完整损失。</text><text x="1000" y="631" fill="#71867e" font-size="11" font-weight="400">原创概念重绘 · 非原图</text></g></svg>
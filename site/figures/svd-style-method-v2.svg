<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1250" viewBox="0 0 1400 1250" role="img" aria-labelledby="title desc"><title id="title">SVD风格个性化 ｜软谱替换与结构注意力</title><desc id="desc">原创中文详图：把残差累积、SVD代数、双流注意力和实现边界分开。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1250" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">SVD风格个性化 ｜软谱替换与结构注意力</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">原创中文详图：把残差累积、SVD代数、双流注意力和实现边界分开。</text><rect x="28" y="115" width="1344" height="245" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  三种来源，两条生成路径：全部预训练参数冻结</text><rect x="52" y="179" width="385" height="165" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="211" font-size="23" fill="#2376c5" font-weight="700">同一文本T → 两条路径</text><text x="70" y="244" font-size="19" fill="#18334c" font-weight="400">内容路径：正常Infinity前向</text><text x="70" y="273" font-size="19" fill="#18334c" font-weight="400">生成路径：将被PFB与SAC干预</text><text x="70" y="302" font-size="19" fill="#18334c" font-weight="400">每尺度预测残差R_s，再累积F_s</text><text x="70" y="331" font-size="19" fill="#18334c" font-weight="400">第3特征hook与步号需代码核验</text><rect x="498" y="179" width="395" height="165" fill="#fff" stroke="#17816c" rx="16"/><text x="516" y="211" font-size="23" fill="#17816c" font-weight="700">参考图 → 多尺度编码</text><text x="516" y="244" font-size="19" fill="#18334c" font-weight="400">取参考第三特征做风格提取</text><text x="516" y="273" font-size="19" fill="#18334c" font-weight="400">不是复制整张参考图的内容</text><text x="516" y="302" font-size="19" fill="#18334c" font-weight="400">PFB只修改生成特征</text><text x="516" y="331" font-size="19" fill="#18334c" font-weight="400">参考 / 生成各自做SVD</text><rect x="954" y="179" width="380" height="165" fill="#fff" stroke="#7750ad" rx="16"/><text x="972" y="211" font-size="23" fill="#7750ad" font-weight="700">第3–12尺度的结构引导</text><text x="972" y="244" font-size="19" fill="#18334c" font-weight="400">Q与K取内容路径</text><text x="972" y="273" font-size="19" fill="#18334c" font-weight="400">V仍取生成路径</text><text x="972" y="302" font-size="19" fill="#18334c" font-weight="400">生成路径累积后解码1024²图</text><text x="972" y="331" font-size="19" fill="#18334c" font-weight="400">训练免费 ≠ 双流前向免费</text><rect x="28" y="385" width="1344" height="265" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="419" font-size="24" fill="#18334c" font-weight="700">02  软谱替换教学：α=1，权重(1,e⁻¹)≈(1,.3679)</text><text x="55" y="450" font-size="23" fill="#18334c" font-weight="700">本例F_gen=diag(4,2)，F_sty=diag(6,1)，奇异向量恰好相同。</text><rect x="52" y="474" width="385" height="155" fill="#fff" stroke="#17816c" rx="16"/><text x="70" y="506" font-size="23" fill="#17816c" font-weight="700">参考软主分量</text><text x="70" y="539" font-size="19" fill="#18334c" font-weight="400">Φ(F_sty)=diag(6,.3679)</text><text x="70" y="568" font-size="19" fill="#18334c" font-weight="400">首分量保持，第二项衰减</text><text x="70" y="597" font-size="19" fill="#18334c" font-weight="400">不是只取rank1</text><text x="450" y="557" font-size="30" fill="#18334c" font-weight="700">+</text><rect x="498" y="474" width="395" height="155" fill="#fff" stroke="#c36b24" rx="16"/><text x="516" y="506" font-size="23" fill="#c36b24" font-weight="700">生成软残差</text><text x="516" y="539" font-size="19" fill="#18334c" font-weight="400">F_gen−Φ(F_gen)</text><text x="516" y="568" font-size="19" fill="#18334c" font-weight="400">=diag(0,1.2642)</text><text x="516" y="597" font-size="19" fill="#18334c" font-weight="400">保留第二项的63.21%</text><text x="905" y="557" font-size="30" fill="#18334c" font-weight="700">=</text><rect x="954" y="474" width="380" height="155" fill="#fff" stroke="#7750ad" rx="16"/><text x="972" y="506" font-size="23" fill="#7750ad" font-weight="700">相加 → 新生成特征</text><text x="972" y="539" font-size="19" fill="#18334c" font-weight="400">结果diag(6,1.6321)</text><text x="972" y="568" font-size="19" fill="#18334c" font-weight="400">完整替换是diag(6,1)</text><text x="972" y="597" font-size="19" fill="#18334c" font-weight="400">硬rank1替换是diag(6,2)</text><rect x="28" y="675" width="1344" height="245" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="709" font-size="24" fill="#18334c" font-weight="700">03  SAC：内容决定从哪里读，生成value决定读出什么</text><text x="55" y="741" font-size="24" fill="#2376c5" font-weight="700">教学A_con = [[.8,.2],[.1,.9]]；V_gen = [[2,0],[0,4]]。</text><text x="55" y="792" font-size="24" fill="#18334c" font-weight="400">第1位置：.8×(2,0)+.2×(0,4)=(1.6,.8)</text><text x="55" y="841" font-size="24" fill="#18334c" font-weight="400">第2位置：.1×(2,0)+.9×(0,4)=(.2,3.6)</text><text x="55" y="889" font-size="22" fill="#7750ad" font-weight="400">复制Q/K约束关系矩阵；保留V才能继续携带生成路径的风格内容。</text><rect x="28" y="945" width="1344" height="250" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="979" font-size="24" fill="#18334c" font-weight="700">04  机制边界：数值主成分不自动等于语义风格</text><text x="55" y="1012" font-size="22" fill="#18334c" font-weight="700">α→0趋向完整替换；α→∞趋向rank1替换；矩阵化方式影响SVD语义。</text><text x="55" y="1060" font-size="22" fill="#c36b24" font-weight="400">参考与生成的U/V通常不同：先各自重构矩阵，再相加，不能只交换奇异值。</text><text x="55" y="1108" font-size="22" fill="#2376c5" font-weight="400">颜色干预分析支持机制动机，不证明构图 / 笔触 / 物体身份全部解耦。</text><text x="55" y="1156" font-size="20" fill="#586d80" font-weight="400">依据式1–7、Fig.4，PDF3–6；矩阵为原创教学例，未运行Infinity生成。</text><text x="36" y="1227" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>
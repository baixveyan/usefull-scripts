<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1230" viewBox="0 0 1400 1230" role="img" aria-labelledby="title desc"><title id="title">4DP-QA ｜把相机运动拿掉，再把几何写成问答</title><desc id="desc">依据原文 Fig.2/3、式1–2、§3–4，PDF 2–5；位移、投影与坐标数值均为教学例子。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1230" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">4DP-QA ｜把相机运动拿掉，再把几何写成问答</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据原文 Fig.2/3、式1–2、§3–4，PDF 2–5；位移、投影与坐标数值均为教学例子。</text><rect x="28" y="115" width="1344" height="260" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  同一物体向右，相机向右更快：画面里会向左</text><text x="55" y="190" font-size="23" fill="#18334c" font-weight="700">解释设置：f=100 像素，Z=10；相机不旋转，主点为0</text><text x="55" y="247" font-size="23" fill="#2376c5" font-weight="700">物体 X</text><path d="M250,240 L500,240" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><text x="245" y="276" font-size="20" fill="#2376c5" font-weight="400">0</text><text x="485" y="276" font-size="20" fill="#2376c5" font-weight="400">1</text><text x="55" y="325" font-size="23" fill="#c36b24" font-weight="700">相机中心 C</text><path d="M250,318 L750,318" fill="none" stroke="#c36b24" stroke-width="3" marker-end="url(#c36b24)" /><text x="245" y="353" font-size="20" fill="#c36b24" font-weight="400">0</text><text x="740" y="353" font-size="20" fill="#c36b24" font-weight="400">2</text><rect x="860" y="220" width="476" height="125" fill="#fff" stroke="#7750ad" rx="16"/><text x="878" y="252" font-size="23" fill="#7750ad" font-weight="700">同一条三维轨迹 X_t</text><text x="878" y="285" font-size="19" fill="#18334c" font-weight="400">实际相机：p_t = f(X_t − C_t) / Z</text><text x="878" y="314" font-size="19" fill="#18334c" font-weight="400">固定参考：m_t = f(X_t − C_0) / Z</text><rect x="28" y="400" width="1344" height="235" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="434" font-size="24" fill="#18334c" font-weight="700">02  真正改变的是观察坐标；True-motion仍是二维投影</text><rect x="52" y="466" width="585" height="120" fill="#fff" stroke="#c36b24" rx="16"/><text x="70" y="498" font-size="23" fill="#c36b24" font-weight="700">实际相机移动的投影</text><text x="70" y="531" font-size="19" fill="#18334c" font-weight="400">0 → 100×(1−2)/10 = −10 像素</text><text x="70" y="560" font-size="19" fill="#18334c" font-weight="400">物体视觉上向左；夹带相机运动</text><rect x="697" y="466" width="639" height="120" fill="#fff" stroke="#17816c" rx="16"/><text x="715" y="498" font-size="23" fill="#17816c" font-weight="700">固定查询时刻相机的投影</text><text x="715" y="531" font-size="19" fill="#18334c" font-weight="400">0 → 100×(1−0)/10 = +10 像素</text><text x="715" y="560" font-size="19" fill="#18334c" font-weight="400">固定参考下向右；沿光轴运动仍可能像素不变</text><text x="55" y="614" font-size="22" fill="#586d80" font-weight="400">查询帧两种坐标相同；相机静止时整段轨迹相同。以上数字全为教学例子。</text><rect x="28" y="660" width="1344" height="255" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="694" font-size="24" fill="#18334c" font-weight="700">03  从几何生成问答：先筛素材，再填标签与坐标</text><rect x="52" y="727" width="280" height="145" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="759" font-size="23" fill="#2376c5" font-weight="700">统一4D输入</text><text x="70" y="792" font-size="19" fill="#18334c" font-weight="400">相机 / 深度 / 实例 / 姿态</text><text x="70" y="821" font-size="19" fill="#18334c" font-weight="400">坐标、帧率与对象ID一致</text><text x="70" y="850" font-size="19" fill="#18334c" font-weight="400">不是由LLM自由猜几何</text><path d="M332,795 L388,795" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="398" y="727" width="295" height="145" fill="#fff" stroke="#7750ad" rx="16"/><text x="416" y="759" font-size="23" fill="#7750ad" font-weight="700">题型 → 素材要求</text><text x="416" y="792" font-size="19" fill="#18334c" font-weight="400">采样满足运动 / 可见性条件</text><text x="416" y="821" font-size="19" fill="#18334c" font-weight="400">选择对象、帧号、参考坐标</text><text x="416" y="850" font-size="19" fill="#18334c" font-weight="400">不足则丢弃片段</text><path d="M693,795 L747,795" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="757" y="727" width="305" height="145" fill="#fff" stroke="#17816c" rx="16"/><text x="775" y="759" font-size="23" fill="#17816c" font-weight="700">数值 → 标签 / 轨迹</text><text x="775" y="792" font-size="19" fill="#18334c" font-weight="400">离散方向 / 距离变化</text><text x="775" y="821" font-size="19" fill="#18334c" font-weight="400">连续坐标 + 遮挡标志</text><text x="775" y="850" font-size="19" fill="#18334c" font-weight="400">阈值与越界处理需记录</text><path d="M1062,795 L1114,795" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="1124" y="727" width="212" height="145" fill="#fff" stroke="#2376c5" rx="16"/><text x="1142" y="759" font-size="23" fill="#2376c5" font-weight="700">模板填槽</text><text x="1142" y="792" font-size="19" fill="#18334c" font-weight="400">多样语言表述</text><text x="1142" y="821" font-size="19" fill="#18334c" font-weight="400">13类训练任务</text><text x="1142" y="850" font-size="19" fill="#18334c" font-weight="400">随机化输出帧序</text><rect x="28" y="940" width="1344" height="230" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="974" font-size="24" fill="#18334c" font-weight="700">04  数据监督路线与几何编码路线，成本和证据分别记录</text><rect x="52" y="1006" width="585" height="124" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="1038" font-size="23" fill="#2376c5" font-weight="700">普通 VLM：冻结视觉编码器</text><text x="70" y="1071" font-size="19" fill="#18334c" font-weight="400">视频 + QA继续训练；不要求推理提供相机GT</text><text x="70" y="1100" font-size="19" fill="#18334c" font-weight="400">坐标监督的存在，不等于基准直接测像素跟踪误差</text><rect x="697" y="1006" width="639" height="124" fill="#fff" stroke="#7750ad" rx="16"/><text x="715" y="1038" font-size="23" fill="#7750ad" font-weight="700">附加 L4P：几何token与视觉token交错</text><text x="715" y="1071" font-size="19" fill="#18334c" font-weight="400">先只训几何投影器，再训LLM和两套投影器</text><text x="715" y="1100" font-size="19" fill="#18334c" font-weight="400">自有基准主要测前11类语言题，连续跟踪需另评价</text><text x="36" y="1207" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">C-Flat Turbo：缓存慢变方向，把反向传播花在需要时</title><desc id="desc">追求更平坦的解，同时降低 C-Flat 成本；仍比普通 SGD / Adam 昂贵。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#6e8a83"/></marker><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#dde6dd"/></pattern></defs><rect width="1200" height="660" rx="20" fill="#fafcf8"/><rect y="110" width="1200" height="490" fill="url(#dots)"/><g font-family="Inter,Segoe UI,Microsoft YaHei,sans-serif"><text x="40" y="38" fill="#688279" font-size="11" font-weight="650">PAPER ATLAS / METHOD EXPLAINED</text><text x="40" y="75" fill="#1f3d34" font-size="28" font-weight="650">C-Flat Turbo：缓存慢变方向，把反向传播花在需要时</text><text x="40" y="103" fill="#71867e" font-size="13" font-weight="400">追求更平坦的解，同时降低 C-Flat 成本；仍比普通 SGD / Adam 昂贵。</text><rect x="40" y="160" width="300" height="180" rx="14" fill="#e7effb" stroke="#3b6fba" stroke-opacity=".25"/><text x="60" y="192" fill="#3b6fba" font-size="18" font-weight="650">刷新步：完整梯度</text><text x="60" y="221" fill="#253d3c" font-size="14" font-weight="400">经验 g / 扰动 gs</text><text x="60" y="246" fill="#253d3c" font-size="14" font-weight="400">代理 g₀ / 平坦修正 gf</text><text x="60" y="271" fill="#253d3c" font-size="14" font-weight="400">提取正交分量 gvf</text><text x="60" y="296" fill="#253d3c" font-size="14" font-weight="400">缓存 sharpness 与 flatness</text><rect x="455" y="160" width="300" height="180" rx="14" fill="#e5f3ec" stroke="#237958" stroke-opacity=".25"/><text x="475" y="192" fill="#237958" font-size="18" font-weight="650">后续 k−1 步</text><text x="475" y="221" fill="#253d3c" font-size="14" font-weight="400">计算当前基础方向</text><text x="475" y="246" fill="#253d3c" font-size="14" font-weight="400">复用已缓存正交分量</text><text x="475" y="271" fill="#253d3c" font-size="14" font-weight="400">用缩放项近似修正</text><text x="475" y="296" fill="#253d3c" font-size="14" font-weight="400">减少额外反向传播</text><path d="M340 245 L455 245" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="865" y="160" width="285" height="180" rx="14" fill="#fff1df" stroke="#aa6b29" stroke-opacity=".25"/><text x="885" y="192" fill="#aa6b29" font-size="18" font-weight="650">动态控制</text><text x="885" y="221" fill="#253d3c" font-size="14" font-weight="400">任务后期逐渐增大 k</text><text x="885" y="246" fill="#253d3c" font-size="14" font-weight="400">EMA 统计触发正则</text><text x="885" y="271" fill="#253d3c" font-size="14" font-weight="400">保持普通优化更新</text><text x="885" y="296" fill="#253d3c" font-size="14" font-weight="400">缓存稳定性属经验观察</text><path d="M755 245 L865 245" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="60" y="440" width="62" height="55" rx="8" fill="#3b6fba"/><text x="75" y="473" fill="#ffffff" font-size="18" font-weight="600">R</text><rect x="150" y="440" width="62" height="55" rx="8" fill="#b2d9c3"/><text x="165" y="473" fill="#237958" font-size="18" font-weight="600">C</text><rect x="240" y="440" width="62" height="55" rx="8" fill="#b2d9c3"/><text x="255" y="473" fill="#237958" font-size="18" font-weight="600">C</text><rect x="330" y="440" width="62" height="55" rx="8" fill="#b2d9c3"/><text x="345" y="473" fill="#237958" font-size="18" font-weight="600">C</text><rect x="420" y="440" width="62" height="55" rx="8" fill="#b2d9c3"/><text x="435" y="473" fill="#237958" font-size="18" font-weight="600">C</text><rect x="510" y="440" width="62" height="55" rx="8" fill="#3b6fba"/><text x="525" y="473" fill="#ffffff" font-size="18" font-weight="600">R</text><rect x="600" y="440" width="62" height="55" rx="8" fill="#b2d9c3"/><text x="615" y="473" fill="#237958" font-size="18" font-weight="600">C</text><rect x="690" y="440" width="62" height="55" rx="8" fill="#b2d9c3"/><text x="705" y="473" fill="#237958" font-size="18" font-weight="600">C</text><rect x="780" y="440" width="62" height="55" rx="8" fill="#b2d9c3"/><text x="795" y="473" fill="#237958" font-size="18" font-weight="600">C</text><rect x="870" y="440" width="62" height="55" rx="8" fill="#b2d9c3"/><text x="885" y="473" fill="#237958" font-size="18" font-weight="600">C</text><rect x="960" y="440" width="62" height="55" rx="8" fill="#3b6fba"/><text x="975" y="473" fill="#ffffff" font-size="18" font-weight="600">R</text><rect x="1050" y="440" width="62" height="55" rx="8" fill="#b2d9c3"/><text x="1065" y="473" fill="#237958" font-size="18" font-weight="600">C</text><text x="45" y="545" fill="#253d3c" font-size="16" font-weight="400">刷新 R → 缓存步 C → 再刷新（示意）；k 是刷新间隔，不是学习率。</text><path d="M40 606H1160" stroke="#dae5dc"/><text x="40" y="631" fill="#71867e" font-size="12" font-weight="400">依据原论文 Fig.1–2 / §3.2 重绘；完整触发顺序须核对附录算法。</text><text x="1000" y="631" fill="#71867e" font-size="11" font-weight="400">原创概念重绘 · 非原图</text></g></svg>
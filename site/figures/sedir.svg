<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">SeDiR：先分清是什么，再用正确先验重建</title><desc id="desc">图展示作者条件重建思路；类别语义分离不意味着每个缺陷都无法重建。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#6e8a83"/></marker><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#dde6dd"/></pattern></defs><rect width="1200" height="660" rx="20" fill="#fafcf8"/><rect y="110" width="1200" height="490" fill="url(#dots)"/><g font-family="Inter,Segoe UI,Microsoft YaHei,sans-serif"><text x="40" y="38" fill="#688279" font-size="11" font-weight="650">PAPER ATLAS / METHOD EXPLAINED</text><text x="40" y="75" fill="#1f3d34" font-size="28" font-weight="650">SeDiR：先分清是什么，再用正确先验重建</text><text x="40" y="103" fill="#71867e" font-size="13" font-weight="400">图展示作者条件重建思路；类别语义分离不意味着每个缺陷都无法重建。</text><rect x="40" y="155" width="260" height="160" rx="14" fill="#e7effb" stroke="#3b6fba" stroke-opacity=".25"/><text x="60" y="187" fill="#3b6fba" font-size="18" font-weight="650">正常点云 + 类别标签</text><text x="60" y="216" fill="#253d3c" font-size="14" font-weight="400">共享 FPS 中心</text><text x="60" y="241" fill="#253d3c" font-size="14" font-weight="400">k/2, k, 2k 邻域编码</text><text x="60" y="266" fill="#253d3c" font-size="14" font-weight="400">保留细节与整体几何</text><rect x="400" y="155" width="310" height="160" rx="14" fill="#f0eafa" stroke="#7753a8" stroke-opacity=".25"/><text x="420" y="187" fill="#7753a8" font-size="18" font-weight="650">CFGT + C3L</text><text x="420" y="216" fill="#253d3c" font-size="14" font-weight="400">多尺度 GAP + ACT</text><text x="420" y="241" fill="#253d3c" font-size="14" font-weight="400">同类拉近、异类分开</text><text x="420" y="266" fill="#253d3c" font-size="14" font-weight="400">分类 / 对比 / 跨尺度损失</text><path d="M300 235 L400 235" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="825" y="155" width="330" height="160" rx="14" fill="#e5f3ec" stroke="#237958" stroke-opacity=".25"/><text x="845" y="187" fill="#237958" font-size="18" font-weight="650">几何引导解码 GGD</text><text x="845" y="216" fill="#253d3c" font-size="14" font-weight="400">全局语义与局部特征</text><text x="845" y="241" fill="#253d3c" font-size="14" font-weight="400">法向 / 曲率信息作为偏置</text><text x="845" y="266" fill="#253d3c" font-size="14" font-weight="400">重建编码特征，不是点坐标</text><path d="M710 235 L825 235" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="825" y="425" width="330" height="130" rx="14" fill="#e5f3ec" stroke="#237958" stroke-opacity=".25"/><text x="845" y="457" fill="#237958" font-size="18" font-weight="650">异常评分</text><text x="845" y="486" fill="#253d3c" font-size="14" font-weight="400">原始与重建特征 L2 差</text><text x="845" y="511" fill="#253d3c" font-size="14" font-weight="400">归一化 + 高斯滤波</text><text x="845" y="536" fill="#253d3c" font-size="14" font-weight="400">对象级与点级分别评价</text><path d="M990 315 L990 425" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="45" y="425" width="620" height="130" rx="14" fill="#fff1df" stroke="#aa6b29" stroke-opacity=".25"/><text x="65" y="457" fill="#aa6b29" font-size="18" font-weight="650">适用边界</text><text x="65" y="486" fill="#253d3c" font-size="14" font-weight="400">仅正常样本训练，但使用类别监督</text><text x="65" y="511" fill="#253d3c" font-size="14" font-weight="400">未见类别和工业生产部署需要另外验证</text><text x="65" y="536" fill="#253d3c" font-size="14" font-weight="400">归一化范围、token 排序及几何偏置需对照实现</text><path d="M40 606H1160" stroke="#dae5dc"/><text x="40" y="631" fill="#71867e" font-size="12" font-weight="400">依据原论文 Fig.3–4 / §3 重绘；未展开局部解码张量与插值细节。</text><text x="1000" y="631" fill="#71867e" font-size="11" font-weight="400">原创概念重绘 · 非原图</text></g></svg>
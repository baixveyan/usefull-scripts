<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1240" viewBox="0 0 1400 1240" role="img" aria-labelledby="title desc"><title id="title">UAAI ｜选帧、空间注意力与不确定性加权分别怎样工作</title><desc id="desc">依据原文 Fig.2、式1–13、§3–4，PDF 3–5；保留公式与实现描述的差别，不补造缺失算法。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1240" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">UAAI ｜选帧、空间注意力与不确定性加权分别怎样工作</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据原文 Fig.2、式1–13、§3–4，PDF 3–5；保留公式与实现描述的差别，不补造缺失算法。</text><rect x="28" y="115" width="1344" height="265" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  前向识别：时间选择、空间加权、动作分类</text><rect x="52" y="179" width="380" height="155" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="211" font-size="23" fill="#2376c5" font-weight="700">RGB → ResNet-50 → 类别观测</text><text x="70" y="244" font-size="19" fill="#18334c" font-weight="400">两层MLP形成观测分布</text><text x="70" y="273" font-size="19" fill="#18334c" font-weight="400">时间模块：a* = argmin_a G(a)</text><text x="70" y="302" font-size="19" fill="#18334c" font-weight="400">候选动作 / 似然 / 预算仍需核对</text><text x="70" y="331" font-size="19" fill="#18334c" font-weight="400">不能用测试真实类别估计似然</text><path d="M432,253 L484,253" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="494" y="179" width="395" height="155" fill="#fff" stroke="#7750ad" rx="16"/><text x="512" y="211" font-size="23" fill="#7750ad" font-weight="700">空间注意力：F 为 C×H×W</text><text x="512" y="244" font-size="19" fill="#18334c" font-weight="400">沿通道 Avg / Max → 两张空间图</text><text x="512" y="273" font-size="19" fill="#18334c" font-weight="400">拼接 → Conv → sigmoid → M</text><text x="512" y="302" font-size="19" fill="#18334c" font-weight="400">M 为 H×W，广播到所有通道</text><text x="512" y="331" font-size="19" fill="#18334c" font-weight="400">F′ = M ⊙ F</text><path d="M889,253 L941,253" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="951" y="179" width="385" height="155" fill="#fff" stroke="#17816c" rx="16"/><text x="969" y="211" font-size="23" fill="#17816c" font-weight="700">输出微动作类别</text><text x="969" y="244" font-size="19" fill="#18334c" font-weight="400">时域聚合等细节需查实现</text><text x="969" y="273" font-size="19" fill="#18334c" font-weight="400">空间热图不是因果解释</text><text x="969" y="302" font-size="19" fill="#18334c" font-weight="400">识别手势不证明情绪 / 隐瞒意图</text><text x="969" y="331" font-size="19" fill="#18334c" font-weight="400">实测是SMG动作分类</text><rect x="28" y="405" width="1344" height="270" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="439" font-size="24" fill="#18334c" font-weight="700">02  UMIX用于训练：预测波动决定贡献，不直接决定混合系数</text><rect x="52" y="471" width="380" height="165" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="503" font-size="23" fill="#2376c5" font-weight="700">MC Dropout 多次前向</text><text x="70" y="536" font-size="19" fill="#18334c" font-weight="400">每类跨前向求概率方差</text><text x="70" y="565" font-size="19" fill="#18334c" font-weight="400">u = max_k Var_m[p_m(k)]</text><text x="70" y="594" font-size="19" fill="#18334c" font-weight="400">示例 .1 / .5 / .9 → u≈.1067</text><text x="70" y="623" font-size="19" fill="#18334c" font-weight="400">稳定的错误预测也可以 u=0</text><path d="M432,550 L484,550" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="494" y="471" width="395" height="165" fill="#fff" stroke="#c36b24" rx="16"/><text x="512" y="503" font-size="23" fill="#c36b24" font-weight="700">配对混合与样本权重</text><text x="512" y="536" font-size="19" fill="#18334c" font-weight="400">λ从Beta分布独立采样</text><text x="512" y="565" font-size="19" fill="#18334c" font-weight="400">x̃ = λx_i + (1−λ)x_j</text><text x="512" y="594" font-size="19" fill="#18334c" font-weight="400">式11：w=exp(−αu)+β</text><text x="512" y="623" font-size="19" fill="#18334c" font-weight="400">§5.1：w=1−u；两者不等价</text><path d="M889,550 L941,550" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="951" y="471" width="385" height="165" fill="#fff" stroke="#17816c" rx="16"/><text x="969" y="503" font-size="23" fill="#17816c" font-weight="700">加权两标签CE：解释缺项</text><text x="969" y="536" font-size="19" fill="#18334c" font-weight="400">w_i λ CE_i + w_j(1−λ) CE_j</text><text x="969" y="565" font-size="19" fill="#18334c" font-weight="400">教学 λ=.6、w_i=.9、w_j=.8</text><text x="969" y="594" font-size="19" fill="#18334c" font-weight="400">两项系数 .54 / .32，总量 .86</text><text x="969" y="623" font-size="19" fill="#18334c" font-weight="400">归一化会改变样本对梯度权重</text><rect x="28" y="700" width="1344" height="245" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="734" font-size="24" fill="#18334c" font-weight="700">03  独立反例：最小化负条件熵，单独看会偏爱更随机的观测</text><rect x="52" y="767" width="380" height="140" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="799" font-size="23" fill="#2376c5" font-weight="700">候选 A：完美反映二分类</text><text x="70" y="832" font-size="19" fill="#18334c" font-weight="400">H(O | S,A) = 0</text><text x="70" y="861" font-size="19" fill="#18334c" font-weight="400">观测能区分类别</text><text x="70" y="890" font-size="19" fill="#18334c" font-weight="400">此处只检查公式符号</text><rect x="494" y="767" width="395" height="140" fill="#fff" stroke="#c36b24" rx="16"/><text x="512" y="799" font-size="23" fill="#c36b24" font-weight="700">候选 B：每类都随机输出</text><text x="512" y="832" font-size="19" fill="#18334c" font-weight="400">H(O | S,B) = log 2</text><text x="512" y="861" font-size="19" fill="#18334c" font-weight="400">观测与类别无关，没有互信息</text><text x="512" y="890" font-size="19" fill="#18334c" font-weight="400">若KL相同，负熵项让 G(B)更低</text><rect x="951" y="767" width="385" height="140" fill="#fff" stroke="#7750ad" rx="16"/><text x="969" y="799" font-size="23" fill="#7750ad" font-weight="700">信息增益需要完整定义</text><text x="969" y="832" font-size="19" fill="#18334c" font-weight="400">I(S;O) = H(S) − E H(S|O)</text><text x="969" y="861" font-size="19" fill="#18334c" font-weight="400">不能把一个 −H(O|S) 直接等同它</text><text x="969" y="890" font-size="19" fill="#18334c" font-weight="400">不是作者实际选帧结果</text><rect x="28" y="970" width="1344" height="205" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="1004" font-size="24" fill="#18334c" font-weight="700">04  从理论动机到可复现算法，中间缺口要明确记录</text><text x="55" y="1037" font-size="22" fill="#18334c" font-weight="700">待核对：动作预算、似然矩阵与目标后验、EFE符号、权重函数、Mixup层次与推理MC配置。</text><text x="55" y="1082" font-size="22" fill="#7750ad" font-weight="400">总体概率方差 ≤ 0.25；直接 w=1−u 时权重 ≥ 0.75，不会自动把高不确定样本压到零。</text><text x="55" y="1127" font-size="21" fill="#586d80" font-weight="400">图片中所有概率、方差、混合系数和熵反例均是教学计算，不是作者实验或本地训练结果。</text><text x="36" y="1217" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1250" viewBox="0 0 1400 1250" role="img" aria-labelledby="title desc"><title id="title">DeltaWorld ｜一枚delta如何变成多条未来轨迹</title><desc id="desc">原创中文详图：先训练条件重建，再训练token预测；历史、候选和解码分支不混用。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1250" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">DeltaWorld ｜一枚delta如何变成多条未来轨迹</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">原创中文详图：先训练条件重建，再训练token预测；历史、候选和解码分支不混用。</text><rect x="28" y="115" width="1344" height="245" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  先训DeltaTok：前帧提供空间内容，delta提供转换条件</text><rect x="52" y="179" width="385" height="165" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="211" font-size="23" fill="#2376c5" font-weight="700">冻结DINOv3 → 空间特征</text><text x="70" y="244" font-size="19" fill="#18334c" font-weight="400">x_prev与x_now：P×D</text><text x="70" y="273" font-size="19" fill="#18334c" font-weight="400">编码器读取两帧和汇聚token</text><text x="70" y="302" font-size="19" fill="#18334c" font-weight="400">z=g(x_prev,x_now,z_init)：D维</text><text x="70" y="331" font-size="19" fill="#18334c" font-weight="400">不是显式差分后求平均</text><path d="M437,255 L483,255" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="498" y="179" width="395" height="165" fill="#fff" stroke="#17816c" rx="16"/><text x="516" y="211" font-size="23" fill="#17816c" font-weight="700">解码依赖前帧</text><text x="516" y="244" font-size="19" fill="#18334c" font-weight="400">x_hat=h(x_prev,z)</text><text x="516" y="273" font-size="19" fill="#18334c" font-weight="400">恢复P×D特征，监督重建MSE</text><text x="516" y="302" font-size="19" fill="#18334c" font-weight="400">本阶段更新tokenizer编码/解码器</text><text x="516" y="331" font-size="19" fill="#18334c" font-weight="400">黑帧特征不等于全零特征</text><path d="M893,255 L939,255" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="954" y="179" width="380" height="165" fill="#fff" stroke="#c36b24" rx="16"/><text x="972" y="211" font-size="23" fill="#c36b24" font-weight="700">一token的条件边界</text><text x="972" y="244" font-size="19" fill="#18334c" font-weight="400">z是高维连续向量，不是一个数</text><text x="972" y="273" font-size="19" fill="#18334c" font-weight="400">替换前帧会改变解码结果</text><text x="972" y="302" font-size="19" fill="#18334c" font-weight="400">首delta承担初始绝对信息</text><text x="972" y="331" font-size="19" fill="#18334c" font-weight="400">大变化可复用的前帧内容更少</text><rect x="28" y="385" width="1344" height="245" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="419" font-size="24" fill="#18334c" font-weight="700">02  再训预测器：固定tokenizer，只在delta空间选择最佳候选</text><rect x="52" y="451" width="595" height="165" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="483" font-size="23" fill="#2376c5" font-weight="700">真实历史delta + 时间戳 + 随机query</text><text x="70" y="516" font-size="19" fill="#18334c" font-weight="400">q∼N(0,.02²I)，一次生成K个候选</text><text x="70" y="545" font-size="19" fill="#18334c" font-weight="400">训练teacher forcing + 因果mask</text><text x="70" y="574" font-size="19" fill="#18334c" font-weight="400">同一目标的获胜候选接受回归监督</text><text x="70" y="603" font-size="19" fill="#18334c" font-weight="400">无须解码K张空间图再计算BoM</text><rect x="697" y="451" width="640" height="165" fill="#fff" stroke="#7750ad" rx="16"/><text x="715" y="483" font-size="23" fill="#7750ad" font-weight="700">教学BoM：真值(0,0)</text><text x="715" y="516" font-size="19" fill="#18334c" font-weight="400">A=(.1,.1)，B=(1,1)</text><text x="715" y="545" font-size="19" fill="#18334c" font-weight="400">标准smooth L1转折1：损失.01与1</text><text x="715" y="574" font-size="19" fill="#18334c" font-weight="400">选整个A；不是每维分别拼最佳候选</text><text x="715" y="603" font-size="19" fill="#18334c" font-weight="400">真实实现归约需核查；不拟合未来概率</text><rect x="28" y="655" width="1344" height="265" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="689" font-size="24" fill="#18334c" font-weight="700">03  每条未来独立滚动；空间解码仍按时间顺序</text><rect x="52" y="720" width="385" height="165" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="752" font-size="23" fill="#2376c5" font-weight="700">分支A：自己的历史</text><text x="70" y="785" font-size="19" fill="#18334c" font-weight="400">Z → z_A1 → z_A2 → z_A3</text><text x="70" y="814" font-size="19" fill="#18334c" font-weight="400">每步重新采样query</text><text x="70" y="843" font-size="19" fill="#18334c" font-weight="400">每步追加本分支预测delta</text><text x="70" y="872" font-size="19" fill="#18334c" font-weight="400">不借用分支B或真实未来</text><path d="M437,800 L483,800" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="498" y="720" width="395" height="165" fill="#fff" stroke="#17816c" rx="16"/><text x="516" y="752" font-size="23" fill="#17816c" font-weight="700">顺序恢复空间特征</text><text x="516" y="785" font-size="19" fill="#18334c" font-weight="400">真实x_t + z_A1 → x_A1</text><text x="516" y="814" font-size="19" fill="#18334c" font-weight="400">预测x_A1 + z_A2 → x_A2</text><text x="516" y="843" font-size="19" fill="#18334c" font-weight="400">预测x_A2 + z_A3 → x_A3</text><text x="516" y="872" font-size="19" fill="#18334c" font-weight="400">后步不能偷用真实x_(t+1)</text><path d="M893,800 L939,800" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="954" y="720" width="380" height="165" fill="#fff" stroke="#c36b24" rx="16"/><text x="972" y="752" font-size="23" fill="#c36b24" font-weight="700">固定下游任务头</text><text x="972" y="785" font-size="19" fill="#18334c" font-weight="400">空间特征 → 分割 / 深度</text><text x="972" y="814" font-size="19" fill="#18334c" font-weight="400">世界模型并非直接输出像素视频</text><text x="972" y="843" font-size="19" fill="#18334c" font-weight="400">中期三步，不是任意未来一步完成</text><text x="972" y="872" font-size="19" fill="#18334c" font-weight="400">预测与解码误差都可能累积</text><rect x="28" y="945" width="1344" height="250" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="979" font-size="24" fill="#18334c" font-weight="700">04  计算与评价：保留完整口径</text><text x="55" y="1012" font-size="21" fill="#18334c" font-weight="700">训练K=256，评价20样本；VFM和空间解码仍计算，token压缩不等于总耗时同比缩小。</text><text x="55" y="1060" font-size="23" fill="#7750ad" font-weight="400">Best借助真值挑最优，是覆盖能力；Mean先平均空间特征再过任务头。</text><text x="55" y="1108" font-size="22" fill="#c36b24" font-weight="400">不能先平均delta代替空间均值，也不能把Mean写成20个分数的算术平均。</text><text x="55" y="1156" font-size="20" fill="#586d80" font-weight="400">依据式2–10、Fig.3–4、§4.3，PDF4–6；教学例非实验，未训练或复现。</text><text x="36" y="1227" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1250" viewBox="0 0 1400 1250" role="img" aria-labelledby="title desc"><title id="title">1-bit视频 ｜一位给出不等式，时间先验补出高位深估计</title><desc id="desc">依据原文 式1–3、§3–4，PDF 3–6；区间、动态反例和窗口示意为独立教学内容。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1250" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">1-bit视频 ｜一位给出不等式，时间先验补出高位深估计</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据原文 式1–3、§3–4，PDF 3–6；区间、动态反例和窗口示意为独立教学内容。</text><rect x="28" y="115" width="1344" height="270" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  同一位的含义由阈值决定；不同帧通常不是同一个未知强度</text><rect x="52" y="179" width="380" height="175" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="211" font-size="23" fill="#2376c5" font-weight="700">静态教学例：同一 X=0.55</text><text x="70" y="244" font-size="19" fill="#18334c" font-weight="400">阈值：0.2 / 0.4 / 0.6 / 0.8</text><text x="70" y="273" font-size="19" fill="#18334c" font-weight="400">观测：  1  /   1  /   0  /   0</text><text x="70" y="302" font-size="19" fill="#18334c" font-weight="400">只能得到区间 0.4 ≤ X &lt; 0.6</text><text x="70" y="331" font-size="19" fill="#18334c" font-weight="400">不是唯一连续强度，更不是8位真值</text><rect x="494" y="179" width="395" height="175" fill="#fff" stroke="#c36b24" rx="16"/><text x="512" y="211" font-size="23" fill="#c36b24" font-weight="700">动态教学例：两个未知量</text><text x="512" y="244" font-size="19" fill="#18334c" font-weight="400">帧1：X₁=0.3，T₁=0.4 → 0</text><text x="512" y="273" font-size="19" fill="#18334c" font-weight="400">帧2：X₂=0.7，T₂=0.6 → 1</text><text x="512" y="302" font-size="19" fill="#18334c" font-weight="400">X₁&lt;0.4 与 X₂≥0.6 各自成立</text><text x="512" y="331" font-size="19" fill="#18334c" font-weight="400">强行当同一个X会得到空区间</text><rect x="951" y="179" width="385" height="175" fill="#fff" stroke="#7750ad" rx="16"/><text x="969" y="211" font-size="23" fill="#7750ad" font-weight="700">网络补的是时空先验</text><text x="969" y="244" font-size="19" fill="#18334c" font-weight="400">M = H(X−T)，等于阈值时记1</text><text x="969" y="273" font-size="19" fill="#18334c" font-weight="400">X̂ = N_θ(M,T)，以L1训练</text><text x="969" y="302" font-size="19" fill="#18334c" font-weight="400">欠定恢复：多个视频符合观测</text><text x="969" y="331" font-size="19" fill="#18334c" font-weight="400">低训练误差不保证逐点严格可行</text><rect x="28" y="410" width="1344" height="255" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="444" font-size="24" fill="#18334c" font-weight="700">02  阈值取值与时间排序分开；恢复网络读取缩放后的多帧</text><rect x="52" y="476" width="380" height="175" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="508" font-size="23" fill="#2376c5" font-weight="700">训练分布 → 阈值集合</text><text x="70" y="541" font-size="19" fill="#18334c" font-weight="400">均匀 / 拟合CDF / 经验分位数</text><text x="70" y="570" font-size="19" fill="#18334c" font-weight="400">主设置：5,15,…,95百分位</text><text x="70" y="599" font-size="19" fill="#18334c" font-weight="400">不使用测试真值重新拟合</text><text x="70" y="628" font-size="19" fill="#18334c" font-weight="400">再排列以增大最小相邻距离</text><path d="M432,550 L484,550" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="494" y="476" width="395" height="175" fill="#fff" stroke="#17816c" rx="16"/><text x="512" y="508" font-size="23" fill="#17816c" font-weight="700">全帧比较器 → 二值观测</text><text x="512" y="541" font-size="19" fill="#18334c" font-weight="400">同帧共享T_k，帧间改变</text><text x="512" y="570" font-size="19" fill="#18334c" font-weight="400">主设置10种阈值重复两遍</text><text x="512" y="599" font-size="19" fill="#18334c" font-weight="400">输入：Mτ，或量化区间中点</text><text x="512" y="628" font-size="19" fill="#18334c" font-weight="400">阈值循环边界和相位也需固定</text><path d="M889,550 L941,550" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="951" y="476" width="385" height="175" fill="#fff" stroke="#7750ad" rx="16"/><text x="969" y="508" font-size="23" fill="#7750ad" font-weight="700">20帧恢复网络</text><text x="969" y="541" font-size="19" fill="#18334c" font-weight="400">不显式估光流的恢复器</text><text x="969" y="570" font-size="19" fill="#18334c" font-weight="400">阈值变化会改变二值外观</text><text x="969" y="599" font-size="19" fill="#18334c" font-weight="400">无显式光流 ≠ 无时序依赖</text><text x="969" y="628" font-size="19" fill="#18334c" font-weight="400">RAW测量域与输出tone-map分开</text><rect x="28" y="690" width="1344" height="250" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="724" font-size="24" fill="#18334c" font-weight="700">03  重叠示意：用偏移窗口改善边缘上下文，代价是额外计算</text><rect x="55" y="760" width="30" height="40" fill="#e3edf7" stroke="#b5cada" rx="3"/><text x="57" y="788" font-size="16" fill="#586d80" font-weight="400">1</text><rect x="89" y="760" width="30" height="40" fill="#e3edf7" stroke="#b5cada" rx="3"/><rect x="123" y="760" width="30" height="40" fill="#e3edf7" stroke="#b5cada" rx="3"/><rect x="157" y="760" width="30" height="40" fill="#e3edf7" stroke="#b5cada" rx="3"/><rect x="191" y="760" width="30" height="40" fill="#e3edf7" stroke="#b5cada" rx="3"/><rect x="225" y="760" width="30" height="40" fill="#e3edf7" stroke="#b5cada" rx="3"/><text x="227" y="788" font-size="16" fill="#586d80" font-weight="400">6</text><rect x="259" y="760" width="30" height="40" fill="#e3edf7" stroke="#b5cada" rx="3"/><rect x="293" y="760" width="30" height="40" fill="#e3edf7" stroke="#b5cada" rx="3"/><rect x="327" y="760" width="30" height="40" fill="#e3edf7" stroke="#b5cada" rx="3"/><rect x="361" y="760" width="30" height="40" fill="#e3edf7" stroke="#b5cada" rx="3"/><rect x="395" y="760" width="30" height="40" fill="#e3edf7" stroke="#b5cada" rx="3"/><text x="397" y="788" font-size="16" fill="#586d80" font-weight="400">11</text><rect x="429" y="760" width="30" height="40" fill="#e3edf7" stroke="#b5cada" rx="3"/><rect x="463" y="760" width="30" height="40" fill="#e3edf7" stroke="#b5cada" rx="3"/><rect x="497" y="760" width="30" height="40" fill="#e3edf7" stroke="#b5cada" rx="3"/><rect x="531" y="760" width="30" height="40" fill="#e3edf7" stroke="#b5cada" rx="3"/><rect x="565" y="760" width="30" height="40" fill="#e3edf7" stroke="#b5cada" rx="3"/><text x="567" y="788" font-size="16" fill="#586d80" font-weight="400">16</text><rect x="599" y="760" width="30" height="40" fill="#e3edf7" stroke="#b5cada" rx="3"/><rect x="633" y="760" width="30" height="40" fill="#e3edf7" stroke="#b5cada" rx="3"/><rect x="667" y="760" width="30" height="40" fill="#e3edf7" stroke="#b5cada" rx="3"/><rect x="701" y="760" width="30" height="40" fill="#e3edf7" stroke="#b5cada" rx="3"/><rect x="735" y="760" width="30" height="40" fill="#e3edf7" stroke="#b5cada" rx="3"/><text x="737" y="788" font-size="16" fill="#586d80" font-weight="400">21</text><rect x="769" y="760" width="30" height="40" fill="#e3edf7" stroke="#b5cada" rx="3"/><rect x="803" y="760" width="30" height="40" fill="#e3edf7" stroke="#b5cada" rx="3"/><rect x="837" y="760" width="30" height="40" fill="#e3edf7" stroke="#b5cada" rx="3"/><rect x="871" y="760" width="30" height="40" fill="#e3edf7" stroke="#b5cada" rx="3"/><rect x="905" y="760" width="30" height="40" fill="#e3edf7" stroke="#b5cada" rx="3"/><text x="907" y="788" font-size="16" fill="#586d80" font-weight="400">26</text><rect x="939" y="760" width="30" height="40" fill="#e3edf7" stroke="#b5cada" rx="3"/><rect x="973" y="760" width="30" height="40" fill="#e3edf7" stroke="#b5cada" rx="3"/><rect x="1007" y="760" width="30" height="40" fill="#e3edf7" stroke="#b5cada" rx="3"/><rect x="1041" y="760" width="30" height="40" fill="#e3edf7" stroke="#b5cada" rx="3"/><rect x="55" y="816" width="676" height="34" fill="#d7e9fa" stroke="#2376c5" rx="4"/><text x="70" y="840" font-size="20" fill="#2376c5" font-weight="700">窗口A：帧1–20</text><rect x="395" y="866" width="676" height="34" fill="#d8eee5" stroke="#17816c" rx="4"/><text x="410" y="890" font-size="20" fill="#17816c" font-weight="700">偏移窗口B：帧11–30</text><rect x="1120" y="758" width="216" height="175" fill="#fff" stroke="#c36b24" rx="16"/><text x="1138" y="790" font-size="23" fill="#c36b24" font-weight="700">共享帧11–20</text><text x="1138" y="823" font-size="19" fill="#18334c" font-weight="400">不同上下文位置</text><text x="1138" y="852" font-size="19" fill="#18334c" font-weight="400">用于边界替换</text><text x="1138" y="881" font-size="19" fill="#18334c" font-weight="400">不是只输出一帧</text><text x="1138" y="910" font-size="19" fill="#18334c" font-weight="400">精确裁剪需查实现</text><rect x="28" y="965" width="1344" height="220" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="999" font-size="24" fill="#18334c" font-weight="700">04  前端减负不等于整机免费重建</text><text x="55" y="1032" font-size="22" fill="#18334c" font-weight="700">同采样数下原始负载：WHf×8 bit → WHf×1 bit；不含阈值元数据、协议或恢复计算。</text><text x="55" y="1078" font-size="22" fill="#c36b24" font-weight="400">曝光 / 读出 / 其他开销仍存在；重叠和未来帧上下文还会影响计算、缓存与延迟。</text><text x="55" y="1124" font-size="21" fill="#586d80" font-weight="400">比较器概念验证 ≠ 完整高速相机能耗认证；RGB逐通道1bit ≠ 整个彩色像素只有1bit。</text><text x="36" y="1227" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1220" viewBox="0 0 1400 1220" role="img" aria-labelledby="title desc"><title id="title">PL-Stitch ｜把流程顺序写成可优化的列表概率</title><desc id="desc">依据原文 Fig.3/4、式1–5、Algorithm 1，PDF 3–6；数值与四块patch均为解释例子。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1220" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">PL-Stitch ｜把流程顺序写成可优化的列表概率</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据原文 Fig.3/4、式1–5、Algorithm 1，PDF 3–6；数值与四块patch均为解释例子。</text><rect x="28" y="115" width="1344" height="245" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  共享图像编码器，时间任务只融合每帧 CLS</text><rect x="60" y="185" width="64" height="64" fill="#e2eef8" stroke="#2376c5" rx="8"/><text x="76" y="226" font-size="21" fill="#2376c5" font-weight="700">t₀</text><rect x="146" y="185" width="64" height="64" fill="#e2eef8" stroke="#2376c5" rx="8"/><text x="162" y="226" font-size="21" fill="#2376c5" font-weight="700">t₁</text><rect x="232" y="185" width="64" height="64" fill="#e2eef8" stroke="#2376c5" rx="8"/><text x="248" y="226" font-size="21" fill="#2376c5" font-weight="700">t₂</text><text x="59" y="289" font-size="19" fill="#586d80" font-weight="400">图中画3帧；默认实际采8帧</text><path d="M305,217 L365,217" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="375" y="178" width="240" height="132" fill="#fff" stroke="#2376c5" rx="16"/><text x="393" y="210" font-size="23" fill="#2376c5" font-weight="700">共享 fθ</text><text x="393" y="243" font-size="19" fill="#18334c" font-weight="400">每帧：(N+1) × D</text><text x="393" y="272" font-size="19" fill="#18334c" font-weight="400">取 CLS → k × D</text><path d="M615,238 L673,238" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="683" y="178" width="310" height="132" fill="#fff" stroke="#7750ad" rx="16"/><text x="701" y="210" font-size="23" fill="#7750ad" font-weight="700">视频排序头</text><text x="701" y="243" font-size="19" fill="#18334c" font-weight="400">MLP → Temporal Transformer</text><text x="701" y="272" font-size="19" fill="#18334c" font-weight="400">→ MLP → 每帧一个分数</text><path d="M993,238 L1047,238" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="1057" y="178" width="279" height="132" fill="#fff" stroke="#17816c" rx="16"/><text x="1075" y="210" font-size="23" fill="#17816c" font-weight="700">PL 时间损失</text><text x="1075" y="243" font-size="19" fill="#18334c" font-weight="400">s_clip：k 个实数</text><text x="1075" y="272" font-size="19" fill="#18334c" font-weight="400">目标是相对时间顺序</text><rect x="28" y="385" width="1344" height="245" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="419" font-size="24" fill="#18334c" font-weight="700">02  列表概率：每次从剩余元素中选择下一个</text><text x="55" y="452" font-size="24" fill="#18334c" font-weight="700">解释例子：目标 A → B → C；exp(s) = (4, 2, 1)</text><rect x="55" y="480" width="305" height="100" fill="#fff" stroke="#17816c" rx="16"/><text x="73" y="512" font-size="23" fill="#17816c" font-weight="700">先选 A</text><text x="73" y="545" font-size="19" fill="#18334c" font-weight="400">4 / (4+2+1) = 4/7</text><rect x="448" y="480" width="345" height="100" fill="#fff" stroke="#17816c" rx="16"/><text x="466" y="512" font-size="23" fill="#17816c" font-weight="700">移除 A，再选 B</text><text x="466" y="545" font-size="19" fill="#18334c" font-weight="400">2 / (2+1) = 2/3</text><rect x="880" y="480" width="456" height="100" fill="#fff" stroke="#17816c" rx="16"/><text x="898" y="512" font-size="23" fill="#17816c" font-weight="700">最后只有 C</text><text x="898" y="545" font-size="19" fill="#18334c" font-weight="400">1 / 1 = 1</text><path d="M360,530 L441,530" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><path d="M793,530 L873,530" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><text x="55" y="611" font-size="22" fill="#7750ad" font-weight="700">P(A,B,C) = 8/21；−log P ≈ 0.965。分数不是秒数，也不是阶段标签。</text><rect x="28" y="655" width="1344" height="345" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="689" font-size="24" fill="#18334c" font-weight="700">03  拼图头：当前帧提问，邻帧提供内容；梯度路径分开</text><rect x="60" y="730" width="60" height="60" fill="#e2eef8" stroke="#2376c5" rx="5"/><text x="79" y="769" font-size="25" fill="#2376c5" font-weight="700">1</text><rect x="130" y="730" width="60" height="60" fill="#e7edf2" stroke="#2376c5" rx="5"/><text x="149" y="769" font-size="25" fill="#2376c5" font-weight="700">?</text><rect x="60" y="800" width="60" height="60" fill="#e7edf2" stroke="#2376c5" rx="5"/><text x="79" y="839" font-size="25" fill="#2376c5" font-weight="700">?</text><rect x="130" y="800" width="60" height="60" fill="#e2eef8" stroke="#2376c5" rx="5"/><text x="149" y="839" font-size="25" fill="#2376c5" font-weight="700">4</text><text x="56" y="900" font-size="20" fill="#2376c5" font-weight="700">当前帧patch → Q</text><path d="M205,795 L365,795" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="375" y="730" width="410" height="130" fill="#fff" stroke="#7750ad" rx="16"/><text x="393" y="762" font-size="23" fill="#7750ad" font-weight="700">拼图头</text><text x="393" y="795" font-size="19" fill="#18334c" font-weight="400">Cross-Attention → Self-Attention</text><text x="393" y="824" font-size="19" fill="#18334c" font-weight="400">→ MLP → N 个排序分数</text><path d="M785,795 L852,795" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="862" y="730" width="474" height="130" fill="#fff" stroke="#17816c" rx="16"/><text x="880" y="762" font-size="23" fill="#17816c" font-weight="700">空间顺序的 PL 损失</text><text x="880" y="795" font-size="19" fill="#18334c" font-weight="400">原网格线性化目标：1,2,…,N</text><text x="880" y="824" font-size="19" fill="#18334c" font-weight="400">不是逐像素重建，也不是光流标签</text><rect x="375" y="888" width="410" height="80" fill="#fff" stroke="#c36b24" rx="16"/><text x="393" y="920" font-size="23" fill="#c36b24" font-weight="700">过去 + 未来patch → K/V</text><text x="393" y="947" font-size="19" fill="#c36b24" font-weight="400">2N × D；上下文特征 stop-gradient</text><path d="M580,888 L580,867" fill="none" stroke="#c36b24" stroke-width="3" marker-end="url(#c36b24)" /><text x="862" y="907" font-size="20" fill="#586d80" font-weight="400">no PE 的具体分支、patch 是否置乱</text><text x="862" y="941" font-size="20" fill="#586d80" font-weight="400">仍需核对实现，不能画成已排除所有捷径</text><rect x="28" y="1025" width="1344" height="140" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="1059" font-size="24" fill="#18334c" font-weight="700">04  预训练结束：只把编码器带到逐帧下游评价</text><text x="55" y="1091" font-size="24" fill="#18334c" font-weight="700">L = L_vid + L_MIM + 0.4 L_jigsaw；按可回传路径更新共享编码器与任务头</text><text x="55" y="1134" font-size="21" fill="#17816c" font-weight="400">冻结编码器 → 有标签线性探针 / kNN；预训练使用未来帧，不等于下游每帧也读取未来</text><text x="36" y="1197" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>
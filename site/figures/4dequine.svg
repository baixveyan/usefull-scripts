<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">4DEquine：动作随时间变化，外观只重建一次</title><desc id="desc">两条网络以同一个马科参数模板相接；“前馈”并未取消几何后优化。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#6e8a83"/></marker><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#dde6dd"/></pattern></defs><rect width="1200" height="660" rx="20" fill="#fafcf8"/><rect y="110" width="1200" height="490" fill="url(#dots)"/><g font-family="Inter,Segoe UI,Microsoft YaHei,sans-serif"><text x="40" y="38" fill="#688279" font-size="11" font-weight="650">PAPER ATLAS / METHOD EXPLAINED</text><text x="40" y="75" fill="#1f3d34" font-size="28" font-weight="650">4DEquine：动作随时间变化，外观只重建一次</text><text x="40" y="103" fill="#71867e" font-size="13" font-weight="400">两条网络以同一个马科参数模板相接；“前馈”并未取消几何后优化。</text><rect x="40" y="150" width="210" height="140" rx="14" fill="#e7effb" stroke="#3b6fba" stroke-opacity=".25"/><text x="60" y="182" fill="#3b6fba" font-size="18" font-weight="650">单目视频</text><text x="60" y="211" fill="#253d3c" font-size="14" font-weight="400">连续 16 帧窗口</text><text x="60" y="236" fill="#253d3c" font-size="14" font-weight="400">长视频滑窗推进</text><rect x="330" y="150" width="360" height="140" rx="14" fill="#e7effb" stroke="#3b6fba" stroke-opacity=".25"/><text x="350" y="182" fill="#3b6fba" font-size="18" font-weight="650">AniMoFormer：动作</text><text x="350" y="211" fill="#253d3c" font-size="14" font-weight="400">空间 → 时间 Transformer</text><text x="350" y="236" fill="#253d3c" font-size="14" font-weight="400">VAREN 姿态 / 形状 / 相机</text><text x="350" y="261" fill="#253d3c" font-size="14" font-weight="400">后优化：关键点 + mask 对齐</text><rect x="40" y="395" width="210" height="140" rx="14" fill="#f0eafa" stroke="#7753a8" stroke-opacity=".25"/><text x="60" y="427" fill="#7753a8" font-size="18" font-weight="650">一张代表性图像</text><text x="60" y="456" fill="#253d3c" font-size="14" font-weight="400">提取静态外观</text><text x="60" y="481" fill="#253d3c" font-size="14" font-weight="400">不需要完整环视</text><rect x="330" y="395" width="360" height="140" rx="14" fill="#f0eafa" stroke="#7753a8" stroke-opacity=".25"/><text x="350" y="427" fill="#7753a8" font-size="18" font-weight="650">EquineGS：外观</text><text x="350" y="456" fill="#253d3c" font-size="14" font-weight="400">DINOv3 图像 + 模板点特征</text><text x="350" y="481" fill="#253d3c" font-size="14" font-weight="400">双流 DSTG → 高斯属性</text><text x="350" y="506" fill="#253d3c" font-size="14" font-weight="400">55,486 个模板绑定高斯</text><rect x="805" y="265" width="350" height="160" rx="14" fill="#e5f3ec" stroke="#237958" stroke-opacity=".25"/><text x="825" y="297" fill="#237958" font-size="18" font-weight="650">VAREN 桥梁 → 可动画 avatar</text><text x="825" y="326" fill="#253d3c" font-size="14" font-weight="400">动作参数驱动模板与 LBS</text><text x="825" y="351" fill="#253d3c" font-size="14" font-weight="400">规范空间高斯变形到各帧</text><text x="825" y="376" fill="#253d3c" font-size="14" font-weight="400">渲染新姿态 / 视角</text><text x="825" y="408" fill="#237958" font-size="11" font-weight="600">不可见表面来自学习先验</text><path d="M250 220 L330 220" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M250 465 L330 465" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M690 220 L805 305" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><text x="752.5" y="253.5" fill="#627b73" font-size="11" font-weight="400">动态几何</text><path d="M690 465 L805 385" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><text x="752.5" y="416.0" fill="#627b73" font-size="11" font-weight="400">静态外观</text><path d="M40 606H1160" stroke="#dae5dc"/><text x="40" y="631" fill="#71867e" font-size="12" font-weight="400">依据原论文 Fig.2 / §4 重绘；VarenPoser 教动作，VarenTex 教多视图外观。</text><text x="1000" y="631" fill="#71867e" font-size="11" font-weight="400">原创概念重绘 · 非原图</text></g></svg>
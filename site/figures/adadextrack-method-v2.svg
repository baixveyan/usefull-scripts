<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1040" viewBox="0 0 1400 1040" role="img" aria-labelledby="title desc"><title id="title">AdaDexTrack ｜把参考、表示和动作都接回反馈环</title><desc id="desc">依据原文 §3、Fig.2，PDF 3–5；320 为参考展平计数，不是完整策略观测维度。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1040" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">AdaDexTrack ｜把参考、表示和动作都接回反馈环</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据原文 §3、Fig.2，PDF 3–5；320 为参考展平计数，不是完整策略观测维度。</text><rect x="28" y="115" width="1344" height="230" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  训练技能载体：多个专家的经验进入一个通用跟踪器</text><rect x="52" y="178" width="270" height="130" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="210" font-size="23" fill="#2376c5" font-weight="700">语言 → 人手物轨迹</text><text x="70" y="243" font-size="19" fill="#18334c" font-weight="400">DiffH2O 生成参考</text><text x="70" y="272" font-size="19" fill="#18334c" font-weight="400">重定向到机械臂 + 手</text><rect x="374" y="178" width="275" height="130" fill="#fff" stroke="#17816c" rx="16"/><text x="392" y="210" font-size="23" fill="#17816c" font-weight="700">PPO 专家集合</text><text x="392" y="243" font-size="19" fill="#18334c" font-weight="400">按参考学习动力学跟踪</text><text x="392" y="272" font-size="19" fill="#18334c" font-weight="400">只收集成功状态—动作对</text><rect x="705" y="178" width="280" height="130" fill="#fff" stroke="#7750ad" rx="16"/><text x="723" y="210" font-size="23" fill="#7750ad" font-weight="700">离线行为克隆</text><text x="723" y="243" font-size="19" fill="#18334c" font-weight="400">模仿专家动作</text><text x="723" y="272" font-size="19" fill="#18334c" font-weight="400">物体编码也是策略条件</text><rect x="1040" y="178" width="300" height="130" fill="#fff" stroke="#2376c5" rx="16"/><text x="1058" y="210" font-size="23" fill="#2376c5" font-weight="700">通用跟踪器</text><text x="1058" y="243" font-size="19" fill="#18334c" font-weight="400">蒸馏完成后冻结权重</text><text x="1058" y="272" font-size="19" fill="#18334c" font-weight="400">供后续调制器调用</text><path d="M322,240 L367,240" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><path d="M649,240 L698,240" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><path d="M985,240 L1033,240" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="28" y="369" width="1344" height="390" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="403" font-size="24" fill="#18334c" font-weight="700">02  一个控制周期：R / O 在输入端，T 在输出端</text><rect x="52" y="431" width="295" height="155" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="463" font-size="23" fill="#2376c5" font-weight="700">当前状态 + 参考窗口</text><text x="70" y="496" font-size="19" fill="#18334c" font-weight="400">本体状态、估计物体位姿</text><text x="70" y="525" font-size="19" fill="#18334c" font-weight="400">当前与未来 1 / 2 / 4 / 12 帧</text><text x="70" y="554" font-size="19" fill="#18334c" font-weight="400">一帧参考：22 + 5×7 + 7</text><text x="70" y="583" font-size="19" fill="#18334c" font-weight="400">5 帧展平参考 = 320 个数</text><rect x="401" y="431" width="275" height="155" fill="#fff" stroke="#c36b24" rx="16"/><text x="419" y="463" font-size="23" fill="#c36b24" font-weight="700">学得的调制器</text><text x="419" y="496" font-size="19" fill="#18334c" font-weight="400">R：微调近未来参考</text><text x="419" y="525" font-size="19" fill="#18334c" font-weight="400">O：调节 64 维物体条件</text><text x="419" y="554" font-size="19" fill="#18334c" font-weight="400">T：22 维关节目标残差</text><path d="M347,505 L394,505" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="742" y="431" width="280" height="155" fill="#fff" stroke="#7750ad" rx="16"/><text x="760" y="463" font-size="23" fill="#7750ad" font-weight="700">冻结的通用跟踪器</text><text x="760" y="496" font-size="19" fill="#18334c" font-weight="400">输入修正参考 + 潜变量</text><text x="760" y="525" font-size="19" fill="#18334c" font-weight="400">按当前状态输出动作</text><text x="760" y="554" font-size="19" fill="#18334c" font-weight="400">a：22 维相对关节目标</text><path d="M676,480 L735,480" fill="none" stroke="#7750ad" stroke-width="3" marker-end="url(#7750ad)" /><text x="693" y="465" font-size="17" fill="#7750ad" font-weight="400">R / O</text><rect x="1078" y="431" width="258" height="155" fill="#fff" stroke="#17816c" rx="16"/><text x="1096" y="463" font-size="23" fill="#17816c" font-weight="700">合成与执行</text><text x="1096" y="496" font-size="19" fill="#18334c" font-weight="400">a′ = a + Δa</text><text x="1096" y="525" font-size="19" fill="#18334c" font-weight="400">相对位置目标 → PD</text><text x="1096" y="554" font-size="19" fill="#18334c" font-weight="400">物理系统产生下一状态</text><path d="M1022,505 L1071,505" fill="none" stroke="#17816c" stroke-width="3" marker-end="url(#17816c)" /><path d="M540 586 L540 630 L1205 630 L1205 594" fill="none" stroke="#c36b24" stroke-width="3" marker-end="url(#c36b24)" /><text x="740" y="621" font-size="18" fill="#c36b24" font-weight="400">T：不经过跟踪器，直接补偿最终目标</text><path d="M1205 586 L1205 713 L190 713 L190 594" fill="none" stroke="#17816c" stroke-width="3" marker-end="url(#17816c)" stroke-dasharray="9 6"/><text x="475" y="704" font-size="19" fill="#17816c" font-weight="400">传感器读到的新状态回到下一周期；不是直接对真机物理反向传播</text><rect x="28" y="784" width="1344" height="195" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="818" font-size="24" fill="#18334c" font-weight="700">03  贯穿例子：三个接口解决不同层次的偏差</text><rect x="52" y="838" width="380" height="108" fill="#fff" stroke="#c36b24" rx="16"/><text x="70" y="870" font-size="23" fill="#c36b24" font-weight="700">R：不要一步追赶不可达目标</text><text x="70" y="903" font-size="19" fill="#18334c" font-weight="400">原参考 x=10 cm、实际 x=7 cm</text><text x="70" y="932" font-size="19" fill="#18334c" font-weight="400">可暂调近未来为 8 cm → 再接轨</text><rect x="486" y="838" width="380" height="108" fill="#fff" stroke="#7750ad" rx="16"/><text x="504" y="870" font-size="23" fill="#7750ad" font-weight="700">O：调用不同手型倾向</text><text x="504" y="903" font-size="19" fill="#18334c" font-weight="400">接近与抓握阶段采用不同潜变量</text><text x="504" y="932" font-size="19" fill="#18334c" font-weight="400">不是把 64 维编码当单调标量旋钮</text><rect x="920" y="838" width="416" height="108" fill="#fff" stroke="#17816c" rx="16"/><text x="938" y="870" font-size="23" fill="#17816c" font-weight="700">T：补偿剩余关节误差</text><text x="938" y="903" font-size="19" fill="#18334c" font-weight="400">例：0.020 rad + (−0.005) = 0.015 rad</text><text x="938" y="932" font-size="19" fill="#18334c" font-weight="400">示例数值不代表控制频率或安全限值</text><text x="36" y="1017" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>
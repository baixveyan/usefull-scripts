<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">TCCA：同一个时间步，不同手势需要不同控制</title><desc id="desc">去噪状态、手势复杂度与纹理一起决定条件权重；不只是预设时间曲线。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#6e8a83"/></marker><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#dde6dd"/></pattern></defs><rect width="1200" height="660" rx="20" fill="#fafcf8"/><rect y="110" width="1200" height="490" fill="url(#dots)"/><g font-family="Inter,Segoe UI,Microsoft YaHei,sans-serif"><text x="40" y="38" fill="#688279" font-size="11" font-weight="650">PAPER ATLAS / METHOD EXPLAINED</text><text x="40" y="75" fill="#1f3d34" font-size="28" font-weight="650">TCCA：同一个时间步，不同手势需要不同控制</text><text x="40" y="103" fill="#71867e" font-size="13" font-weight="400">去噪状态、手势复杂度与纹理一起决定条件权重；不只是预设时间曲线。</text><rect x="40" y="145" width="270" height="150" rx="14" fill="#e7effb" stroke="#3b6fba" stroke-opacity=".25"/><text x="60" y="177" fill="#3b6fba" font-size="18" font-weight="650">目标姿态 + 多参考图</text><text x="60" y="206" fill="#253d3c" font-size="14" font-weight="400">PoseNet → 多尺度 Fp</text><text x="60" y="231" fill="#253d3c" font-size="14" font-weight="400">CLIP patch → SVD / 聚合</text><text x="60" y="256" fill="#253d3c" font-size="14" font-weight="400">全局 CLS + 局部外观 Fa</text><rect x="410" y="145" width="330" height="150" rx="14" fill="#f0eafa" stroke="#7753a8" stroke-opacity=".25"/><text x="430" y="177" fill="#7753a8" font-size="18" font-weight="650">三组 query 对齐语义</text><text x="430" y="206" fill="#253d3c" font-size="14" font-weight="400">Qc 读取当前噪声潜变量</text><text x="430" y="231" fill="#253d3c" font-size="14" font-weight="400">Qp 读取姿态；Qa 读取外观</text><text x="430" y="256" fill="#253d3c" font-size="14" font-weight="400">时间嵌入与内容交互</text><path d="M310 220 L410 220" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="850" y="145" width="305" height="150" rx="14" fill="#fff1df" stroke="#aa6b29" stroke-opacity=".25"/><text x="870" y="177" fill="#aa6b29" font-size="18" font-weight="650">动态控制强度</text><text x="870" y="206" fill="#253d3c" font-size="14" font-weight="400">时间 base + 内容 residual</text><text x="870" y="231" fill="#253d3c" font-size="14" font-weight="400">姿态：通道级 αp</text><text x="870" y="256" fill="#253d3c" font-size="14" font-weight="400">外观：token 级 αa</text><path d="M740 220 L850 220" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="410" y="420" width="745" height="140" rx="14" fill="#e5f3ec" stroke="#237958" stroke-opacity=".25"/><text x="430" y="452" fill="#237958" font-size="18" font-weight="650">每个去噪时刻：条件权重 → U-Net → 更新潜变量</text><text x="430" y="481" fill="#253d3c" font-size="14" font-weight="400">姿态特征加到下采样块；外观通过 cross-attention 注入</text><text x="430" y="506" fill="#253d3c" font-size="14" font-weight="400">只有 base 权重互补；最终 αp / αa 不必和为 1</text><text x="430" y="531" fill="#253d3c" font-size="14" font-weight="400">SVD 主方向不是已证明的纯姿态，投影维度需核验</text><path d="M1000 295 L1000 420" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M410 490 L375 490" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="7 6"/><path d="M375 490 L375 125" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="7 6"/><text x="380.0" y="298.5" fill="#627b73" font-size="11" font-weight="400">下一步</text><path d="M375 125 L575 125" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="7 6"/><path d="M575 125 L575 145" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="7 6"/><path d="M40 606H1160" stroke="#dae5dc"/><text x="40" y="631" fill="#71867e" font-size="12" font-weight="400">依据原论文 Fig.3 / §3 重绘；PIAE 式4的投影形状与符号另见讲解。</text><text x="1000" y="631" fill="#71867e" font-size="11" font-weight="400">原创概念重绘 · 非原图</text></g></svg>
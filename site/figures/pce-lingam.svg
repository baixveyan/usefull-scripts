<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">PCE-LiNGAM：用随机展开描述噪声，再研究方向</title><desc id="desc">作者流程概述与待核验环节并列呈现；未声称本地证明或复现通过。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#6e8a83"/></marker><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#dde6dd"/></pattern></defs><rect width="1200" height="660" rx="20" fill="#fafcf8"/><rect y="110" width="1200" height="490" fill="url(#dots)"/><g font-family="Inter,Segoe UI,Microsoft YaHei,sans-serif"><text x="40" y="38" fill="#688279" font-size="11" font-weight="650">PAPER ATLAS / METHOD EXPLAINED</text><text x="40" y="75" fill="#1f3d34" font-size="28" font-weight="650">PCE-LiNGAM：用随机展开描述噪声，再研究方向</text><text x="40" y="103" fill="#71867e" font-size="13" font-weight="400">作者流程概述与待核验环节并列呈现；未声称本地证明或复现通过。</text><rect x="40" y="155" width="250" height="160" rx="14" fill="#e7effb" stroke="#3b6fba" stroke-opacity=".25"/><text x="60" y="187" fill="#3b6fba" font-size="18" font-weight="650">观测变量 X</text><text x="60" y="216" fill="#253d3c" font-size="14" font-weight="400">中心化与 PCE 签名</text><text x="60" y="241" fill="#253d3c" font-size="14" font-weight="400">基与阶数必须匹配分布</text><text x="60" y="266" fill="#253d3c" font-size="14" font-weight="400">ζ 与观测如何耦合需核验</text><rect x="390" y="155" width="300" height="160" rx="14" fill="#f0eafa" stroke="#7753a8" stroke-opacity=".25"/><text x="410" y="187" fill="#7753a8" font-size="18" font-weight="650">候选方向与残差</text><text x="410" y="216" fill="#253d3c" font-size="14" font-weight="400">多项式回归 Xj ~ Xi</text><text x="410" y="241" fill="#253d3c" font-size="14" font-weight="400">提取残差系数签名</text><text x="410" y="266" fill="#253d3c" font-size="14" font-weight="400">比较所谓独立性 / 污染度</text><path d="M290 235 L390 235" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="810" y="155" width="340" height="160" rx="14" fill="#e5f3ec" stroke="#237958" stroke-opacity=".25"/><text x="830" y="187" fill="#237958" font-size="18" font-weight="650">递归图结构搜索</text><text x="830" y="216" fill="#253d3c" font-size="14" font-weight="400">推测汇点 → 选择父节点</text><text x="830" y="241" fill="#253d3c" font-size="14" font-weight="400">检查多父节点冗余</text><text x="830" y="266" fill="#253d3c" font-size="14" font-weight="400">移除汇点并重复</text><path d="M690 235 L810 235" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="810" y="415" width="340" height="140" rx="14" fill="#e5f3ec" stroke="#237958" stroke-opacity=".25"/><text x="830" y="447" fill="#237958" font-size="18" font-weight="650">代理模型方差归因</text><text x="830" y="476" fill="#253d3c" font-size="14" font-weight="400">重估全局 PCE 展开</text><text x="830" y="501" fill="#253d3c" font-size="14" font-weight="400">Sobol 指数 + bootstrap</text><text x="830" y="526" fill="#253d3c" font-size="14" font-weight="400">不等于精确干预效应</text><path d="M980 315 L980 415" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="50" y="415" width="610" height="140" rx="14" fill="#fff1df" stroke="#aa6b29" stroke-opacity=".25"/><text x="70" y="447" fill="#aa6b29" font-size="18" font-weight="650">理论与实现边界</text><text x="70" y="476" fill="#253d3c" font-size="14" font-weight="400">独立噪声 / 有限矩 / 稀疏指纹是实质假设</text><text x="70" y="501" fill="#253d3c" font-size="14" font-weight="400">小图合成实验不证明任意工业系统可识别</text><text x="70" y="526" fill="#253d3c" font-size="14" font-weight="400">参考 ζ 若与数据独立随机配对，投影不能自动恢复指纹</text><path d="M40 606H1160" stroke="#dae5dc"/><text x="40" y="631" fill="#71867e" font-size="12" font-weight="400">依据原论文 Algorithm1 / §2 重绘；保留潜变量耦合这一关键未说明边界。</text><text x="1000" y="631" fill="#71867e" font-size="11" font-weight="400">原创概念重绘 · 非原图</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1220" viewBox="0 0 1400 1220" role="img" aria-labelledby="title desc"><title id="title">RDD ｜重建误差怎样做差，图像与latent怎样分工</title><desc id="desc">依据原文 Fig.1、式1–7、§3，PDF 2–5；保留式6符号问题，教学分数不是实验输出。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1220" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">RDD ｜重建误差怎样做差，图像与latent怎样分工</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据原文 Fig.1、式1–7、§3，PDF 2–5；保留式6符号问题，教学分数不是实验输出。</text><rect x="28" y="115" width="1344" height="280" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  图像路径：四个输入分别重建，再按正负号组合</text><rect x="52" y="178" width="280" height="125" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="210" font-size="23" fill="#2376c5" font-weight="700">原图 x</text><text x="70" y="243" font-size="19" fill="#18334c" font-weight="400">f_AE(x) = 0.12</text><text x="70" y="272" font-size="19" fill="#18334c" font-weight="400">系数 +1</text><rect x="398" y="178" width="295" height="125" fill="#fff" stroke="#17816c" rx="16"/><text x="416" y="210" font-size="23" fill="#17816c" font-weight="700">低通 Fx</text><text x="416" y="243" font-size="19" fill="#18334c" font-weight="400">f_AE(Fx) = 0.05</text><text x="416" y="272" font-size="19" fill="#18334c" font-weight="400">系数 −1</text><rect x="757" y="178" width="305" height="125" fill="#fff" stroke="#c36b24" rx="16"/><text x="775" y="210" font-size="23" fill="#c36b24" font-weight="700">旋转 Rx</text><text x="775" y="243" font-size="19" fill="#18334c" font-weight="400">f_AE(Rx) = 0.20</text><text x="775" y="272" font-size="19" fill="#18334c" font-weight="400">系数 −λ_R</text><rect x="1124" y="178" width="212" height="125" fill="#fff" stroke="#7750ad" rx="16"/><text x="1142" y="210" font-size="23" fill="#7750ad" font-weight="700">低通旋转 FRx</text><text x="1142" y="243" font-size="19" fill="#18334c" font-weight="400">f_AE(FRx)=0.08</text><text x="1142" y="272" font-size="19" fill="#18334c" font-weight="400">系数 +λ_R</text><text x="55" y="344" font-size="25" fill="#18334c" font-weight="700">λ_R=0.5 → S_image = 0.12 − 0.05 − 0.10 + 0.04 = 0.01</text><text x="55" y="378" font-size="21" fill="#586d80" font-weight="400">教学例子：四项都加0.30，结果仍为0.01；真实干扰不保证完全相同。</text><rect x="28" y="420" width="1344" height="220" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="454" font-size="24" fill="#18334c" font-weight="700">02  两种旋转路径不同，不能为了省计算直接替换</text><rect x="52" y="485" width="585" height="110" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="517" font-size="23" fill="#2376c5" font-weight="700">图像路径</text><text x="70" y="550" font-size="19" fill="#18334c" font-weight="400">x → 旋转图像 Rx → E(Rx) → D → 与 Rx 比较</text><text x="70" y="579" font-size="19" fill="#18334c" font-weight="400">每个变换输入都要有自己的重建参照</text><rect x="697" y="485" width="639" height="110" fill="#fff" stroke="#7750ad" rx="16"/><text x="715" y="517" font-size="23" fill="#7750ad" font-weight="700">latent路径</text><text x="715" y="550" font-size="19" fill="#18334c" font-weight="400">x → 编码 E(x) → 旋转空间网格 R(E(x))</text><text x="715" y="579" font-size="19" fill="#18334c" font-weight="400">一般 E(Rx) ≠ R(E(x))；latent范数可保持</text><rect x="28" y="665" width="1344" height="280" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="699" font-size="24" fill="#18334c" font-weight="700">03  latent：加已知噪声，比较预测噪声，再看旋转参照</text><rect x="52" y="733" width="355" height="145" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="765" font-size="23" fill="#2376c5" font-weight="700">z₀ 与 Rz₀ 两路</text><text x="70" y="798" font-size="19" fill="#18334c" font-weight="400">z_t = √ᾱ_t z₀ + √(1−ᾱ_t) ε</text><text x="70" y="827" font-size="19" fill="#18334c" font-weight="400">小时间步；空文本条件</text><text x="70" y="856" font-size="19" fill="#18334c" font-weight="400">不是从纯噪声完整生成图片</text><path d="M407,803 L470,803" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="480" y="733" width="385" height="145" fill="#fff" stroke="#17816c" rx="16"/><text x="498" y="765" font-size="23" fill="#17816c" font-weight="700">噪声预测误差</text><text x="498" y="798" font-size="19" fill="#18334c" font-weight="400">ε_θ(z_t,t,∅) 与已知 ε 比较</text><text x="498" y="827" font-size="19" fill="#18334c" font-weight="400">多次采样平均为 f_latent</text><text x="498" y="856" font-size="19" fill="#18334c" font-weight="400">噪声配对与调度需核对实现</text><path d="M865,803 L928,803" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="938" y="733" width="398" height="145" fill="#fff" stroke="#c36b24" rx="16"/><text x="956" y="765" font-size="23" fill="#c36b24" font-weight="700">原式6首行：旋转减原值</text><text x="956" y="798" font-size="19" fill="#18334c" font-weight="400">S_latent = f(Rz₀) − f(z₀)</text><text x="956" y="827" font-size="19" fill="#18334c" font-weight="400">同式展开行顺序相反，保留歧义</text><text x="956" y="856" font-size="19" fill="#18334c" font-weight="400">最终平方消整体符号，不消阈值问题</text><text x="55" y="921" font-size="22" fill="#586d80" font-weight="400">范数保持不等于所有属性不变；旋转后也可能偏离参考模型常见的latent结构。</text><rect x="28" y="970" width="1344" height="190" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="1004" font-size="24" fill="#18334c" font-weight="700">04  最终 S_RDD = S_image × (S_latent)²</text><text x="55" y="1036" font-size="23" fill="#18334c" font-weight="700">这是融合分数，不是贝叶斯后验，也不自动落在[0,1]；低分判生成仍需校准阈值。</text><text x="55" y="1081" font-size="22" fill="#7750ad" font-weight="400">主检测 t=0.05、λ_R=0.5；归因任务另设λ_R=0.25，归因速度不能套到完整RDD。</text><text x="55" y="1126" font-size="21" fill="#586d80" font-weight="400">上部四个误差均为代数例子；未运行检测器、未产生实验图或逐图真假结论。</text><text x="36" y="1197" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>
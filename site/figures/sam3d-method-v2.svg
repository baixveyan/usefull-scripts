<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1270" viewBox="0 0 1400 1270" role="img" aria-labelledby="title desc"><title id="title">SAM 3D ｜从目标掩码到三维对象，再到人工选择循环</title><desc id="desc">依据原文 §2–3、Fig.2/5、Table 1，PDF 2–6；注意力关系对照原图，不虚构内部token数。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1270" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">SAM 3D ｜从目标掩码到三维对象，再到人工选择循环</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据原文 §2–3、Fig.2/5、Table 1，PDF 2–6；注意力关系对照原图，不虚构内部token数。</text><rect x="28" y="115" width="1344" height="270" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  两阶段生成：先确定粗形状和布局，再细化与解码</text><rect x="52" y="178" width="280" height="145" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="210" font-size="23" fill="#2376c5" font-weight="700">图像条件</text><text x="70" y="243" font-size="19" fill="#18334c" font-weight="400">裁剪图+mask / 全图+mask</text><text x="70" y="272" font-size="19" fill="#18334c" font-weight="400">DINOv2 四组条件token</text><text x="70" y="301" font-size="19" fill="#18334c" font-weight="400">可选：场景 pointmap</text><path d="M332,245 L387,245" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="397" y="178" width="295" height="145" fill="#fff" stroke="#7750ad" rx="16"/><text x="415" y="210" font-size="23" fill="#7750ad" font-weight="700">Geometry：1.2B</text><text x="415" y="243" font-size="19" fill="#18334c" font-weight="400">粗形状 O：64³ 空间网格</text><text x="415" y="272" font-size="19" fill="#18334c" font-weight="400">旋转6D / 平移3D / 尺度3D</text><text x="415" y="301" font-size="19" fill="#18334c" font-weight="400">网格位置数 ≠ 主干token数</text><path d="M692,245 L747,245" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><text x="711" y="225" font-size="20" fill="#7750ad" font-weight="700">O</text><rect x="757" y="178" width="305" height="145" fill="#fff" stroke="#17816c" rx="16"/><text x="775" y="210" font-size="23" fill="#17816c" font-weight="700">Texture &amp; Refinement</text><text x="775" y="243" font-size="19" fill="#18334c" font-weight="400">从 O 取活跃体素支持集</text><text x="775" y="272" font-size="19" fill="#18334c" font-weight="400">600M 稀疏 latent flow</text><text x="775" y="301" font-size="19" fill="#18334c" font-weight="400">图像条件继续提供细节</text><path d="M1062,245 L1115,245" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="1125" y="178" width="211" height="145" fill="#fff" stroke="#2376c5" rx="16"/><text x="1143" y="210" font-size="23" fill="#2376c5" font-weight="700">VAE 解码</text><text x="1143" y="243" font-size="19" fill="#18334c" font-weight="400">Mesh decoder</text><text x="1143" y="272" font-size="19" fill="#18334c" font-weight="400">或 Gaussian decoder</text><text x="1143" y="301" font-size="19" fill="#18334c" font-weight="400">共享结构化潜空间</text><text x="55" y="360" font-size="23" fill="#18334c" font-weight="700">布局把对象放回相机坐标；遮挡背面依赖生成先验，不是完整物理测量。</text><rect x="28" y="410" width="1344" height="255" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="444" font-size="24" fill="#18334c" font-weight="700">02  MoT 的注意力与梯度边界：不是两个流完全双向互读</text><text x="250" y="477" font-size="22" fill="#7750ad" font-weight="700">形状 Key</text><text x="560" y="477" font-size="22" fill="#2376c5" font-weight="700">布局 Key</text><text x="55" y="531" font-size="21" fill="#18334c" font-weight="700">形状 Query</text><text x="250" y="531" font-size="24" fill="#17816c" font-weight="700">允许</text><text x="560" y="531" font-size="24" fill="#c36b24" font-weight="700">屏蔽</text><text x="55" y="590" font-size="21" fill="#18334c" font-weight="700">布局 Query</text><text x="250" y="590" font-size="24" fill="#17816c" font-weight="700">允许 / detach</text><text x="560" y="590" font-size="24" fill="#17816c" font-weight="700">允许</text><rect x="830" y="476" width="506" height="147" fill="#fff" stroke="#7750ad" rx="16"/><text x="848" y="508" font-size="23" fill="#7750ad" font-weight="700">原图布局 ← 形状区块：Stop Grad</text><text x="848" y="541" font-size="19" fill="#18334c" font-weight="400">布局可用形状表示，但此路径不回传</text><text x="848" y="570" font-size="19" fill="#18334c" font-weight="400">形状本身仍有训练；不代表全模型冻结</text><text x="848" y="599" font-size="19" fill="#18334c" font-weight="400">完整共享组件梯度仍需核对附录D.1</text><rect x="28" y="690" width="1344" height="335" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="724" font-size="24" fill="#18334c" font-weight="700">03  数据引擎：选最好与够不够好是两次判断</text><rect x="52" y="758" width="280" height="148" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="790" font-size="23" fill="#2376c5" font-weight="700">目标 I / M</text><text x="70" y="823" font-size="19" fill="#18334c" font-weight="400">模型集合与检索提供候选</text><text x="70" y="852" font-size="19" fill="#18334c" font-weight="400">人工常从8个候选中选择</text><text x="70" y="881" font-size="19" fill="#18334c" font-weight="400">多个候选也可能全部错误</text><path d="M332,829 L387,829" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="397" y="758" width="295" height="148" fill="#fff" stroke="#c36b24" rx="16"/><text x="415" y="790" font-size="23" fill="#c36b24" font-weight="700">人工选择 + 评分 r</text><text x="415" y="823" font-size="19" fill="#18334c" font-weight="400">最佳且 r ≥ ω → 接纳</text><text x="415" y="852" font-size="19" fill="#18334c" font-weight="400">候选都差 → 拒绝 / 专家</text><text x="415" y="881" font-size="19" fill="#18334c" font-weight="400">不能把相对第一当真实正确</text><path d="M692,829 L747,829" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="757" y="758" width="305" height="148" fill="#fff" stroke="#17816c" rx="16"/><text x="775" y="790" font-size="23" fill="#17816c" font-weight="700">相对点图调整布局</text><text x="775" y="823" font-size="19" fill="#18334c" font-weight="400">旋转 / 平移 / 尺度</text><text x="775" y="852" font-size="19" fill="#18334c" font-weight="400">形成监督样本 D+</text><text x="775" y="881" font-size="19" fill="#18334c" font-weight="400">较差候选形成偏好 D−</text><path d="M1062,829 L1115,829" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="1125" y="758" width="211" height="148" fill="#fff" stroke="#7750ad" rx="16"/><text x="1143" y="790" font-size="23" fill="#7750ad" font-weight="700">更新模型</text><text x="1143" y="823" font-size="19" fill="#18334c" font-weight="400">MITL / 艺术家 SFT</text><text x="1143" y="852" font-size="19" fill="#18334c" font-weight="400">再做偏好对齐</text><text x="1143" y="881" font-size="19" fill="#18334c" font-weight="400">更新候选生成器</text><path d="M1225 906 L1225 979 L190 979 L190 913" fill="none" stroke="#7750ad" stroke-width="3" marker-end="url(#7750ad)" stroke-dasharray="9 6"/><text x="380" y="969" font-size="22" fill="#7750ad" font-weight="700">人类选择持续提供监督；模型更新后回到候选流程</text><rect x="28" y="1050" width="1344" height="160" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="1084" font-size="24" fill="#18334c" font-weight="700">04  明确成本和证据边界</text><text x="55" y="1116" font-size="23" fill="#18334c" font-weight="700">Geometry 蒸馏 NFE：25 → 4；这不是整套高精纹理、解码与导出的总耗时。</text><text x="55" y="1158" font-size="21" fill="#c36b24" font-weight="400">布局 Table 3 使用真值深度 / pointmap 参考；不要标成没有额外深度条件的纯RGB数值。</text><text x="55" y="1191" font-size="20" fill="#586d80" font-weight="400">旋转 / flow / DPO 的背景解释与本文精确实现分开；当前未运行模型或复现实验。</text><text x="36" y="1247" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>
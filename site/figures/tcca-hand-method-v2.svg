<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1230" viewBox="0 0 1400 1230" role="img" aria-labelledby="title desc"><title id="title">TCCA ｜按去噪状态调整姿态与外观，不让固定日程包办</title><desc id="desc">依据原文 Fig.3、式2–4、§3，PDF 4–6；权重、广播与投影例为独立教学内容。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1230" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">TCCA ｜按去噪状态调整姿态与外观，不让固定日程包办</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据原文 Fig.3、式2–4、§3，PDF 4–6；权重、广播与投影例为独立教学内容。</text><rect x="28" y="115" width="1344" height="245" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  三组查询读取异质输入，再与时间嵌入共同预测残差</text><rect x="52" y="179" width="380" height="175" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="211" font-size="23" fill="#2376c5" font-weight="700">上下文查询 Q_c</text><text x="70" y="244" font-size="19" fill="#18334c" font-weight="400">读取当前加噪latent z_t</text><text x="70" y="273" font-size="19" fill="#18334c" font-weight="400">表达当前生成状态</text><text x="70" y="302" font-size="19" fill="#18334c" font-weight="400">Temporal指去噪步，不是视频帧</text><text x="70" y="331" font-size="19" fill="#18334c" font-weight="400">同一步的不同内容也可不同</text><rect x="494" y="179" width="395" height="175" fill="#fff" stroke="#7750ad" rx="16"/><text x="512" y="211" font-size="23" fill="#7750ad" font-weight="700">姿态查询 Q_p</text><text x="512" y="244" font-size="19" fill="#18334c" font-weight="400">读取PoseNet最后尺度 f⁴</text><text x="512" y="273" font-size="19" fill="#18334c" font-weight="400">目标姿态给出几何条件</text><text x="512" y="302" font-size="19" fill="#18334c" font-weight="400">与上下文在Transformer中融合</text><text x="512" y="331" font-size="19" fill="#18334c" font-weight="400">输出通道级姿态残差</text><rect x="951" y="179" width="385" height="175" fill="#fff" stroke="#17816c" rx="16"/><text x="969" y="211" font-size="23" fill="#17816c" font-weight="700">外观查询 Q_a</text><text x="969" y="244" font-size="19" fill="#18334c" font-weight="400">读取PIAE外观token F_a</text><text x="969" y="273" font-size="19" fill="#18334c" font-weight="400">参考图为同身份多姿态</text><text x="969" y="302" font-size="19" fill="#18334c" font-weight="400">时间嵌入参与汇聚融合</text><text x="969" y="331" font-size="19" fill="#18334c" font-weight="400">输出token级外观残差</text><rect x="28" y="385" width="1344" height="245" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="419" font-size="24" fill="#18334c" font-weight="700">02  基础时间日程互补；加上内容残差后不再是概率分配</text><rect x="52" y="451" width="585" height="175" fill="#fff" stroke="#7750ad" rx="16"/><text x="70" y="483" font-size="23" fill="#7750ad" font-weight="700">姿态通路：通道缩放后加到下采样块</text><text x="70" y="516" font-size="19" fill="#18334c" font-weight="400">α_p = α_p^base + α_p^res</text><text x="70" y="545" font-size="19" fill="#18334c" font-weight="400">教学：base=.7、res=.1 → α_p=.8</text><text x="70" y="574" font-size="19" fill="#18334c" font-weight="400">空间维广播，各尺度通道数需匹配</text><text x="70" y="603" font-size="19" fill="#18334c" font-weight="400">不能把一个不匹配的向量直接乘全部层</text><rect x="697" y="451" width="639" height="175" fill="#fff" stroke="#17816c" rx="16"/><text x="715" y="483" font-size="23" fill="#17816c" font-weight="700">外观通路：token缩放后进入cross-attention</text><text x="715" y="516" font-size="19" fill="#18334c" font-weight="400">α_a = 1−α_p^base + α_a^res</text><text x="715" y="545" font-size="19" fill="#18334c" font-weight="400">教学：res=.2 → α_a=.5；两者总和=1.3</text><text x="715" y="574" font-size="19" fill="#18334c" font-weight="400">K/V变化也会改变softmax，不是输出线性比例</text><text x="715" y="603" font-size="19" fill="#18334c" font-weight="400">base互补，不代表最终权重相加永远等于1</text><rect x="28" y="655" width="1344" height="255" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="689" font-size="24" fill="#18334c" font-weight="700">03  PIAE：patch特征分解与全局CLS分别提供信息</text><rect x="52" y="721" width="380" height="165" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="753" font-size="23" fill="#2376c5" font-weight="700">同身份参考 → CLIP patches</text><text x="70" y="786" font-size="19" fill="#18334c" font-weight="400">N×H_p×W_p×D → Q×D矩阵</text><text x="70" y="815" font-size="19" fill="#18334c" font-weight="400">SVD主方向只表示强变化</text><text x="70" y="844" font-size="19" fill="#18334c" font-weight="400">强变化未必只有姿态</text><text x="70" y="873" font-size="19" fill="#18334c" font-weight="400">rank与是否中心化需核对</text><path d="M432,800 L484,800" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="494" y="721" width="395" height="165" fill="#fff" stroke="#c36b24" rx="16"/><text x="512" y="753" font-size="23" fill="#c36b24" font-weight="700">标准投影对照，不冒充原式</text><text x="512" y="786" font-size="19" fill="#18334c" font-weight="400">若 B 为 D×r正交基</text><text x="512" y="815" font-size="19" fill="#18334c" font-weight="400">E_perp = E − EBBᵀ</text><text x="512" y="844" font-size="19" fill="#18334c" font-weight="400">E=(2,3)、B=(1,0)ᵀ → (0,3)</text><text x="512" y="873" font-size="19" fill="#18334c" font-weight="400">原式4的转置与P_proj定义待核</text><path d="M889,800 L941,800" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="951" y="721" width="385" height="165" fill="#fff" stroke="#17816c" rx="16"/><text x="969" y="753" font-size="23" fill="#17816c" font-weight="700">空间聚合 + CLIP全局CLS</text><text x="969" y="786" font-size="19" fill="#18334c" font-weight="400">局部细节token与全局语义拼接</text><text x="969" y="815" font-size="19" fill="#18334c" font-weight="400">得到外观条件 F_a</text><text x="969" y="844" font-size="19" fill="#18334c" font-weight="400">正交不证明语义 / 统计独立</text><text x="969" y="873" font-size="19" fill="#18334c" font-weight="400">单参考也可有多个空间patch</text><rect x="28" y="935" width="1344" height="235" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="969" font-size="24" fill="#18334c" font-weight="700">04  每个去噪步重新调制；固定参考不等于固定控制强度</text><text x="55" y="1003" font-size="22" fill="#18334c" font-weight="700">参考 / 姿态特征 → 当前 z_t 与时间 → 预测权重 → U-Net去噪 → 下一步 → VAE图像。</text><text x="55" y="1049" font-size="22" fill="#7750ad" font-weight="400">同一latent时间下内容可不同；通道平均权重曲线也不能当逐因素因果贡献。</text><text x="55" y="1095" font-size="21" fill="#586d80" font-weight="400">教学系数和二维投影不是真实手部生成结果；未训练模型、未下载权重或生成图像。</text><text x="36" y="1207" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">DeltaWorld：保留前帧，只预测怎么变</title><desc id="desc">tokenizer 先学重建，预测器再学未来；初始黑帧让第一枚 token 承载绝对信息。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#6e8a83"/></marker><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#dde6dd"/></pattern></defs><rect width="1200" height="660" rx="20" fill="#fafcf8"/><rect y="110" width="1200" height="490" fill="url(#dots)"/><g font-family="Inter,Segoe UI,Microsoft YaHei,sans-serif"><text x="40" y="38" fill="#688279" font-size="11" font-weight="650">PAPER ATLAS / METHOD EXPLAINED</text><text x="40" y="75" fill="#1f3d34" font-size="28" font-weight="650">DeltaWorld：保留前帧，只预测怎么变</text><text x="40" y="103" fill="#71867e" font-size="13" font-weight="400">tokenizer 先学重建，预测器再学未来；初始黑帧让第一枚 token 承载绝对信息。</text><rect x="40" y="150" width="265" height="150" rx="14" fill="#e7effb" stroke="#3b6fba" stroke-opacity=".25"/><text x="60" y="182" fill="#3b6fba" font-size="18" font-weight="650">连续帧特征</text><text x="60" y="211" fill="#253d3c" font-size="14" font-weight="400">冻结 DINOv3：x(t−1), x(t)</text><text x="60" y="236" fill="#253d3c" font-size="14" font-weight="400">DeltaTok 条件编码 g</text><text x="60" y="261" fill="#253d3c" font-size="14" font-weight="400">单枚连续向量 z(t)</text><rect x="415" y="150" width="320" height="150" rx="14" fill="#f0eafa" stroke="#7753a8" stroke-opacity=".25"/><text x="435" y="182" fill="#7753a8" font-size="18" font-weight="650">世界预测器 f</text><text x="435" y="211" fill="#253d3c" font-size="14" font-weight="400">只看历史 delta 与时间戳</text><text x="435" y="236" fill="#253d3c" font-size="14" font-weight="400">多个随机 query 并行产生</text><text x="435" y="261" fill="#253d3c" font-size="14" font-weight="400">K 个未来 delta 候选</text><path d="M305 225 L415 225" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="850" y="150" width="300" height="150" rx="14" fill="#fff1df" stroke="#aa6b29" stroke-opacity=".25"/><text x="870" y="182" fill="#aa6b29" font-size="18" font-weight="650">训练：Best-of-Many</text><text x="870" y="211" fill="#253d3c" font-size="14" font-weight="400">在 token 空间比较真值</text><text x="870" y="236" fill="#253d3c" font-size="14" font-weight="400">只监督最接近的候选</text><text x="870" y="261" fill="#253d3c" font-size="14" font-weight="400">不需要逐个解码空间图</text><path d="M735 225 L850 225" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="415" y="405" width="320" height="150" rx="14" fill="#e5f3ec" stroke="#237958" stroke-opacity=".25"/><text x="435" y="437" fill="#237958" font-size="18" font-weight="650">推理：DeltaTok 解码 h</text><text x="435" y="466" fill="#253d3c" font-size="14" font-weight="400">前一帧特征 + 预测 delta</text><text x="435" y="491" fill="#253d3c" font-size="14" font-weight="400">恢复空间特征图</text><text x="435" y="516" fill="#253d3c" font-size="14" font-weight="400">长时预测逐步自回归</text><path d="M575 300 L575 405" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="850" y="405" width="300" height="150" rx="14" fill="#e5f3ec" stroke="#237958" stroke-opacity=".25"/><text x="870" y="437" fill="#237958" font-size="18" font-weight="650">固定任务头</text><text x="870" y="466" fill="#253d3c" font-size="14" font-weight="400">分割 / 深度预测</text><text x="870" y="491" fill="#253d3c" font-size="14" font-weight="400">报告 best-of-20 与 mean</text><text x="870" y="516" fill="#253d3c" font-size="14" font-weight="400">best 需要真值挑选</text><path d="M735 480 L850 480" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><text x="45" y="550" fill="#253d3c" font-size="23" font-weight="400">一 token / 帧</text><text x="45" y="579" fill="#253d3c" font-size="12" font-weight="400">表示变化；不等于独立无损视频编码。</text><path d="M40 606H1160" stroke="#dae5dc"/><text x="40" y="631" fill="#71867e" font-size="12" font-weight="400">依据原论文 Fig.3–4 / §3 重绘；省略多步 rollout 与冻结模块的内部层。</text><text x="1000" y="631" fill="#71867e" font-size="11" font-weight="400">原创概念重绘 · 非原图</text></g></svg>
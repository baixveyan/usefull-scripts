<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">4D-RGPT：教师在训练时教，学生在部署时答</title><desc id="desc">双重蒸馏把低层时空感知与语言问答连接；额外教师不进入推理链路。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#6e8a83"/></marker><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#dde6dd"/></pattern></defs><rect width="1200" height="660" rx="20" fill="#fafcf8"/><rect y="110" width="1200" height="490" fill="url(#dots)"/><g font-family="Inter,Segoe UI,Microsoft YaHei,sans-serif"><text x="40" y="38" fill="#688279" font-size="11" font-weight="650">PAPER ATLAS / METHOD EXPLAINED</text><text x="40" y="75" fill="#1f3d34" font-size="28" font-weight="650">4D-RGPT：教师在训练时教，学生在部署时答</text><text x="40" y="103" fill="#71867e" font-size="13" font-weight="400">双重蒸馏把低层时空感知与语言问答连接；额外教师不进入推理链路。</text><rect x="40" y="150" width="210" height="145" rx="14" fill="#e7effb" stroke="#3b6fba" stroke-opacity=".25"/><text x="60" y="182" fill="#3b6fba" font-size="18" font-weight="650">视频 + 时间戳</text><text x="60" y="211" fill="#253d3c" font-size="14" font-weight="400">采样帧与区域提示</text><text x="60" y="236" fill="#253d3c" font-size="14" font-weight="400">视觉特征加入 TPE</text><rect x="330" y="150" width="300" height="145" rx="14" fill="#e5f3ec" stroke="#237958" stroke-opacity=".25"/><text x="350" y="182" fill="#237958" font-size="18" font-weight="650">学生：4D-RGPT</text><text x="350" y="211" fill="#253d3c" font-size="14" font-weight="400">视觉编码 → projector → LLM</text><text x="350" y="236" fill="#253d3c" font-size="14" font-weight="400">生成回答；隐藏态送训练读出</text><text x="350" y="278" fill="#237958" font-size="11" font-weight="600">推理保留此主干与 TPE</text><rect x="730" y="150" width="200" height="145" rx="14" fill="#fff1df" stroke="#aa6b29" stroke-opacity=".25"/><text x="750" y="182" fill="#aa6b29" font-size="18" font-weight="650">训练期读出</text><text x="750" y="211" fill="#253d3c" font-size="14" font-weight="400">MLP → 4D latent</text><text x="750" y="236" fill="#253d3c" font-size="14" font-weight="400">冻结模态 decoder</text><text x="750" y="278" fill="#aa6b29" font-size="11" font-weight="600">部署时移除</text><rect x="330" y="400" width="300" height="130" rx="14" fill="#f0eafa" stroke="#7753a8" stroke-opacity=".25"/><text x="350" y="432" fill="#7753a8" font-size="18" font-weight="650">冻结教师：L4P</text><text x="350" y="461" fill="#253d3c" font-size="14" font-weight="400">统一 4D 表征</text><text x="350" y="486" fill="#253d3c" font-size="14" font-weight="400">深度 / 光流 / 运动 / 相机射线</text><rect x="730" y="400" width="200" height="130" rx="14" fill="#f0eafa" stroke="#7753a8" stroke-opacity=".25"/><text x="750" y="432" fill="#7753a8" font-size="18" font-weight="650">教师目标</text><text x="750" y="461" fill="#253d3c" font-size="14" font-weight="400">latent features</text><text x="750" y="486" fill="#253d3c" font-size="14" font-weight="400">explicit signals</text><rect x="1000" y="270" width="160" height="150" rx="14" fill="#fcebea" stroke="#b45853" stroke-opacity=".25"/><text x="1020" y="302" fill="#b45853" font-size="18" font-weight="650">P4D 约束</text><text x="1020" y="331" fill="#253d3c" font-size="14" font-weight="400">latent 对齐</text><text x="1020" y="356" fill="#253d3c" font-size="14" font-weight="400">signal 对齐</text><text x="1020" y="381" fill="#253d3c" font-size="14" font-weight="400">加上 SFT</text><path d="M250 222 L330 222" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M630 222 L730 222" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M250 250 L330 450" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><text x="295.0" y="341.0" fill="#627b73" font-size="11" font-weight="400">同一视频</text><path d="M630 465 L730 465" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M930 222 L1000 300" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><text x="970.0" y="252.0" fill="#627b73" font-size="11" font-weight="400">学生</text><path d="M930 465 L1000 390" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" /><text x="970.0" y="418.5" fill="#627b73" font-size="11" font-weight="400">教师</text><path d="M1065 270 L1065 120" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="7 6"/><text x="1070.0" y="186.0" fill="#627b73" font-size="11" font-weight="400">训练梯度</text><path d="M1065 120 L480 120" stroke="#6e8a83" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="7 6"/><path d="M40 606H1160" stroke="#dae5dc"/><text x="40" y="631" fill="#71867e" font-size="12" font-weight="400">依据原论文 Fig.2 / §4 重绘；四类显式信号与真实时间戳不可混为文本标签。</text><text x="1000" y="631" fill="#71867e" font-size="11" font-weight="400">原创概念重绘 · 非原图</text></g></svg>